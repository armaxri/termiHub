  - id: MT-UI-50
    release_gate: true
    manual_reason: "uPlot draws on a <canvas>; seeing the repaint needs a WebView (the rebuild with new colours is unit-tested in themeRecolour.test.tsx)"
    name: "Charts and primary buttons follow a live theme switch"
    pr: 4600
    platforms: [all]
    prerequisites:
      - app: true
    instructions:
      - "Open Network Tools > Ping, start a ping so the latency chart is drawing."
      - "Without closing it, switch the theme in Settings > Appearance from Dark to Light."
      - "Create a custom theme, set its Accent to a light yellow (#ffd700) and watch the Save Theme button."
