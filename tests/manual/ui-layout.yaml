  - id: MT-UI-51
    release_gate: true
    manual_reason: "scrollbar paint and overlap with terminal text are a visual judgement (the CSS rules are pinned by tokenDiscipline.test.ts)"
    name: "Terminal and file-browser breadcrumb scrollbars follow the global style"
    pr: 4615
    platforms: [all]
    prerequisites:
      - app: true
    instructions:
      - "Open a local shell and run 'seq 1 500' so there is scrollback; keep the pointer off the terminal."
      - "Fill the terminal with long lines (e.g. 'yes $(printf x%.0s {1..300}) | head -50') and look at the right edge."
      - "Enable horizontal scrolling for the terminal and scroll a little to the right."
      - "Open the file browser in a deeply nested folder so the breadcrumb row is wider than the sidebar, then scroll it sideways."
    expected:
      - "The terminal's vertical scrollbar thumb is visible without hovering and brightens when hovered or dragged."
      - "The thumb sits in the strip at the right edge and never covers terminal text; there is only one vertical bar."
      - "In horizontal-scroll mode the horizontal thumb is visible at rest and does not cover the last row."
      - "The breadcrumb row scrolls and shows the same thin scrollbar as the rest of the app."
    verification: manual
    tags: [visual]

  - id: MT-UI-52
    release_gate: true
    manual_reason: "Monaco paints its editor background on a real DOM in a WebView; the token patch is unit-tested in monacoCustomLanguages.theme.test.ts"
    name: "File editor background matches the surrounding panes in every theme"
    pr: 4599
    platforms: [all]
    prerequisites:
      - app: true
    instructions:
      - "Split the view: a local terminal in one panel, any text file open in the file editor in the other."
      - "In Settings > Appearance, switch the theme to Dark, then Light, then Solarized Dark, then Solarized Light."
      - "Create a custom theme, change its Terminal background colour, and watch the open editor while editing."
    expected:
      - "In every theme the editor, its line-number gutter and its minimap share the terminal pane's background; no lighter or darker block."
      - "Syntax colours stay the same as before (only the background changes)."
      - "The custom-theme edit repaints the open editor background live, without reopening the file."
    verification: manual
    tags: [visual]

  - id: MT-UI-53
    release_gate: true
    manual_reason: "real layout and hover paint at a dragged sidebar width; the collapse logic is unit-tested with a mocked ResizeObserver"
    name: "Every sidebar works at the default and the minimum sidebar width"
    pr: 4720
    platforms: [all]
    prerequisites:
      - app: true
    instructions:
      - "Turn on Settings > General > Experimental Features. Create a workspace 'test', one named 'ssh-production-cluster', a macro, a workflow with a schedule, a tunnel, a service, an HTTP monitor and a remote agent."
      - "At the default sidebar width (260px) open each sidebar in turn: Connections (with Remote Agents), File Browser, SSH Tunnels, Services, Workspaces, Macros, Workflows (with Schedules and History), Network Tools, Recent Sessions and Plugins."
      - "Drag the sidebar edge fully left to its minimum width (200px; or focus the resize handle and press Home) and open every sidebar again."
      - "In each sidebar hover a list row, then Tab onto it with the keyboard."
      - "At the minimum width open any '…' overflow menu in a toolbar or header and pick an action from it."
    expected:
      - "At the default width toolbars show their labels where they fit (e.g. '+ New Workspace'); nothing is clipped."
      - "At the minimum width toolbar buttons become icons with tooltips or move into a '…' menu; no button is cut off or missing, and import/export stay reachable."
      - "Row names use the full row ('ssh-production-cluster', not 'ss…'); a name that really does not fit ends in '…' and shows the full name in a tooltip."
      - "Hovering or focusing a row shows its actions over the end of the row; all of them are visible (a long set wraps), and they disappear again on leave."
      - "The Schedules header keeps 'Pause all' on one line or hides it behind the toggle's tooltip; the toggle and '+' are never clipped. History headers keep their buttons."
      - "Agent header buttons wrap rather than clip; HTTP monitor rows keep the URL readable with status and age below it when narrow."
      - "The overflow menu action runs exactly like its toolbar button."
    verification: manual
    tags: [visual]

  - id: MT-UI-54
    release_gate: true
    manual_reason: "fresh-start lazy-chunk CSS loading and settings row layout are visual; the stylesheet placement is pinned by ui/uiCssCoverage.test.ts"
    name: "Settings fields render styled on a fresh start (no connection editor opened)"
    pr: 4708
    platforms: [all]
    prerequisites:
      - app: true
    instructions:
      - "Quit and restart the app; do NOT open any connection editor."
      - "Open Settings and visit every category (General, Appearance, Terminal, Sessions, Safety Prompts, X Server, Security, Plugins, Backup, Schedules, Updates, ...)."
      - "Repeat General and Sessions with the Settings tab narrowed to about 420 px wide."
      - "Open a connection editor (new SSH connection) and look at its fields and toggles."
    expected:
      - "Toggle and button rows: label with its hint underneath on the left, the control right-aligned; a long hint wraps under its label."
      - "Input and select rows: label, then the control, then the hint; even spacing between fields and between sections."
      - "The Default SSH Key Path '…' button is attached to the right edge of its input as one input-group."
      - "Action buttons (e.g. Clear All History) sit on the right of their row, never between the label and the hint."
      - "The connection editor's fields look the same as before this change, apart from toggles sharing the inline row layout."
    verification: manual
    tags: [visual]

  - id: MT-UI-55
    release_gate: true
    manual_reason: "real flex-wrap layout at the minimum window size; the wrap rules and header structure are pinned by ExternalFilesSettings.test.tsx"
    name: "Settings section headers keep every button visible at the minimum window size"
    pr: 4728
    platforms: [all]
    prerequisites:
      - app: true
    instructions:
      - "Resize the window to its minimum size (800x600) with the sidebar at its default width (260px)."
      - "Open Settings > External Files and look at the 'External Connection Files' header; click 'Create File'."
      - "Open Settings > File Types (add one custom mapping), Custom Grammars and Shell Integration, and look at each section header."
      - "Widen the window until the External Files header fits on one row."
    expected:
      - "At 800x600 the Reload, Create File and Add File buttons move below the title (wrapping onto a second row if needed); none is cut off at the window edge and each is clickable."
      - "The title reads on as few lines as possible and is never squeezed next to the buttons."
      - "The create-file prompt keeps the name field usable; Save and Cancel wrap below it rather than clipping."
      - "Other section headers (Reset All, Import Grammar File, Add entry) also wrap below their title instead of clipping."
      - "Once wide enough, title and buttons sit on one row again, buttons on the right."
    verification: manual
    tags: [visual]

  - id: MT-UI-56
    release_gate: true
    manual_reason: "real import, settings file and relaunch on the desktop shell; listing, revoke and re-hold logic are pinned by ImportedWorkspaceConfirmations.test.tsx and the 800x600 layout by the visual lane"
    name: "Imported workspace confirmations can be reviewed and revoked in Settings"
    pr: 4445
    platforms: [all]
    prerequisites:
      - app: true
    instructions:
      - "Import a workspace file whose tab has an initialCommand (e.g. echo hello), open it in the workspace editor and click Confirm on the command."
      - "Open Settings > Security and scroll to 'Imported Workspace Confirmations' (or search settings for 'allowlist')."
      - "Click the trash icon next to the command, then Revoke in the dialog."
      - "Reopen the workspace editor for that workspace, then launch the workspace."
      - "Confirm the command again, return to Settings > Security, click Revoke All and confirm."
    expected:
      - "The section shows '1 imported item is confirmed on this machine' and lists the command under the workspace's name with its tab."
      - "After revoking, the count reads that nothing is confirmed and settings.json no longer contains the key."
      - "The workspace editor shows the command with a Confirm button again, and launching does not run it until confirmed."
      - "Revoke All empties the list and hides the Revoke All button."
      - "At 800x600 the section header, long commands and trash buttons stay fully visible."
    verification: manual
    tags: [visual]
