  # --- Folded in from the per-feature walkthroughs in docs/testing.md (#3695) ---

  - id: MT-UI-40
    release_gate: true
    manual_reason: "colour/contrast look and first-paint flash are visual judgements"
    name: "Light/dark look sweep: palette, toasts, badges, banners, Transfer Queue"
    pr: "UI-001"
    platforms: [all]
    prerequisites:
      - app: true
    instructions:
      - "Launch with the Dark theme and watch the first paint"
      - "Show a success toast (save a connection); hover and Tab to its close X"
      - "Connect a remote agent (version badge), open a root-owned remote file (Read-only banner)"
      - "Start a large SFTP download so the Transfer Queue shows active/paused/done/failed rows"
      - "Switch Settings > Appearance between Light and Dark and re-check each surface"
    expected:
      - "No white or grey flash on first paint; Dark is deep blue-charcoal with bright-blue accents"
      - "Toast close X sits top-right with visible hover and focus ring"
      - "Agent version chip/badge, Read-only badge + banner and queue state colours are legible"
      - "Every surface stays legible and on-theme in both Light and Dark"
    verification: manual
    tags: [visual]

