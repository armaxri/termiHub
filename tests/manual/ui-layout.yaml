  # --- Unicode glyph painting on the GPU renderer (#3059) ---
  # Automated: test_terminal_glyph_shaping.py asserts xterm's cell model (wide
  # CJK, attached combining marks, logical-order RTL, intact ZWJ sequences) and
  # the DOM renderer's painted rows, with a screenshot; terminalCells.test.ts pins
  # the cell model per PR. What remains is how the WebGL renderer paints them.

  - id: MT-UI-46
    release_gate: true
    manual_reason: "WebGL-painted glyph shapes depend on each OS's font fallback; the DOM screenshot cannot capture the GPU canvas"
    name: "CJK, combining marks, RTL and emoji paint correctly on the WebGL renderer"
    pr: 3059
    platforms: [all]
    prerequisites:
      - app: true
    instructions:
      - "Open a local shell (Git Bash on Windows) with the default WebGL renderer."
      - "Run: printf '日本語한국|\\ne\\314\\201a\\314\\210x|\\nשלום سلام|\\n👨\\342\\200\\215👩\\342\\200\\215👧|\\n'"
      - "Look at the four output lines."
    expected:
      - "Each CJK character fills exactly two columns; the '|' after them lines up with the grid and nothing overlaps or is clipped."
      - "The accents sit on their letters (é, ä), not beside them or on the next cell."
      - "Hebrew and Arabic letters render with a real font (no boxes or question marks)."
      - "The family emoji shows as three emoji people in six columns (xterm does not join ZWJ sequences); no boxes, no stray joiner glyph."
    verification: manual
    tags: [visual]

  - id: MT-UI-47
    release_gate: true
    manual_reason: "real WebView focus, Escape routing into xterm/Monaco and pointer events inside a Radix modal; jsdom has no layout or real input"
    name: "Zoom overlay is a modal dialog that leaves Escape to the terminal"
    pr: 4531
    platforms: [all]
    prerequisites:
      - app: true
    instructions:
      - "Open a local shell, run 'vim', press i, then zoom the tab with Ctrl+Shift+Enter (Cmd+Shift+Enter on macOS)."
      - "Press Escape, then type ':q!' and Enter."
      - "Run 'less /etc/hosts' in the zoomed terminal and scroll with the mouse wheel, then quit less."
      - "Press Tab repeatedly with focus on the overlay's close button; right-click the overlay title and pick Set Color..."
      - "Press Shift+Escape in the terminal."
    expected:
      - "Escape leaves vim insert mode; the overlay stays open and vim quits normally."
      - "The wheel scrolls less inside the overlay."
      - "Tab never reaches the panels behind the overlay; the title menu opens and its items are clickable."
      - "Shift+Escape closes the overlay and focus returns to the terminal tab."
    verification: manual
    tags: [visual]

  - id: MT-UI-48
    release_gate: true
    manual_reason: "real stacking of portaled Radix menus over a modal scrim needs a WebView with layout; jsdom computes no z-order (the token tier is unit-tested in tokenDiscipline.test.ts)"
    name: "Context menu inside the zoomed terminal appears above the overlay"
    platforms: [all]
    prerequisites:
      - app: true
    instructions:
      - "Open a local shell tab and zoom it with Ctrl+Shift+Enter (Cmd+Shift+Enter on macOS)."
      - "Right-click the zoomed tab's title in the overlay header."
      - "Hover each menu item, then pick Rename and press Escape."
      - "Close the overlay, open the Open Connections dialog with an SSH host that has monitoring on, and click its refresh-interval button."
    expected:
      - "The overlay opens over the whole window."
      - "The menu draws fully on top of the overlay: no part of it is dimmed by the scrim or hidden behind the dialog."
      - "Every item highlights on hover and responds to the click."
      - "The refresh-interval menu opens on top of the dialog and picking an interval updates the button label."
    verification: manual
    tags: [visual]

  - id: MT-UI-49
    release_gate: true
    manual_reason: "Monaco paints its editor theme on a real canvas/DOM in a WebView; the colorScheme mapping is unit-tested in monacoCustomLanguages.test.ts"
    name: "Every light theme gets a light file editor"
    pr: 4600
    platforms: [all]
    prerequisites:
      - app: true
    instructions:
      - "Open any text file in the file editor."
      - "In Settings > Appearance, switch the theme to Solarized Light, then Light, then Dark."
      - "Create a custom theme based on Light, select it, and look at the open editor."
    expected:
      - "Solarized Light and Light show a light editor (light background, dark code text)."
      - "Dark shows the dark editor."
      - "The light custom theme shows a light editor, not a dark block inside a light app."
    verification: manual
    tags: [visual]

  - id: MT-UI-50
    release_gate: true
    manual_reason: "uPlot draws on a <canvas>; seeing the repaint needs a WebView (the rebuild with new colours is unit-tested in themeRecolour.test.tsx)"
    name: "Charts and primary buttons follow a live theme switch"
    pr: 4600
    platforms: [all]
    prerequisites:
      - app: true
    instructions:
      - "Open Network Tools > Ping, start a ping so the latency chart is drawing."
      - "Without closing it, switch the theme in Settings > Appearance from Dark to Light."
      - "Create a custom theme, set its Accent to a light yellow (#ffd700) and watch the Save Theme button."
    expected:
      - "The latency chart's line, axis labels and grid lines change to the light palette at once; no dark grid lines remain."
      - "The chart keeps its data and keeps updating."
      - "With the yellow accent, primary button text turns dark and stays readable."
    verification: manual
    tags: [visual]

  - id: MT-UI-51
    release_gate: true
    manual_reason: "scrollbar paint and overlap with terminal text are a visual judgement (the CSS rules are pinned by tokenDiscipline.test.ts)"
    name: "Terminal and file-browser breadcrumb scrollbars follow the global style"
    pr: 4615
    platforms: [all]
    prerequisites:
      - app: true
    instructions:
      - "Open a local shell and run 'seq 1 500' so there is scrollback; keep the pointer off the terminal."
      - "Fill the terminal with long lines (e.g. 'yes $(printf x%.0s {1..300}) | head -50') and look at the right edge."
      - "Enable horizontal scrolling for the terminal and scroll a little to the right."
      - "Open the file browser in a deeply nested folder so the breadcrumb row is wider than the sidebar, then scroll it sideways."
    expected:
      - "The terminal's vertical scrollbar thumb is visible without hovering and brightens when hovered or dragged."
      - "The thumb sits in the strip at the right edge and never covers terminal text; there is only one vertical bar."
      - "In horizontal-scroll mode the horizontal thumb is visible at rest and does not cover the last row."
      - "The breadcrumb row scrolls and shows the same thin scrollbar as the rest of the app."
    verification: manual
    tags: [visual]
