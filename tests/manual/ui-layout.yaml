  # --- Restore last session on startup (PR #586) ---

  - id: MT-UI-37
    automation_issue: 3693
    name: "Open tabs and layout are restored after an app restart"
    pr: 586
    platforms: [all]
    prerequisites:
      - app: true
      - "Settings → General → Restore Last Session on Startup is ON (the default)"
    instructions:
      - "Open several tabs of different types (e.g. a local shell and a saved SSH connection)"
      - "Arrange them into a split layout and create a second tab group"
      - "Fully quit the app (not just close the window) and relaunch it — alternatively, in dev mode, trigger a WebView reload"
    expected:
      - "On relaunch the previously open tabs reappear with the same split layout and tab groups"
      - "The tab group that was active is active again"
      - "Each restored terminal tab reconnects automatically where possible"
      - "A tab whose target can no longer be reached (host down, agent offline) is shown in a disconnected/error state rather than being silently dropped"
    verification: manual
    tags: [session-restore, startup, layout]
