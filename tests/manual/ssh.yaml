category: ssh
display_name: "SSH"

tests:
  # --- Agnoster/Powerline theme rendering (PR #197) ---

  - id: MT-SSH-01
    release_gate: true
    manual_reason: "zsh + Agnoster prompt look on a real remote"
    name: "Agnoster theme renders without black rectangle"
    pr: 197
    platforms: [all]
    prerequisites:
      - app: true
      - docker: true
    instructions:
      - "Connect via SSH to a Linux machine with zsh + Agnoster theme"
      - "Observe the user@machine prompt segment"
    expected:
      - "Prompt segment blends with terminal background"
      - "No visible black rectangle behind user@machine segment"
    verification: manual
    tags: [visual]

  - id: MT-SSH-16
    automation_issue: 3687
    name: "DISPLAY variable set correctly"
    pr: 69
    platforms: [macos, linux]
    prerequisites:
      - app: true
      - docker: true
    instructions:
      - "From the X11 SSH session, run: echo $DISPLAY"
    expected:
      - "Shows localhost:N.0 on remote"
    verification: manual

  - id: MT-SSH-18
    automation_issue: 3687
    name: "X11 graceful degradation without X server"
    pr: 69
    platforms: [windows]
    prerequisites:
      - app: true
      - docker: true
    instructions:
      - "Enable X11 forwarding on an SSH connection"
      - "Connect without a local X server running"
    expected:
      - "SSH connects with graceful degradation"
    verification: manual

  # --- Disconnect overlay: view mode + reconnect feedback (feature/terminal-disconnect-overlay) ---

  - id: MT-SSH-24
    automation_issue: 3687
    name: "Disconnect overlay view mode: browse scrollback after dismiss"
    platforms: [all]
    prerequisites:
      - app: true
      - docker: true
    instructions:
      - "Open an SSH session and let some output accumulate"
      - "Kill the SSH server / disconnect the network to trigger an abrupt disconnect"
      - "Wait for the disconnect overlay ('Session disconnected') to appear"
      - "Click 'View Scrollback' (or the × button)"
    expected:
      - "Overlay disappears and a thin yellow banner appears at the bottom reading 'Session ended'"
      - "All previous terminal output is visible and selectable"
      - "Text can be copied from the terminal normally"
    verification: manual

  - id: MT-SSH-25
    automation_issue: 3687
    name: "View mode: Enter key triggers reconnect prompt"
    platforms: [all]
    prerequisites:
      - app: true
      - docker: true
    instructions:
      - "Be in view mode (MT-SSH-24 complete — thin banner visible)"
      - "Click anywhere in the terminal area and press Enter"
    expected:
      - "A small dialog appears: 'This session has ended. Would you like to reconnect?'"
      - "Dialog has 'Reconnect' and 'Stay in View Mode' buttons"
      - "Clicking 'Stay in View Mode' closes the dialog and returns to view mode"
      - "Clicking 'Reconnect' starts a new session and opens a fresh terminal"
    verification: manual

  - id: MT-SSH-39
    automation_issue: 3687
    name: "Line-ending setting changes what Enter sends and is overridable per connection"
    platforms: [all]
    prerequisites:
      - app: true
      - docker: true
    instructions:
      - "Set Settings → Terminal → Line Ending to CRLF and open a new SSH tab — type a command and press Enter"
      - "Edit a saved SSH connection → Terminal → Line Ending and pick 'LF (\\n)' to override the global default"
      - "Open that connection and confirm normal line submission"
      - "Set the per-connection value back to 'Use global default'"
    expected:
      - "With each global setting, pressing Enter still submits commands normally (no doubled or missing newlines)"
      - "The per-connection override takes precedence over the global default while it is set"
      - "Selecting 'Use global default' makes the connection follow the global Line Ending again"
    verification: manual

  - id: MT-SSH-44
    automation_issue: 3688
    name: "Jump-host reconnection re-establishes the chain through the shared gateway"
    pr: 958
    platforms: [all]
    prerequisites:
      - app: true
      - docker: true
    instructions:
      - "Open two SSH terminals that both reach their target through the same bastion"
      - "Drop the bastion (e.g. stop the bastion container or kill its sshd)"
      - "Use the reconnect banner on each terminal to reconnect (trigger both close together)"
    expected:
      - "Each terminal shows a reconnect banner when its session drops"
      - "Reconnecting re-establishes the full jump-host chain and the terminal becomes usable again"
      - "Both terminals reconnecting at once create only one new gateway session (verify in the Open Connections panel)"
    verification: manual
    tags: [jump-host]
