category: editor
display_name: "Editor"

# Native save-dialog paths of the file editor.
# Folded in from the per-feature walkthroughs in docs/testing.md (#3695).

tests:
  - id: MT-EDIT-01
    release_gate: true
    manual_reason: "native OS save dialog"
    name: "Download a read-only SFTP file via the native save dialog"
    pr: 1330
    platforms: [all]
    prerequisites:
      - app: true
    instructions:
      - "On an SFTP-only connection, open a root-owned file in the editor."
      - "Click Download in the banner and pick a local path in the save dialog."
    expected:
      - "A 'Downloaded \u2026' toast appears."
      - "The local file has the remote contents."
    verification: manual
    tags: [os-native]
