# Network Tools Manual Tests
# Panel UI is covered by tests/system/tests/test_network_tools.py and the live
# loopback cases by test_network_tools_live.py; see docs/testing.md
# (Manual Testing -> Triage) for where each retired MT-NET item went.

prefix: MT-NET
feature: Network Tools

tests:
  - id: MT-NET-15
    automation_issue: 3692
    title: DNS Lookup — multiple record types
    automated_by: null
    steps:
      - Open the DNS Lookup panel
      - Test each record type (MX, CNAME, NS, TXT) for a domain that has them (e.g. `google.com`)
    expected:
      - Results match the expected records for each type (verify against `dig` or similar)

  - id: MT-NET-16
    release_gate: true
    manual_reason: "traceroute needs raw ICMP (root); hop rendering is unit-tested"
    title: Traceroute — hops stream in
    automated_by: null
    steps:
      - Click "Traceroute…" to open the Traceroute panel
      - Enter `8.8.8.8` in Host
      - Click Run
    expected:
      - Hop rows stream in as TTL probes return
      - Each row shows hop number, address, and three RTT columns
      - Trace completes (or times out with `* * *` rows for unresponsive hops)

  - id: MT-NET-19
    automation_issue: 3692
    title: Remote agent — network.open_ports via JSON-RPC
    automated_by: null
    steps:
      - Configure an SSH connection with a remote agent
      - Connect and ensure the agent is deployed
      - Open the Network Tools sidebar while the remote agent connection is active
      - Open the Open Ports panel and click Refresh
    expected:
      - Results return showing the listening ports on the remote machine
      - Port list differs from the local machine's ports

  - id: MT-NET-21
    release_gate: true
    manual_reason: "chart stroke/hover readability is visual; data in latencyChartData.test.ts"
    title: Ping / HTTP Monitor — readable latency chart (uPlot)
    automated_by: null
    pr: 790
    steps:
      - Open the Ping panel, enter a reachable host (e.g. a LAN device or `8.8.8.8`), set Interval to `1000`, and click Start
      - Let several replies stream in, then hover the latency chart
      - Stop, then start an HTTP Monitor for `https://example.com` and observe its Response Time chart
    expected:
      - The latency line has a uniform (non-distorted) stroke width regardless of panel width — no thick slanted smear
      - The y axis shows millisecond gridlines and `…ms` tick labels, baselined at 0
      - The Ping x axis is labelled in elapsed seconds (e.g. `0s`, `5s`, `10s`)
      - Hovering shows a read-out of the exact latency at the hovered sample
      - A dropped/timed-out sample is marked with a dashed vertical drop marker and a gap in the line
      - The HTTP Monitor Response Time chart renders with the same readable axes and hover read-out
