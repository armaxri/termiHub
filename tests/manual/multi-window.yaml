category: multi-window
display_name: "Multi-Window"

# Only the OS-native macOS behaviour stays manual (TIN-014, #3720). Everything
# else about multi-window — opening a window, moving a live tab, the
# close-with-live-tabs dialog, windowed-layout restore, and the Linux/Windows
# last-window quit — runs unattended in tests/system/tests/test_multi_window.py.

tests:
  # --- Per-OS quit policy: macOS Dock (PR #1903) ---

  - id: MT-WIN-01
    release_gate: true
    manual_reason: "macOS Dock lifecycle is OS-native; the bridge cannot drive the Dock"
    name: "macOS — closing the last window keeps the app in the Dock; Dock click reopens a window"
    pr: 1903
    platforms: [macos]
    prerequisites:
      - app: true
    instructions:
      - "With two windows open, close the non-last one (title-bar close)"
      - "Close the last remaining window"
      - "Click the termiHub icon in the Dock"
    expected:
      - "Closing the non-last window closes only that window; the app keeps running"
      - "After the last window closes the app stays running (its Dock icon keeps the running dot)"
      - "Clicking the Dock icon recreates a window"
    verification: manual
    tags: [os-native]

  - id: MT-WIN-02
    release_gate: true
    manual_reason: "macOS app-menu Quit (Cmd+Q) is OS-native; the bridge cannot drive it"
    name: "macOS — Cmd+Q quits the app with several windows open"
    pr: 1903
    platforms: [macos]
    prerequisites:
      - app: true
    instructions:
      - "Open a second window (Cmd+Shift+N) and a local shell in each window"
      - 'Press Cmd+Q; in the "Quit termiHub?" dialog each window shows, choose "Quit & end sessions"'
    expected:
      - "The app quits entirely: every window closes and the Dock icon loses its running dot"
      - "Relaunching the app starts cleanly (no leftover windows or orphaned sessions)"
    verification: manual
    tags: [os-native]

  - id: MT-WIN-03
    release_gate: true
    manual_reason: "macOS app-menu Quit (Cmd+Q) is OS-native; the bridge cannot drive it"
    name: "macOS — Cmd+Q with a live local shell asks before quitting"
    pr: 4458
    platforms: [macos]
    prerequisites:
      - app: true
    instructions:
      - "Open one local shell tab and an editor tab with an unsaved change"
      - "Press Cmd+Q"
      - "While the dialog is open, press Cmd+Q again"
      - "Click Cancel"
      - 'Choose termiHub > Quit termiHub from the menu bar, then click "Quit & end sessions"'
      - "Relaunch, close every window (app stays in the Dock), then press Cmd+Q"
    expected:
      - 'Cmd+Q opens the "Quit termiHub?" dialog listing the shell (would be terminated) and the unsaved editor; the app keeps running'
      - "The second Cmd+Q neither opens another dialog nor quits the app"
      - "Cancel closes the dialog and the shell keeps running"
      - "The menu Quit opens the same dialog, and confirming it quits the app"
      - "With no windows open, Cmd+Q quits at once without a dialog"
    verification: manual
    tags: [os-native]

  - id: MT-WIN-03b
    release_gate: true
    manual_reason: "The Dock menu, AppleScript quit and logout are OS-native; the bridge cannot drive them"
    name: "macOS — Dock Quit and AppleScript quit ask before quitting; logout is not blocked"
    pr: null
    platforms: [macos]
    prerequisites:
      - app: true
    instructions:
      - "Open one local shell tab and an editor tab with an unsaved change"
      - "Right-click the termiHub Dock icon and choose Quit, then click Cancel"
      - "In Terminal.app run: osascript -e 'quit app \"termiHub\"', then click Cancel"
      - 'Run the osascript command again and click "Quit & end sessions"'
      - "Relaunch, open a local shell tab and an unsaved editor again, then choose Apple menu > Log Out and confirm"
    expected:
      - 'The Dock Quit opens the same "Quit termiHub?" dialog as Cmd+Q; after Cancel the app and the shell keep running'
      - "The osascript quit opens the same dialog; after Cancel the app keeps running"
      - "Confirming the dialog quits the app"
      - "Log Out proceeds without waiting on a termiHub dialog and termiHub is gone after logging back in (no \"termiHub cancelled logout\" message)"
    verification: manual
    tags: [os-native]
