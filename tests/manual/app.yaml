category: app
display_name: "App"

# App-level checks that need a real macOS WKWebView build, the real internet or OS window raise.
# Folded in from the per-feature walkthroughs in docs/testing.md (#3695).

tests:
  - id: MT-APP-02
    release_gate: true
    manual_reason: "no macOS WKWebView integration leg"
    name: "macOS production build has no CSP violations"
    pr: 3627
    platforms: [macos]
    prerequisites:
      - app: true
    instructions:
      - "Build with ./scripts/build.sh and open the Log Viewer."
      - "Open a local shell, then a .sh file in the editor."
      - "Turn on JS plugins and install examples/plugins/clock-widget."
    expected:
      - "Terminal and editor are coloured and the clock widget shows."
      - "The Log Viewer has no csp entries."
    verification: manual
    tags: [os-native]

  - id: MT-APP-03
    release_gate: true
    manual_reason: "real internet HTTPS and published index"
    name: "Plugin index and URL install over real HTTPS"
    pr: 3715
    platforms: [macos]
    prerequisites:
      - app: true
    instructions:
      - "Settings > Plugins > Browse Plugins > Load plugin index."
      - "Under Install from URL, paste a GitHub-hosted clock-widget URL with its SHA-256."
    expected:
      - "The default index loads from main (no HTTP 404)."
      - "The install dialog opens with the unsigned banner, and nothing installs before you confirm."
    verification: manual
    tags: [network]

  - id: MT-APP-04
    release_gate: true
    manual_reason: "OS window focus/raise and the pre-startup native rfd error dialog"
    name: "Second launch raises the running window; portable double-launch refused"
    pr: 3100
    platforms: [all]
    prerequisites:
      - app: true
    instructions:
      - "Install and launch the release build; minimize its window."
      - "Launch the installed app a second time."
      - "Launch a portable copy, then launch the same portable copy again."
    expected:
      - "No second window; the existing window un-minimizes and comes to the front with tabs intact."
      - "The second portable launch shows 'termiHub is already running' naming the data folder."
      - "After OK the second process exits; the first is untouched."
    verification: manual
    tags: [os-native]

  - id: MT-APP-05
    release_gate: true
    manual_reason: "needs a real MobaXterm install on Windows to locate its configuration"
    name: "MobaXterm import finds the installed configuration and imports the folder tree"
    pr: 4850
    platforms: [windows]
    prerequisites:
      - app: true
    instructions:
      - "Install MobaXterm (installed edition) and save a few test sessions: an SSH session with a private key, a Telnet and a Serial session, one in a sub-folder, plus one Browser session."
      - "Close MobaXterm, then in termiHub open Settings > Import & Migration and click Import from MobaXterm…"
      - "Select all, pick a target folder and click Import."
      - "Click Choose another file… and pick a .mxtsessions export of the same sessions."
    expected:
      - "The settings page says Found MobaXterm configuration at %APPDATA%\\MobaXterm\\MobaXterm.ini, and the dialog opens with that file already previewed, without picking a file."
      - "Each session shows its type, target and folder; the Browser session is listed under Not imported with a reason."
      - "The connections appear under the target folder in the same sub-folders; the SSH key path points at the real file (no _ProfileDir_ left)."
      - "No password is filled in; connecting asks for it. The .mxtsessions file previews the same sessions."
    verification: manual
    tags: [os-native]
