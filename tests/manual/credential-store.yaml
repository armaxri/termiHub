category: credential-store
display_name: "Credential Store"

tests:
  # --- KeychainStore integration (PR #250) ---

  - id: MT-CRED-01
    name: "Windows Credential Manager stores credentials"
    pr: 250
    platforms: [windows]
    prerequisites:
      - app: true
    instructions:
      - "Save a password for an SSH connection"
      - "Open Windows Credential Manager"
      - "Search for 'termihub' entries"
    expected:
      - "Credentials are stored in Windows Credential Manager"
    verification: manual

  - id: MT-CRED-02
    name: "macOS Keychain stores credentials"
    pr: 250
    platforms: [macos]
    prerequisites:
      - app: true
    instructions:
      - "Save a password for an SSH connection"
      - "Open Keychain Access"
      - "Search for 'termihub' entries"
    expected:
      - "Credentials are stored in Keychain Access"
    verification: manual

  - id: MT-CRED-03
    name: "Linux Secret Service stores credentials"
    pr: 250
    platforms: [linux]
    prerequisites:
      - app: true
    instructions:
      - "Save a password for an SSH connection"
      - "Check Secret Service / D-Bus (if available)"
    expected:
      - "Credentials are stored via Secret Service"
    verification: manual

  # --- Master-password auto-lock (PR #862) ---
  # The auto-lock timeout options start at 5 minutes, so the lock firing cannot be
  # awaited in a system test (test_credential_store.py only asserts the setting
  # round-trips). This manual test covers the timer actually firing.

  - id: MT-CRED-04
    name: "Master-password store auto-locks after the timeout"
    pr: 862
    platforms: [windows, macos, linux]
    prerequisites:
      - app: true
    instructions:
      - "Settings → Security: switch to a master-password store and unlock it"
      - "Set the Auto-Lock Timeout to 5 minutes"
      - "Leave the app idle for just over 5 minutes (no credential activity)"
      - "Observe the status-bar credential indicator"
    expected:
      - "After the timeout the indicator flips to 'Locked'"
      - "Connecting a saved connection then raises the unlock dialog before proceeding"
    verification: manual
