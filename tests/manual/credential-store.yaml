category: credential-store
display_name: "Credential Store"

tests:
  # --- KeychainStore integration (PR #250) ---

  - id: MT-CRED-01
    release_gate: true
    manual_reason: "Windows Credential Manager inspection (real OS store)"
    name: "Windows Credential Manager stores credentials"
    pr: 250
    platforms: [windows]
    prerequisites:
      - app: true
    instructions:
      - "Save a password for an SSH connection"
      - "Open Windows Credential Manager"
      - "Search for 'termihub' entries"
    expected:
      - "Credentials are stored in Windows Credential Manager"
    verification: manual

  - id: MT-CRED-02
    release_gate: true
    manual_reason: "macOS Keychain Access inspection (real OS store)"
    name: "macOS Keychain stores credentials"
    pr: 250
    platforms: [macos]
    prerequisites:
      - app: true
    instructions:
      - "Save a password for an SSH connection"
      - "Open Keychain Access"
      - "Search for 'termihub' entries"
    expected:
      - "Credentials are stored in Keychain Access"
    verification: manual

  - id: MT-CRED-03
    release_gate: true
    manual_reason: "Linux Secret Service inspection (real OS store)"
    name: "Linux Secret Service stores credentials"
    pr: 250
    platforms: [linux]
    prerequisites:
      - app: true
    instructions:
      - "Save a password for an SSH connection"
      - "Check Secret Service / D-Bus (if available)"
    expected:
      - "Credentials are stored via Secret Service"
    verification: manual

  # --- Folded in from the per-feature walkthroughs in docs/testing.md (#3695) ---

  # MT-CRED-10 (vault export + import with Replace through the native dialogs) is
  # walked by the guided test_native_dialogs.py::test_credential_vault_export_import_round_trip
  # (#4076).

  - id: MT-CRED-11
    release_gate: true
    manual_reason: "Touch ID system sheet"
    name: "macOS keychain export asks Touch ID every time"
    pr: 3433
    platforms: [macos]
    prerequisites:
      - app: true
    instructions:
      - "Storage OS Keychain, save one password."
      - "Export vault..., enter the passphrase, touch the sensor, save."
      - "Export again and click Cancel in the system sheet."
      - "Export again and use Use Password... with the Mac login password."
      - "Back up everything... with Credentials and confirm with Touch ID."
    expected:
      - "A system sheet appears on every export and backup."
      - "Touch ID or the login password lets the save go through."
      - "Cancel shows 'System authentication was cancelled' and writes no file."
    verification: manual
    tags: [os-native, hardware]

  - id: MT-CRED-12
    release_gate: true
    manual_reason: "Touch ID hardware and system sheet"
    name: "macOS Touch ID unlock of the master-password store"
    pr: 3433
    platforms: [macos]
    prerequisites:
      - app: true
    instructions:
      - "Master Password mode: turn on Unlock with Touch ID and confirm with Touch ID."
      - "Lock the store and connect a saved connection; touch the sensor."
      - "Lock again and choose Use Master Password in the sheet."
      - "Add a fingerprint in System Settings, then lock and unlock again."
    expected:
      - "Touch ID unlocks the store and the connection proceeds."
      - "The master password fallback works."
      - "After a fingerprint change the app says biometric unlock was turned off."
    verification: manual
    tags: [os-native, hardware]

  - id: MT-CRED-13
    release_gate: true
    manual_reason: "Windows Hello system dialog"
    name: "Windows Hello export and unlock"
    pr: 3433
    platforms: [windows]
    prerequisites:
      - app: true
    instructions:
      - "Storage OS Keychain: Export vault..., verify in the Windows Hello dialog, save."
      - "Back up everything... with Credentials and verify."
      - "Master Password mode: turn on Unlock with Windows Hello, lock, then unlock with Hello."
      - "Cancel the Hello dialog once and use the master password."
    expected:
      - "The Hello dialog appears in front of termiHub each time."
      - "Export, backup and unlock succeed after verifying."
      - "Cancel writes nothing and the master password fallback works."
    verification: manual
    tags: [os-native, hardware]

  - id: MT-CRED-14
    release_gate: true
    manual_reason: "desktop polkit agent dialog"
    name: "Linux polkit dialog for keychain export (GNOME and KDE)"
    pr: 3535
    platforms: [linux]
    prerequisites:
      - app: true
    instructions:
      - "Install the .deb or .rpm on GNOME, then on KDE Plasma."
      - "Storage OS Keychain: Export vault..., enter your own password in the polkit dialog, save."
      - "Export again and click Cancel in the polkit dialog."
      - "Back up everything... with Credentials and authenticate."
    expected:
      - "The desktop polkit dialog asks for your own password every time."
      - "Export and backup save after authenticating."
      - "Cancel shows 'System authentication was cancelled' and writes no file."
    verification: manual
    tags: [os-native]
