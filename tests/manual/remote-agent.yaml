category: remote-agent
display_name: "Remote Agent"

tests:
  # --- Docker container session from a Windows-hosted agent (#768, #770) ---
  # The SSH half of the old MT-AGENT-26 and all of MT-AGENT-27 are automated in
  # agent/tests/native_sshd_agent_backends.rs (Windows SSH Host lane, #3684), as
  # is the engine half of this item (docker.list_containers over the named pipe).

  - id: MT-AGENT-28
    release_gate: true
    manual_reason: "needs Docker Desktop with Linux containers on a Windows host; hosted Windows runners run only Windows containers"
    name: "Docker container session via named pipe from a Windows-hosted agent"
    pr: 768
    platforms: [all]
    prerequisites:
      - app: true
    instructions:
      - "On the Windows agent host, ensure Docker Desktop (Linux containers) or a Podman machine is running"
      - "Through the Windows agent, open a Docker session against a small image (e.g. `alpine`) with runtime left on `Auto`"
      - "Run a command in the container, resize the pane, and open the in-container file browser"
      - "Close the tab"
    expected:
      - "The container shell is interactive, command output appears and resize does not crash the session"
      - "In-container file browsing lists directories"
      - "Closing the tab tears the session down; the container is removed (when Remove on Exit is set)"
    verification: manual
