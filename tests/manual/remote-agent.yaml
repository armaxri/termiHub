category: remote-agent
display_name: "Remote Agent"

tests:
  # --- Agent setup wizard (PR #137) ---

  - id: MT-AGENT-04
    name: "Setup commands injected into terminal"
    pr: 137
    platforms: [all]
    prerequisites:
      - app: true
      - docker: true
    instructions:
      - "Select a valid agent binary"
      - "Proceed with setup"
      - "Observe the terminal"
    expected:
      - "Setup commands are injected (mv, chmod, --version)"
    verification: manual

  - id: MT-AGENT-07
    name: "Connect after setup"
    pr: 137
    platforms: [all]
    prerequisites:
      - app: true
      - docker: true
    instructions:
      - "After agent setup, right-click agent > 'Connect'"
    expected:
      - "Agent connects successfully"
    verification: manual

  # --- Agent disconnect overlay: reconnecting spinner + error feedback (feature/terminal-disconnect-overlay) ---

  - id: MT-AGENT-08
    name: "Agent reconnect: spinner overlay shown while auto-reconnecting"
    platforms: [all]
    prerequisites:
      - app: true
      - docker: true
    instructions:
      - "Open one or more sessions via a remote agent"
      - "Simulate a temporary network disruption (e.g. pause the Docker container briefly)"
      - "Observe the terminal tabs while the agent is reconnecting"
    expected:
      - "Each affected tab shows a 'Reconnecting…' spinner overlay (blurred background, animated icon)"
      - "No user action is needed — the overlay disappears automatically when the agent reconnects"
      - "After reconnect, terminal output resumes in the same tab (scrollback preserved)"
    verification: manual

  - id: MT-AGENT-09
    name: "Agent reconnect failure: error message in overlay"
    platforms: [all]
    prerequisites:
      - app: true
      - docker: true
    instructions:
      - "Open one or more sessions via a remote agent"
      - "Permanently disconnect the agent (stop the SSH server) so reconnect retries all fail"
      - "Wait for the auto-reconnect loop to exhaust all 10 attempts (may take a few minutes)"
    expected:
      - "The 'Reconnect failed' overlay appears on each affected tab"
      - "The overlay shows a red 'Reconnect failed' heading and an error box with the reason"
      - "A 'Try Again' button is present (triggers a new manual reconnect attempt)"
      - "A 'View Scrollback' button is present (enters view mode so history can be read)"
    verification: manual

  # --- Agent-session connecting overlay: auto-retry + waiting-for-agent (feature/terminal-connect-overlay) ---

  - id: MT-AGENT-10
    name: "Agent session auto-retries with spinner while agent is unavailable"
    platforms: [all]
    prerequisites:
      - app: true
      - docker: true
    instructions:
      - "Stop a remote agent (or make it unreachable)"
      - "Open a new session tab that routes through that agent"
      - "Observe the overlay while the session fails to connect"
    expected:
      - "The overlay cycles through 'Connecting…' → short delay → 'Connecting… (attempt N)' indefinitely"
      - "No error overlay or Retry button appears — the loop is fully automatic"
      - "A 'Cancel' button is always visible to abort"
    verification: manual

  - id: MT-AGENT-11
    name: "Waiting-for-agent state: session auto-starts when agent connects"
    platforms: [all]
    prerequisites:
      - app: true
      - docker: true
    instructions:
      - "Ensure the agent is in 'connecting' or 'reconnecting' state (start app before agent is up)"
      - "Open a session tab that routes through that agent"
      - "Observe the overlay, then bring the agent online"
    expected:
      - "Overlay shows 'Waiting for agent…' with a spinner and no Retry button"
      - "As soon as the agent transitions to 'connected', the session starts automatically"
      - "The overlay disappears and normal terminal output appears without any user action"
    verification: manual

  # --- Agent setup SSH timeout fix (bugfix/agent-setup-ssh-timeout-hang) ---

  - id: MT-AGENT-12
    name: "Agent update dialog does not hang when SSH is unresponsive"
    platforms: [all]
    prerequisites:
      - app: true
    instructions:
      - "Configure an agent whose SSH host is reachable at TCP level but unresponsive (e.g. firewall drops packets after connect, or the SSH daemon is frozen)"
      - "Open the Setup Agent dialog for that agent (Settings wheel → Setup Agent)"
      - "Observe the 'Connecting and detecting architecture…' phase"
    expected:
      - "The dialog does not hang indefinitely — after ~30 seconds it displays an error message (SSH timeout or similar)"
      - "The UI remains responsive; no restart of the app is required"
    verification: manual

  # --- Persistent shell double-click on stopped state (bugfix/agent-persistent-shell-doubleclick-icon) ---

  - id: MT-AGENT-13
    name: "Double-clicking a stopped persistent agent shell turns the state dot green"
    platforms: [all]
    prerequisites:
      - app: true
      - docker: true
    instructions:
      - "Connect to a remote agent that has at least one persistent shell connection definition"
      - "Ensure the persistent shell is stopped (state dot is grey)"
      - "Double-click the persistent shell entry in the sidebar"
    expected:
      - "A new terminal tab opens and connects to the shell"
      - "The state dot next to the sidebar entry transitions from grey to green (running/attached)"
      - "The persistent badge (∞) and Stop/Attach action icons appear, confirming the session is registered with the persistent-session machinery"
      - "Closing the tab leaves the background session running and the dot stays green"
    verification: manual

  # --- Active Sessions reattach preserves scrollback (bugfix/agent-persistent-reattach-buffer-loss) ---

  - id: MT-AGENT-14
    name: "Reattaching via Active Sessions preserves scrollback buffer"
    platforms: [all]
    prerequisites:
      - app: true
      - docker: true
    instructions:
      - "Connect to a remote agent that has a persistent shell definition"
      - "Double-click the persistent shell to open a tab"
      - "Run several commands so there is visible scrollback (e.g. `ls -la /etc`, `seq 1 50`)"
      - "Close the tab (the background session must stay running — verify the state dot is still green)"
      - "Expand the agent in the sidebar and locate the running session under the 'Active Sessions' section"
      - "Double-click the session under 'Active Sessions' to reattach"
    expected:
      - "A new tab opens with a 'Restoring session…' overlay during the buffer fetch"
      - "The previous scrollback (the `ls -la /etc` output and the `seq` numbers) appears in the new tab"
      - "Subsequent input continues in the same shell (e.g. `pwd` reports the same cwd as before)"
      - "The state dot stays green throughout — no duplicate session is created on the agent"
    verification: manual

  # --- Windows agent binary build (#761) ---

  - id: MT-AGENT-15
    name: "Build the Windows agent binary natively (MSVC)"
    pr: 761
    platforms: [windows]
    prerequisites:
      - app: false
    instructions:
      - "On a Windows host with the Rust toolchain and the MSVC build tools (Visual Studio Build Tools) installed"
      - "Run `scripts\\build-agents.cmd --native` (or `bash scripts/build-agents.sh --native --targets x86_64-pc-windows-msvc` from Git Bash)"
      - "Optionally also build ARM64: `bash scripts/build-agents.sh --native --targets aarch64-pc-windows-msvc` (requires the ARM64 MSVC build tools)"
    expected:
      - "`target/x86_64-pc-windows-msvc/release/termihub-agent.exe` is produced and the summary reports `Built: 1`"
      - "The script never invokes cross-rs / Docker for the Windows target (native cargo only)"
      - "Requesting a Windows target without `--native`, or on a non-Windows host, fails fast with a clear error message"
      - "ARM64 is best effort — if the ARM64 MSVC tools are missing, `.cmd --native` prints a WARNING and skips it without failing the run"
    verification: manual

  # --- Reconnect restarts the connection instead of looping (bugfix/agent-reconnect-endless-loop) ---

  - id: MT-AGENT-16
    name: "Reconnecting a destroyed persistent session restarts it (no endless loop)"
    platforms: [all]
    prerequisites:
      - app: true
      - docker: true
    instructions:
      - "Connect to a remote agent and open a persistent shell session in a tab"
      - "Open the Open Connections panel (Settings wheel → Open Connections) and kill that persistent session, OR stop it from the sidebar"
      - "On the tab's disconnect overlay, click 'Reconnect'"
    expected:
      - "The tab does NOT get stuck retrying forever (no endless 'Connecting… / Connection failed' cycling)"
      - "A brand-new persistent session is started and the tab attaches to it (fresh prompt)"
      - "The sidebar state dot for the persistent shell returns to green (running/attached)"
    verification: manual

  - id: MT-AGENT-17
    name: "Reconnecting after the agent connection is destroyed re-establishes the agent"
    platforms: [all]
    prerequisites:
      - app: true
      - docker: true
    instructions:
      - "Connect to a remote agent and open a session tab through it"
      - "Open the Open Connections panel and kill the agent connection (or use 'Kill All' agents)"
      - "On the tab's disconnect overlay, click 'Reconnect'"
    expected:
      - "The reconnect does not spin endlessly with 'Agent not connected' failures"
      - "The agent connection is automatically re-established (sidebar agent dot returns to green)"
      - "Once the agent is back, a fresh session starts in the tab automatically"
      - "If the agent cannot be reached (e.g. host offline), the retry stops after a few attempts and a disconnect error is shown rather than looping forever"
    verification: manual

  # --- Windows agent deploy + install over SSH (#763) ---

  - id: MT-AGENT-18
    name: "Deploy + install agent to a Windows host (cmd.exe default shell)"
    pr: 763
    platforms: [all]
    prerequisites:
      - app: true
    instructions:
      - "Have a Windows host reachable over SSH (OpenSSH server) with its DefaultShell left at the default cmd.exe"
      - "Create a Remote Agent for the host and open the Setup Agent dialog"
      - "Confirm the detected target shows Windows and a windows-x64 / windows-arm64 binary is selected"
      - "Note the Remote Install Path field is read-only and the 'Install systemd service' option is hidden"
      - "Start the setup and watch the injected commands in the visible SSH terminal"
    expected:
      - "Only Windows commands are issued — `md`/`move` (no `mkdir -p`, `mv -f`, `chmod`, or `/tmp`)"
      - "The binary is uploaded to the SFTP home and moved to `%LOCALAPPDATA%\\termiHub\\agent\\termihub-agent.exe`"
      - "The verify step prints `termihub-agent <version>`"
    verification: manual

  - id: MT-AGENT-19
    name: "Deploy + install agent to a Windows host (PowerShell default shell)"
    pr: 763
    platforms: [all]
    prerequisites:
      - app: true
    instructions:
      - "Set the Windows host's OpenSSH DefaultShell to PowerShell (registry key `HKLM\\SOFTWARE\\OpenSSH\\DefaultShell`)"
      - "Create a Remote Agent for the host and run the Setup Agent flow as in MT-AGENT-18"
    expected:
      - "PowerShell commands are issued — `New-Item -ItemType Directory -Force` and `Move-Item -Force` (no `md`/`move`, no POSIX commands)"
      - "The binary installs to `%LOCALAPPDATA%\\termiHub\\agent\\termihub-agent.exe`"
      - "The verify step (`& \"...termihub-agent.exe\" --version`) prints the version"
    verification: manual

  - id: MT-AGENT-20
    name: "Connect (--stdio) to a freshly installed Windows agent"
    pr: 763
    platforms: [all]
    prerequisites:
      - app: true
    instructions:
      - "After MT-AGENT-18 or MT-AGENT-19, set the Remote Agent's agent path to the resolved install location (e.g. `C:\\Users\\<user>\\AppData\\Local\\termiHub\\agent\\termihub-agent.exe`)"
      - "Right-click the agent and choose Connect"
    expected:
      - "The agent launches over SSH exec via `--stdio` and the connection reaches the connected state"
      - "A shell session can be opened through the agent and echoes input/output normally"
    verification: manual

  - id: MT-AGENT-21
    name: "Windows agent binary ships with releases"
    pr: 769
    platforms: [all]
    prerequisites:
      - app: false
    instructions:
      - "After a tagged release completes, open the GitHub Releases page for the new version"
      - "Locate the agent binary assets next to the desktop installers"
      - "Download `termihub-agent-windows-x64.exe` onto a Windows host"
      - "From a terminal on that host, run `termihub-agent-windows-x64.exe --version`"
    expected:
      - "`termihub-agent-windows-x64.exe` is attached to the release alongside the Linux and macOS agent binaries"
      - "Running the binary with `--version` prints the agent version and exits cleanly"
    verification: manual

  # --- Windows ConPTY shell sessions through the agent (#765) ---

  - id: MT-AGENT-22
    name: "PowerShell session through the Windows agent (ConPTY spawn / resize / teardown)"
    pr: 765
    platforms: [all]
    prerequisites:
      - app: true
    instructions:
      - "Connect to a Windows host that already has the agent installed (see MT-AGENT-18 / MT-AGENT-20)"
      - "Open a new Local Shell session through the agent and leave the shell as the detected default (PowerShell)"
      - "Run `Write-Output 'HELLO_AGENT_PS'` and confirm the line appears in the output"
      - "Resize the terminal pane several times (drag the split divider or toggle full-screen) — the prompt must keep re-rendering at the new size"
      - "Close the tab and verify the agent's session list no longer contains the session"
    expected:
      - "PowerShell launches via the agent without error"
      - "Echoed input and command output both appear normally"
      - "Resize does not crash the session or scramble the prompt"
      - "Closing the tab terminates the ConPTY child on the Windows host (no orphaned `powershell.exe` in Task Manager)"
    verification: manual

  - id: MT-AGENT-23
    name: "cmd.exe session through the Windows agent (ConPTY spawn / resize / teardown)"
    pr: 765
    platforms: [all]
    prerequisites:
      - app: true
    instructions:
      - "Connect to a Windows host that already has the agent installed"
      - "Open a new Local Shell session through the agent and choose `cmd` as the shell"
      - "Run `echo HELLO_AGENT_CMD` and confirm the line appears in the output"
      - "Resize the terminal pane a few times"
      - "Close the tab"
    expected:
      - "`cmd.exe` launches via the agent without error"
      - "Echoed input and command output both appear normally"
      - "Resize does not crash the session"
      - "Closing the tab terminates the `cmd.exe` child on the Windows host (no orphaned process in Task Manager)"
    verification: manual

  # --- Windows agent secondary backends: SSH / Docker / file browser (#768) ---

  - id: MT-AGENT-24
    name: "File browser on a Windows-hosted agent returns forward-slash paths"
    pr: 768
    platforms: [all]
    prerequisites:
      - app: true
    instructions:
      - "Connect to a Windows host that already has the agent installed (see MT-AGENT-18 / MT-AGENT-20)"
      - "Open the file browser for the agent host"
      - "Navigate into `C:\\Users\\<user>` and then a few subdirectories"
      - "Type `~` (or a path beginning with `~/`) into the path field and navigate"
    expected:
      - "Directory listings render without errors or panics (the Permissions column is blank on Windows — this is expected)"
      - "Path breadcrumbs and navigation use forward slashes (e.g. `C:/Users/<user>`); no backslashes leak into the UI"
      - "`~` resolves to the Windows user profile (`%USERPROFILE%`) and lists its contents"
      - "Files open, rename, delete, and folder creation all work"
    verification: manual

  - id: MT-AGENT-25
    name: "SSH jump-host backend from a Windows-hosted agent"
    pr: 768
    platforms: [all]
    prerequisites:
      - app: true
    instructions:
      - "On the Windows agent host, place an SSH key at `%USERPROFILE%\\.ssh\\id_rsa` (or id_ed25519) authorized on a reachable SSH server"
      - "Through the Windows agent, open an SSH session to that server using key auth and leave the key path empty (default)"
      - "Repeat with `auth_method = agent` after starting the OpenSSH agent service (`Start-Service ssh-agent`) and adding the key"
    expected:
      - "Default key auth resolves the key under `%USERPROFILE%\\.ssh` and authenticates"
      - "Agent auth connects via the `\\\\.\\pipe\\openssh-ssh-agent` named pipe and authenticates"
      - "The remote shell is interactive and the SSH session closes cleanly"
    verification: manual

  - id: MT-AGENT-26
    name: "Docker backend via named pipe from a Windows-hosted agent"
    pr: 768
    platforms: [all]
    prerequisites:
      - app: true
    instructions:
      - "On the Windows agent host, ensure Docker Desktop (or Podman machine) is running"
      - "Through the Windows agent, open a Docker session against a small image (e.g. `alpine`) with runtime left on `Auto`"
      - "Run a command in the container and open the in-container file browser"
    expected:
      - "The backend connects to the local engine via the Windows named pipe without a TCP port"
      - "The container shell is interactive and command output appears"
      - "In-container file browsing lists directories; the container is removed on disconnect (when Remove on Exit is set)"
    verification: manual
