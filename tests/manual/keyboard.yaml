category: keyboard
display_name: "Keyboard Shortcuts"

tests:
  # --- Clipboard shortcuts (PR #418) ---

  - id: MT-KB-01
    name: "macOS: Cmd+C copies terminal selection"
    pr: 418
    platforms: [macos]
    prerequisites:
      - app: true
      - terminal: true
    instructions:
      - "Open a terminal and produce some output (e.g., run 'ls')"
      - "Select text in the terminal by clicking and dragging"
      - "Press Cmd+C"
      - "Paste into a text editor to verify"
    expected:
      - "Selected text is copied to clipboard"
      - "Ctrl+C still sends SIGINT (does not copy)"
    verification: manual
    tags: [clipboard, platform]

  - id: MT-KB-02
    name: "macOS: Cmd+V pastes into terminal"
    pr: 418
    platforms: [macos]
    prerequisites:
      - app: true
      - terminal: true
    instructions:
      - "Copy some text to clipboard"
      - "Click on a terminal to focus it"
      - "Press Cmd+V"
    expected:
      - "Clipboard text is pasted into the terminal"
    verification: manual
    tags: [clipboard, platform]

  - id: MT-KB-03
    name: "Windows/Linux: Ctrl+Shift+C copies terminal selection"
    pr: 418
    platforms: [windows, linux]
    prerequisites:
      - app: true
      - terminal: true
    instructions:
      - "Open a terminal and produce some output"
      - "Select text in the terminal by clicking and dragging"
      - "Press Ctrl+Shift+C"
      - "Paste into a text editor to verify"
    expected:
      - "Selected text is copied to clipboard"
      - "Ctrl+C still sends SIGINT to the terminal"
    verification: manual
    tags: [clipboard, platform]

  - id: MT-KB-04
    name: "Windows/Linux: Ctrl+Shift+V pastes into terminal"
    pr: 418
    platforms: [windows, linux]
    prerequisites:
      - app: true
      - terminal: true
    instructions:
      - "Copy some text to clipboard"
      - "Click on a terminal to focus it"
      - "Press Ctrl+Shift+V"
    expected:
      - "Clipboard text is pasted into the terminal"
      - "Ctrl+V sends literal ^V to terminal (not paste)"
    verification: manual
    tags: [clipboard, platform]

  - id: MT-KB-05
    name: "Large paste confirmation dialog"
    pr: 418
    platforms: [all]
    prerequisites:
      - app: true
      - terminal: true
    instructions:
      - "Copy more than 5000 characters to clipboard (e.g., a large file)"
      - "Paste into a terminal using the platform paste shortcut"
    expected:
      - "A confirmation dialog appears showing the character count"
      - "Clicking 'Cancel' does not paste"
      - "Clicking 'Paste' performs the paste"
    verification: manual
    tags: [clipboard]

  - id: MT-KB-06
    name: "Keyboard shortcuts overlay via chord"
    pr: 418
    platforms: [all]
    prerequisites:
      - app: true
    instructions:
      - "Press Ctrl+K (on macOS: Cmd+K)"
      - "Observe the status bar shows chord pending indicator"
      - "Then press Ctrl+S (on macOS: Cmd+S) within 1.5 seconds"
    expected:
      - "Status bar shows '(Ctrl+K) was pressed. Waiting for second key...' after first key"
      - "Shortcuts overlay opens after Ctrl+K Ctrl+S chord completes"
      - "Overlay shows all shortcuts in two columns (Win/Linux and macOS)"
      - "Search bar filters shortcuts"
    verification: manual
    tags: [ui, chord]

  - id: MT-KB-07
    name: "Keyboard settings panel"
    pr: 418
    platforms: [all]
    prerequisites:
      - app: true
    instructions:
      - "Open Settings and navigate to the Keyboard category"
      - "Click on a keybinding cell to enter recording mode"
      - "Press a new key combination"
      - "Verify the binding is updated"
      - "Click Reset to restore the default"
    expected:
      - "Keyboard settings shows all shortcuts grouped by category"
      - "Recording mode captures the key combination"
      - "Conflict warning appears if the new binding conflicts with an existing one"
      - "Reset restores the default binding"
      - "Changes persist after restarting the app"
    verification: manual
    tags: [settings]

  - id: MT-KB-08
    name: "Platform-aware modifier keys"
    pr: 418
    platforms: [all]
    prerequisites:
      - app: true
      - terminal: true
    instructions:
      - "On macOS: press Cmd+B to toggle sidebar"
      - "On Windows/Linux: press Ctrl+Shift+B to toggle sidebar"
      - "Verify that the non-platform modifier does not trigger the shortcut"
    expected:
      - "macOS: Cmd+B toggles sidebar, Ctrl+B sends control character to terminal"
      - "Windows/Linux: Ctrl+Shift+B toggles sidebar; Ctrl+B is sent to the terminal (tmux prefix passes through)"
    verification: manual
    tags: [platform]

  # --- Shell-conflict avoidance & pass-through (PR feature/keybindings-conflict-avoidance) ---

  - id: MT-KB-09
    name: "Windows/Linux: Ctrl+W in shell deletes a word (not Close Tab)"
    platforms: [windows, linux]
    prerequisites:
      - app: true
      - terminal: true
    instructions:
      - "Open a local terminal and type 'echo foo bar baz' without pressing Enter"
      - "Press Ctrl+W (readline delete-word-backward)"
      - "Verify the last word ('baz') is deleted from the command line"
      - "Press Ctrl+Shift+W"
      - "Verify the tab closes"
    expected:
      - "Ctrl+W deletes the word; tab is NOT closed"
      - "Ctrl+Shift+W closes the tab"
    verification: manual
    tags: [passthrough, shell-conflict]

  - id: MT-KB-10
    name: "Windows/Linux: Ctrl+B reaches tmux prefix on remote SSH session"
    platforms: [windows, linux]
    prerequisites:
      - app: true
      - terminal: true
      - ssh_server: true
    instructions:
      - "SSH into a remote machine that has tmux installed"
      - "Run 'tmux' on the remote host"
      - "Press Ctrl+B followed by C (tmux prefix + new window)"
      - "Verify a new tmux window is created (status bar shows two windows)"
      - "Press Ctrl+Shift+B"
      - "Verify the local sidebar toggles"
    expected:
      - "Ctrl+B reaches tmux on the remote host (passes through, no sidebar toggle)"
      - "Ctrl+Shift+B toggles the local termiHub sidebar"
    verification: manual
    tags: [passthrough, ssh, tmux]

  - id: MT-KB-11
    name: "Windows/Linux: Ctrl+\\ sends SIGQUIT (does not split panel)"
    platforms: [windows, linux]
    prerequisites:
      - app: true
      - terminal: true
    instructions:
      - "Open a local terminal and run 'sleep 60'"
      - "Press Ctrl+\\"
      - "Verify the sleep process is killed by SIGQUIT (terminal returns to prompt, may print 'Quit (core dumped)')"
      - "Press Alt+Shift+\\"
      - "Verify the panel splits to the right"
    expected:
      - "Ctrl+\\ kills the foreground process via SIGQUIT (no split)"
      - "Alt+Shift+\\ splits the panel"
    verification: manual
    tags: [passthrough, signals]

  - id: MT-KB-12
    name: "Pass-through toggle in Settings disables shell-key forwarding"
    platforms: [all]
    prerequisites:
      - app: true
      - terminal: true
    instructions:
      - "Rebind 'Close Tab' to Ctrl+W via Settings → Keyboard Shortcuts (Win/Linux) or Ctrl+W (mac)"
      - "Focus a terminal tab and press Ctrl+W"
      - "Verify the tab is NOT closed (pass-through suppresses the rebound shortcut)"
      - "Disable 'Pass through shell keys when terminal is focused'"
      - "Press Ctrl+W again"
      - "Verify the tab IS closed"
      - "Re-enable pass-through and click Reset to Safer Defaults"
    expected:
      - "While pass-through is on, Ctrl+W in a focused terminal reaches the PTY"
      - "Disabling pass-through makes the rebound shortcut fire instead"
      - "Reset to Safer Defaults restores the conflict-avoiding bindings"
    verification: manual
    tags: [passthrough, settings]

  # --- Context-aware shortcut routing (PR #787) ---

  - id: MT-KB-13
    name: "macOS: Cmd+F opens Monaco find in an editor tab, terminal search in a terminal tab"
    pr: 787
    platforms: [macos]
    prerequisites:
      - app: true
      - terminal: true
    instructions:
      - "Open a terminal, produce some output, and use the tab/pane menu 'Open in Editor' (or open any file in the editor) to create a Monaco editor tab"
      - "With the editor tab active, press Cmd+F"
      - "Verify Monaco's find widget opens in the top-right of the editor (with Aa / .* toggles and a match count)"
      - "Switch to a terminal tab and press Cmd+F"
      - "Verify the terminal search bar opens (not Monaco)"
    expected:
      - "Cmd+F in an editor tab opens Monaco's built-in find widget"
      - "Cmd+F in a terminal tab opens the terminal search bar"
      - "No regression: global shortcuts (Cmd+\\ split, Cmd+Shift+Enter zoom) still work from an editor tab"
    verification: manual
    tags: [routing, editor, platform]

  - id: MT-KB-14
    name: "Editor-delegation toggle reverts to global-first behavior"
    pr: 787
    platforms: [macos]
    prerequisites:
      - app: true
      - terminal: true
    instructions:
      - "Open Settings → Keyboard and confirm 'Let editor tabs handle their own editing shortcuts' is on (default)"
      - "Open a Monaco editor tab and verify Cmd+F opens Monaco's find widget"
      - "Disable 'Let editor tabs handle their own editing shortcuts'"
      - "With the editor tab active, press Cmd+F again"
      - "Verify Monaco's find no longer opens (old global-first behavior is restored)"
      - "Re-enable the toggle"
    expected:
      - "With the toggle on, Cmd+F is delegated to Monaco in an editor tab"
      - "With the toggle off, the global handler claims Cmd+F and Monaco's find does not open"
    verification: manual
    tags: [routing, editor, settings]
