category: local-shell
display_name: "Local Shell"

tests:
  # --- No initial output flash for WSL/SSH terminals (PR #175) ---

  - id: MT-LOCAL-03
    release_gate: true
    manual_reason: "WSL welcome-banner paint timing on real Windows + WSL"
    name: "WSL connection — no welcome banner flash"
    pr: 175
    platforms: [windows]
    prerequisites:
      - app: true
    setup:
      - create_connection:
          name: "WSL Flash Test"
          type: local
          config:
            shellType: wsl
      - connect: "WSL Flash Test"
    instructions:
      - "Watch the terminal carefully as it opens"
      - "Look for any flash of setup commands or welcome banner"
    expected:
      - "No welcome banner or setup commands flash before the prompt appears"
      - "A clean prompt appears directly"
    verification: manual

  - id: MT-LOCAL-08
    release_gate: true
    manual_reason: "real macOS key repeat / press-and-hold accent picker"
    name: "macOS key repeat works"
    pr: 48
    platforms: [macos]
    prerequisites:
      - app: true
    setup:
      - create_connection:
          name: "Key Repeat Test"
          type: local
          config:
            shellType: zsh
      - connect: "Key Repeat Test"
    instructions:
      - "Switch to the 'Key Repeat Test' tab"
      - "Hold any letter key (e.g., 'k') for 3 seconds"
      - "Observe the terminal output"
    expected:
      - "Key repeats continuously (kkkkkkkkkkkk...)"
      - "Accent picker does NOT appear"
      - "No delay before repeat starts"
    verification: manual

  # --- Folded in from the per-feature walkthroughs in docs/testing.md (#3695) ---

  - id: MT-LOCAL-30
    release_gate: true
    manual_reason: "ConPTY/WebView2 stale-row paint"
    name: "Windows CMD output paints in order"
    pr: 1849
    platforms: [windows]
    prerequisites:
      - app: true
    instructions:
      - "Open a local CMD tab in a git repo with many untracked files."
      - "Run git status, then press Enter twice. Repeat a few times."
      - "Run dir /s."
    expected:
      - "The file list is one block and the prompts come after it."
      - "No resize is needed and output does not slow down."
    verification: manual
    tags: [visual]

  - id: MT-LOCAL-31
    release_gate: true
    manual_reason: "real installer + UAC on a Git-free Windows host"
    name: "Guided Git for Windows install end to end"
    pr: 1672
    platforms: [windows]
    prerequisites:
      - app: true
    instructions:
      - "On Windows without Git Bash or WSL, pick 'Git Bash \u2014 set up\u2026' as default shell."
      - "Click Open git-scm.com, then close the browser."
      - "Click Install in terminal and finish the winget install (accept UAC)."
      - "Reopen the shell picker without restarting."
    expected:
      - "The browser opens the Git download page."
      - "A tab 'Install Git for Windows' runs winget."
      - "Git Bash is now a normal row; the set-up entry is gone."
    verification: manual
    tags: [os-native, hardware]

  - id: MT-LOCAL-32
    release_gate: true
    manual_reason: "live xterm render pacing and UI responsiveness need a foreground display"
    name: "Output flood stays bounded and Ctrl+C stops it promptly"
    pr: 4417
    platforms: [windows, macos, linux]
    prerequisites:
      - app: true
    instructions:
      - "Open a local shell tab and run yes (Windows: a PowerShell loop printing a line forever)."
      - "Let it run for 30 seconds and watch termiHub's memory in the OS task manager."
      - "Press Ctrl+C."
    expected:
      - "Memory stays roughly flat; the UI keeps responding to clicks and tab switches."
      - "Output stops within about a second and the prompt returns."
      - "The app log shows no 'write data discarded' errors."
    verification: manual
    tags: [visual]

  - id: MT-LOCAL-33
    release_gate: true
    manual_reason: "real WebGL context limits and GPU rendering need a foreground display"
    name: "Twenty terminal tabs all render with GPU contexts released while hidden"
    pr: 4308
    platforms: [windows, macos, linux]
    prerequisites:
      - app: true
    instructions:
      - "Open 20 local shell tabs and run ls in each one."
      - "Click through every tab, then split the view and show two tabs side by side."
      - "Open the Log Viewer and filter for 'renderer'."
    expected:
      - "Every tab shows its text sharply and promptly when selected; none is blank or garbled."
      - "Switching tabs logs 'renderer webgl (visible)' for the shown tab and 'renderer dom (hidden)' for the hidden one."
      - "No 'webgl context lost' entries appear."
    verification: manual
    tags: [visual]
