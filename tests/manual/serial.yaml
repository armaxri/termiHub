category: serial
display_name: "Serial"

tests:
  - id: MT-SER-02
    release_gate: true
    manual_reason: "needs a clean Windows install without a Nerd Font"
    name: "Glyphs render on clean Windows without Nerd Font"
    pr: 131
    platforms: [windows]
    prerequisites:
      - app: true
    instructions:
      - "On a clean Windows machine without any Nerd Font installed locally"
      - "Open a terminal and verify font rendering"
    expected:
      - "Bundled Nerd Font renders glyphs correctly"
    verification: manual
    tags: [visual]

  # --- Configurable serial port scan prefixes (now under Settings → Serial) ---

  - id: MT-SER-06
    automation_issue: 3683
    name: "Serial port scan prefixes appear in Settings → General"
    platforms: [all]
    prerequisites:
      - app: true
    instructions:
      - "Open Settings (gear icon in the Activity Bar)"
      - "Navigate to General"
      - "Scroll to the 'Serial Port Scan Prefixes' section"
    expected:
      - "The section shows a badge with the count of enabled / total prefixes (e.g. '42 / 42 enabled')"
      - "A list of built-in prefixes is shown, each with a toggle switch"
      - "An 'Add' input and button are present at the bottom"
    verification: manual
    tags: [settings, serial]

  - id: MT-SER-07
    automation_issue: 3683
    name: "Disabling a prefix removes its ports from the serial dropdown"
    platforms: [linux]
    prerequisites:
      - app: true
      - hardware: "A Linux machine with at least one /dev/ttyS* device present"
    instructions:
      - "Open Settings → General → Serial Port Scan Prefixes"
      - "Toggle the 'ttyS' prefix off"
      - "Open a connection editor for a Serial connection type"
      - "Click the Port dropdown"
    expected:
      - "No /dev/ttyS* ports appear in the dropdown"
      - "Toggle 'ttyS' back on; re-open the dropdown — the ports reappear"
    verification: manual
    tags: [settings, serial]

  - id: MT-SER-08
    automation_issue: 3683
    name: "Adding a custom prefix discovers matching ports"
    platforms: [linux]
    prerequisites:
      - app: true
      - hardware: "A Linux machine with a device matching a non-default /dev prefix (e.g. create a test symlink: sudo ln -s /dev/null /dev/ttyTEST0)"
    instructions:
      - "Open Settings → General → Serial Port Scan Prefixes"
      - "Type 'ttyTEST' in the add-prefix input and click Add"
      - "Open a connection editor for a Serial connection type"
      - "Click the Port dropdown"
    expected:
      - "The custom prefix 'ttyTEST' appears in the list with a delete button"
      - "/dev/ttyTEST0 appears in the port dropdown"
      - "Deleting the custom prefix and reopening the dropdown removes the port"
    verification: manual
    tags: [settings, serial]

  # --- Live virtual-serial happy path (ported from E2E SERIAL-02/03/04, PR #813) ---
  # Since #854 the port field is an editable combobox, so a virtual socat PTY path
  # can be typed (and is now driven by the bridge in test_serial.py). The connect /
  # echo / disconnect happy path still runs manually because the harness has no
  # host-side socat echo fixture: #859 removed the unreachable container fixture
  # instead of adding one. Automating it is tracked in #3682.

  - id: MT-SER-09
    automation_issue: 3682
    name: "Connect to a virtual serial port, echo data, and handle disconnect"
    pr: 813
    platforms: [linux, macos]
    prerequisites:
      - app: true
      - hardware: "socat-backed virtual serial pair + echo server: run ./scripts/test-system.sh (or examples/scripts/setup-virtual-serial.sh + examples/serial/serial-echo-server.py)"
    instructions:
      - "Create a Serial connection; in the Port field type/select /tmp/termihub-serial-a, leave baud at 9600"
      - "Open the connection and confirm a terminal tab appears and renders"
      - "Type 'SERIAL_ECHO_TEST' and press Enter"
      - "Stop the socat process (or unplug the device) to simulate a disconnect"
    expected:
      - "A terminal tab opens titled with the connection name and an xterm renders"
      - "The echo server echoes the typed text back into the terminal"
      - "On disconnect the app stays stable (no crash); the tab shows a connection-closed/error state"
    verification: manual
    tags: [serial]
