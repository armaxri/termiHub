; xrdp configuration for the termiHub RDP integration fixture (#3609).
; Trimmed from Debian's default /etc/xrdp/xrdp.ini: only the options the fixture
; relies on are set; everything else keeps xrdp's built-in default.

[Globals]
ini_version=1
fork=true
port=3389
tcp_nodelay=true
tcp_keepalive=true
; TLS only: xrdp has no NLA/CredSSP, and the legacy RC4 layer is not what the
; backend's Auto security mode negotiates.
security_layer=tls
crypt_level=high
; Empty = xrdp's packaged self-signed certificate (the test ignores cert errors).
certificate=
key_file=
ssl_protocols=TLSv1.2, TLSv1.3
; Log the client straight into the Xorg session with the Client Info
; credentials, never showing the interactive login window...
autorun=Xorg
; ...and refuse (disconnect) a client whose credentials are wrong instead of
; falling back to that login window, so a wrong password is a hard failure.
require_credentials=true
allow_channels=true
allow_multimon=true
bitmap_cache=true
bitmap_compression=true
bulk_compression=true
max_bpp=32
new_cursors=true
use_fastpath=both

[Logging]
LogFile=xrdp.log
LogLevel=INFO
EnableSyslog=false
EnableConsole=true
ConsoleLevel=INFO

[Channels]
rdpdr=true
rdpsnd=true
drdynvc=true
cliprdr=true
rail=true
xrdpvr=true

[Xorg]
name=Xorg
lib=libxup.so
username=ask
password=ask
port=-1
code=20
