# termiHub Comprehensive Test Infrastructure
#
# Usage:
#   docker compose up -d                    # Start all containers
#   docker compose up -d ssh-password       # Start specific container
#   docker compose --profile fault up -d    # Include fault injection
#   docker compose --profile stress up -d   # Include stress test containers
#   docker compose --profile all up -d      # Start everything
#   docker compose down                     # Stop and remove all
#
# Profiles:
#   (default)  - Core test containers (SSH, telnet, serial)
#   agent      - Remote agent test container
#   fault      - Network fault injection proxy
#   stress     - SFTP stress test container
#   network    - Network tools live test target (HTTP server on :8080)
#   all        - Everything
#
# Networks:
#   test-net      - Main test network (all containers)
#   jumphost-net  - Isolated network for jump host testing

services:
  # ============================================================
  # SSH Containers
  # ============================================================

  # Standard SSH with password auth (OpenSSH latest / Ubuntu 24.04)
  ssh-password:
    build: ./ssh-password
    container_name: ${TERMIHUB_TEST_PROJECT:-termihub}-ssh-password
    ports:
      - "127.0.0.1:${TERMIHUB_TEST_SSH_PASSWORD_PORT:-2201}:22"
    networks:
      - test-net
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/22"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Legacy SSH (OpenSSH 7.x / Ubuntu 18.04) for compatibility
  ssh-legacy:
    build:
      context: ./ssh-legacy
      additional_contexts:
        keys: ../fixtures/ssh-keys
    container_name: ${TERMIHUB_TEST_PROJECT:-termihub}-ssh-legacy
    ports:
      - "127.0.0.1:${TERMIHUB_TEST_SSH_LEGACY_PORT:-2202}:22"
    networks:
      - test-net
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/22"]
      interval: 5s
      timeout: 3s
      retries: 5

  # SSH with key-based auth only (all key types)
  ssh-keys:
    build:
      context: ./ssh-keys
      additional_contexts:
        keys: ../fixtures/ssh-keys
    container_name: ${TERMIHUB_TEST_PROJECT:-termihub}-ssh-keys
    ports:
      - "127.0.0.1:${TERMIHUB_TEST_SSH_KEYS_PORT:-2203}:22"
    networks:
      - test-net
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/22"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Jump host bastion (entry point for 2-hop chain)
  ssh-jumphost-bastion:
    build:
      context: ./ssh-jumphost-bastion
      additional_contexts:
        keys: ../fixtures/ssh-keys
    container_name: ${TERMIHUB_TEST_PROJECT:-termihub}-ssh-bastion
    ports:
      - "127.0.0.1:${TERMIHUB_TEST_SSH_BASTION_PORT:-2204}:22"
    networks:
      - test-net
      - jumphost-net
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/22"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Jump host target (only reachable via bastion through jumphost-net)
  ssh-jumphost-target:
    build:
      context: ./ssh-jumphost-target
      additional_contexts:
        keys: ../fixtures/ssh-keys
    container_name: ${TERMIHUB_TEST_PROJECT:-termihub}-ssh-target
    # No host port exposure — only reachable via bastion
    networks:
      - jumphost-net
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/22"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Restricted shell (rbash) for testing limited environments
  ssh-restricted:
    build: ./ssh-restricted
    container_name: ${TERMIHUB_TEST_PROJECT:-termihub}-ssh-restricted
    ports:
      - "127.0.0.1:${TERMIHUB_TEST_SSH_RESTRICTED_PORT:-2205}:22"
    networks:
      - test-net
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/22"]
      interval: 5s
      timeout: 3s
      retries: 5

  # SSH with pre-auth banner and MOTD
  ssh-banner:
    build: ./ssh-banner
    container_name: ${TERMIHUB_TEST_PROJECT:-termihub}-ssh-banner
    ports:
      - "127.0.0.1:${TERMIHUB_TEST_SSH_BANNER_PORT:-2206}:22"
    networks:
      - test-net
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/22"]
      interval: 5s
      timeout: 3s
      retries: 5

  # SSH with internal services for tunnel testing
  ssh-tunnel-target:
    build:
      context: ./ssh-tunnel-target
      additional_contexts:
        keys: ../fixtures/ssh-keys
    container_name: ${TERMIHUB_TEST_PROJECT:-termihub}-ssh-tunnel
    ports:
      - "127.0.0.1:${TERMIHUB_TEST_SSH_TUNNEL_PORT:-2207}:22"
    networks:
      - test-net
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/22"]
      interval: 5s
      timeout: 3s
      retries: 5

  # SSH with X11 forwarding support
  ssh-x11:
    build:
      context: ./ssh-x11
      additional_contexts:
        keys: ../fixtures/ssh-keys
    container_name: ${TERMIHUB_TEST_PROJECT:-termihub}-ssh-x11
    ports:
      - "127.0.0.1:${TERMIHUB_TEST_SSH_X11_PORT:-2208}:22"
    networks:
      - test-net
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/22"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Remote agent test container (for agent E2E tests)
  remote-agent:
    build:
      context: ./remote-agent
      additional_contexts:
        keys: ../fixtures/ssh-keys
    container_name: ${TERMIHUB_TEST_PROJECT:-termihub}-remote-agent
    ports:
      - "127.0.0.1:${TERMIHUB_TEST_REMOTE_AGENT_PORT:-2211}:22"
    networks:
      - test-net
    profiles:
      - agent
      - all
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/22"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================
  # Telnet
  # ============================================================

  telnet-server:
    build: ./telnet-server
    container_name: ${TERMIHUB_TEST_PROJECT:-termihub}-telnet
    ports:
      - "127.0.0.1:${TERMIHUB_TEST_TELNET_PORT:-2301}:23"
    networks:
      - test-net
    healthcheck:
      # netcat isn't installed in the image; use bash's /dev/tcp to probe the
      # telnet port without an extra package (the old `nc` probe always failed,
      # so the container reported "unhealthy" even when serving).
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/23"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================
  # Network Tools Live Test Target (profile: network)
  # ============================================================

  # Simple HTTP server for testing: ping, port scan, DNS, HTTP monitor.
  # Exposed on 127.0.0.1:8080 (HTTP) and known SSH port for port scanning.
  network-target:
    image: nginx:alpine
    container_name: ${TERMIHUB_TEST_PROJECT:-termihub}-network-target
    ports:
      - "127.0.0.1:${TERMIHUB_TEST_NETWORK_TARGET_PORT:-8080}:80"
    networks:
      - test-net
    profiles:
      - network
      - all
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================
  # Network Fault Injection (profile: fault)
  # ============================================================

  network-fault-proxy:
    build:
      context: ./network-fault-proxy
      additional_contexts:
        keys: ../fixtures/ssh-keys
    container_name: ${TERMIHUB_TEST_PROJECT:-termihub}-network-fault
    ports:
      - "127.0.0.1:${TERMIHUB_TEST_NETWORK_FAULT_PORT:-2209}:22"
    cap_add:
      - NET_ADMIN
    networks:
      - test-net
    profiles:
      - fault
      - all
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/22"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================
  # SFTP Stress Testing (profile: stress)
  # ============================================================

  sftp-stress:
    build:
      context: ./sftp-stress
      additional_contexts:
        keys: ../fixtures/ssh-keys
    container_name: ${TERMIHUB_TEST_PROJECT:-termihub}-sftp-stress
    ports:
      - "127.0.0.1:${TERMIHUB_TEST_SFTP_STRESS_PORT:-2210}:22"
    networks:
      - test-net
    profiles:
      - stress
      - all
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/22"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  test-net:
    name: ${TERMIHUB_TEST_PROJECT:-termihub}-test-net
    driver: bridge
  jumphost-net:
    name: ${TERMIHUB_TEST_PROJECT:-termihub}-jumphost-net
    driver: bridge
    internal: true  # No external access — only bastion bridges to test-net
