[project]
name = "termihub-system-tests"
version = "0.0.0"
description = "termiHub Python system-test harness (cross-platform WebSocket bridge tests)."
# Broad floor so the harness runs on the varied dev/CI machines (incl. RPis);
# the exact resolved versions are pinned in `uv.lock` for reproducibility.
requires-python = ">=3.9"
dependencies = [
    "pytest>=8.0",
    # pytest-xdist shards the integration lane across worker processes so the
    # macOS/Windows nightly legs finish under their timeout (#2639). Used with
    # `--dist loadscope` so each test class (its class-scoped app fixture) stays
    # on one worker — one app launch per class, classes fanned across workers.
    "pytest-xdist>=3.5",
    # pytest-rerunfailures adds bounded auto-retries to the nightly integration
    # lanes only (see .github/workflows/system-integration.yml, #2698). The real
    # bugs are fixed; this absorbs irreducible hosted-CI environmental flakiness
    # (WKWebView occlusion / WebView2 contention / Xvfb render-timing). The bulk
    # lane runs at `--reruns 2` (the documented policy value); the display-critical
    # grades (test_agent_reconnect_ui, test_layout_scrollback_ui) run at
    # `--reruns 0` so an intermittent regression on the reconnect path reds the lane
    # on first failure rather than being retried away (CI-002). `--reruns` re-runs
    # only FAILED tests, so a deterministic regression still fails after its retries.
    # Not used by per-PR CI, which stays strict.
    "pytest-rerunfailures>=14.0",
    "websockets>=12.0",
    "psutil>=5.9",
    # tftpy: real TFTP RRQ client for the Embedded Services SVC-13 transfer check
    # (replaces host-curl, whose tftp:// support is build-dependent — issue #964).
    "tftpy>=0.8",
    # pyftpdlib: in-process FTP server for the app-independent transfer-checker
    # tests (test-only; the FTP checker itself uses only the stdlib ftplib).
    "pyftpdlib>=1.5",
]

[tool.uv]
# The harness (`termihub_harness`) is imported via `pythonpath = ["."]`, not
# installed as a distribution — so uv manages only the dependencies and the
# `.venv`, and never tries to build this directory as a package.
package = false

[tool.pytest.ini_options]
# Run from tests/system. `pythonpath = .` makes `termihub_harness` importable;
# test modules in tests/ import their local `fake_app` via pytest's prepend mode.
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: launches the real built app/agent (needs `pnpm tauri build`)",
    "manual: guided-manual test — automated setup then an operator prompt (skipped unless --manual + TTY)",
    "category: optional feature-category override for the test inventory (scripts/build-test-inventory.py); e.g. @pytest.mark.category(\"ssh\")",
]
