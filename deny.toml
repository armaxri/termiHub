# cargo-deny configuration — supply-chain gate for the Rust workspace.
# https://embarkstudios.github.io/cargo-deny/
#
# CI runs `cargo deny check advisories bans licenses sources` (see
# .github/workflows/code-quality.yml -> "Security Audit"). Four gates:
#   - advisories: YANKED-crate gate (#2074) — a lockfile pinning a crate version
#     that has been yanked from crates.io fails CI instead of the app silently
#     shipping a withdrawn dependency.
#   - bans: documented release sign-off for the pre-release RustCrypto stack.
#   - licenses: license compliance for the distributed binary — every crate in
#     the transitive tree must resolve to an explicitly allowed license (#2096).
#   - sources: every crate must come from crates.io — an unexpected registry or
#     git source fails CI (#2096).
# cargo-audit (also in the Security Audit job) covers RUSTSEC *vulnerability*
# advisories.
#
# A yanked TRANSITIVE crate reds every open PR here at once. It is auto-mitigated
# by the weekly `cargo update` chore (.github/workflows/cargo-update-lockfile.yml)
# and, when one slips through, fixed via the runbook: docs/ci-yanked-crate-runbook.md.

[advisories]
# A yanked crate in the lockfile fails CI. This is the headline gate: it is how
# the crypto-bigint 0.7.x yank surfaced (crypto-bigint reached 0.7.5, a
# non-yanked release, pulled transitively via russh 0.61 -> RustCrypto).
yanked = "deny"

# Unmaintained-crate advisories are NOT gated here. The tree carries a large,
# tauri-bound set of them (gtk3 bindings, async-std, proc-macro-error, unic-*,
# rustls-pemfile, serial, ...) that no local change can clear — they are tracked
# for upstream resolution in #1037. cargo-audit (the other tool in the Security
# Audit job) likewise does not fail on unmaintained advisories, so the two stay
# in agreement. This keeps cargo-deny focused on yanked crates + real
# vulnerabilities rather than churn we cannot act on.
unmaintained = "none"

# RUSTSEC advisories accepted as a conscious release sign-off. These mirror the
# cargo-audit ignore list (.cargo/audit.toml) so the two tools agree; each has a
# documented rationale there.
#
# - RUSTSEC-2023-0071: Marvin timing sidechannel in `rsa` (transitive via
#   ssh-key). We only extract raw RSA key components and rebuild via OpenSSL;
#   we never decrypt through this crate, so the sidechannel does not apply.
#
# The `unsound` entries below are non-actionable transitive advisories accepted
# as a release sign-off (#3054; findings SUP-003/004/006). They are unsoundness
# NOTICES on upstream-pinned crates (git2, event-listener, the Tauri/GTK3 glib
# bindings), not exploitable vulnerabilities in our usage, and no upstream fix
# exists. Kept in lockstep with .cargo/audit.toml. Unmaintained advisories are
# NOT listed here — they are globally ungated above via `unmaintained = "none"`.
# Real vulnerabilities and yanked crates are NOT ignored and still fail CI.
ignore = [
    "RUSTSEC-2023-0071",
    # event-listener: unsound (!Send tags cross threads via StackSlot), transitive.
    "RUSTSEC-2026-0221",
    # git2: unsound (UB in Remote::list()), Tauri/git transitive.
    "RUSTSEC-2026-0183",
    # git2: unsound (UB via Signature from buffer-created BlameHunk), transitive.
    "RUSTSEC-2026-0184",
    # glib: unsound VariantStrIter iterator impls, Tauri/GTK3 binding transitive.
    "RUSTSEC-2024-0429",
]

[licenses]
# License allowlist for the distributed binary. A crate whose license does not
# resolve to one of these fails CI, so an unknown or restrictive (e.g. GPL)
# license cannot slip into the tree unnoticed. The set below is the standard
# permissive family actually present in the current transitive tree
# (enumerated via `cargo deny list`); it is deliberately NOT a blanket allow.
#
# Copyleft note: MPL-2.0 is included. It is a *file-level* weak copyleft — it
# governs only the individual MPL-licensed source files (cssparser, selectors,
# slog, ...), imposes no obligation on the rest of the binary, and is standard
# practice to ship in a permissively-licensed distributed application. Stronger
# copyleft (GPL/AGPL/LGPL) is intentionally NOT allowed: `r-efi` is
# `MIT OR Apache-2.0 OR LGPL-2.1-or-later`, so it resolves to MIT/Apache and its
# LGPL arm is never selected — a crate offering *only* (L)GPL would still fail.
allow = [
    "0BSD",
    "Apache-2.0",
    # LLVM-exception is a permissive linking exception layered on Apache-2.0
    # (strictly more permissive). Required by winx, which offers no other arm;
    # rustix/cap-std/wasi/wit-bindgen all also dual-license to plain MIT/Apache.
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# The workspace's own crates (termihub, termihub-core, termihub-agent,
# termihub-plugin-api, and the example plugins) carry no `license` field and so
# read as "Unlicensed". They are first-party, never published to crates.io, and
# covered by the repository's MIT LICENSE — not a third-party licensing concern.
# `ignore = true` skips these private (publish = false) workspace members so the
# gate applies only to external dependencies.
private = { ignore = true }

[sources]
# Every crate must come from crates.io. An unexpected registry or a git
# dependency (a common supply-chain injection vector) fails CI. The workspace
# currently has no git dependencies; the vendored `vnc-rs` is an in-tree path
# member (no external source) and is not subject to this check. Add a git URL to
# `allow-git` here if a vetted git dependency is ever introduced.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[bans]
# Pre-release RustCrypto stack — documented release sign-off (#2074).
#
# The SSH auth path pulls a pre-release RustCrypto stack via russh 0.61.1. The
# accepted set is wider than just rsa + ssh-key — russh 0.61 pulls the whole
# in-flight RustCrypto 0.7/0.10 line and the matching Dalek pre-releases. The
# pre-release crates the tree currently carries (from Cargo.lock) are:
#   - rsa 0.10.0-rc, ssh-key 0.7.0-rc, ssh-encoding 0.3.0-rc, ssh-cipher 0.3.0-rc
#   - crypto-bigint 0.7.x (was yanked at 0.7.0-0.7.4; now the non-yanked 0.7.5)
#   - AEAD/cipher: aead 0.6.0-rc, aes-gcm 0.11.0-rc
#   - hashes/KDF: blake2 0.11.0-rc, argon2 0.6.0-rc
#   - elliptic-curve 0.14.0-rc, ecdsa 0.17.0-rc, p256/p384/p521 0.14.0-rc,
#     primefield 0.14.0-rc, primeorder 0.14.0-rc, rustcrypto-ff 0.14.0-rc,
#     rustcrypto-group 0.14.0-rc, pkcs1 0.8.0-rc
#   - Dalek edge (ride alongside via the SSH stack): curve25519-dalek 5.0.0-pre,
#     ed25519-dalek 3.0.0-pre
# These RC/pre crates are a deliberate, accepted risk for this release: russh has
# not yet cut a stable release on the final RustCrypto 0.7/0.10 line. Upgrading to
# a russh release built on stable RustCrypto is tracked in #1037. Until then the
# yanked gate above guards against the versions silently regressing to a yanked
# release, which is the concrete failure mode we care about.
#
# Multiple versions of a crate are common in a large tree (Cargo allows one
# version per major) and are not a supply-chain signal on their own, so they do
# not gate CI here.
multiple-versions = "allow"
wildcards = "allow"
