name: Release Linux Smoke

# Automates the Linux x64 post-release install-smoke test (#478) so it needs no
# human (#2651). After the "Release" workflow finishes publishing a tag's
# artifacts, this downloads the just-published Linux x64 AppImage and .deb,
# installs/extracts each on ubuntu-latest, and runs scripts/smoke-test.sh against
# the installed binary headlessly under xvfb-run (the same WebKitGTK headless
# knobs as system-integration.yml). tauri-driver is retired, so smoke-test.sh
# uses its process-based fallback: launch the app, confirm it stays alive, and
# shut it down cleanly.
#
# This is a SEPARATE workflow (not a job inside release.yml) on purpose: it is
# fully decoupled from the release-build matrix and cannot collide with concurrent
# edits to release.yml. It is triggered by the completion of the "Release" run
# rather than the `release: published` event, because release.yml publishes the
# (non-draft) release BEFORE its build matrix uploads the assets — a
# `release: published` job would run too early and find no artifacts to test.
#
# NOTE (#2646 fixed, #2669): the built desktop app now launches headless under
# WebKitGTK on ubuntu-latest (the nightly integration Xvfb leg passes), so the two
# GUI-launch smoke steps are load-bearing again and the final gate is enforcing
# (ENFORCE=true) — a GUI-launch smoke regression fails the job. The job already
# HARD-fails if an artifact is missing, cannot be extracted, or will not install,
# which is real signal on artifact well-formedness. (The steps stay
# `continue-on-error` so both outcomes are captured and reported together, then
# the "Enforce smoke results" step fails on any non-success.)

on:
  # Fire after the Release workflow completes. workflow_run runs the copy of this
  # file on the default branch, which is the correct behavior for release
  # automation (releases are cut from the default branch's tags).
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  # Manual re-run against any already-published release, for verification without
  # cutting a new release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to smoke-test (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-x64-install-smoke:
    name: Linux x64 install + smoke (AppImage + .deb)
    # Only run for a manual dispatch, or for a Release run that was triggered by a
    # tag push AND succeeded — a failed/cancelled Release has no assets to test.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # webkit2gtk headless knobs — identical to system-integration.yml. They let
      # the WebKitGTK webview render in software under Xvfb (no real GPU/display)
      # and silence at-spi accessibility-bus warnings on a headless box.
      WEBKIT_DISABLE_DMABUF_RENDERER: "1"
      WEBKIT_DISABLE_COMPOSITING_MODE: "1"
      NO_AT_BRIDGE: "1"

      # #2646: force fully-software GL (Mesa llvmpipe) for the WebKitGTK web
      # process so it launches headless without a real GPU/DRI3 device — mirrors
      # system-integration.yml. Needs libgl1-mesa-dri (installed below). The two
      # WEBKIT_DEBUG/G_MESSAGES_DEBUG diagnostics surface the real cause in the
      # smoke logs if a launch still fails.
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: "llvmpipe"
      WEBKIT_DEBUG: "Process"
      G_MESSAGES_DEBUG: "all"

    steps:
      - name: Resolve release tag
        id: tag
        env:
          GH_EVENT: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$GH_EVENT" = "workflow_dispatch" ]; then
            TAG="${DISPATCH_TAG:-}"
          else
            # For a tag-triggered upstream run, head_branch is the tag name.
            TAG="${RUN_TAG:-}"
            case "$TAG" in
              v*.*.*) ;;
              *)
                # Fallback: resolve the version tag pointing at the release commit.
                echo "head_branch '$TAG' is not a version tag; resolving from head_sha"
                TAG="$(gh api "repos/${GITHUB_REPOSITORY}/tags" --paginate \
                        --jq "map(select(.commit.sha==\"${RUN_SHA:-}\")) | .[].name" \
                        | grep -E '^v[0-9]' | head -n1 || true)"
                ;;
            esac
          fi
          case "$TAG" in
            v*.*.*) ;;
            *) echo "::error::could not resolve a version tag (got '$TAG')"; exit 1 ;;
          esac
          echo "Resolved release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        # smoke-test.sh cd's to the git top-level, so a checkout must be present.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install headless runtime dependencies
        # Runtime WebKitGTK/GTK libs the app links against plus Xvfb for a virtual
        # display. Mirrors the runtime-relevant subset of system-integration.yml's
        # Tauri dep list (build-only tools like build-essential/patchelf are not
        # needed to RUN a prebuilt app). apt-get install of the .deb below also
        # pulls the package's own declared dependencies.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-0 \
            libgtk-3-0 \
            libayatana-appindicator3-1 \
            librsvg2-2 \
            libgl1-mesa-dri \
            dbus-x11 \
            xvfb

      - name: Relax AppArmor unprivileged-userns restriction (#2646)
        # ubuntu-24.04 blocks unprivileged user namespaces
        # (kernel.apparmor_restrict_unprivileged_userns=1), which stops WebKitGTK
        # 2.44+ from spawning its bubblewrap-sandboxed web-content process — the app
        # boots but its webview never loads, so the headless GUI-launch smoke below
        # cannot pass. Relax it before the smoke steps (same fix as
        # system-integration.yml). Guarded no-op on kernels without the knob.
        run: |
          set -euo pipefail
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "kernel.apparmor_restrict_unprivileged_userns absent; nothing to relax"
          fi

      - name: Download Linux x64 release assets
        id: download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$PWD/dist"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*linux-x64.AppImage' \
            --pattern '*linux-x64.deb' \
            --dir "$PWD/dist"
          ls -la "$PWD/dist"
          APPIMAGE="$(find "$PWD/dist" -name '*linux-x64.AppImage' | head -n1)"
          DEB="$(find "$PWD/dist" -name '*linux-x64.deb' | head -n1)"
          [ -n "$APPIMAGE" ] || { echo "::error::AppImage asset not found for $TAG"; exit 1; }
          [ -n "$DEB" ] || { echo "::error::.deb asset not found for $TAG"; exit 1; }
          echo "appimage=$APPIMAGE" >> "$GITHUB_OUTPUT"
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"

      - name: Extract AppImage
        id: appimage
        env:
          APPIMAGE: ${{ steps.download.outputs.appimage }}
        run: |
          set -euo pipefail
          chmod +x "$APPIMAGE"
          workdir="$PWD/appimage-extract"
          rm -rf "$workdir"
          mkdir -p "$workdir"
          # FUSE is unavailable on GitHub runners, so extract rather than mount.
          ( cd "$workdir" && "$APPIMAGE" --appimage-extract >/dev/null )
          BIN="$workdir/squashfs-root/AppRun"
          [ -x "$BIN" ] || { echo "::error::extracted AppRun not executable at $BIN"; exit 1; }
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"

      - name: Install .deb
        id: deb
        env:
          DEB: ${{ steps.download.outputs.deb }}
        run: |
          set -euo pipefail
          # apt-get install of a local path resolves the package's dependencies,
          # equivalent to `dpkg -i` followed by `apt-get -f install`.
          sudo apt-get install -y "$DEB"
          BIN="$(command -v termihub || true)"
          [ -n "$BIN" ] || { echo "::error::termihub not on PATH after .deb install"; exit 1; }
          echo "Installed binary: $BIN"
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"

      - name: Smoke-test AppImage (headless)
        id: smoke_appimage
        # #2646: the built app may not launch headless under WebKitGTK 2.52 yet.
        continue-on-error: true
        env:
          BIN: ${{ steps.appimage.outputs.bin }}
        run: |
          set -euo pipefail
          # dbus-run-session (#2646): give the app a throwaway D-Bus session bus so
          # its startup xdg-desktop-portal call fails fast instead of blocking ~25s
          # on a headless runner (same fix as system-integration.yml).
          echo "== AppImage --version =="
          timeout 60 xvfb-run -a dbus-run-session -- "$BIN" --version 2>&1 | tee appimage-version.log
          echo "== AppImage smoke-test.sh =="
          xvfb-run -a dbus-run-session -- ./scripts/smoke-test.sh "$BIN" 2>&1 | tee appimage-smoke.log

      - name: Smoke-test .deb (headless)
        id: smoke_deb
        # #2646: the built app may not launch headless under WebKitGTK 2.52 yet.
        continue-on-error: true
        env:
          BIN: ${{ steps.deb.outputs.bin }}
        run: |
          set -euo pipefail
          # dbus-run-session (#2646): same headless-portal fast-fail as the AppImage
          # step above.
          echo "== .deb --version =="
          timeout 60 xvfb-run -a dbus-run-session -- "$BIN" --version 2>&1 | tee deb-version.log
          echo "== .deb smoke-test.sh =="
          xvfb-run -a dbus-run-session -- ./scripts/smoke-test.sh "$BIN" 2>&1 | tee deb-smoke.log

      - name: Enforce smoke results
        # ENFORCE=true (#2669): #2646 is fixed — the ubuntu headless app now launches
        # (the system-integration ubuntu leg passes) — so the two GUI-launch smoke
        # steps are load-bearing again and a real regression must fail the release.
        # The download/extract/install steps above already HARD-fail on malformed or
        # non-installable artifacts; this gate now also fails on a GUI-launch smoke
        # regression. (Was advisory/false while #2646 was open.)
        if: always()
        env:
          ENFORCE: "true"
          APPIMAGE_OUTCOME: ${{ steps.smoke_appimage.outcome }}
          DEB_OUTCOME: ${{ steps.smoke_deb.outcome }}
        run: |
          set -euo pipefail
          echo "AppImage smoke outcome: $APPIMAGE_OUTCOME"
          echo ".deb smoke outcome:     $DEB_OUTCOME"
          {
            echo "### Linux x64 install-smoke"
            echo ""
            echo "- AppImage smoke: \`$APPIMAGE_OUTCOME\`"
            echo "- .deb smoke: \`$DEB_OUTCOME\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$APPIMAGE_OUTCOME" != "success" ] || [ "$DEB_OUTCOME" != "success" ]; then
            if [ "$ENFORCE" = "true" ]; then
              echo "::error::Linux x64 install-smoke failed"
              exit 1
            fi
            echo "::warning::Linux x64 install-smoke did not fully pass (advisory until #2646 lands)"
          fi

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-x64-install-smoke-logs
          path: |
            appimage-version.log
            appimage-smoke.log
            deb-version.log
            deb-smoke.log
          if-no-files-found: ignore
          retention-days: 14
