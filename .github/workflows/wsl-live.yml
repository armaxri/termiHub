name: WSL Live (Windows)

# Runs the live WSL tests (core/src/backends/wsl_live_tests.rs, #4008) against
# a REAL distribution on a GitHub-hosted Windows runner. The regular Windows
# "Run Tests" leg has no distro installed, so every WSL test there self-skips:
# the real wsl.exe spawn, the ConPTY session, the `\\wsl$` share, the distro-side
# 0600 init script (#2837), symlink listing (#1523) and Windows <-> WSL queued
# copies (#3567) would otherwise never run anywhere in CI.
#
# Distro setup: Vampire/setup-wsl, the de-facto standard action for WSL on
# hosted runners (used per-PR by e.g. uutils/coreutils on windows-latest). It
# installs the WSL platform when the image lacks it (windows-2025 ships without
# WSL), imports the distro, and caches the downloaded rootfs in the Actions
# cache, so a warm run spends well under a minute on setup. WSL 2 (the action's
# default and what users run) — the hosted Windows runners support the nested
# virtualization it needs. Debian is the smallest mainstream distro, keeping the
# cache footprint low; nothing under test is distro-specific.
#
# Not on every PR (installing WSL plus a Windows build of the core crate costs
# several minutes): nightly + manual + PRs that touch the WSL code paths.
# `TERMIHUB_REQUIRE_WSL=1` turns a missing distro from a skip into a failure, so
# a broken setup reds this lane instead of skipping to a false green.
#
# A second job (`wsl-spawn-grades`, #4962) builds the system-test app and grades
# MT-SHI-01/03 through the Python harness: `termiHub spawn --pick` lists every
# distribution and opens the picked one, and `spawn --kind wsl` opens the
# default distro or a saved connection's. That needs a SECOND distribution, so
# the job imports Alpine's minirootfs (3.6 MB, pinned by SHA-256) next to
# Debian; the two report different `ID=`s in /etc/os-release.

on:
  schedule:
    # main ONLY — weekly, Wednesday 03:41 UTC (off the top of the hour to dodge
    # scheduler congestion). A scheduled run executes MAIN's copy of this file
    # and checks out main, so main is graded with its own job definitions.
    #
    # The DAILY develop nightly is not a cron here (#4847): GitHub would run
    # main's copy of this YAML against develop's tree. scheduled-dispatch.yml
    # dispatches it at 03:41 UTC instead (`gh workflow run wsl-live.yml --ref
    # develop`), which executes develop's YAML. Registry:
    # scripts/internal/scheduled-lanes.mjs.
    - cron: "41 3 * * 3"
  workflow_dispatch:
  pull_request:
    # Every source the live suite exercises (#4618); kept in sync by the drift
    # test in scripts/internal/ci-changes.test.mjs ("live lane path filters").
    paths:
      - "core/src/backends/wsl.rs"
      - "core/src/backends/wsl_*.rs"
      - "core/src/backends/conpty_cursor.rs"
      - "core/src/session/shell.rs"
      - "core/src/files/browser.rs"
      - "core/src/files/copy.rs"
      - "core/src/files/local.rs"
      - "core/src/files/ranged.rs"
      - "core/src/files/utils.rs"
      - "core/src/files/transfer/attempt.rs"
      - "core/src/files/transfer/local.rs"
      - "core/src/files/transfer/local_folder.rs"
      - "core/src/files/transfer/mod.rs"
      - "core/src/files/transfer/progress.rs"
      - "core/src/files/transfer/registry.rs"
      - "core/src/files/transfer/retry.rs"
      - "core/src/files/transfer/scheduler.rs"
      - "core/src/files/transfer/state.rs"
      # The spawn path the wsl-spawn-grades job drives (#4962).
      - "src-tauri/src/commands/spawn.rs"
      - "src-tauri/src/spawn/**"
      - "src/components/Spawn/**"
      - "tests/system/tests/test_external_spawn.py"
      - ".github/workflows/wsl-live.yml"

concurrency:
  group: wsl-live-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token (CI-010): checkout + build + test only.
permissions:
  contents: read

jobs:
  wsl-live:
    name: Live WSL tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # checkout's default ref: a PR's merge ref, the dispatching branch
          # (develop for the nightly dispatch) or main for the weekly cron.
          persist-credentials: false

      - name: Install WSL and a Debian distribution
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        # Bounded: a stuck WSL install must not eat the whole job timeout.
        timeout-minutes: 20
        with:
          distribution: Debian-12
          wsl-version: 2
          use-cache: "true"

      - name: Skip the distribution's first-launch user setup
        # Modern `.wsl` distributions run an OOBE ("Enter new UNIX username:") on
        # the first INTERACTIVE launch. setup-wsl only ever runs commands, so the
        # flag is still set and the tests' ConPTY session would land in that
        # prompt instead of a shell. Clear WSL's per-distro `RunOOBE` registry
        # value (read by the service at instance start; see microsoft/WSL
        # DistributionRegistration.h) and restart the distro, so an interactive
        # `wsl.exe -d` opens a root bash like a set-up user distro does.
        shell: pwsh
        run: |
          $name = 'Debian-12'
          $lxss = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Lxss'
          $key = Get-ChildItem $lxss |
            Where-Object { (Get-ItemProperty $_.PSPath).DistributionName -eq $name }
          if (-not $key) { throw "no Lxss registration for $name" }
          Set-ItemProperty -Path $key.PSPath -Name RunOOBE -Value 0 -Type DWord
          wsl.exe --terminate $name
          (Get-ItemProperty $key.PSPath) | Select-Object DistributionName, RunOOBE, DefaultUid

      - name: Show the installed distributions
        shell: pwsh
        env:
          # Plain UTF-8 instead of wsl.exe's default UTF-16 output.
          WSL_UTF8: "1"
        run: |
          wsl.exe --version
          wsl.exe --list --verbose

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Its own key: this lane builds only core with `wsl,local-transfer`.
          shared-key: wsl-live
          # Reader/writer split (#3328): PRs restore, only develop/main save.
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}

      - name: Run the live WSL tests
        shell: bash
        env:
          TERMIHUB_REQUIRE_WSL: "1"
          RUST_BACKTRACE: "1"
        run: |
          set -euo pipefail
          filter=backends::wsl::live_tests::
          args=(-p termihub-core --no-default-features --features "wsl,local-transfer" --lib "$filter")
          # Guard against a filter that silently matches nothing (a false green).
          count=$(cargo test "${args[@]}" -- --list --format terse | grep -c ': test$' || true)
          echo "live WSL tests found: $count"
          if [ "$count" -lt 4 ]; then
            echo "::error::expected at least 4 live WSL tests under $filter, found $count"
            exit 1
          fi
          # Serial: the session test and the init-script test share the distro's /tmp.
          cargo test "${args[@]}" -- --test-threads=1 --nocapture

  # MT-SHI-01/03 (#4962): the desktop app's WSL spawns against two real
  # distributions, through the Python bridge harness. Its own job so the core
  # tests above keep their fast feedback; both install WSL from the same cache.
  wsl-spawn-grades:
    name: WSL spawn grades (Windows, MT-SHI-01/03)
    runs-on: windows-latest
    # A debug build of the whole app on Windows plus two short grades.
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install WSL and a Debian distribution
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        timeout-minutes: 20
        with:
          distribution: Debian-12
          wsl-version: 2
          use-cache: "true"

      - name: Skip the distribution's first-launch user setup
        # Same RunOOBE reset as the wsl-live job: the spawned tab is an
        # interactive `wsl.exe -d`, which must land in a shell, not the OOBE.
        shell: pwsh
        run: |
          $name = 'Debian-12'
          $lxss = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Lxss'
          $key = Get-ChildItem $lxss |
            Where-Object { (Get-ItemProperty $_.PSPath).DistributionName -eq $name }
          if (-not $key) { throw "no Lxss registration for $name" }
          Set-ItemProperty -Path $key.PSPath -Name RunOOBE -Value 0 -Type DWord
          wsl.exe --terminate $name

      - name: Import a second distribution (Alpine minirootfs)
        # Pinned by SHA-256: a changed or truncated download fails here, never
        # in a grade. `wsl --import` gets a plain tar (decompressed here), which
        # every WSL version accepts. Debian stays the default distribution.
        shell: pwsh
        env:
          ALPINE_URL: https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/x86_64/alpine-minirootfs-3.22.7-x86_64.tar.gz
          ALPINE_SHA256: 57e364a241bab0699cd8a760c0fd7b270e9cbcbd3cee822cb2b07ca6d925c16c
          WSL_UTF8: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $tgz = Join-Path $env:RUNNER_TEMP 'alpine-minirootfs.tar.gz'
          $tar = Join-Path $env:RUNNER_TEMP 'alpine-minirootfs.tar'
          $dir = Join-Path $env:RUNNER_TEMP 'wsl-alpine'
          Invoke-WebRequest -Uri $env:ALPINE_URL -OutFile $tgz -MaximumRetryCount 4 -RetryIntervalSec 10
          $hash = (Get-FileHash -Algorithm SHA256 $tgz).Hash.ToLowerInvariant()
          if ($hash -ne $env:ALPINE_SHA256) { throw "Alpine rootfs SHA-256 $hash != $env:ALPINE_SHA256" }
          $in = [IO.File]::OpenRead($tgz)
          $gz = [IO.Compression.GZipStream]::new($in, [IO.Compression.CompressionMode]::Decompress)
          $out = [IO.File]::Create($tar)
          $gz.CopyTo($out)
          $out.Dispose(); $gz.Dispose(); $in.Dispose()
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          wsl.exe --import termihub-alpine $dir $tar --version 2
          if ($LASTEXITCODE -ne 0) { throw "wsl --import failed ($LASTEXITCODE)" }
          wsl.exe --set-default Debian-12
          if ($LASTEXITCODE -ne 0) { throw "wsl --set-default failed ($LASTEXITCODE)" }
          wsl.exe -d termihub-alpine --exec cat /etc/os-release
          if ($LASTEXITCODE -ne 0) { throw "the imported distribution does not start" }
          wsl.exe --list --verbose

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The app build is not the core-only build above: its own key.
          shared-key: wsl-live-app
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}

      - name: Setup uv
        # uv version comes from .github/uv-version (#1552, WA-CI-017).
        uses: ./.github/actions/setup-uv
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: tests/system/uv.lock

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the desktop app (debug)
        # The shared system-test app recipe (test bridge + mock-remote-desktop,
        # #3664), under Git Bash like the integration lane.
        shell: bash
        run: scripts/internal/build-system-test-app.sh --debug

      - name: Run the WSL spawn grades
        # TERMIHUB_REQUIRE_WSL=1: fewer than two distributions fails the grades
        # instead of skipping them. The skip guard (lane `wsl-live`, no
        # allowlisted skips) also fails any skip and an empty selection.
        # --reruns 0: a first failure is the honest result for two grades.
        shell: bash
        env:
          TERMIHUB_REQUIRE_WSL: "1"
          TERMIHUB_SKIP_GUARD_LANE: wsl-live
        run: >-
          ./tests/system/pytest.sh -m integration -k TestWslSpawnGrades -v
          -n 1 --dist loadscope --reruns 0 -r aR

      - name: Upload failure artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wsl-spawn-grades-artifacts
          path: tests/system/artifacts/
          if-no-files-found: ignore
          retention-days: 14
