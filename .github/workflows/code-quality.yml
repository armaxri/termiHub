name: Code Quality

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

# Cancel superseded runs on the same ref (a force-push or a newer commit on the
# PR) so we don't burn runner minutes finishing checks for stale commits.
concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rust Backend Quality Checks
  rust-quality:
    name: Rust Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # Reader/writer split. Integration happens on develop: merging a PR is a
          # push event on develop, which SAVEs the cache; main is the default
          # branch, kept as a global fallback. PRs (based on develop) restore the
          # develop cache via base-branch access and never write their own. PR
          # caches are dead weight after merge — and the repo cache was already
          # over GitHub's 10 GB limit, causing LRU eviction churn (cold caches).
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (linter)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Guards #868: the Docker-dependent integration tests in core/tests/ are
      # feature-gated (#![cfg(feature = "ssh")], etc.) so a plain
      # `cargo test -p termihub-core` compiles to a no-op instead of erroring.
      # Every other Rust job runs --all-features, where cargo feature unification
      # would hide a newly-added un-gated test file — this check would not. The
      # ssh / telnet partial builds also verify the gates resolve correctly
      # (telnet.rs needs both ssh and telnet). Compile-only (--no-run): the tests
      # themselves need Docker fixtures and run in the integration lane.
      - name: Core compiles without --all-features (guards #868)
        run: |
          cargo test -p termihub-core --no-run
          cargo test -p termihub-core --no-run --features ssh
          cargo test -p termihub-core --no-run --features telnet

      # Prebuilt binary download (~seconds) instead of `cargo install cargo-audit`,
      # which compiles from source (~3 min) on a cold cache.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Check for security vulnerabilities
        run: cargo audit

  # Frontend Quality Checks
  frontend-quality:
    name: Frontend Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Check TypeScript types
        run: pnpm exec tsc --noEmit

      - name: Check formatting with Prettier
        run: pnpm run format:check

      - name: Lint Markdown
        run: pnpm run markdownlint

      - name: Check data-testid catalog is up to date (#899)
        run: python3 scripts/build-testid-catalog.py --check

  # Run tests
  tests:
    name: Run Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # Reader/writer split. Integration happens on develop: merging a PR is a
          # push event on develop, which SAVEs the cache; main is the default
          # branch, kept as a global fallback. PRs (based on develop) restore the
          # develop cache via base-branch access and never write their own. PR
          # caches are dead weight after merge — and the repo cache was already
          # over GitHub's 10 GB limit, causing LRU eviction churn (cold caches).
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Run Rust tests
        run: cargo test --workspace --all-features

      - name: Run frontend tests
        run: pnpm test

  # Python system-test harness — fast "machinery" suite (issue #801).
  # These drive the harness plumbing (bridge server, Driver, protocol, transfer
  # checkers) against a FakeApp, so they need no app build and no Docker — just
  # uv + the locked deps in tests/system/uv.lock. The `integration` group (which
  # launches the real desktop app) is excluded; it runs in the dedicated
  # system-test lanes, not on every PR.
  system-test-machinery:
    name: System-Test Harness (machinery)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          # Pin the interpreter for reproducibility; dependencies are resolved
          # from the committed tests/system/uv.lock (the wrapper uses --frozen).
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: tests/system/uv.lock

      - name: Run machinery suite
        run: ./tests/system/pytest.sh -m "not integration" -q

  # Dependency Security Audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: pnpm audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: true  # Don't fail build, just warn

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Prebuilt binary download instead of compiling cargo-audit from source.
      # This job has no rust-cache, so the old `cargo install` recompiled it every
      # run (~197 s); the prebuilt download takes seconds.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Cargo Audit
        run: cargo audit

  # Check conventional commits (PR only)
  commit-lint:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate PR commits
        run: |
          BASE=$(git merge-base HEAD origin/${{ github.base_ref }})
          pnpm exec commitlint --from "$BASE" --to ${{ github.sha }} --verbose
