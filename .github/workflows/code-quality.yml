name: Code Quality

# Per-PR vs post-merge split (#3325). CI runner queueing is the bottleneck, so a
# PR runs only the fast, high-signal gates for the areas it actually touches
# (see the `changes` job + scripts/internal/ci-changes.mjs). Every push to
# develop/main runs EVERY job here on EVERY platform, so anything a PR skipped
# is still caught post-merge — watch develop's own runs. See
# docs/contributing.md → "What a green PR proves".

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

# Cancel superseded runs on the same ref (a force-push or a newer commit on the
# PR) so we don't burn runner minutes finishing checks for stale commits.
concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token (CI-010). Every job here only checks out, builds, tests,
# and lints the tree — none comment on the PR, publish check runs, push, or
# upload SARIF — so a read-only token is all that is needed.
permissions:
  contents: read

jobs:
  # Changed-area detection (#3325). Classifies the PR's changed files so the jobs
  # below can skip areas the PR cannot affect. On push (develop/main) every area
  # is on. Downstream jobs gate on `!= 'false'` so that if THIS job fails, its
  # outputs are empty and every job runs (fail-open) — never silently skipped.
  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      frontend: ${{ steps.detect.outputs.frontend }}
      sidecar: ${{ steps.detect.outputs.sidecar }}
      scripts: ${{ steps.detect.outputs.scripts }}
      harness: ${{ steps.detect.outputs.harness }}
      markdown: ${{ steps.detect.outputs.markdown }}
      test_matrix: ${{ steps.detect.outputs.test_matrix }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The PR merge commit plus its parents, so HEAD^1 (the base tip) exists.
          fetch-depth: 2

      - name: Classify changed files
        id: detect
        uses: ./.github/actions/detect-changes

  # Rust Backend Quality Checks
  rust-quality:
    name: Rust Code Quality
    runs-on: ubuntu-latest
    needs: changes
    # Also on sidecar-only PRs: cargo-machete below scans rdp-sidecar/ too.
    if: >-
      ${{ !cancelled() && (needs.changes.outputs.rust != 'false' ||
      needs.changes.outputs.sidecar != 'false') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Pin the clippy/rustfmt toolchain (issue #2549). A floating `@stable`
      # lets any new Rust release introduce clippy lints that fire under the
      # `-D warnings` gate below, reddening every PR with no code change (this
      # blocked all PRs on 2026-08-24, #2547). A fixed version makes clippy
      # results reproducible; bump it deliberately — treat it as a periodic
      # "bump toolchain" chore so new lints are adopted on purpose, not by
      # surprise. Only this lint job is pinned: the other cargo jobs build/test
      # rather than lint with `-D warnings`, so a new stable release cannot red
      # them the same way, and pinning them (or a repo-root rust-toolchain.toml)
      # would needlessly freeze local dev and every other CI job on one version.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0 branch
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Reader/writer split. Integration happens on develop: merging a PR is a
          # push event on develop, which SAVEs the cache; main is the default
          # branch, kept as a global fallback. PRs (based on develop) restore the
          # develop cache via base-branch access and never write their own. PR
          # caches are dead weight after merge — and the repo cache was already
          # over GitHub's 10 GB limit, causing LRU eviction churn (cold caches).
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (linter)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Guards #868 + #1499: builds termihub-core with individual opt-in features
      # *in isolation*, which the --all-features jobs above cannot do because
      # feature unification always compiles everything together.
      #
      # #868: the Docker-dependent integration tests in core/tests/ are
      # feature-gated (#![cfg(feature = "ssh")], etc.) so a plain
      # `cargo test -p termihub-core` compiles to a no-op instead of erroring; a
      # newly-added un-gated test file would be hidden under --all-features but
      # caught here. The per-feature builds also verify the gates resolve
      # correctly (telnet.rs needs both ssh and telnet).
      #
      # #1499: opt-in feature code (e.g. `ftp`, which gates core/src/backends/ftp/)
      # must compile on the offending PR. This isolation build additionally catches
      # gate bugs that --all-features masks — code reachable under `ftp` that
      # accidentally leans on a symbol only present when another feature is on.
      # (The #1324/#1456 regression — an MLSD FileEntry construction missing the
      # new `writable` field, E0063 — fails here.)
      #
      # #3318: this runs as `clippy --all-targets -D warnings` (not
      # `test --no-run`) so a lint that only fires in one feature's isolated build
      # also fails here — e.g. a helper that is dead code when `telnet` alone is on.
      # `--all-targets` still compiles the (feature-gated) test targets, so the
      # #868 guard is preserved; those tests need Docker fixtures and run in the
      # integration lane. Every opt-in core feature is linted on its own, plus the
      # bare no-feature build. The feature list is read from core/Cargo.toml via
      # `cargo metadata`, so a newly added feature is linted without editing this.
      - name: Core clippy with each opt-in feature in isolation (guards #868, #1499, #3318)
        run: |
          set -euo pipefail
          FEATURES=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "termihub-core")
                     | .features | keys[] | select(. != "default")')
          test -n "$FEATURES"
          echo "::group::clippy termihub-core (no features)"
          cargo clippy -p termihub-core --no-default-features --all-targets -- -D warnings
          echo "::endgroup::"
          for feature in $FEATURES; do
            echo "::group::clippy termihub-core --features $feature"
            cargo clippy -p termihub-core --no-default-features --features "$feature" \
              --all-targets -- -D warnings
            echo "::endgroup::"
          done

      # ts-rs codegen staleness gate (audit DUP-030). The TypeScript DTOs in
      # src/types/generated/ are generated from their Rust source of truth by the
      # ts-rs `export_bindings_*` tests. Regenerate them, then fail if the tree
      # changed — i.e. a Rust struct was edited without committing the refreshed
      # binding, which would let the TS↔Rust contract drift silently. Regenerating
      # is fast (unit-level) and one platform suffices: cluster-1 has no
      # `#[cfg]`-gated fields, so the output is platform-independent.
      - name: Regenerate ts-rs TypeScript bindings
        run: cargo test -p termihub --lib export_bindings
      - name: Regenerate ts-rs TypeScript bindings (core crate)
        run: cargo test -p termihub-core --lib export_bindings
      - name: Fail if generated TypeScript is stale
        run: git diff --exit-code -- src/types/generated

      # Fail the PR when a crate declares a dependency it never uses (TOOL-008).
      # Unused deps grow build time and supply-chain surface. cargo-machete
      # statically scans each crate's sources for usage — no build required.
      # Known false positives (e.g. a dep whose package name differs from its
      # lib crate name, which the name-scan cannot match) are ignore-listed
      # per-crate via `[package.metadata.cargo-machete]`. Run from the repo root
      # it walks the whole tree, so it also covers the workspace-EXCLUDED
      # `rdp-sidecar/` and the vendored crates the workspace jobs don't build.
      # Prebuilt binary download (~seconds) instead of compiling from source.
      - name: Install cargo-machete
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: cargo-machete

      - name: Check for unused dependencies (cargo-machete)
        run: cargo machete

      # NOTE (CI-019): the RUSTSEC `cargo audit` gate is NOT run here — it runs
      # in the dedicated `security-audit` job in security-audit.yml (which invokes the
      # identical bare `cargo audit` over the same workspace Cargo.lock, alongside
      # the `cargo deny` supply-chain gate). Running it in both jobs was redundant;
      # the single invocation in `security-audit` covers the same advisories.

      # Validate the plugin packaging tooling (#1994) against the example
      # plugins. The JSON-only theme plugin is packaged with --no-build (no
      # native code, safe on any platform); the native echo-backend is built and
      # packaged here on Linux — its cdylib compiles cross-platform via the
      # workspace build above, but packaging carries only this OS's library, so
      # it is validated on a single platform rather than the full matrix. The
      # packer round-trip-validates each archive; a broken package fails the job.
      - name: Package example plugins (guards #1994)
        run: |
          ./scripts/package-plugin.sh examples/plugins/solarized-night-theme --out target/plugin-dist --no-build
          ./scripts/package-plugin.sh examples/plugins/echo-backend --out target/plugin-dist
          test -f target/plugin-dist/solarized-night-1.0.0.termihub-plugin
          test -f target/plugin-dist/echo-backend-1.0.0.termihub-plugin

  # Clippy on the Windows target (#3312). `rust-quality` above lints only on
  # ubuntu, where every `#[cfg(windows)]` item (the WSL backend, the named-pipe
  # IPC listener, the Windows clipboard/registry integration, ...) is compiled
  # out — so Windows-only code was never linted, and lints such as a
  # production `.expect()` (TOOL-010) merged undetected. `cargo test` on the
  # Windows test leg compiles that code but does not lint it. This job closes
  # the gap with the same `-D warnings` gate over the same workspace/target/
  # feature set, so a lint in Windows-gated code fails the offending PR.
  #
  # fmt and the other ubuntu steps are platform-independent and are not
  # repeated here; this job is clippy only.
  rust-quality-windows:
    name: Rust Code Quality (Windows)
    runs-on: windows-latest
    needs: changes
    # PR lane: only when Rust changed (#3325). Post-merge: always.
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Same pinned clippy toolchain as `rust-quality` (issue #2549): a floating
      # `@stable` would let a new Rust release red this gate with no code change.
      # Bump both pins together.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0 branch
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Same reader/writer split as `rust-quality`: only develop/main pushes
          # save; PRs restore the develop cache and never write their own.
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}

      - name: Run Clippy on Windows (linter)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # RDP Sidecar Quality + Supply-Chain Checks (PKG-013)
  #
  # The RDP sidecar (`termihub-rdp-helper`, #1747) is a workspace-EXCLUDED crate
  # with its OWN Cargo.lock — IronRDP's CredSSP crypto and russh pin incompatible
  # RustCrypto pre-releases, so it cannot live in the workspace lockfile. It is
  # cross-built and bundled into every release via Tauri `externalBin` (#1754),
  # so it SHIPS to users — yet the workspace `rust-quality` / `security-audit`
  # jobs above never see it (they operate on the workspace lockfile). This job
  # closes that gap: it gates the sidecar's own lockfile with the same checks the
  # workspace gets — fmt, clippy (`-D warnings`), tests, and the cargo-deny
  # supply-chain gate (advisories/bans/licenses/sources against rdp-sidecar's own
  # Cargo.lock + rdp-sidecar/deny.toml). All steps run in rdp-sidecar/.
  #
  # PR lane: only when rdp-sidecar/** changes (#3325). Post-merge: always, so a
  # time-based RUSTSEC/yank on the sidecar lockfile still surfaces on develop.
  rdp-sidecar-quality:
    name: RDP Sidecar Quality
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.sidecar != 'false' }}
    defaults:
      run:
        working-directory: rdp-sidecar

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Pin the clippy/rustfmt toolchain to match the workspace rust-quality job
      # (issue #2549): a floating `@stable` lets a new Rust release introduce
      # clippy lints that fire under `-D warnings` and red the job with no code
      # change. Bump deliberately as a "bump toolchain" chore.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0 branch
        with:
          components: rustfmt, clippy

      # The sidecar links libasound2 (cpal/rodio audio); build-essential provides
      # the C toolchain its sys-crates need. Mirrors the release build's Ubuntu
      # deps for this crate.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libasound2-dev
        working-directory: .

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The sidecar has its own lockfile/target, separate from the workspace.
          workspaces: rdp-sidecar
          # Same reader/writer split as the other Rust jobs: only develop/main
          # (push events) write the cache; PRs restore it read-only.
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --check

      # `--locked` fails the job if rdp-sidecar/Cargo.lock is stale instead of
      # silently re-locking it in CI (#3334: a stale ringbuf pin went unnoticed
      # because every build quietly re-resolved it).
      - name: Run Clippy (linter)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      # Prebuilt binary download (~seconds) instead of compiling from source.
      - name: Install cargo-deny
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: cargo-deny

      # Supply-chain gate over the sidecar's OWN lockfile. Config:
      # rdp-sidecar/deny.toml. Covers RUSTSEC vulnerability + yanked-crate
      # advisories (equivalent to cargo-audit, both use the RustSec DB), the
      # license allowlist for the shipped binary, and the crates.io-only source
      # gate. Accepted advisories are documented in rdp-sidecar/deny.toml.
      - name: Cargo Deny (supply-chain gate)
        run: cargo deny check advisories bans licenses sources

  # Frontend Quality Checks
  # Also on docs-only PRs: Prettier + markdownlint over docs/**/*.md live here.
  frontend-quality:
    name: Frontend Code Quality
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      ${{ !cancelled() && (needs.changes.outputs.frontend != 'false' ||
      needs.changes.outputs.markdown != 'false') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Check TypeScript types
        run: pnpm exec tsc --noEmit

      - name: Check formatting with Prettier
        run: pnpm run format:check

      - name: Lint Markdown
        run: pnpm run markdownlint

      # Advisory unused-code report (audit findings TOOL-009 + TOOL-008 JS slice).
      # knip statically finds unused files, exports, and dependencies; knip.json
      # declares the real entrypoints (src/main.tsx, the vite/vitest configs, test
      # setup + test files, the dynamically-loaded testbridge) so the report is
      # useful-not-noisy. It is REPORT-ONLY: `continue-on-error` plus `|| true`
      # guarantee it can never fail the build (knip exits non-zero when it finds
      # anything). The JS unused-*dependency* slice (TOOL-008, the advisory
      # counterpart of the blocking cargo-machete Rust check) is now clean — the
      # genuinely-unused deps knip flagged have been removed. The remaining
      # unused-file/-export findings are a separate future cleanup effort, not
      # this step's job; the step only surfaces them in the run log.
      - name: Unused-code report (knip, advisory)
        continue-on-error: true
        run: pnpm knip || true

  # Advisory frontend bundle-size budget (audit finding TOOL-013).
  #
  # Builds the frontend and reports the total on-disk size of dist/ against a
  # generous budget (see scripts/internal/bundle-size.mjs), so a large size
  # regression is visible in the run log without gating a release. This is
  # REPORT-ONLY: the whole job is `continue-on-error` and every step is too, so
  # it can never red a PR — a red "Bundle Size" check would be misleading. The
  # size script itself always exits 0; a build failure here is caught by the
  # real build/test lanes, not by this advisory job.
  #
  # POST-MERGE ONLY (#3325): advisory, so it does not spend a PR runner slot; the
  # develop/main push run reports the size trend.
  bundle-size:
    name: Bundle Size (advisory)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        continue-on-error: true
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        continue-on-error: true
        run: pnpm build

      - name: Report bundle size (advisory)
        continue-on-error: true
        run: pnpm size >> "$GITHUB_STEP_SUMMARY"

  # Shell-script quality: static analysis + cross-platform parity + headless
  # smoke (audit finding TOOL-012 / WA-CI-029).
  #
  # Three gates run here (all blocking): ShellCheck static analysis, the
  # .sh<->.cmd parity check, and a headless --help smoke that actually EXECUTES
  # scripts (catching the runtime set -u/expansion faults static checks miss).
  #
  # No CI lane ran shellcheck over the repo's shell scripts, so shell bugs
  # shipped silently — including the SC2257-class defect that broke
  # verify-agent-reconnect.sh on its first real run (an unquoted heredoc
  # arithmetic expansion that shellcheck flagged but was suppressed as a false
  # positive, with no CI to re-check it). This job gates every PR on shellcheck
  # over the repo's shell scripts (scripts/**, tests/**, examples/**, agent/**,
  # plus the executable scripts/hooks/* discovered by shebang). It runs on a
  # bare checkout (no pnpm/cargo install), so only tracked scripts are scanned.
  #
  # Severity gate = warning, not error. SC2257 and the other set -u / quoting
  # hazards this lane exists to catch are warning-level (an error-only gate
  # would miss the exact class that motivated the finding). The tree is green at
  # warning today; any new warning fails the PR. Fix real findings; a
  # `# shellcheck disable=SCxxxx` is allowed only with a one-line justification.
  #
  # The shellcheck version is pinned (same rationale as the clippy toolchain
  # pin, #2549): a floating "stable" lets a new shellcheck release add a warning
  # that reds every PR with no script change. Bump it deliberately as a chore.
  shellcheck:
    name: Shell Script Quality
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.scripts != 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning
          version: v0.11.0
          ignore_paths: node_modules target graft

      # Cross-platform script-parity gate (TOOL-012 / WA-CI-029). ShellCheck
      # only sees the .sh half; nothing enforced that each user-facing
      # scripts/**/*.sh has its Windows .cmd twin (and vice-versa), so the pairs
      # drifted. This BLOCKING check fails when a .sh lacks a .cmd (or a .cmd a
      # .sh), minus the documented single-platform ALLOWLIST inside the script
      # (per-OS test-system orchestrators + Unix-only internal helpers).
      - name: Check script cross-platform parity (.sh <-> .cmd)
        run: ./scripts/internal/check-script-parity.sh

      # Headless smoke of shell scripts (TOOL-012 / WA-CI-029). ShellCheck and
      # `bash -n` are static and never RUN a script, so they miss runtime
      # `set -u` / expansion faults on first execution — the class that broke
      # verify-agent-reconnect.sh (#2545). This step actually executes each
      # script's non-destructive `--help` fast path (real shebang + set flags +
      # top-of-file sourcing + arg parser) and asserts a clean exit 0. Scoped to
      # the safe --help path so it needs no Docker/network/app-build and is
      # deterministic, not flaky.
      - name: Headless smoke of shell scripts (--help paths)
        run: ./scripts/internal/check-script-headless.sh

  # Run tests
  #
  # Per-PR matrix (#3325, computed by the `changes` job):
  #   * ubuntu  — when Rust and/or frontend changed; runs only the half that changed.
  #   * windows — only when Rust changed, Rust tests only (it catches real
  #               Windows-only Rust bugs; the platform-independent vitest suite is
  #               ~15 min on Windows and is not repeated there on a PR).
  #   * macos   — never on a PR: macOS runners are the scarcest in the pool.
  # On push to develop/main the full 3-OS matrix runs both halves everywhere.
  tests:
    name: Run Tests
    runs-on: ${{ matrix.os }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.test_matrix != '[]' }}
    strategy:
      # Don't cancel sibling legs when one platform fails: a single real
      # failure (e.g. Windows) otherwise cancels the others, and downstream
      # `gh pr checks` renders cancellations as `fail` — making one broken
      # platform look like all three are red. Let every leg run to completion
      # so each reports its own true pass/fail. (#1669)
      fail-fast: false
      matrix:
        # Fail-open fallback: if `changes` failed, run the full matrix.
        os: ${{ fromJSON(needs.changes.outputs.test_matrix || '["ubuntu-latest","windows-latest","macos-latest"]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Rust
        if: needs.changes.outputs.rust != 'false'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch

      - name: Setup pnpm
        # Only on a leg that runs vitest (see the frontend steps below); the Rust
        # tests need no node_modules (debug builds use devUrl, not ../dist).
        if: >-
          needs.changes.outputs.frontend != 'false' &&
          (matrix.os == 'ubuntu-latest' || github.event_name != 'pull_request')
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        if: >-
          needs.changes.outputs.frontend != 'false' &&
          (matrix.os == 'ubuntu-latest' || github.event_name != 'pull_request')
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Cache Rust dependencies
        if: needs.changes.outputs.rust != 'false'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Reader/writer split. Integration happens on develop: merging a PR is a
          # push event on develop, which SAVEs the cache; main is the default
          # branch, kept as a global fallback. PRs (based on develop) restore the
          # develop cache via base-branch access and never write their own. PR
          # caches are dead weight after merge — and the repo cache was already
          # over GitHub's 10 GB limit, causing LRU eviction churn (cold caches).
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        if: >-
          needs.changes.outputs.frontend != 'false' &&
          (matrix.os == 'ubuntu-latest' || github.event_name != 'pull_request')
        run: pnpm install --frozen-lockfile

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest' && needs.changes.outputs.rust != 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # Split Rust test run (CI-013, #3350). A plain `cargo test --workspace`
      # ran the contention-sensitive suites (PTY shells, embedded russh server,
      # reconnect redrive, remote-forward relays) alongside ~4800 other tests —
      # incl. CPU-bound Argon2 KDF tests — at one thread per core, so on the
      # 4-core Windows runner they were starved and a random one timed out.
      # The script runs everything else first at default parallelism, then only
      # those suites with --test-threads capped, one filter list for both halves
      # so every test runs exactly once (`ci-rust-tests.sh list` proves it).
      # Windows also pins the live-agent cold-start gate explicitly (its
      # platform default); elsewhere the empty value keeps the default.
      - name: Run Rust tests
        if: needs.changes.outputs.rust != 'false'
        shell: bash
        env:
          TERMIHUB_AGENT_TEST_MAX_CONCURRENT: ${{ matrix.os == 'windows-latest' && '2' || '' }}
        run: ./scripts/internal/ci-rust-tests.sh bulk --workspace

      - name: Run Rust tests (contention-sensitive suites, capped threads)
        if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
        shell: bash
        run: ./scripts/internal/ci-rust-tests.sh heavy --workspace

      # Run coverage-gated tests once (Ubuntu) to enforce the vitest coverage
      # floors from vitest.config.ts (#2066). Coverage is computed from the
      # platform-independent TS sources, so gating on a single leg avoids
      # per-platform coverage drift while still failing CI on a real drop. The
      # other legs run the plain suite so every platform still exercises the tests.
      - name: Run frontend tests with coverage
        if: matrix.os == 'ubuntu-latest' && needs.changes.outputs.frontend != 'false'
        run: pnpm test:coverage

      # Publish the vitest coverage report (html + lcov + text) as a downloadable
      # CI artifact (TOOL-004). `pnpm test:coverage` writes it to coverage/ (see
      # vitest.config.ts) but nothing surfaced it before, so the html report was
      # only ever produced locally. `if: always()` uploads it even when the
      # coverage step failed a threshold, so a coverage drop can be inspected from
      # the failed run. This is a plain artifact upload — advisory only, no gate.
      - name: Upload coverage report artifact
        if: always() && matrix.os == 'ubuntu-latest' && needs.changes.outputs.frontend != 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: warn

      # Non-Ubuntu vitest legs run post-merge only (#3325): the suite is
      # platform-independent TS and already gates the PR on the Ubuntu leg.
      - name: Run frontend tests
        if: matrix.os != 'ubuntu-latest' && github.event_name != 'pull_request'
        run: pnpm test

  # Python system-test harness — fast "machinery" suite (issue #801).
  # These drive the harness plumbing (bridge server, Driver, protocol, transfer
  # checkers) against a FakeApp, so they need no app build and no Docker — just
  # uv + the locked deps in tests/system/uv.lock. The `integration` group (which
  # launches the real desktop app) is excluded; it runs in the dedicated
  # system-test lanes, not on every PR.
  system-test-machinery:
    name: System-Test Harness (machinery)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.harness != 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          # Pin uv itself (issue #1552). Without an explicit version the action
          # resolves "latest" through the GitHub Releases API, which flakes and
          # fast-fails the whole job on transient API errors — unrelated to the
          # PR under test. A fixed version skips that lookup entirely and also
          # makes the toolchain reproducible; bump it deliberately.
          version: '0.11.29'
          # Pin the interpreter for reproducibility; dependencies are resolved
          # from the committed tests/system/uv.lock (the wrapper uses --frozen).
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: tests/system/uv.lock

      - name: Run machinery suite
        run: ./tests/system/pytest.sh -m "not integration" -q

      # Optional, non-blocking test-inventory + coverage-gap report (#1950). It
      # statically introspects the harness (stdlib-only, no app build) and lists
      # feature areas with zero automated/manual coverage. `continue-on-error`
      # keeps it advisory: a coverage gap is surfaced in the step summary, never
      # a failed build.
      - name: Test inventory + coverage-gap report (advisory)
        continue-on-error: true
        run: |
          python3 scripts/build-test-inventory.py --stdout >> "$GITHUB_STEP_SUMMARY"

  # Static data-testid drift guard (TIN-012). The Python bridge harness
  # (tests/system/) drives the app by data-testid selectors; when a component's
  # testid is renamed or removed in src/** but the harness still references it,
  # the harness silently breaks and only the slow nightly integration lane
  # catches it — late. This purely-static check (stdlib only, no app build, no
  # Docker, no uv) fails the PR the moment a harness-referenced testid is absent
  # from src/**. It reuses the testid-catalog source scan, so it can never
  # disagree with the catalog. See scripts/check-testid-drift.py.
  # Runs when either side of the contract changes: src/** (frontend) or the harness.
  testid-drift-guard:
    name: Test-ID Drift Guard
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      ${{ !cancelled() && (needs.changes.outputs.frontend != 'false' ||
      needs.changes.outputs.harness != 'false') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check harness testid references against src/**
        run: python3 scripts/check-testid-drift.py

  # Dependency Security Audit moved to its own workflow, security-audit.yml
  # (#3325): it runs on push to develop/main + daily, and on PRs only when a
  # dependency manifest/lockfile changes — so a time-based RUSTSEC/yank no longer
  # reds every unrelated PR at once.

  # Check conventional commits (PR only)
  commit-lint:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate PR commits
        run: |
          BASE=$(git merge-base HEAD origin/${{ github.base_ref }})
          pnpm exec commitlint --from "$BASE" --to ${{ github.sha }} --verbose
