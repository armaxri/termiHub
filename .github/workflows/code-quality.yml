name: Code Quality

# Per-PR vs post-merge split (#3325). CI runner queueing is the bottleneck, so a
# PR runs only the fast, high-signal gates for the areas it actually touches
# (see the `changes` job + scripts/internal/ci-changes.mjs). Every push to
# develop/main runs EVERY job here on EVERY platform, so anything a PR skipped
# is still caught post-merge — watch develop's own runs. See
# docs/contributing.md → "What a green PR proves".

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

# Cancel superseded runs (#4119). A newer commit on the same PR, or a newer push
# to develop, cancels the in-flight run for the older commit, so a merge burst
# fully tests only its newest develop commit (develop's tip includes every
# earlier merge). A develop failure may therefore point at a batch of merges —
# see docs/contributing.md → "What a green PR proves". Never cancelled: pushes
# to main, tag/release pushes, schedules and workflow_dispatch. The event name
# is part of the group, so a push can never cancel a scheduled or dispatched run.
# (#3588 had made every push run complete; under constant merges that ran each
# superseded commit to completion — ~440 develop push runs/week.)
concurrency:
  group: code-quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' ||
    (github.event_name == 'push' && github.ref == 'refs/heads/develop') }}

# Least-privilege token (CI-010). Every job here only checks out, builds, tests,
# and lints the tree — none comment on the PR, publish check runs, push, or
# upload SARIF — so a read-only token is all that is needed.
permissions:
  contents: read

jobs:
  # Changed-area detection (#3325). Classifies the PR's changed files so the jobs
  # below can skip areas the PR cannot affect. On push (develop/main) every area
  # is on. Downstream jobs gate on `!= 'false'` so that if THIS job fails, its
  # outputs are empty and every job runs (fail-open) — never silently skipped.
  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      frontend: ${{ steps.detect.outputs.frontend }}
      sidecar: ${{ steps.detect.outputs.sidecar }}
      scripts: ${{ steps.detect.outputs.scripts }}
      harness: ${{ steps.detect.outputs.harness }}
      markdown: ${{ steps.detect.outputs.markdown }}
      agent: ${{ steps.detect.outputs.agent }}
      workflows: ${{ steps.detect.outputs.workflows }}
      rustdoc: ${{ steps.detect.outputs.rustdoc }}
      plugin_fuzz: ${{ steps.detect.outputs.plugin_fuzz }}
      tests: ${{ steps.detect.outputs.tests }}
      test_matrix: ${{ steps.detect.outputs.test_matrix }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The PR merge commit plus its parents, so HEAD^1 (the base tip) exists.
          fetch-depth: 2

      - name: Classify changed files
        id: detect
        uses: ./.github/actions/detect-changes

  # Rust Backend Quality Checks
  rust-quality:
    name: Rust Code Quality
    runs-on: ubuntu-latest
    needs: changes
    # Also on sidecar-only PRs: cargo-machete below scans rdp-sidecar/ too.
    if: >-
      ${{ !cancelled() && (needs.changes.outputs.rust != 'false' ||
      needs.changes.outputs.sidecar != 'false') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Fails if `.github/rust-version` (the CI toolchain pin), the workspace
      # `rust-version`, and rdp-sidecar's `rust-version` disagree, or if any
      # workflow installs a toolchain without ./.github/actions/setup-rust
      # (CI-005, SUP-011, WA-CI-016). Plain Node, preinstalled on the runner.
      - name: Check Rust toolchain pin consistency
        run: node scripts/internal/check-rust-version.mjs

      # Fails if Cargo.lock or rdp-sidecar/Cargo.lock locks a pre-release crate
      # version (e.g. `-rc.N`) that is not in the reviewed set
      # .github/prerelease-allowlist.json, or the list has a stale entry
      # (SUP-002; accepted-risk register in docs/supply-chain.md). Plain Node,
      # preinstalled on the runner.
      - name: Check pre-release crates are reviewed
        run: node scripts/internal/check-prerelease-crates.mjs

      # Pinned toolchain (#2549, CI-005): a floating `@stable` lets any new Rust
      # release introduce clippy lints that fire under the `-D warnings` gate
      # below, reddening every PR with no code change (this blocked all PRs on
      # 2026-08-24, #2547). Every CI Rust job now installs the one version in
      # `.github/rust-version` via this action, so lints, tests and shipped
      # binaries all use the same rustc. Bump it deliberately as a "bump
      # toolchain" chore — docs/contributing.md -> "Rust toolchain version".
      # Deliberately NOT a repo-root rust-toolchain.toml (#2549): that would
      # freeze local dev too.
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Reader/writer split. Integration happens on develop: merging a PR is a
          # push event on develop, which SAVEs the cache; main is the default
          # branch, kept as a global fallback. PRs (based on develop) restore the
          # develop cache via base-branch access and never write their own. PR
          # caches are dead weight after merge — and the repo cache was already
          # over GitHub's 10 GB limit, causing LRU eviction churn (cold caches).
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      # --locked: a stale root Cargo.lock fails here, per PR, instead of first
      # surfacing in the --locked release builds (#4282, SUP2-001).
      - name: Run Clippy (linter)
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      # Guards #868 + #1499: builds termihub-core with individual opt-in features
      # *in isolation*, which the --all-features jobs above cannot do because
      # feature unification always compiles everything together.
      #
      # #868: the Docker-dependent integration tests in core/tests/ are
      # feature-gated (#![cfg(feature = "ssh")], etc.) so a plain
      # `cargo test -p termihub-core` compiles to a no-op instead of erroring; a
      # newly-added un-gated test file would be hidden under --all-features but
      # caught here. The per-feature builds also verify the gates resolve
      # correctly (telnet.rs needs both ssh and telnet).
      #
      # #1499: opt-in feature code (e.g. `ftp`, which gates core/src/backends/ftp/)
      # must compile on the offending PR. This isolation build additionally catches
      # gate bugs that --all-features masks — code reachable under `ftp` that
      # accidentally leans on a symbol only present when another feature is on.
      # (The #1324/#1456 regression — an MLSD FileEntry construction missing the
      # new `writable` field, E0063 — fails here.)
      #
      # #3318: this runs as `clippy --all-targets -D warnings` (not
      # `test --no-run`) so a lint that only fires in one feature's isolated build
      # also fails here — e.g. a helper that is dead code when `telnet` alone is on.
      # `--all-targets` still compiles the (feature-gated) test targets, so the
      # #868 guard is preserved; those tests need Docker fixtures and run in the
      # integration lane. Every opt-in core feature is linted on its own, plus the
      # bare no-feature build. The feature list is read from core/Cargo.toml via
      # `cargo metadata`, so a newly added feature is linted without editing this.
      - name: Core clippy with each opt-in feature in isolation (guards #868, #1499, #3318)
        run: |
          set -euo pipefail
          FEATURES=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "termihub-core")
                     | .features | keys[] | select(. != "default")')
          test -n "$FEATURES"
          echo "::group::clippy termihub-core (no features)"
          cargo clippy -p termihub-core --no-default-features --all-targets -- -D warnings
          echo "::endgroup::"
          for feature in $FEATURES; do
            echo "::group::clippy termihub-core --features $feature"
            cargo clippy -p termihub-core --no-default-features --features "$feature" \
              --all-targets -- -D warnings
            echo "::endgroup::"
          done

      # ts-rs codegen staleness gate (audit DUP-030). The TypeScript DTOs in
      # src/types/generated/ are generated from their Rust source of truth by the
      # ts-rs `export_bindings_*` tests. Regenerate them, then fail if the tree
      # changed — i.e. a Rust struct was edited without committing the refreshed
      # binding, which would let the TS↔Rust contract drift silently. Regenerating
      # is fast (unit-level) and one platform suffices: cluster-1 has no
      # `#[cfg]`-gated fields, so the output is platform-independent.
      - name: Regenerate ts-rs TypeScript bindings
        run: cargo test -p termihub --lib export_bindings
      # `ssh` / `docker` / `embedded-servers` / `plugin` enable core's
      # feature-gated `tunnel`, `backends::docker`, `embedded_servers` and
      # `plugin` modules, whose DTOs are generated too.
      - name: Regenerate ts-rs TypeScript bindings (core crate)
        run: cargo test -p termihub-core --lib --features ssh,docker,embedded-servers,plugin,http-monitor export_bindings
      - name: Fail if generated TypeScript is stale
        run: git diff --exit-code -- src/types/generated

      # IPC wire-contract fixture staleness gate (audit MOCK-005, #3837). The
      # golden JSON in src/test/fixtures/wire/ is what the Rust IPC DTOs really
      # serialize; the frontend wire-contract suite feeds it to the api wrappers.
      # Regenerate it, then fail if it changed (or a new fixture is untracked):
      # a serde-only backend change must land with its refreshed fixture, which
      # is what makes the frontend assertions see it.
      - name: Fail if IPC wire-contract fixtures are stale
        run: |
          cargo test -p termihub --lib ipc_wire_fixtures
          stale=$(git status --porcelain -- src/test/fixtures/wire)
          if [ -n "$stale" ]; then
            echo "::error::IPC wire fixtures are stale; run" \
              "'cargo test -p termihub --lib ipc_wire_fixtures' and commit:"
            echo "$stale"
            git --no-pager diff -- src/test/fixtures/wire
            exit 1
          fi

      # Fail the PR when a crate declares a dependency it never uses (TOOL-008).
      # Unused deps grow build time and supply-chain surface. cargo-machete
      # statically scans each crate's sources for usage — no build required.
      # Known false positives (e.g. a dep whose package name differs from its
      # lib crate name, which the name-scan cannot match) are ignore-listed
      # per-crate via `[package.metadata.cargo-machete]`. Run from the repo root
      # it walks the whole tree, so it also covers the workspace-EXCLUDED
      # `rdp-sidecar/` and the vendored crates the workspace jobs don't build.
      # Prebuilt binary download (~seconds) instead of compiling from source.
      - name: Install cargo-machete
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: cargo-machete

      - name: Check for unused dependencies (cargo-machete)
        run: cargo machete

      # NOTE (CI-019): the RUSTSEC `cargo audit` gate is NOT run here — it runs
      # in the dedicated `security-audit` job in security-audit.yml (which invokes the
      # identical bare `cargo audit` over the same workspace Cargo.lock, alongside
      # the `cargo deny` supply-chain gate). Running it in both jobs was redundant;
      # the single invocation in `security-audit` covers the same advisories.

      # Validate the plugin packaging tooling (#1994) against the example
      # plugins. The JSON-only theme plugin is packaged with --no-build (no
      # native code, safe on any platform); the native echo-backend is built and
      # packaged here in the legacy single-platform layout. The multi-platform
      # format, per-OS package-then-load and the fat-package merge are covered
      # by plugin-packaging.yml (PLG-011). The packer round-trip-validates each
      # archive; a broken package fails the job.
      - name: Package example plugins (guards #1994)
        run: |
          ./scripts/package-plugin.sh examples/plugins/solarized-night-theme --out target/plugin-dist --no-build
          ./scripts/package-plugin.sh examples/plugins/echo-backend --out target/plugin-dist
          ./scripts/package-plugin.sh examples/plugins/log-highlighter --out target/plugin-dist --no-build
          ./scripts/package-plugin.sh examples/plugins/clock-widget --out target/plugin-dist --no-build
          test -f target/plugin-dist/solarized-night-1.0.0.termihub-plugin
          test -f target/plugin-dist/log-highlighter-1.0.0.termihub-plugin
          test -f target/plugin-dist/clock-widget-1.0.0.termihub-plugin
          test -f target/plugin-dist/echo-backend-1.0.0.termihub-plugin

  # Clippy on the Windows target (#3312). `rust-quality` above lints only on
  # ubuntu, where every `#[cfg(windows)]` item (the WSL backend, the named-pipe
  # IPC listener, the Windows clipboard/registry integration, ...) is compiled
  # out — so Windows-only code was never linted, and lints such as a
  # production `.expect()` (TOOL-010) merged undetected. `cargo test` on the
  # Windows test leg compiles that code but does not lint it. This job closes
  # the gap with the same `-D warnings` gate over the same workspace/target/
  # feature set, so a lint in Windows-gated code fails the offending PR.
  #
  # fmt and the other ubuntu steps are platform-independent and are not
  # repeated here; this job is clippy only.
  rust-quality-windows:
    name: Rust Code Quality (Windows)
    runs-on: windows-latest
    needs: changes
    # PR lane: only when Rust changed (#3325). Post-merge: always.
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Same pinned toolchain as `rust-quality` (#2549): a floating `@stable`
      # would let a new Rust release red this gate with no code change. The
      # version lives only in `.github/rust-version`.
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Same reader/writer split as `rust-quality`: only develop/main pushes
          # save; PRs restore the develop cache and never write their own.
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}

      - name: Run Clippy on Windows (linter)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # #3319: the workspace lint above runs with --all-features, so feature
      # unification masks gate bugs in core's Windows-only `wsl` feature — core
      # can compile only because src-tauri turns on another feature for it.
      # Before #3314, `wsl` alone failed with E0433 (`backends` not compiled).
      # Lint core with just `wsl` so such a gap fails here. It mirrors the
      # per-feature isolation step in `rust-quality` (#1499, #3318). That step
      # runs on Linux, where `wsl` code is `cfg(windows)`-gated out.
      - name: Core clippy with wsl feature in isolation (guards #3314, #3319)
        run: cargo clippy -p termihub-core --no-default-features --features wsl --all-targets -- -D warnings

  # RDP Sidecar Quality + Supply-Chain Checks (PKG-013)
  #
  # The RDP sidecar (`termihub-rdp-helper`, #1747) is a workspace-EXCLUDED crate
  # with its OWN Cargo.lock — IronRDP's CredSSP crypto and russh pin incompatible
  # RustCrypto pre-releases, so it cannot live in the workspace lockfile. It is
  # cross-built and bundled into every release via Tauri `externalBin` (#1754),
  # so it SHIPS to users — yet the workspace `rust-quality` / `security-audit`
  # jobs above never see it (they operate on the workspace lockfile). This job
  # closes that gap: it gates the sidecar's own lockfile with the same checks the
  # workspace gets — fmt, clippy (`-D warnings`), tests, and the cargo-deny
  # supply-chain gate (advisories/bans/licenses/sources against rdp-sidecar's own
  # Cargo.lock + rdp-sidecar/deny.toml). All steps run in rdp-sidecar/.
  #
  # PR lane: when rdp-sidecar/** changes (#3325), or what the sidecar compiles
  # from outside it — core/**, win-security/** and the root Cargo.toml (#4357).
  # Post-merge: always. The daily time-based RUSTSEC/yank scan of the sidecar
  # lockfile (cargo audit + cargo deny) lives in security-audit.yml (#4357).
  rdp-sidecar-quality:
    name: RDP Sidecar Quality
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.sidecar != 'false' }}
    defaults:
      run:
        working-directory: rdp-sidecar

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Same pinned toolchain as the workspace `rust-quality` job (#2549): a
      # floating `@stable` lets a new Rust release introduce clippy lints that
      # fire under `-D warnings` and red the job with no code change. The
      # version lives only in `.github/rust-version`.
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy

      # The sidecar links libasound2 (cpal/rodio audio); build-essential provides
      # the C toolchain its sys-crates need. Mirrors the release build's Ubuntu
      # deps for this crate.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libasound2-dev
        working-directory: .

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The sidecar has its own lockfile/target, separate from the workspace.
          workspaces: rdp-sidecar
          # Same reader/writer split as the other Rust jobs: only develop/main
          # (push events) write the cache; PRs restore it read-only.
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --check

      # `--locked` fails the job if rdp-sidecar/Cargo.lock is stale instead of
      # silently re-locking it in CI (#3334: a stale ringbuf pin went unnoticed
      # because every build quietly re-resolved it).
      - name: Run Clippy (linter)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      # Prebuilt binary download (~seconds) instead of compiling from source.
      - name: Install cargo-deny
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: cargo-deny

      # Supply-chain gate over the sidecar's OWN lockfile. Config:
      # rdp-sidecar/deny.toml. Covers RUSTSEC vulnerability + yanked-crate
      # advisories (equivalent to cargo-audit, both use the RustSec DB), the
      # license allowlist for the shipped binary, and the crates.io-only source
      # gate. Accepted advisories are documented in rdp-sidecar/deny.toml.
      - name: Cargo Deny (supply-chain gate)
        run: cargo deny check advisories bans licenses sources

  # Frontend Quality Checks
  # Also on docs-only PRs: Prettier + markdownlint over docs/**/*.md live here.
  # Also on Rust-only PRs: the IPC invoke-contract step below cross-checks the
  # #[tauri::command] parameter names in src-tauri against src/ (#3488), so a
  # renamed Rust parameter must re-run it too.
  frontend-quality:
    name: Frontend Code Quality
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      ${{ !cancelled() && (needs.changes.outputs.frontend != 'false' ||
      needs.changes.outputs.markdown != 'false' ||
      needs.changes.outputs.rust != 'false') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Check TypeScript types
        run: pnpm exec tsc --noEmit

      # Tauri matches invoke() args to #[tauri::command] params BY NAME; a wrong
      # key is invisible to tsc and to mocked-invoke unit tests (#3488). Fails on
      # unknown commands, missing required args and unknown extra args.
      - name: Check IPC invoke argument contract
        run: node scripts/internal/check-invoke-contract.mjs

      - name: Check formatting with Prettier
        run: pnpm run format:check

      - name: Lint Markdown
        run: pnpm run markdownlint

      # Manual-test counts are NOT committed to the docs (#4070, after #3721):
      # any committed total row made every pair of test-automation PRs conflict.
      # This validates the tests/manual/*.yaml corpus (incl. that every item has
      # the name/instructions/expected keys the runner needs, #4131), fails if a doc
      # reintroduces a committed count block, and publishes the per-category
      # table as the job summary. Stdlib-only Python, no venv.
      - name: Manual-test inventory (job summary)
        run: python3 scripts/manual-inventory.py --check

      # Version drift (CI-009, #3901): the five version sources (package.json,
      # tauri.conf.json, src-tauri/core/agent Cargo.toml) must agree, and the
      # installed @tauri-apps/* npm packages must match their Rust crates on
      # major/minor. The same check gates release.yml (verify-version), so drift
      # is caught on the PR that introduces it instead of when a tag is pushed.
      # Every version source is in the frontend or rust area, both of which run
      # this job. Sub-second; reuses the install above.
      - name: Check version sources + Tauri npm/crate drift
        run: scripts/release-check.sh --versions-only

      # Advisory unused-code report (audit findings TOOL-009 + TOOL-008 JS slice).
      # knip statically finds unused files, exports, and dependencies; knip.jsonc
      # declares the real entrypoints (src/main.tsx, the vite/vitest configs, test
      # setup + test files, the dynamically-loaded testbridge) so the report is
      # useful-not-noisy. It is REPORT-ONLY: `continue-on-error` plus `|| true`
      # guarantee it can never fail the build (knip exits non-zero when it finds
      # anything). The JS unused-*dependency* slice (TOOL-008, the advisory
      # counterpart of the blocking cargo-machete Rust check) is now clean — the
      # genuinely-unused deps knip flagged have been removed. The remaining
      # unused-file/-export findings are a separate future cleanup effort, not
      # this step's job; the step only surfaces them in the run log.
      - name: Unused-code report (knip, advisory)
        # advisory: unused-code findings are not defects, and #3158 says keep it
        # non-blocking. Forcing function: the #3158 cleanup tracker.
        continue-on-error: true
        run: pnpm knip || true

  # Frontend bundle-size budget (audit findings TOOL-013, CI-012; #3757).
  #
  # Builds the frontend and grades the total on-disk size of dist/ against a
  # generous budget (see scripts/internal/bundle-size.mjs), so only a large size
  # regression trips it. Over budget, the size step prints an `::error`
  # annotation and exits 1, which reds this job and so develop's post-merge
  # Code Quality run. That red run is the alarm: post-merge runs are watched
  # (docs/contributing.md, "Post-merge lane").
  #
  # POST-MERGE ONLY (#3325), and not a PR gate (pr-gate.mjs GATE_EXCLUDED): a
  # Vite build costs a PR runner slot, and the size check is not a
  # correctness gate. The budget is ~40% above the current build, so one PR
  # can hardly trip it alone; the develop run names the push that did. The
  # install/build steps stay `continue-on-error`: build failures are owned by
  # the real build/test lanes, and a missing dist/ makes the size step skip.
  bundle-size:
    name: Bundle Size
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        # advisory: install failures are gated by the real build/test lanes.
        # Forcing function: those lanes.
        continue-on-error: true
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        # advisory: build failures are gated by the real build/test lanes.
        # Forcing function: those lanes.
        continue-on-error: true
        run: pnpm build

      # Not continue-on-error: over budget, this step fails the job (#3757).
      - name: Check bundle size against budget
        run: pnpm size >> "$GITHUB_STEP_SUMMARY"

  # Rustdoc intra-doc link gate (#3812). Plain `cargo doc` only warns on broken
  # or private intra-doc links, so they accumulated silently (a link to a private
  # item, a feature-gated path, a TS-only type). This builds the first-party
  # crates' docs with `-D warnings` so a new broken link fails the run. Both the
  # default and the --all-features build of termihub-core are checked: its
  # backends are feature-gated, so each build sees a different set of items.
  #
  # On a PR it runs whenever workspace Rust changes, code or comment-only
  # (`rustdoc` area, #3903): #3899 showed a broken intra-doc link reaching
  # develop because this was post-merge only. It restores develop's cache, so
  # the doc build compiles only first-party crates.
  #
  # It also runs `cargo fmt --check`: a comment-only Rust PR (every changed .rs
  # line a whole-line `//` comment) skips Rust Code Quality and every Rust
  # test/build lane, so this job is its only Rust check (fmt reflows comments
  # too). On a full Rust PR the fmt step repeats Rust Code Quality's (seconds).
  # What a comment-only PR does NOT get: clippy's doc lints and doctests are
  # left to the post-merge run (doctest lines are classified as code anyway).
  rustdoc:
    name: Rustdoc (-D warnings)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rustdoc != 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Reader/writer split, same as rust-quality: PRs restore, pushes save.
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}

      - name: Build docs with -D warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          set -euo pipefail
          echo "::group::cargo doc termihub-core (default features)"
          cargo doc --no-deps -p termihub-core
          echo "::endgroup::"
          echo "::group::cargo doc termihub, termihub-core, termihub-agent (--all-features)"
          cargo doc --no-deps --all-features -p termihub -p termihub-core -p termihub-agent
          echo "::endgroup::"

  # The plugin-runner IPC fuzz crate (#4257). plugin-runner/fuzz is excluded from
  # the workspace (libfuzzer-sys, its own lockfile), so no workspace job compiles
  # it, and its only other consumer is the scheduled plugin-sandbox-nightly.yml,
  # which runs main's copy. Its structured message generator constructs every
  # IPC message literally, so a field added to one without updating the
  # generator broke it silently until #4219 happened to touch it. This job
  # compiles the lib, the gen-seeds bin and all three fuzz targets on the pinned
  # STABLE toolchain: only `cargo fuzz build`/`run` need nightly (for
  # -Zsanitizer=address); a plain clippy check of libfuzzer-sys and the
  # `fuzz_target!` bodies builds on stable. Its target dir is the fuzz crate's
  # own (plugin-runner/fuzz/target, a separate workspace root), cached under this
  # job's own key, so it never touches the workspace cache.
  plugin-fuzz-check:
    name: Plugin IPC Fuzz Crate (stable check)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.plugin_fuzz != 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy

      # The fuzz crate's Cargo.lock is deliberately uncommitted (its deps must
      # stay out of the workspace audits). Seed it from the workspace lockfile so
      # the deps it shares with plugin-runner resolve to the reviewed workspace
      # versions; cargo prunes the rest and adds only the fuzz-only crates.
      - name: Seed the fuzz lockfile from the workspace
        run: cp Cargo.lock plugin-runner/fuzz/Cargo.lock

      - name: Cache the fuzz crate build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: plugin-runner/fuzz
          # Reader/writer split, same as rust-quality: PRs restore, pushes save.
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}

      # `cargo fmt --all` at the root does not reach an excluded crate.
      - name: Check fuzz crate formatting
        working-directory: plugin-runner/fuzz
        run: cargo fmt -- --check

      - name: Clippy the fuzz crate (lib, gen-seeds, fuzz targets)
        working-directory: plugin-runner/fuzz
        run: cargo clippy --all-targets -- -D warnings

  # Shell-script quality: static analysis + cross-platform parity + headless
  # smoke (audit finding TOOL-012 / WA-CI-029).
  #
  # Three gates run here (all blocking): ShellCheck static analysis, the
  # .sh<->.cmd parity check, and a headless --help smoke that actually EXECUTES
  # scripts (catching the runtime set -u/expansion faults static checks miss).
  #
  # No CI lane ran shellcheck over the repo's shell scripts, so shell bugs
  # shipped silently — including the SC2257-class defect that broke
  # verify-agent-reconnect.sh on its first real run (an unquoted heredoc
  # arithmetic expansion that shellcheck flagged but was suppressed as a false
  # positive, with no CI to re-check it). This job gates every PR on shellcheck
  # over the repo's shell scripts (scripts/**, tests/**, examples/**, agent/**,
  # plus the executable scripts/hooks/* discovered by shebang). It runs on a
  # bare checkout (no pnpm/cargo install), so only tracked scripts are scanned.
  #
  # Severity gate = warning, not error. SC2257 and the other set -u / quoting
  # hazards this lane exists to catch are warning-level (an error-only gate
  # would miss the exact class that motivated the finding). The tree is green at
  # warning today; any new warning fails the PR. Fix real findings; a
  # `# shellcheck disable=SCxxxx` is allowed only with a one-line justification.
  #
  # The shellcheck version is pinned (same rationale as the clippy toolchain
  # pin, #2549): a floating "stable" lets a new shellcheck release add a warning
  # that reds every PR with no script change. Bump it deliberately as a chore.
  shellcheck:
    name: Shell Script Quality
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.scripts != 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning
          version: v0.11.0
          ignore_paths: node_modules target graft

      # Cross-platform script-parity gate (TOOL-012 / WA-CI-029). ShellCheck
      # only sees the .sh half; nothing enforced that each user-facing
      # scripts/**/*.sh has its Windows .cmd twin (and vice-versa), so the pairs
      # drifted. This BLOCKING check fails when a .sh lacks a .cmd (or a .cmd a
      # .sh), minus the documented single-platform ALLOWLIST inside the script
      # (per-OS test-system orchestrators + Unix-only internal helpers).
      - name: Check script cross-platform parity (.sh <-> .cmd)
        run: ./scripts/internal/check-script-parity.sh

      # Headless smoke of shell scripts (TOOL-012 / WA-CI-029). ShellCheck and
      # `bash -n` are static and never RUN a script, so they miss runtime
      # `set -u` / expansion faults on first execution — the class that broke
      # verify-agent-reconnect.sh (#2545). This step actually executes each
      # script's non-destructive `--help` fast path (real shebang + set flags +
      # top-of-file sourcing + arg parser) and asserts a clean exit 0. Scoped to
      # the safe --help path so it needs no Docker/network/app-build and is
      # deterministic, not flaky. It also runs build-agents.sh's real .sha256
      # sidecar writer on a dummy binary and checks it with `sha256sum -c`
      # (#1350; the .cmd twin is the Windows cmd Script Smoke job below).
      - name: Headless smoke of shell scripts (--help paths)
        run: ./scripts/internal/check-script-headless.sh

  # Workflow lint (#3327). actionlint type-checks every workflow under
  # .github/workflows (expressions, `needs`/outputs wiring, runner labels,
  # action inputs) and runs shellcheck over each `run:` script. Nothing linted
  # workflow files before, so shell bugs in release-only steps (quoting,
  # `ls | grep`) sat unseen until the rare run that exercised them. BLOCKING;
  # PR lane only when .github/ changes (the `workflows` area), post-merge always.
  #
  # Both binaries are pinned and SHA256-verified (same rationale as the
  # shellcheck pin above and the cross-rs pin in release.yml, CI-004): a floating
  # version would let a new release add a finding that reds every workflow PR.
  # shellcheck matches the Shell Script Quality job's v0.11.0. Fix findings; an
  # inline `# shellcheck disable=` needs a written reason next to it.
  actionlint:
    name: Workflow Lint (actionlint)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.workflows != 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install pinned actionlint and shellcheck
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/lint-bin"
          mkdir -p "$bin"
          al="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$al" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $al" | sha256sum -c -
          tar xzf "$al" -C "$bin" actionlint
          sc="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL -o "$sc" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $sc" | sha256sum -c -
          tar xJf "$sc" -C "$bin" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Run actionlint
        run: |
          set -euo pipefail
          shellcheck --version
          actionlint -version
          # -shellcheck pins the binary we verified above rather than whatever
          # the runner image has on PATH first.
          actionlint -color -shellcheck "$RUNNER_TEMP/lint-bin/shellcheck"

  # Windows .cmd smoke (#3340). The Shell Script Quality job above runs on
  # Ubuntu, so it can compare the flags a .cmd parses but never RUNS one. This
  # cheap job (no Rust/Node setup, no build) executes build-agents.cmd's
  # --help and its fail-fast argument/validation paths on a real Windows cmd.exe,
  # and runs the exact PowerShell line build-agents.cmd uses to write .sha256
  # sidecars, checking the result is byte-identical to `sha256sum` -- launched
  # from cmd AND from pwsh (pwsh leaks its PSModulePath into powershell.exe,
  # which broke cmdlet autoload in the old Get-FileHash line, #4029). It also runs
  # build-rdp-sidecar.cmd end to end against a stub cargo (#3475). PR lane: only
  # when scripts change. Post-merge: always.
  cmd-scripts-windows:
    name: Windows cmd Script Smoke
    runs-on: windows-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.scripts != 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: build-agents.cmd --help and fail-fast paths
        shell: cmd
        run: |
          call scripts\build-agents.cmd --help
          if errorlevel 1 exit /b 1
          call scripts\build-agents.cmd --no-such-flag
          if not errorlevel 1 (echo expected failure: unknown option& exit /b 1)
          call scripts\build-agents.cmd --targets
          if not errorlevel 1 (echo expected failure: --targets without a value& exit /b 1)
          call scripts\build-agents.cmd --targets x86_64-pc-windows-msvc
          if not errorlevel 1 (echo expected failure: MSVC target without --native& exit /b 1)
          call scripts\build-agents.cmd --native --sign-key does-not-exist.pem
          if not errorlevel 1 (echo expected failure: missing signing key& exit /b 1)
          echo build-agents.cmd smoke OK
          rem echo keeps the last negative test's ERRORLEVEL; exit 0 explicitly.
          exit /b 0

      - name: Stage the build-agents.cmd checksum line
        shell: bash
        run: |
          set -euo pipefail
          dir="$(cygpath -u "$RUNNER_TEMP")/sha"
          mkdir -p "$dir"
          printf 'termihub agent checksum smoke\n' >"$dir/termihub-agent.exe"
          line="$(grep -m1 -E '^powershell .*SHA256' scripts/build-agents.cmd | tr -d '\r')"
          [ -n "$line" ] || { echo "::error::checksum line not found in build-agents.cmd"; exit 1; }
          # build-rdp-sidecar.cmd must carry the identical line (one tested copy).
          rdp="$(grep -m1 -E '^powershell .*SHA256' scripts/build-rdp-sidecar.cmd | tr -d '\r')"
          [ "$line" = "$rdp" ] || { echo "::error::build-rdp-sidecar.cmd checksum line differs from build-agents.cmd"; exit 1; }
          runner="$(grep -m1 -E '^powershell .*SHA256' scripts/build-plugin-runner.cmd | tr -d '\r')"
          [ "$line" = "$runner" ] || { echo "::error::build-plugin-runner.cmd checksum line differs from build-agents.cmd"; exit 1; }
          # A cmdlet in the line breaks when launched from pwsh (#4029).
          if grep -qiE 'Get-FileHash|Resolve-Path' <<<"$line"; then
            echo "::error::checksum line must use .NET only, no cmdlets (#4029)"; exit 1
          fi
          printf '@echo off\r\n%s\r\nexit /b %%errorlevel%%\r\n' "$line" >"$dir/hash.cmd"

      - name: Write a .sha256 sidecar with build-agents.cmd's PowerShell line
        shell: cmd
        run: |
          call "%RUNNER_TEMP%\sha\hash.cmd" "%RUNNER_TEMP%\sha\termihub-agent.exe"
          if errorlevel 1 exit /b 1

      - name: Sidecar matches sha256sum byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          cd "$(cygpath -u "$RUNNER_TEMP")/sha"
          # Expected bytes: "<hex>  <name>" + LF, the Linux text-mode format.
          # Built by hand because Git for Windows' sha256sum defaults to binary
          # mode and prints "<hex> *<name>", which is not the published format.
          hex="$(sha256sum <termihub-agent.exe | cut -c1-64)"
          printf '%s  %s\n' "$hex" termihub-agent.exe >expected.sha256
          if ! cmp expected.sha256 termihub-agent.exe.sha256; then
            od -c termihub-agent.exe.sha256
            exit 1
          fi
          sha256sum -c termihub-agent.exe.sha256
          rm termihub-agent.exe.sha256

      # The agent workflow runs build-agents.cmd from pwsh; powershell.exe then
      # inherits pwsh's PSModulePath (#4029). Re-run the line from there.
      - name: Write the .sha256 sidecar again, launched from pwsh
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\sha\hash.cmd" "$env:RUNNER_TEMP\sha\termihub-agent.exe"
          if ($LASTEXITCODE -ne 0) { Write-Error "hash.cmd exited $LASTEXITCODE"; exit 1 }

      - name: pwsh-launched sidecar matches sha256sum byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          cd "$(cygpath -u "$RUNNER_TEMP")/sha"
          cmp expected.sha256 termihub-agent.exe.sha256 || { od -c termihub-agent.exe.sha256; exit 1; }
          sha256sum -c termihub-agent.exe.sha256

      # build-rdp-sidecar.cmd (#3475): --help, the fail-fast argument paths, and
      # full runs of the script against a stub `cargo` (a cargo.cmd first on PATH
      # that drops a fake helper where cargo would), so the flag parsing, the
      # host-triple lookup, the externalBin staging, the .sha256 sidecar and the
      # --out copy all execute on a real cmd.exe without a ~10 min sidecar build.
      - name: build-rdp-sidecar.cmd --help and fail-fast paths
        shell: cmd
        run: |
          call scripts\build-rdp-sidecar.cmd --help
          if errorlevel 1 exit /b 1
          call scripts\build-rdp-sidecar.cmd --no-such-flag
          if not errorlevel 1 (echo expected failure: unknown option& exit /b 1)
          call scripts\build-rdp-sidecar.cmd --target
          if not errorlevel 1 (echo expected failure: --target without a value& exit /b 1)
          call scripts\build-rdp-sidecar.cmd --release --out
          if not errorlevel 1 (echo expected failure: --out without a value& exit /b 1)
          echo build-rdp-sidecar.cmd fail-fast smoke OK
          exit /b 0

      - name: Stage a stub cargo for build-rdp-sidecar.cmd
        shell: bash
        run: |
          set -euo pipefail
          dir="$(cygpath -u "$RUNNER_TEMP")/stub-cargo"
          mkdir -p "$dir"
          # Mimics `cargo build --manifest-path rdp-sidecar\Cargo.toml [--release]
          # [--target <triple>]`: writes the helper where cargo's layout puts it.
          # STUB_CARGO_FAIL makes it fail like a broken build.
          printf '%s\r\n' \
            '@echo off' \
            'setlocal' \
            'if defined STUB_CARGO_FAIL (echo stub cargo: failing on purpose 1>&2& exit /b 101)' \
            'set "P=debug"' \
            'set "T="' \
            ':a' \
            'if "%~1"=="" goto b' \
            'if "%~1"=="--release" set "P=release"' \
            'if "%~1"=="--target" set "T=%~2"' \
            'shift' \
            'goto a' \
            ':b' \
            'set "D=rdp-sidecar\target\%P%"' \
            'if defined T set "D=rdp-sidecar\target\%T%\%P%"' \
            'if not exist "%D%" mkdir "%D%"' \
            '>"%D%\termihub-rdp-helper.exe" echo stub rdp helper %P% %T%' \
            'exit /b 0' >"$dir/cargo.cmd"

      - name: build-rdp-sidecar.cmd runs end to end (stub cargo)
        shell: cmd
        run: |
          set "PATH=%RUNNER_TEMP%\stub-cargo;%PATH%"
          rem Host triple from rustc, release, --locked, staged for externalBin, copied to --out.
          call scripts\build-rdp-sidecar.cmd --release --locked --tauri-externalbin --out "%RUNNER_TEMP%\rdp-out"
          if errorlevel 1 (echo externalBin run failed& exit /b 1)
          rem Explicit --target without staging: cargo's per-target output dir.
          call scripts\build-rdp-sidecar.cmd --target aarch64-pc-windows-msvc
          if errorlevel 1 (echo --target run failed& exit /b 1)
          rem A failed cargo build must fail the script.
          set "STUB_CARGO_FAIL=1"
          call scripts\build-rdp-sidecar.cmd --release
          if not errorlevel 1 (echo expected failure: cargo build failed& exit /b 1)
          set "STUB_CARGO_FAIL="
          rem A digest that cannot be computed must fail loudly, not write an empty
          rem sidecar: the apostrophe in this triple breaks the PowerShell hash line.
          call scripts\build-rdp-sidecar.cmd --target "bad'triple-pc-windows-msvc" --tauri-externalbin
          if not errorlevel 1 (echo expected failure: unhashable staged binary& exit /b 1)
          echo build-rdp-sidecar.cmd stub runs OK
          exit /b 0

      - name: build-rdp-sidecar.cmd outputs are correct
        shell: bash
        run: |
          set -euo pipefail
          triple="$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')"
          staged="src-tauri/binaries/termihub-rdp-helper-${triple}.exe"
          test -s "$staged" || { echo "::error::not staged: $staged"; exit 1; }
          # --tauri-externalbin resolves the host triple and passes --target (as the .sh
          # does), so cargo output lands in the per-target dir.
          built="rdp-sidecar/target/${triple}/release/termihub-rdp-helper.exe"
          cmp "$built" "$staged"
          # The .sha256 must be "<hex>  <name>" + LF, byte-identical to what the .sh
          # (sha256sum text mode) writes -- never empty (#3475).
          hex="$(sha256sum <"$staged" | cut -c1-64)"
          printf '%s  %s\n' "$hex" "termihub-rdp-helper-${triple}.exe" >"$RUNNER_TEMP/expected.sha256"
          if ! cmp "$RUNNER_TEMP/expected.sha256" "$staged.sha256"; then
            od -c "$staged.sha256"
            exit 1
          fi
          (cd src-tauri/binaries && sha256sum -c "termihub-rdp-helper-${triple}.exe.sha256")
          out="$(cygpath -u "$RUNNER_TEMP")/rdp-out/termihub-rdp-helper.exe"
          cmp "$built" "$out"
          test -s rdp-sidecar/target/aarch64-pc-windows-msvc/debug/termihub-rdp-helper.exe
          bad="src-tauri/binaries/termihub-rdp-helper-bad'triple-pc-windows-msvc.exe"
          test -f "$bad" || { echo "::error::failure scenario never reached staging"; exit 1; }
          if [ -e "$bad.sha256" ]; then
            echo "::error::a failed digest left a .sha256 behind"
            od -c "$bad.sha256"
            exit 1
          fi

      # build-plugin-runner.cmd (#4202): the same --help / fail-fast / stub-cargo
      # coverage as build-rdp-sidecar.cmd above. The runner is a workspace
      # member, so the stub drops it where `cargo build -p` puts it (target\).
      - name: build-plugin-runner.cmd --help and fail-fast paths
        shell: cmd
        run: |
          call scripts\build-plugin-runner.cmd --help
          if errorlevel 1 exit /b 1
          call scripts\build-plugin-runner.cmd --no-such-flag
          if not errorlevel 1 (echo expected failure: unknown option& exit /b 1)
          call scripts\build-plugin-runner.cmd --target
          if not errorlevel 1 (echo expected failure: --target without a value& exit /b 1)
          call scripts\build-plugin-runner.cmd --release --out
          if not errorlevel 1 (echo expected failure: --out without a value& exit /b 1)
          echo build-plugin-runner.cmd fail-fast smoke OK
          exit /b 0

      - name: Stage a stub cargo for build-plugin-runner.cmd
        shell: bash
        run: |
          set -euo pipefail
          dir="$(cygpath -u "$RUNNER_TEMP")/stub-cargo-runner"
          mkdir -p "$dir"
          # Mimics `cargo build -p termihub-plugin-runner --bin termihub-plugin-runner
          # [--release] [--target <triple>]`: writes the runner where cargo's layout
          # puts it, and records the RUSTFLAGS it saw. STUB_CARGO_FAIL fails it.
          printf '%s\r\n' \
            '@echo off' \
            'setlocal' \
            'if defined STUB_CARGO_FAIL (echo stub cargo: failing on purpose 1>&2& exit /b 101)' \
            'set "P=debug"' \
            'set "T="' \
            ':a' \
            'if "%~1"=="" goto b' \
            'if "%~1"=="--release" set "P=release"' \
            'if "%~1"=="--target" set "T=%~2"' \
            'shift' \
            'goto a' \
            ':b' \
            'set "D=target\%P%"' \
            'if defined T set "D=target\%T%\%P%"' \
            'if not exist "%D%" mkdir "%D%"' \
            '>"%D%\termihub-plugin-runner.exe" echo stub plugin runner %P% %T%' \
            '>"%D%\stub-rustflags.txt" echo RUSTFLAGS=[%RUSTFLAGS%]' \
            'exit /b 0' >"$dir/cargo.cmd"

      - name: build-plugin-runner.cmd runs end to end (stub cargo)
        shell: cmd
        run: |
          set "PATH=%RUNNER_TEMP%\stub-cargo-runner;%PATH%"
          rem Host triple from rustc, release, --locked, staged for externalBin, copied to --out.
          call scripts\build-plugin-runner.cmd --release --tauri-externalbin --out "%RUNNER_TEMP%\runner-out"
          if errorlevel 1 (echo externalBin run failed& exit /b 1)
          rem Explicit --target without staging: cargo's per-target output dir.
          call scripts\build-plugin-runner.cmd --target aarch64-pc-windows-msvc
          if errorlevel 1 (echo --target run failed& exit /b 1)
          rem A failed cargo build must fail the script.
          set "STUB_CARGO_FAIL=1"
          call scripts\build-plugin-runner.cmd --release
          if not errorlevel 1 (echo expected failure: cargo build failed& exit /b 1)
          set "STUB_CARGO_FAIL="
          echo build-plugin-runner.cmd stub runs OK
          exit /b 0

      - name: build-plugin-runner.cmd outputs are correct
        shell: bash
        run: |
          set -euo pipefail
          triple="$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')"
          staged="src-tauri/binaries/termihub-plugin-runner-${triple}.exe"
          test -s "$staged" || { echo "::error::not staged: $staged"; exit 1; }
          built="target/${triple}/release/termihub-plugin-runner.exe"
          cmp "$built" "$staged"
          hex="$(sha256sum <"$staged" | cut -c1-64)"
          printf '%s  %s\n' "$hex" "termihub-plugin-runner-${triple}.exe" >"$RUNNER_TEMP/expected-runner.sha256"
          if ! cmp "$RUNNER_TEMP/expected-runner.sha256" "$staged.sha256"; then
            od -c "$staged.sha256"
            exit 1
          fi
          (cd src-tauri/binaries && sha256sum -c "termihub-plugin-runner-${triple}.exe.sha256")
          out="$(cygpath -u "$RUNNER_TEMP")/runner-out/termihub-plugin-runner.exe"
          cmp "$built" "$out"
          test -s target/aarch64-pc-windows-msvc/debug/termihub-plugin-runner.exe
          # Windows MSVC targets link the static VC runtime (#4172).
          grep -q 'crt-static' "target/${triple}/release/stub-rustflags.txt" ||
            { echo "::error::no +crt-static for ${triple}"; cat "target/${triple}/release/stub-rustflags.txt"; exit 1; }

      # fetch-conpty.cmd (#4121): the flag parser, then REAL fetches of the
      # pinned Microsoft.Windows.Console.ConPTY package through the PowerShell
      # twin, from cmd AND from pwsh (#4029), each checked against the pins in
      # src-tauri/packaging/windows/conpty.env. A run with a tampered package
      # pin must fail and stage nothing.
      - name: fetch-conpty.cmd --help and fail-fast paths
        shell: cmd
        run: |
          call scripts\internal\fetch-conpty.cmd --help
          if errorlevel 1 exit /b 1
          call scripts\internal\fetch-conpty.cmd --no-such-flag
          if not errorlevel 1 (echo expected failure: unknown option& exit /b 1)
          call scripts\internal\fetch-conpty.cmd --arch
          if not errorlevel 1 (echo expected failure: --arch without a value& exit /b 1)
          call scripts\internal\fetch-conpty.cmd --arch riscv
          if not errorlevel 1 (echo expected failure: unsupported arch& exit /b 1)
          echo fetch-conpty.cmd fail-fast smoke OK
          exit /b 0

      - name: fetch-conpty.cmd fetches and verifies the pinned package (cmd)
        shell: cmd
        run: |
          call scripts\internal\fetch-conpty.cmd --dest "%RUNNER_TEMP%\conpty-cmd"
          if errorlevel 1 exit /b 1
          call scripts\internal\fetch-conpty.cmd --arch arm64 --dest "%RUNNER_TEMP%\conpty-arm64"
          if errorlevel 1 exit /b 1

      - name: fetch-conpty.cmd fetches and verifies the pinned package (pwsh)
        shell: pwsh
        run: |
          & scripts\internal\fetch-conpty.cmd --dest "$env:RUNNER_TEMP\conpty-pwsh"
          if ($LASTEXITCODE -ne 0) { Write-Error "fetch-conpty.cmd exited $LASTEXITCODE"; exit 1 }

      - name: Staged ConPTY files match the pins; a tampered pin fails
        shell: bash
        run: |
          set -euo pipefail
          pins=src-tauri/packaging/windows/conpty.env
          pin() { sed -n "s/^$1=//p" "$pins" | tr -d '\r'; }
          tmp="$(cygpath -u "$RUNNER_TEMP")"
          check() { echo "$(pin "$2")  $1" | sha256sum -c -; }
          for d in conpty-cmd conpty-pwsh; do
            check "$tmp/$d/conpty.dll" CONPTY_DLL_X64_SHA256
            check "$tmp/$d/OpenConsole.exe" OPENCONSOLE_X64_SHA256
          done
          check "$tmp/conpty-arm64/conpty.dll" CONPTY_DLL_ARM64_SHA256
          check "$tmp/conpty-arm64/OpenConsole.exe" OPENCONSOLE_ARM64_SHA256
          # The bash twin must stage the same bytes as the PowerShell one.
          scripts/internal/fetch-conpty.sh --dest "$tmp/conpty-bash"
          cmp "$tmp/conpty-bash/conpty.dll" "$tmp/conpty-cmd/conpty.dll"
          cmp "$tmp/conpty-bash/OpenConsole.exe" "$tmp/conpty-cmd/OpenConsole.exe"
          # Tampered package pin: both twins must refuse and stage nothing.
          cp "$pins" "$tmp/conpty.env.orig"
          sed -i 's/^CONPTY_NUPKG_SHA256=./CONPTY_NUPKG_SHA256=x/' "$pins"
          sh_rc=0
          ps_rc=0
          scripts/internal/fetch-conpty.sh --dest "$tmp/conpty-bad-sh" || sh_rc=$?
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass \
            -File scripts/internal/fetch-conpty.ps1 -Dest "$(cygpath -w "$tmp/conpty-bad-ps")" ||
            ps_rc=$?
          cp "$tmp/conpty.env.orig" "$pins"
          [ "$sh_rc" -ne 0 ] || { echo "::error::fetch-conpty.sh accepted a tampered pin"; exit 1; }
          [ "$ps_rc" -ne 0 ] || { echo "::error::fetch-conpty.ps1 accepted a tampered pin"; exit 1; }
          if [ -e "$tmp/conpty-bad-sh" ] || [ -e "$tmp/conpty-bad-ps" ]; then
            echo "::error::a tampered package left files staged"
            exit 1
          fi
          echo "fetch-conpty smoke OK"


  # Run tests
  #
  # Per-PR matrix (#3325, computed by the `changes` job):
  #   * ubuntu  — when Rust and/or frontend changed; runs only the half that changed.
  #   * windows — only when Rust changed, Rust tests only (it catches real
  #               Windows-only Rust bugs; the platform-independent vitest suite is
  #               ~15 min on Windows and is not repeated there on a PR).
  #   * macos   — never on a PR: macOS runners are the scarcest in the pool.
  # On push to develop/main the full 3-OS matrix runs both halves everywhere.
  tests:
    name: Run Tests
    runs-on: ${{ matrix.os }}
    needs: changes
    # [skip-tests] on the PR head commit (#3915) empties test_matrix and sets
    # tests=false; either skips this job.
    if: >-
      ${{ !cancelled() && needs.changes.outputs.tests != 'false' &&
      needs.changes.outputs.test_matrix != '[]' }}
    strategy:
      # Don't cancel sibling legs when one platform fails: a single real
      # failure (e.g. Windows) otherwise cancels the others, and downstream
      # `gh pr checks` renders cancellations as `fail` — making one broken
      # platform look like all three are red. Let every leg run to completion
      # so each reports its own true pass/fail. (#1669)
      fail-fast: false
      matrix:
        # Fail-open fallback: if `changes` failed, run the full matrix.
        os: ${{ fromJSON(needs.changes.outputs.test_matrix || '["ubuntu-latest","windows-latest","macos-latest"]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Rust
        if: needs.changes.outputs.rust != 'false'
        uses: ./.github/actions/setup-rust

      - name: Setup pnpm
        # Only on a leg that runs vitest (see the frontend steps below); the Rust
        # tests need no node_modules (debug builds use devUrl, not ../dist).
        if: >-
          needs.changes.outputs.frontend != 'false' &&
          (matrix.os == 'ubuntu-latest' || github.event_name != 'pull_request')
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        if: >-
          needs.changes.outputs.frontend != 'false' &&
          (matrix.os == 'ubuntu-latest' || github.event_name != 'pull_request')
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Cache Rust dependencies
        if: needs.changes.outputs.rust != 'false'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Reader/writer split. Integration happens on develop: merging a PR is a
          # push event on develop, which SAVEs the cache; main is the default
          # branch, kept as a global fallback. PRs (based on develop) restore the
          # develop cache via base-branch access and never write their own. PR
          # caches are dead weight after merge — and the repo cache was already
          # over GitHub's 10 GB limit, causing LRU eviction churn (cold caches).
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        if: >-
          needs.changes.outputs.frontend != 'false' &&
          (matrix.os == 'ubuntu-latest' || github.event_name != 'pull_request')
        run: pnpm install --frozen-lockfile

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest' && needs.changes.outputs.rust != 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb \
            xclip \
            sway \
            wl-clipboard \
            openssh-server \
            openssh-client

      # Stage the sideloaded ConPTY host (#4121) for core/tests/sideloaded_conpty.rs
      # (#4130): the pinned conpty.dll + OpenConsole.exe, SHA-256-verified against
      # src-tauri/packaging/windows/conpty.env (~1.7 MB). The test preloads them from
      # TERMIHUB_TEST_CONPTY_DIR and runs a real PTY session on that host; on a
      # GitHub runner it fails, never skips, when the variable is missing.
      - name: Stage the sideloaded ConPTY host for the Rust tests (Windows)
        if: matrix.os == 'windows-latest' && needs.changes.outputs.rust != 'false'
        shell: bash
        run: |
          set -euo pipefail
          dest="$(cygpath -u "$RUNNER_TEMP")/conpty-test-host"
          ./scripts/internal/fetch-conpty.sh --arch x64 --dest "$dest"
          echo "TERMIHUB_TEST_CONPTY_DIR=$(cygpath -w "$dest")" >>"$GITHUB_ENV"

      # Split Rust test run (CI-013, #3350). A plain `cargo test --workspace`
      # ran the contention-sensitive suites (PTY shells, embedded russh server,
      # reconnect redrive, remote-forward relays) alongside ~4800 other tests —
      # incl. CPU-bound Argon2 KDF tests — at one thread per core, so on the
      # 4-core Windows runner they were starved and a random one timed out.
      # The script runs everything else first at default parallelism, then only
      # those suites with --test-threads capped, one filter list for both halves
      # so every test runs exactly once (`ci-rust-tests.sh list` proves it).
      # Windows also pins the live-agent cold-start gate explicitly (its
      # platform default); elsewhere the empty value keeps the default.
      # On Windows the live-agent-TCP tests (`live_agent_tcp_*`) are SKIPPED here
      # (CI_RUST_TESTS_SPLIT_SERIAL) and run in the `agent-live-windows` job below
      # instead — serially, isolated from this leg (#2495, #3615). Linux and
      # macOS still run them here.
      - name: Run Rust tests
        if: needs.changes.outputs.rust != 'false'
        shell: bash
        env:
          TERMIHUB_AGENT_TEST_MAX_CONCURRENT: ${{ matrix.os == 'windows-latest' && '2' || '' }}
          CI_RUST_TESTS_SPLIT_SERIAL: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
          # The Linux X11 delayed-render paste test (#4087) starts its own Xvfb and
          # drives it with xclip (both installed above); on ubuntu a missing tool
          # fails the test instead of skipping it.
          TERMIHUB_REQUIRE_X11_CLIPBOARD_TEST: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
          # Its native-Wayland sibling (#1847, #4004) starts a private headless sway
          # and pastes with wl-paste (sway + wl-clipboard, installed above).
          TERMIHUB_REQUIRE_WAYLAND_CLIPBOARD_TEST: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
        run: ./scripts/internal/ci-rust-tests.sh bulk --workspace

      # The headless agent-reconnect tests (`russh_reconnect_tests`, Unix only)
      # stand up a throwaway local sshd and run the prebuilt termihub-agent
      # through it. TERMIHUB_REQUIRE_LOCAL_SSHD makes a missing sshd, ssh client
      # or agent binary a failure instead of a skip on Linux (openssh-server is
      # installed above) and macOS (ships sshd), so the #2476/#2491 regression
      # guard cannot pass without running (#4338, TBE2-006).
      - name: Run Rust tests (contention-sensitive suites, capped threads)
        if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
        shell: bash
        env:
          CI_RUST_TESTS_SPLIT_SERIAL: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
          TERMIHUB_REQUIRE_LOCAL_SSHD: ${{ matrix.os != 'windows-latest' && '1' || '' }}
        run: ./scripts/internal/ci-rust-tests.sh heavy --workspace

      # Windows shell-integration CLI smoke (#4010, #1368): build the desktop
      # binary and run `termiHub.exe install-shell-integration` /
      # `uninstall-shell-integration` for real. Both must exit 0 and print their
      # confirmation; the Explorer verb must land under HKCU only (no elevation)
      # and be removed again. The script refuses to run outside GitHub Actions,
      # since the HKCU class store cannot be sandboxed on a developer machine.
      - name: Shell-integration CLI smoke (Windows, HKCU only)
        if: ${{ !cancelled() && matrix.os == 'windows-latest' && needs.changes.outputs.rust != 'false' }}
        shell: pwsh
        run: |
          cargo build -p termihub --bin termihub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/internal/shell-integration-cli-smoke.ps1 -Exe target/debug/termihub.exe

      # Run coverage-gated tests once (Ubuntu) to enforce the vitest coverage
      # floors from vitest.config.ts (#2066). Coverage is computed from the
      # platform-independent TS sources, so gating on a single leg avoids
      # per-platform coverage drift while still failing CI on a real drop. The
      # other legs run the plain suite so every platform still exercises the tests.
      - name: Run frontend tests with coverage
        if: matrix.os == 'ubuntu-latest' && needs.changes.outputs.frontend != 'false'
        run: pnpm test:coverage

      # Publish the vitest coverage report (html + lcov + text) as a downloadable
      # CI artifact (TOOL-004). `pnpm test:coverage` writes it to coverage/ (see
      # vitest.config.ts) but nothing surfaced it before, so the html report was
      # only ever produced locally. `if: always()` uploads it even when the
      # coverage step failed a threshold, so a coverage drop can be inspected from
      # the failed run. This is a plain artifact upload — advisory only, no gate.
      - name: Upload coverage report artifact
        if: always() && matrix.os == 'ubuntu-latest' && needs.changes.outputs.frontend != 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: warn

      # Non-Ubuntu vitest legs run post-merge only (#3325): the suite is
      # platform-independent TS and already gates the PR on the Ubuntu leg.
      - name: Run frontend tests
        if: matrix.os != 'ubuntu-latest' && github.event_name != 'pull_request'
        run: pnpm test

  # Windows live-agent-TCP tests, serial + isolated (#2495, #3615). BLOCKING.
  #
  # The `live_agent_tcp_*` tests (agent/tests/local_agent_integration.rs and
  # tcp_listener_readiness.rs; 10 compile on Windows, the other 6 of the 16 are
  # unix-only) each cold-start a real `termihub-agent --listen`
  # and drive it over TCP. In the shared parallel Windows leg — many agents
  # cold-starting at once, alongside the whole workspace suite — they
  # oversubscribed the runner and timed out on a random test (10060), so they
  # were quarantined on Windows. Root cause was environmental, so the fix is
  # isolation: the Windows "Run Tests" leg (and agent.yml's post-merge Windows
  # leg) skip them, and this job runs exactly them, one at a time, with nothing
  # else on the runner. Its non-blocking predecessor (the "Serial Grade" lane)
  # was green on 29/29 non-cancelled runs before this was made blocking.
  #
  # Runs on any PR that touches what the agent builds from (the `agent` area:
  # agent/, core/, plugin-api/, plugin-runner/, vendor/, workspace manifests/toolchain, the test
  # driver script) and on every push to develop/main. A skipped job reports
  # success, so requiring this check does not block unrelated PRs. The script's
  # `serial` phase fails if fewer than the expected count ran (10 on Windows)
  # or any was ignored, so the filter can never go green by selecting nothing.
  agent-live-windows:
    name: Agent Live Tests (Windows, serial)
    runs-on: windows-latest
    needs: changes
    # Also skipped when the PR head commit carries [skip-tests] (#3915).
    if: >-
      ${{ !cancelled() && needs.changes.outputs.tests != 'false' &&
      needs.changes.outputs.agent != 'false' }}
    # The 10 tests take ~20s serially; a cold build is the long pole. The
    # script's own deadline (CI_SERIAL_TIMEOUT_SECS) kills a wedged run first
    # and names the stuck test; this ceiling is only the backstop.
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Restore the warm Windows cache agent.yml's post-merge build-windows
          # job writes. It builds the same `-p termihub-agent -p termihub-core
          # --all-features` test binaries as below, so a run starts hot. Read-only
          # here, so this job adds nothing to the repo cache budget.
          key: x86_64-pc-windows-msvc
          save-if: false

      # Compile first so build time is not counted against the test step.
      - name: Build agent test binaries
        shell: bash
        run: cargo test -p termihub-agent -p termihub-core --all-features --lib --bins --tests --no-run

      # Only the `live_agent_tcp_*` tests run (core has none; the core package is
      # selected purely so the feature set matches the cached build above), with
      # --test-threads=1: one agent cold-start at a time on an otherwise idle
      # runner. TERMIHUB_TEST_TIMING prints each test's gate-wait / cold-start /
      # first-RPC phases, so a failure names the slow phase.
      - name: Run live-agent tests serially
        shell: bash
        env:
          TERMIHUB_TEST_TIMING: '1'
          TERMIHUB_AGENT_TEST_MAX_CONCURRENT: '1'
        run: ./scripts/internal/ci-rust-tests.sh serial -p termihub-agent -p termihub-core

  # Python system-test harness — fast "machinery" suite (issue #801).
  # These drive the harness plumbing (bridge server, Driver, protocol, transfer
  # checkers) against a FakeApp, so they need no app build and no Docker — just
  # uv + the locked deps in tests/system/uv.lock. The `integration` group (which
  # launches the real desktop app) is excluded; it runs in the dedicated
  # system-test lanes, not on every PR.
  system-test-machinery:
    name: System-Test Harness (machinery)
    runs-on: ubuntu-latest
    needs: changes
    # Also skipped when the PR head commit carries [skip-tests] (#3915).
    if: >-
      ${{ !cancelled() && needs.changes.outputs.tests != 'false' &&
      needs.changes.outputs.harness != 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Fails if `.github/uv-version` is malformed or any workflow / composite
      # action calls astral-sh/setup-uv directly instead of ./.github/actions/setup-uv
      # (WA-CI-017). Plain Node, preinstalled on the runner.
      - name: Check uv version pin consistency
        run: node scripts/internal/check-uv-version.mjs

      - name: Setup uv
        # uv version comes from .github/uv-version (#1552, WA-CI-017).
        uses: ./.github/actions/setup-uv
        with:
          # Pin the interpreter for reproducibility; dependencies are resolved
          # from the committed tests/system/uv.lock (the wrapper uses --frozen).
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: tests/system/uv.lock

      - name: Run machinery suite
        run: ./tests/system/pytest.sh -m "not integration" -q

      # Test inventory + coverage-gap report (#1950) and its ratchet (#3755,
      # CI-012). It statically introspects the harness (stdlib-only, no app build)
      # and writes the report to the step summary, then fails when a feature area
      # becomes a NEW gap (no per-PR test, or no test at all) that the committed
      # tests/system/test-inventory-baseline.json does not already list. Blocking:
      # existing gaps are grandfathered by the baseline, so only a regression reds.
      # Lock in a closed gap: python3 scripts/build-test-inventory.py --update-baseline
      - name: Test inventory + coverage-gap ratchet
        run: |
          python3 scripts/build-test-inventory.py --stdout >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/build-test-inventory.py --check-baseline

  # Static data-testid drift guard (TIN-012). The Python bridge harness
  # (tests/system/) drives the app by data-testid selectors; when a component's
  # testid is renamed or removed in src/** but the harness still references it,
  # the harness silently breaks and only the slow nightly integration lane
  # catches it — late. This purely-static check (stdlib only, no app build, no
  # Docker, no uv) fails the PR the moment a harness-referenced testid is absent
  # from src/**. It reuses the testid-catalog source scan, so it can never
  # disagree with the catalog. See scripts/check-testid-drift.py.
  # Runs when either side of the contract changes: src/** (frontend) or the harness.
  testid-drift-guard:
    name: Test-ID Drift Guard
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      ${{ !cancelled() && (needs.changes.outputs.frontend != 'false' ||
      needs.changes.outputs.harness != 'false') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check harness testid references against src/**
        run: python3 scripts/check-testid-drift.py

  # Dependency Security Audit moved to its own workflow, security-audit.yml
  # (#3325): it runs on push to develop/main + daily, and on PRs only when a
  # dependency manifest/lockfile changes — so a time-based RUSTSEC/yank no longer
  # reds every unrelated PR at once.

  # Check conventional commits (PR only)
  commit-lint:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate PR commits
        run: |
          BASE=$(git merge-base HEAD origin/${{ github.base_ref }})
          pnpm exec commitlint --from "$BASE" --to ${{ github.sha }} --verbose

  # Aggregate gate (#3678): the ONE check branch protection requires for the
  # per-PR test legs. Matrix legs depend on the changed areas, so no leg name can
  # be required without blocking docs-only PRs; this job always reports under one
  # fixed name. It needs every correctness job above (a new one must be added
  # here or to GATE_EXCLUDED in scripts/internal/pr-gate.mjs; pr-gate.test.mjs
  # enforces it) and fails if any failed or was cancelled — skipped passes.
  # `always()` (not `!cancelled()`) so a cancelled run still reports a failure
  # instead of a skipped (= passing) gate.
  pr-gate:
    name: PR Gate
    runs-on: ubuntu-latest
    needs:
      - changes
      - rust-quality
      - rust-quality-windows
      - rustdoc
      - plugin-fuzz-check
      - rdp-sidecar-quality
      - frontend-quality
      - shellcheck
      - actionlint
      - cmd-scripts-windows
      - tests
      - agent-live-windows
      - system-test-machinery
      - testid-drift-guard
      - commit-lint
    if: always()

    steps:
      - name: Checkout gate script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Keep this list in sync with pr-gate.mjs's local imports: it runs from
          # this sparse tree, so a missing helper fails the gate (ERR_MODULE_NOT_FOUND).
          sparse-checkout: |
            scripts/internal/pr-gate.mjs
            scripts/internal/is-main-module.mjs
          sparse-checkout-cone-mode: false

      - name: Evaluate needed jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/internal/pr-gate.mjs
