name: Plugin Packaging

# Per-OS package-then-load for native plugins (PLG-011). Each OS builds the
# `echo-backend` example with the real packer (`--target host`, i.e. the
# multi-platform format), installs the package through PluginManager and loads
# it with the real PluginHost (core/tests/plugin_host_roundtrip's packaged
# sibling, core/tests/plugin_package_load.rs). A merge job then combines the
# per-OS packages into one fat package, verifies every platform entry's hash
# against the library each OS built, and loads the fat package on Linux. Each
# Unix OS also runs the OS-sandbox escape probe (#4186).
#
# Lane policy (#3325/#3326): on a PR this runs only when the plugin surface
# changes, and only on ubuntu + windows (macOS runners are the scarcest in the
# pool). Every push to develop/main runs it on all three platforms.
on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'plugin-api/**'
      - 'plugin-runner/**'
      - 'core/tests/plugin_runner*'
      - 'core/src/plugin/**'
      - 'core/src/bin/plugin_*.rs'
      - 'core/tests/plugin_package_load.rs'
      - 'core/tests/fixtures/test-plugin/**'
      - 'core/build.rs'
      - 'examples/plugins/**'
      - 'scripts/package-plugin.*'
      - 'plugins/keys/first-party-publisher.pub.pem'
      - '.github/workflows/plugin-packaging.yml'
  push:
    branches: [ main, develop ]

# Cancel superseded runs (#4119). A newer commit on the same PR, or a newer push
# to develop, cancels the in-flight run for the older commit, so a merge burst
# fully tests only its newest develop commit (develop's tip includes every
# earlier merge). A develop failure may therefore point at a batch of merges —
# see docs/contributing.md → "What a green PR proves". Never cancelled: pushes
# to main, tag/release pushes, schedules and workflow_dispatch. The event name
# is part of the group, so a push can never cancel a scheduled or dispatched run.
# (#3588 had made every push run complete; under constant merges that ran each
# superseded commit to completion — ~440 develop push runs/week.)
concurrency:
  group: plugin-packaging-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' ||
    (github.event_name == 'push' && github.ref == 'refs/heads/develop') }}

# Least-privilege token (CI-010): checkout, build, test and the artifact API
# (which does not use the GITHUB_TOKEN's contents scope).
permissions:
  contents: read

jobs:
  # Changed-area detection (#3903): the path filter above is file-level, so a
  # comment-only Rust change (every changed .rs line a whole-line `//` comment)
  # still triggers this workflow. The shared classifier narrows it; see
  # .github/actions/detect-changes. Non-PR events report every area on, and the
  # gated jobs test `!= 'false'`, so a failure here runs everything (fail-open).
  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      tests: ${{ steps.detect.outputs.tests }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The PR merge commit plus its parents, so HEAD^1 (the base tip) exists.
          fetch-depth: 2

      - name: Classify changed files
        id: detect
        uses: ./.github/actions/detect-changes

  package-and-load:
    name: Package + load (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    # Skipped on a PR whose plugin-surface changes are comment-only (#3903), or
    # whose head commit carries [skip-tests] (#3915).
    # `merge` needs this job, so it skips with it.
    if: >-
      ${{ !cancelled() && needs.changes.outputs.tests != 'false' &&
      needs.changes.outputs.rust != 'false' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON(github.event_name == 'pull_request'
          && '["ubuntu-latest","windows-latest"]'
          || '["ubuntu-latest","windows-latest","macos-latest"]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}

      # The .sh wrapper on Linux/macOS and the .cmd twin on Windows, so both
      # halves of the script pair are exercised for real.
      - name: Package echo-backend for this host (package-plugin.sh)
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/package-plugin.sh examples/plugins/echo-backend --target host --out target/plugin-dist

      - name: Package echo-backend for this host (package-plugin.cmd)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\package-plugin.cmd examples\plugins\echo-backend --target host --out target\plugin-dist

      # The hash of the library cargo built, recorded independently of the
      # packer, so the load test and the merge job can check the package carries
      # (and the host selects) exactly those bytes.
      - name: Record the built library's hash
        id: lib
        shell: bash
        run: |
          set -euo pipefail
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          dir="target/$triple/release"
          lib=""
          for name in libecho_backend.so libecho_backend.dylib echo_backend.dll; do
            if [ -f "$dir/$name" ]; then lib="$dir/$name"; fi
          done
          test -n "$lib"
          if command -v sha256sum >/dev/null 2>&1; then
            sum="$(sha256sum "$lib" | cut -d' ' -f1)"
          else
            sum="$(shasum -a 256 "$lib" | cut -d' ' -f1)"
          fi
          echo "$triple $sum" > "target/plugin-dist/expected-$triple.sha256"
          echo "Built $lib for $triple: sha256 $sum"
          {
            echo "triple=$triple"
            echo "sha256=$sum"
          } >> "$GITHUB_OUTPUT"

      - name: Install + load the package with the real host
        shell: bash
        env:
          TERMIHUB_PLUGIN_PACKAGE: ${{ github.workspace }}/target/plugin-dist/echo-backend-1.0.0.termihub-plugin
          TERMIHUB_PLUGIN_LIBRARY_SHA256: ${{ steps.lib.outputs.sha256 }}
        run: cargo test -p termihub-core --features plugin --test plugin_package_load -- --nocapture

      # Plugin OS sandbox (#4186, #4185, #4187): the escape-probe fixture runs
      # inside the confined plugin runner and tries every forbidden operation;
      # each must fail while the positive controls (data folder, install
      # folder, a bridge connection opened by the host) succeed. macOS asserts
      # Seatbelt, Linux landlock + seccomp (and the simulated reduced path),
      # Windows the Less-Privileged AppContainer + job object (incl.
      # HKCU\Software, %USERPROFILE%, a named pipe, cmd.exe). A safety test:
      # never moved to the post-merge lane.
      - name: Sandbox escape probe
        shell: bash
        run: cargo test -p termihub-core --features plugin --test plugin_runner_sandbox -- --nocapture

      - name: Upload the per-platform package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-package-${{ steps.lib.outputs.triple }}
          path: |
            target/plugin-dist/echo-backend-1.0.0.termihub-plugin
            target/plugin-dist/expected-*.sha256
          retention-days: 7
          if-no-files-found: error

  # Linux plugin sandbox inside a container (#4185): Docker's default seccomp
  # profile blocks unshare / user namespaces, as many container hosts do, so
  # this proves the runner's own landlock + seccomp setup works there — as a
  # non-root user, the way termiHub runs — and the escape probe still passes.
  # A safety test: never moved to the post-merge lane.
  sandbox-docker:
    name: Sandbox escape probe (Docker, no user namespaces)
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      ${{ !cancelled() && needs.changes.outputs.tests != 'false' &&
      needs.changes.outputs.rust != 'false' }}
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run the runner and escape-probe tests in rust:bookworm as a non-root user
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat .github/rust-version)"
          docker run --rm -v "$PWD:/src:ro" "rust:${version}-bookworm" bash -euo pipefail -c '
            apt-get update -qq
            apt-get install -y -qq pkg-config libudev-dev libssl-dev libdbus-1-dev >/dev/null
            useradd -m -s /bin/bash probe
            cp -r /src /home/probe/src
            chown -R probe /home/probe/src /usr/local/cargo
            su probe -c "
              set -euo pipefail
              export PATH=/usr/local/cargo/bin:\$PATH CARGO_HOME=/usr/local/cargo RUSTUP_HOME=/usr/local/rustup
              cd /home/probe/src
              cargo test -p termihub-plugin-runner
              cargo test -p termihub-core --features plugin --test plugin_runner_sandbox -- --nocapture
            "
          '

  merge:
    name: Merge into a multi-platform package
    needs: package-and-load
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}

      - name: Download the per-platform packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: plugin-package-*
          path: target/per-os

      - name: Merge and verify every platform entry's hash
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for pkg in target/per-os/*/echo-backend-1.0.0.termihub-plugin; do
            args+=(--merge "$pkg")
          done
          test "${#args[@]}" -ge 4 # at least two platforms
          ./scripts/package-plugin.sh "${args[@]}" --out target/plugin-fat
          fat=target/plugin-fat/echo-backend-1.0.0.termihub-plugin
          cargo run --quiet -p termihub-core --features plugin --bin termihub-plugin-pack -- \
            --inspect "$fat" > target/entries.txt
          cat target/per-os/*/expected-*.sha256 | sort > target/expected.txt
          awk '{ sub(/^sha256:/, "", $2); print $1, $2 }' target/entries.txt | sort > target/actual.txt
          echo "--- expected (built per OS)"; cat target/expected.txt
          echo "--- actual (merged package)"; cat target/actual.txt
          diff -u target/expected.txt target/actual.txt

      # First-party signing (#3980). The fat package is the shippable artifact,
      # so it is the one signed (merging rebuilds the archive, so per-OS
      # signatures would not survive). A no-op with a notice while
      # plugins/keys/first-party-publisher.pub.pem is the placeholder or the
      # FIRST_PARTY_PLUGIN_SIGNING_KEY secret is unavailable (fork PR / not set
      # yet); the load below then runs on the unsigned package as before. Once
      # both exist, the secret's key must be the compiled-in one, so the signed
      # package verifies as first-party with no user pin. The key file lives in
      # a 0600 file in RUNNER_TEMP only for the signing call; it is never echoed.
      - name: Sign the first-party package with the bundled publisher key
        shell: bash
        env:
          FIRST_PARTY_PLUGIN_SIGNING_KEY: ${{ secrets.FIRST_PARTY_PLUGIN_SIGNING_KEY }}
        run: |
          set -euo pipefail
          pub=plugins/keys/first-party-publisher.pub.pem
          if ! grep -q -- '-----BEGIN PUBLIC KEY-----' "$pub"; then
            echo "::notice title=First-party plugin signing not configured::$pub is still the placeholder, so first-party plugins ship unsigned and desktops have no bundled publisher. Maintainer: run scripts/internal/setup-plugin-publisher-key.sh (docs/contributing.md -> 'First-party plugin publisher key')."
            exit 0
          fi
          if [ -z "${FIRST_PARTY_PLUGIN_SIGNING_KEY}" ]; then
            echo "::notice::FIRST_PARTY_PLUGIN_SIGNING_KEY is not available to this run (fork PR or secret unset); the package is left unsigned."
            exit 0
          fi
          key="$RUNNER_TEMP/first-party-plugin.key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$FIRST_PARTY_PLUGIN_SIGNING_KEY" >"$key")
          # Every compiled-in key id, derived exactly as the desktop does:
          # sha256 of the raw 32-byte Ed25519 key (the SPKI DER's tail).
          trusted="$(awk '/-----BEGIN PUBLIC KEY-----/{b="";k=1;next}
            /-----END PUBLIC KEY-----/{print b;k=0;next} k{b=b $0}' "$pub" |
            while read -r b64; do
              printf '%s' "$b64" | openssl base64 -d -A | tail -c 32 | sha256sum | cut -c1-64
            done)"
          signer="$(jq -r .keyId "$key")"
          if ! grep -qx "${signer#sha256:}" <<<"$trusted"; then
            echo "::error title=First-party signing key mismatch::FIRST_PARTY_PLUGIN_SIGNING_KEY ($signer) is not a key in $pub, so the package would not verify as first-party. Re-run scripts/internal/setup-plugin-publisher-key.sh --force and commit the key file."
            exit 1
          fi
          cargo run --quiet -p termihub-core --features plugin --bin termihub-plugin-sign -- \
            --key "$key" target/plugin-fat/echo-backend-1.0.0.termihub-plugin

      - name: Load the fat package on Linux (selects its own entry)
        shell: bash
        run: |
          set -euo pipefail
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          sum="$(awk -v t="$triple" '$1 == t { print $2 }' target/expected.txt)"
          test -n "$sum"
          TERMIHUB_PLUGIN_PACKAGE="$PWD/target/plugin-fat/echo-backend-1.0.0.termihub-plugin" \
          TERMIHUB_PLUGIN_LIBRARY_SHA256="$sum" \
            cargo test -p termihub-core --features plugin --test plugin_package_load -- --nocapture

      - name: Upload the multi-platform package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-package-multi-platform
          path: target/plugin-fat/echo-backend-1.0.0.termihub-plugin
          retention-days: 7
          if-no-files-found: error
