name: "Release Candidate: Full Integration"

# The release gate's integration run (#3652, WA-CI-004, WA-CI-024).
#
# Per-PR CI is the slim lane (#3325/#3326): it never runs the bridge integration
# lane, runs the Docker fixture lane only on a path filter, and leaves the agent
# Docker/live suites to the nightly and post-merge lanes. A release must not be cut
# on that alone. This workflow runs EVERY integration lane, with no path filter, on
# one exact commit — the commit it is dispatched on (`github.sha`):
#
#   * system-integration.yml  — bridge integration lane (Linux/macOS/Windows, plus
#                                linux-arm64 on every candidate, #4934), the
#                                display-critical grades, the agent Docker suites
#   * integration-fixtures.yml — core/tests against the live Docker fixtures and the
#                                polkit D-Bus verifier
#   * release-linux-arm64-smoke.yml — the linux-arm64 install smoke (#4934, #5178)
#                                against the Dev Build pre-release built from this
#                                exact commit (see the arm64-smoke-tag job)
#
# The Release workflow's first gate (scripts/internal/release-integration-gate.mjs)
# refuses to publish unless the newest run of THIS workflow on the tag's commit is
# green (plus the post-merge Code Quality push run, which carries the Windows agent
# live tests, the post-merge Dev Build push run, the full app build, and the
# post-merge Security Audit push run). Dispatch it on the release ref before (or after) pushing the tag:
#
#   gh workflow run release-candidate.yml --ref main       # or --ref vX.Y.Z
#
# ADVISORY coverage summary (#3658, TOOL-005): the fixtures lane runs instrumented
# here (measure_coverage), and the "Release coverage summary" job merges its lcov
# with the unit lcov of the Coverage run on the same commit. The bridge harness
# lane stays uninstrumented here so the gate tests the shipped bundle and binary;
# its coverage is nightly only (#3657). The job summary then shows the unified
# coverage and the integration gap for the exact commit. That
# job is continue-on-error and nothing needs it, so it can never red this run or
# the release gate.
#
# See docs/contributing.md -> "Release integration gate".

on:
  workflow_dispatch:

# One candidate run per ref; a re-dispatch on the same ref waits rather than
# cancelling a run the release gate may already be counting on.
concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

# Least-privilege token (CI-010). The called lanes only check out, build, test and
# upload artifacts; a called workflow can never get more than this.
permissions:
  contents: read

jobs:
  system-integration:
    name: System integration
    uses: ./.github/workflows/system-integration.yml
    with:
      ref: ${{ github.sha }}
      # Deliberately NOT instrumented (#3657): the release gate must exercise the
      # same frontend bundle and binary that ship. Harness coverage is nightly only.

  integration-fixtures:
    name: Integration fixtures
    uses: ./.github/workflows/integration-fixtures.yml
    with:
      measure_coverage: true

  # The linux-arm64 install smoke on every candidate (#5178). release.yml runs it
  # again on the published tag, but that is after the release exists; here it
  # grades the candidate before the tag ships. The candidate has no release of its
  # own yet, so the smoke installs the Dev Build pre-release built from this exact
  # commit: dev-build.yml publishes `dev-latest` from main and
  # `dev-<branch>-latest` from develop, each with `target_commitish` set to the
  # built sha. This job picks the one whose target is `github.sha`. When the Dev
  # Build run for the sha is still in flight it waits for it (bounded by the job
  # timeout); when no pre-release was built from the sha, the job fails and names
  # the fix, so the candidate never smokes a different commit's packages.
  arm64-smoke-tag:
    name: Resolve the arm64 smoke pre-release
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Find the Dev Build pre-release for this commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Wait for an in-flight Dev Build of this sha (main or develop push).
          run_id="$(gh run list --workflow dev-build.yml --commit "$SHA" --event push \
            --json databaseId,status --jq '[.[] | select(.status != "completed")][0].databaseId // empty')"
          if [ -n "$run_id" ]; then
            echo "Dev Build run $run_id for $SHA is in flight; waiting for it"
            gh run watch "$run_id" --interval 60 >/dev/null || true
          fi
          for tag in dev-latest dev-develop-latest; do
            target="$(gh release view "$tag" --json targetCommitish --jq .targetCommitish 2>/dev/null || true)"
            echo "$tag -> ${target:-<none>}"
            if [ "$target" = "$SHA" ]; then
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              echo "linux-arm64 smoke will install $tag (built from $SHA)"
              exit 0
            fi
          done
          echo "::error::no Dev Build pre-release (dev-latest, dev-develop-latest) is built from" \
            "$SHA. Let Dev Build finish on the candidate's branch, then re-dispatch this workflow."
          exit 1

  linux-arm64-smoke:
    name: Linux arm64 install smoke
    needs: [arm64-smoke-tag]
    uses: ./.github/workflows/release-linux-arm64-smoke.yml
    with:
      tag: ${{ needs.arm64-smoke-tag.outputs.tag }}

  # Advisory (#3658): never blocks. Runs after the fixtures lane whatever its
  # result (a failed suite still measured what ran), and job-level
  # continue-on-error keeps any failure here out of the run's conclusion, which
  # the release gate reads.
  coverage-summary:
    name: Release coverage summary (advisory)
    needs: [integration-fixtures]
    if: ${{ !cancelled() }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reads the Coverage run's artifact for this commit via the Actions API.
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download this run's integration coverage
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: integration-coverage
          path: coverage-integration

      # node is preinstalled on the runner. Always exits 0 (see the script).
      - name: Summarize unified + integration coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/internal/release-coverage-summary.mjs
          --repo "${{ github.repository }}"
          --sha "${{ github.sha }}"
          --ref "${{ github.ref_name }}"
          --integration-lcov coverage-integration/integration.lcov
          --out-dir coverage-release

      - name: Upload release coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-coverage
          path: |
            coverage-release/release-coverage.md
            coverage-release/integration-gap.md
            coverage-release/merged.lcov
          if-no-files-found: warn
