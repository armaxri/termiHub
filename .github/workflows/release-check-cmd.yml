name: Release Check (Windows .cmd)

# Executes the release gates in scripts\release-check.cmd on a real Windows host
# (#3753). The integration-lane gate, the TODO/FIXME/HACK scan and the bundle
# build + smoke test (#3750) are batch-specific code (`for /f` over gh/git
# output, the installer glob, errorlevel handling) that no maintainer machine
# runs before a release, so a parse bug would only surface on release day.
#
# scripts/internal/test-release-check-cmd.ps1 drives each gate on its own via
# `release-check.cmd --only <section>` and asserts the exit code and the
# PASS/FAIL line for every scenario (injected TODO, gh missing / logged out,
# HEAD on no remote branch, no green runs for HEAD, installer glob hits and
# misses, failed build, failed smoke test).
#
# Slim PR lane (#3325): this runs on a PR only when the release-check scripts,
# their Node helpers, the harness or this workflow change. The real bundle build
# + smoke test (~30 min) runs only on workflow_dispatch; the PR path exercises
# the same section against stub build.cmd / smoke-test.cmd.

on:
  pull_request:
    paths:
      - "scripts/release-check*"
      - "scripts/internal/release-*"
      - "scripts/internal/test-release-check-cmd.ps1"
      - ".github/workflows/release-check-cmd.yml"
  workflow_dispatch:

permissions:
  contents: read
  # The integration gate lists workflow runs for HEAD.
  actions: read

concurrency:
  group: release-check-cmd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmd-gates:
    name: release-check.cmd gates (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Run the release-check.cmd gate scenarios
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/internal/test-release-check-cmd.ps1

  bundle-real:
    name: release-check.cmd bundle build + smoke (Windows)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tauri-x86_64-pc-windows-msvc
          save-if: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release-check.cmd --only bundle (real build.cmd + smoke-test.cmd)
        shell: pwsh
        run: ./scripts/internal/test-release-check-cmd.ps1 -RealBundle
