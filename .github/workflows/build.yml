name: Build

on:
  pull_request:
    branches: [ main, develop ]

# Cancel an in-flight PR build when a newer commit is pushed to the same PR —
# no point finishing a build for a superseded commit.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token (CI-010). The job only checks out and compiles the app
# (no bundle upload, no PR comment, no push) — read-only is sufficient.
permissions:
  contents: read

jobs:
  # Changed-area detection (#3325) — same classifier as code-quality.yml.
  # Fail-open: if this job fails, `build` still runs (gates on `!= 'false'`).
  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      frontend: ${{ steps.detect.outputs.frontend }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2

      - name: Classify changed files
        id: detect
        uses: ./.github/actions/detect-changes

  # ONE fast release-compile smoke per PR (#3325), on Linux only, and only when
  # Rust or frontend code changed. It is kept because it is the only pre-merge
  # exercise of the `tauri build` wiring the tests never touch: the production
  # `pnpm build` (Vite bundling, beforeBuildCommand), `frontendDist`, the
  # release profile and `custom-protocol` feature. It does NOT bundle
  # installers (`--no-bundle`).
  #
  # The macOS and Windows release compiles moved POST-MERGE: dev-build.yml builds
  # full installers for every platform/arch (macOS arm64+x64, Windows x64, Linux
  # x64+arm64) on every push to develop/main, which strictly covers the old PR
  # legs. Per-platform *Rust* breakage is still caught on the PR by the Windows
  # "Run Tests" leg (code-quality.yml) whenever Rust changes.
  build:
    name: Build on ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: changes
    if: >-
      ${{ !cancelled() && (needs.changes.outputs.rust != 'false' ||
      needs.changes.outputs.frontend != 'false') }}

    strategy:
      fail-fast: false
      matrix:
        # Kept as a one-entry matrix so the check name stays "Build on ubuntu-latest".
        include:
          - platform: 'ubuntu-latest'
            os: ubuntu-latest
            rust_target: 'x86_64-unknown-linux-gnu'

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # shared-key (keyed by rust target, identical in dev-build.yml) lets the
          # full release builds on every push to develop/main warm the exact cache
          # these PR builds restore — so a fresh PR starts from a hot cache.
          shared-key: tauri-${{ matrix.rust_target }}
          # PR builds are pure readers. The writer for this shared-key is
          # dev-build.yml, which runs when a PR merges into develop (a push event
          # on develop) — that's where integration actually happens. A PR based on
          # develop can restore its base branch's caches, so it starts hot without
          # ever saving its own dead, PR-scoped cache against the 10 GB budget.
          save-if: false

      - name: Install system dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # `tauri build --no-bundle` runs the frontend build (beforeBuildCommand:
      # `pnpm build`) and compiles the release binary, but skips installer
      # packaging. This is the compile-verification the PR needs; dev-build.yml
      # produces the actual installers on push to develop/main.
      - name: Build Tauri app (compile only, no installers)
        run: pnpm tauri build --no-bundle --target ${{ matrix.rust_target }}
