name: Build

on:
  pull_request:
    branches: [ main, develop ]

# Cancel an in-flight PR build when a newer commit is pushed to the same PR —
# no point finishing a build for a superseded commit.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR builds verify the app *compiles* on each platform. They intentionally do
  # NOT bundle installers (`--no-bundle`) — packaging (NSIS/MSI/DMG/AppImage)
  # rarely breaks, is the slowest tail (esp. Windows), and full installers are
  # produced by the Dev Build workflow on every push to develop/main. The PR
  # matrix is also trimmed to one arch per OS (x64 Linux, arm64 macOS, x64
  # Windows); the dropped arches (macOS x64, Linux arm64) are still built in full
  # by dev-build.yml post-merge.
  build:
    name: Build on ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest-arm'
            os: macos-latest
            rust_target: 'aarch64-apple-darwin'
          - platform: 'ubuntu-latest'
            os: ubuntu-latest
            rust_target: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            os: windows-latest
            rust_target: 'x86_64-pc-windows-msvc'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # shared-key (keyed by rust target, identical in dev-build.yml) lets the
          # full release builds on every push to develop/main warm the exact cache
          # these PR builds restore — so a fresh PR starts from a hot cache.
          shared-key: tauri-${{ matrix.rust_target }}
          # PR builds are pure readers: dev-build.yml (on push to develop/main) is
          # the writer for this shared-key, so PRs never need to save and don't add
          # dead PR-scoped caches to the repo's 10 GB budget.
          save-if: false

      - name: Install system dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # `tauri build --no-bundle` runs the frontend build (beforeBuildCommand:
      # `pnpm build`) and compiles the release binary, but skips installer
      # packaging. This is the compile-verification the PR needs; dev-build.yml
      # produces the actual installers on push to develop/main.
      - name: Build Tauri app (compile only, no installers)
        run: pnpm tauri build --no-bundle --target ${{ matrix.rust_target }}
