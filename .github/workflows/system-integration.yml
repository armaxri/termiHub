name: System Integration (nightly)

# Runs the Python bridge harness **integration** lane — the suites marked
# `@pytest.mark.integration`, which launch the REAL built desktop app (and, where
# a suite needs them, the Docker SSH/telnet fixtures). Per-PR CI only ever runs
# `-m "not integration"` (see code-quality.yml → System-Test Harness), so every
# one of these ~360 tests is otherwise merely *collected*, never *run*. That dark
# lane is how stale-testid rot slipped in unnoticed (#1568): a green PR proves the
# harness *collects*, not that it *works*.
#
# This job closes that gap on a nightly cadence, separate from per-PR CI (owner's
# decision on #1569): per-PR stays fast and unchanged, and any rot in the
# integration lane surfaces within a day instead of at the next accidental
# discovery. It is Docker-bound and builds the app, so it is deliberately NOT a
# per-PR check.
#
# The bridge drives the app over a WebSocket bridge — not a native WebView driver
# — so the lane runs on **Linux, macOS, and Windows** (#804/#1649). macOS is the
# point: `tauri-driver` never had a WKWebView driver, so macOS app-UI testing was
# manual-only before the bridge; now the built `.app` launches and is driven
# natively in CI. The **Docker fixtures stay Linux-only**: the GitHub-hosted
# macOS and Windows runners have no usable Linux Docker daemon (macOS runners
# ship no Docker; the Windows runner's daemon runs Windows, not Linux,
# containers), so the fixture-backed suites (SSH/telnet/serial/agent) self-skip
# there while the app-launch/UI integration suites run. This mirrors the
# long-standing Docker-daemon caveat in ADR-5 and the SSH-tunnel macOS carve-out
# (docs/testing.md).
#
# Trigger by hand from the Actions tab ("Run workflow") to validate a change to
# the harness, the fixtures, or this workflow without waiting for the nightly run.

on:
  schedule:
    # develop — daily ~05:00 UTC (:05 off the top of the hour to dodge scheduler
    # congestion). Which branch each schedule grades is resolved by the `setup`
    # job below from github.event.schedule.
    - cron: "5 5 * * *"
    # main — weekly, Wednesday ~05:00 UTC. Both crons fire on Wednesday, so that
    # day gets a develop run (daily) AND a main run (weekly) as separate runs.
    - cron: "5 5 * * 3"
  workflow_dispatch:
    inputs:
      branch:
        description: "Which branch(es) to grade"
        type: choice
        options: [both, develop, main]
        default: both

# Key concurrency on the trigger so the daily-develop and weekly-main runs (which
# overlap on Wednesday) do not cancel each other, while a redundant re-fire of the
# same trigger still cancels the older in-flight run.
concurrency:
  group: system-integration-${{ github.event.schedule || github.event.inputs.branch || github.ref }}
  cancel-in-progress: true

jobs:
  # Resolve which branch(es) this run grades from the trigger: the daily cron →
  # develop, the Wednesday cron → main, a manual dispatch → the chosen input
  # (default both). Emitted as a JSON array the matrix below expands over.
  setup:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.pick.outputs.branches }}
    steps:
      - id: pick
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "5 5 * * 3") echo 'branches=["main"]' >> "$GITHUB_OUTPUT" ;;
              *) echo 'branches=["develop"]' >> "$GITHUB_OUTPUT" ;;
            esac
          else
            case "${{ github.event.inputs.branch }}" in
              develop) echo 'branches=["develop"]' >> "$GITHUB_OUTPUT" ;;
              main) echo 'branches=["main"]' >> "$GITHUB_OUTPUT" ;;
              *) echo 'branches=["main","develop"]' >> "$GITHUB_OUTPUT" ;;
            esac
          fi

  system-integration:
    needs: setup
    name: System-Test Harness (integration lane, ${{ matrix.os }} · ${{ matrix.branch }})
    runs-on: ${{ matrix.os }}
    # The lane builds the app (debug) and launches it once per suite against live
    # Docker fixtures; a generous ceiling keeps a slow image build or a hung app
    # from being read as success, while still bounding a wedged run.
    timeout-minutes: 120

    strategy:
      # One red platform must not cancel the others — each leg is independent
      # evidence, and the macOS/Windows legs run a different (Docker-less) subset
      # than Linux, so a Linux failure says nothing about them and vice versa.
      fail-fast: false
      matrix:
        # Which branch(es) to grade is resolved per-trigger by the `setup` job:
        # develop daily, main weekly (Wed), both on manual dispatch. Each leg
        # checks out its matrix.branch code below. main == develop until develop
        # advances past a release.
        branch: ${{ fromJSON(needs.setup.outputs.branches) }}
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      # webkit2gtk-only knobs — read solely by the Linux WebKitGTK webview under
      # Xvfb, harmless no-ops on the macOS (WKWebView) and Windows (WebView2)
      # runners. Disable the DMABUF and compositing paths that assume a real
      # GPU/display so the webview renders in software on a headless runner, and
      # silence the at-spi accessibility-bus warnings that otherwise flood the
      # app log on a headless box.
      WEBKIT_DISABLE_DMABUF_RENDERER: "1"
      WEBKIT_DISABLE_COMPOSITING_MODE: "1"
      NO_AT_BRIDGE: "1"

      # Un-skip the automated agent-reconnect UI grade
      # (test_agent_reconnect_ui.py, #2574) on the macOS leg. That suite carries a
      # skip-guard (#2631): on CI it stays skipped unless TERMIHUB_LIVE_AGENT=1,
      # because it needs a live app->agent SSH connect rather than merely an sshd
      # binary. Nothing extra has to be *installed* to un-skip it — the runner
      # already has everything the grade needs: its harness (LocalAgentSshd) stands
      # up its own throwaway loopback sshd from the macOS /usr/sbin/sshd, and the
      # release termihub-agent it deploys is built by the "Build the agent
      # (release)" step above. A live connect over exactly this path was already
      # observed on the macOS runner (the failure that motivated #2579 was a harness
      # region-read bug since fixed in #2628, not a missing agent), so flipping the
      # opt-in is all that is required. Scoped to macOS via the matrix expression
      # (empty string elsewhere = still skipped): the macOS GUI lane is the grade's
      # home (#2618/#2579), and Windows loopback sshd is unreliable. (#2579, #2618,
      # #2626 cat B)
      TERMIHUB_LIVE_AGENT: ${{ matrix.os == 'macos-latest' && '1' || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Grade the branch this matrix leg targets (main or develop), not just
          # the default branch the scheduled run fires from.
          ref: ${{ matrix.branch }}

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          # Pin uv itself (issue #1552): "latest" resolves through the GitHub
          # Releases API, which flakes and fast-fails unrelated to the run.
          version: '0.11.29'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: tests/system/uv.lock

      - name: Install system dependencies (Tauri + headless display)
        # Linux only: the Tauri webview build/runtime deps (mirrors dev-build.yml)
        # plus xvfb, so the app has a virtual X display to launch into. socat backs
        # the virtual serial-port suites; without it those integration tests skip.
        # macOS ships WKWebView and Windows ships WebView2, so neither needs these.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb \
            socat

      - name: Install serial fixture dependency (socat)
        # macOS only: socat backs the virtual serial-port suites the same way it
        # does on Linux; without it those integration tests skip cleanly. Windows
        # has no socat equivalent, so its serial suites remain manual.
        if: runner.os == 'macOS'
        run: brew install socat

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the agent (release)
        # The agent-lifecycle integration suites (AgentInstance) resolve
        # target/release/termihub-agent; build it so they run instead of skipping.
        run: cargo build --release -p termihub-agent

      - name: Build the desktop app (debug)
        # The integration lane launches the real app; the harness resolves the
        # debug bundle (target/debug/…) when no release build is present. Debug
        # builds far faster than release, which is what we want for a nightly.
        #
        # --config src-tauri/tauri.test.conf.json re-adds the loopback ws:// the
        # bridge's in-app client needs: the production CSP no longer allows any
        # ws:// in connect-src (#2059), and the overlay restores it for test
        # builds only. Everything else in the CSP (script-src, style-src, …) is
        # identical to production, so this lane still exercises the shipped
        # rendering-relevant policy — including the CSP-violation assertion in
        # test_csp.py.
        run: pnpm tauri build --debug --config src-tauri/tauri.test.conf.json

      - name: Bring up the Docker fixtures
        # Linux only. Pre-build and start the profile-less SSH/telnet fixtures so
        # image builds happen once here (visible as their own step) rather than
        # inside a per-suite fixture under its bring-up timeout. The harness'
        # ComposeFixture then finds them already up; profile-gated fixtures
        # (agent/stress/fault/ftp) are brought up on demand by the suites that
        # need them — the agent image must be staged by the harness first. The
        # macOS/Windows runners have no usable Linux Docker daemon, so their
        # fixture-backed suites self-skip instead (see the header note).
        if: runner.os == 'Linux'
        run: |
          docker compose -f tests/docker/docker-compose.yml up -d --build

      - name: Run the integration lane (Linux, headless via Xvfb)
        # Fail loudly: a real test failure fails the job (that is the whole point
        # — surface rot). Xvfb gives the app a display; the harness owns launching
        # the app and driving the fixtures. Suites whose fixtures are unavailable
        # skip cleanly rather than error.
        if: runner.os == 'Linux'
        run: xvfb-run -a ./tests/system/pytest.sh -m integration -v --durations=25

      - name: Run the integration lane (macOS/Windows, native display)
        # No Xvfb — the runner has a real (or headless-native) display and drives
        # the app's own webview (WKWebView / WebView2) through the bridge. The
        # Docker-fixture suites self-skip here (no Linux daemon); the app-launch
        # and UI integration suites run natively. This is the coverage the bridge
        # newly unlocks on macOS, where `tauri-driver` never had a WKWebView
        # driver. Run under Git Bash on Windows so pytest.sh executes as written.
        #
        # Sharded with pytest-xdist (#2639): once the #2626 harness fixes let the
        # ~82 previously-fast-failing suites actually run their real
        # connection/terminal flows, the serial macOS lane overflowed the 120-min
        # ceiling (cancelled at ~43%). `-n auto` fans the suites across one worker
        # per core; the work is dominated by app-launch settle / terminal-output
        # waits rather than CPU, so it parallelises well past a naive core-count
        # estimate (tune the count here if a runner over-subscribes). `--dist
        # loadscope` groups by test class so each class-scoped app fixture stays
        # on a single worker — one app launch per class, exactly as serial, just
        # fanned across workers. The Docker-fixture suites still self-skip per
        # worker. Linux keeps running serially (above): its fixtures publish fixed
        # host ports (2201/2203/…) that parallel workers would contend for.
        if: runner.os != 'Linux'
        shell: bash
        run: ./tests/system/pytest.sh -m integration -n auto --dist loadscope -v --durations=25

      - name: Dump container logs on failure
        # Linux only — the other legs bring up no containers.
        if: failure() && runner.os == 'Linux'
        run: docker compose -f tests/docker/docker-compose.yml --profile all logs --tail=200

      - name: Upload failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-integration-artifacts-${{ matrix.os }}
          path: tests/system/artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down the fixtures
        # Linux only — nothing was brought up on the other legs.
        if: always() && runner.os == 'Linux'
        run: docker compose -f tests/docker/docker-compose.yml --profile all down -v

  # Fast display-critical grades, split into their own job (#2639) so they ALWAYS
  # report an independent pass/fail even when the bulk `system-integration` lane
  # above is slow: a job-level timeout *cancels* the whole job, erasing the signal
  # from any grade that happened to run inside it, so only a separate job with its
  # own timeout guarantees these two always surface a green/red check. It runs
  # just the two grades (`-k`), needs no Docker fixtures, and so finishes well
  # inside its own budget. (These grades also still run inside the bulk lane; this
  # job is the guaranteed signal, not their only home — keeping them in the bulk
  # lane leaves #2634's Linux-enable of test_agent_reconnect_ui untouched.)
  display-grades:
    needs: setup
    name: Display-critical grades (${{ matrix.os }} · ${{ matrix.branch }})
    runs-on: ${{ matrix.os }}
    # Only the app+agent build plus two short grades — a fraction of the bulk
    # lane, but generous enough to absorb a slow debug build.
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.setup.outputs.branches) }}
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      # Same webkit2gtk-only knobs as the bulk lane (Linux WebKitGTK under Xvfb;
      # harmless no-ops on macOS/Windows).
      WEBKIT_DISABLE_DMABUF_RENDERER: "1"
      WEBKIT_DISABLE_COMPOSITING_MODE: "1"
      NO_AT_BRIDGE: "1"

      # Preserve the bulk lane's gating for test_agent_reconnect_ui EXACTLY:
      # macOS-only opt-in (skip-guarded elsewhere). Do NOT widen this to new
      # platforms here — extending the reconnect grade to the Linux leg is owned
      # by #2634, which edits the matching expression in the bulk lane above.
      TERMIHUB_LIVE_AGENT: ${{ matrix.os == 'macos-latest' && '1' || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.29'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: tests/system/uv.lock

      - name: Install system dependencies (Tauri + headless display)
        # Linux only: Tauri webview build deps + xvfb to give the app a display.
        # No socat/Docker — these two grades need neither.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the agent (release)
        # test_agent_reconnect_ui deploys target/release/termihub-agent via its
        # loopback LocalAgentSshd; build it so the grade runs instead of skipping.
        run: cargo build --release -p termihub-agent

      - name: Build the desktop app (debug)
        # Same debug bundle + test-CSP overlay as the bulk lane (see its note).
        run: pnpm tauri build --debug --config src-tauri/tauri.test.conf.json

      - name: Run the display-critical grades (Linux, headless via Xvfb)
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a ./tests/system/pytest.sh -m integration
          -k "test_agent_reconnect_ui or test_layout_scrollback_ui" -v

      - name: Run the display-critical grades (macOS/Windows, native display)
        # No fixtures needed, so no xdist — the two suites run quickly serially.
        if: runner.os != 'Linux'
        shell: bash
        run: >-
          ./tests/system/pytest.sh -m integration
          -k "test_agent_reconnect_ui or test_layout_scrollback_ui" -v

      - name: Upload failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: display-grades-artifacts-${{ matrix.os }}
          path: tests/system/artifacts/
          if-no-files-found: ignore
          retention-days: 14
