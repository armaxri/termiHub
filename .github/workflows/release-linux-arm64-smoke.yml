name: Release Linux arm64 Smoke

# Automates the Linux arm64 post-release install-smoke (#2654), the follow-up to
# the x64 smoke (#478/#2651, release-linux-smoke.yml). After the "Release"
# workflow finishes publishing a tag's artifacts, this downloads the
# just-published Linux arm64 .deb and .rpm and checks them on the native
# ubuntu-24.04-arm hosted runner (the same aarch64 runner release.yml uses to
# BUILD the linux-arm64 bundles):
#
#   * .deb: installed with apt; the bundled sidecars match the app's digests;
#     `--version` works headless (no display, #2655); and, since #4934, the
#     same GUI launch smoke as x64 under xvfb-run + dbus-run-session
#     (scripts/smoke-test.sh) plus the app-log / single-instance lifecycle
#     (scripts/internal/release-smoke-app-lifecycle.sh, #4011).
#   * .rpm (#4934): its payload is extracted (bsdtar; the runner is Debian-based)
#     and must hold an aarch64 `termihub` whose sidecars match its digests and
#     whose `--version` prints the same line as the .deb's.
#
# This retires the GUI half of the Raspberry Pi .deb session (#479). What stays
# manual is a launch on a real Pi desktop (its GPU stack and Wayland/X session);
# see docs/testing.md.
#
# Like release-linux-smoke.yml, release.yml calls this as a reusable workflow
# (workflow_call) after verify-release and before mark-latest (#4281), so a
# failing smoke keeps the release from becoming GitHub's "Latest release".
# A manual dispatch also accepts a dev pre-release tag (`dev-develop-latest`,
# published by dev-build.yml) so the smoke can be proven before a real release.

on:
  # Called by release.yml after verify-release and before mark-latest (#4281),
  # so a failing smoke keeps the release from becoming GitHub's "Latest release".
  workflow_call:
    inputs:
      tag:
        description: "Release tag to smoke-test (e.g. v0.1.0)"
        required: true
        type: string
  # Manual re-run against any already-published release, for verification without
  # cutting a new release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to smoke-test (e.g. v0.1.0, or dev-develop-latest)"
        required: true
        type: string

permissions:
  contents: read


jobs:
  linux-arm64-install-smoke:
    name: Linux arm64 install + GUI smoke (.deb + .rpm)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    env:
      # webkit2gtk headless knobs, identical to release-linux-smoke.yml and
      # system-integration.yml: software rendering under Xvfb (Mesa llvmpipe,
      # needs libgl1-mesa-dri), no at-spi noise, and webkit/GLib diagnostics in
      # the smoke logs if a launch fails.
      WEBKIT_DISABLE_DMABUF_RENDERER: "1"
      WEBKIT_DISABLE_COMPOSITING_MODE: "1"
      NO_AT_BRIDGE: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: "llvmpipe"
      WEBKIT_DEBUG: "Process"
      G_MESSAGES_DEBUG: "all"

    steps:
      - name: Resolve release tag
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v*.*.*) ;;
            # A dev pre-release, for a manual dispatch (#4934); release.yml
            # always passes a version tag.
            dev-*) ;;
            *) echo "::error::not a version tag: '$TAG'"; exit 1 ;;
          esac
          echo "Resolved release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        # smoke-test.sh cd's to the git top-level, and the verify / lifecycle
        # scripts live in scripts/internal.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install headless runtime dependencies
        # Runtime WebKitGTK/GTK libs + Xvfb (as release-linux-smoke.yml), and
        # libarchive-tools for bsdtar, which reads the .rpm payload directly
        # (release.yml does the same; rpm2cpio exits 1 on Tauri's rpms).
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-0 \
            libgtk-3-0 \
            libayatana-appindicator3-1 \
            librsvg2-2 \
            libgl1-mesa-dri \
            dbus-x11 \
            python3-xlib \
            xvfb \
            libarchive-tools \
            file

      - name: Relax AppArmor unprivileged-userns restriction (#2646)
        # Same WebKitGTK 2.44+ sandbox fix as release-linux-smoke.yml: without an
        # unprivileged userns the web-content process never spawns and the GUI
        # smoke cannot pass. Guarded no-op on kernels without the knob.
        run: |
          set -euo pipefail
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "kernel.apparmor_restrict_unprivileged_userns absent; nothing to relax"
          fi

      - name: Download Linux arm64 release assets
        id: download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$PWD/dist"
          # release.yml uploads termiHub-<version>-linux-arm64.deb (the primary
          # arm64 artifact) and the .rpm side-asset (its "Stage .rpm" step).
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*linux-arm64.deb' \
            --pattern '*linux-arm64.rpm' \
            --dir "$PWD/dist"
          ls -la "$PWD/dist"
          DEB="$(find "$PWD/dist" -name '*linux-arm64.deb' | head -n1)"
          RPM="$(find "$PWD/dist" -name '*linux-arm64.rpm' | head -n1)"
          [ -n "$DEB" ] || { echo "::error::arm64 .deb asset not found for $TAG"; exit 1; }
          [ -n "$RPM" ] || { echo "::error::arm64 .rpm asset not found for $TAG"; exit 1; }
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"
          echo "rpm=$RPM" >> "$GITHUB_OUTPUT"

      - name: Install .deb
        id: deb
        env:
          DEB: ${{ steps.download.outputs.deb }}
        run: |
          set -euo pipefail
          # apt-get install of a local path resolves the package's dependencies,
          # equivalent to `dpkg -i` followed by `apt-get -f install`.
          sudo apt-get install -y "$DEB"
          # The Debian bundle installs the Cargo bin name `termihub`
          # (src-tauri/Cargo.toml [[bin]] name), matching release-linux-smoke.yml.
          BIN="$(command -v termihub || true)"
          [ -n "$BIN" ] || { echo "::error::termihub not on PATH after .deb install"; exit 1; }
          echo "Installed binary: $BIN"
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"

      - name: Extract .rpm payload
        id: rpm
        env:
          RPM: ${{ steps.download.outputs.rpm }}
        run: |
          set -euo pipefail
          dest="$PWD/rpm-extract"
          rm -rf "$dest"
          mkdir -p "$dest"
          bsdtar -xf "$RPM" -C "$dest"
          BIN="$dest/usr/bin/termihub"
          [ -x "$BIN" ] || { echo "::error::no executable usr/bin/termihub in the .rpm"; exit 1; }
          file "$BIN" | tee rpm-file.log
          grep -q 'ARM aarch64' rpm-file.log ||
            { echo "::error::the .rpm's termihub is not an aarch64 binary"; exit 1; }
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"

      # The plugin runner (#4202) and the RDP helper (#1762) ship next to
      # termihub in both packages. They must match the digests the app embeds
      # (the runner must also start), or the app would refuse them as tampered.
      - name: Verify the bundled sidecars (.deb + .rpm)
        env:
          DEB_BIN: ${{ steps.deb.outputs.bin }}
          RPM_BIN: ${{ steps.rpm.outputs.bin }}
        run: |
          set -euo pipefail
          for app in "$(readlink -f "$DEB_BIN")" "$RPM_BIN"; do
            scripts/internal/verify-plugin-runner-bundle.sh "$app"
            scripts/internal/verify-rdp-helper-bundle.sh "$app"
          done

      - name: Assert headless --version (.deb + .rpm)
        id: version
        env:
          BIN: ${{ steps.deb.outputs.bin }}
          RPM_BIN: ${{ steps.rpm.outputs.bin }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # #2655: --version prints and exits 0 with no GUI/window/display, so no
          # xvfb is needed. version_line() prints "termiHub <version>".
          echo "== termihub --version (headless, no xvfb) =="
          timeout 60 "$BIN" --version 2>&1 | tee arm64-version.log
          line="$(grep -E '^termiHub [0-9]+\.[0-9]+\.[0-9]+' arm64-version.log | head -n1 || true)"
          if [ -z "$line" ]; then
            echo "::error::termihub --version did not print an expected version line"
            exit 1
          fi
          echo "== .rpm termihub --version =="
          timeout 60 "$RPM_BIN" --version 2>&1 | tee arm64-rpm-version.log
          if ! grep -qxF "$line" arm64-rpm-version.log; then
            echo "::error::the .rpm's --version differs from the .deb's ('$line')"
            exit 1
          fi
          # The lifecycle smoke checks the banner against this version: the tag's
          # for a release, the binary's own for a dev pre-release.
          version="${line#termiHub }"
          version="${version%% *}"
          case "$TAG" in
            v*)
              if [ "$version" != "${TAG#v}" ]; then
                echo "::error::termihub reports $version, the tag is $TAG"
                exit 1
              fi
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "arm64 headless --version smoke passed ($version)"

      - name: GUI launch smoke, .deb (headless via Xvfb)
        id: smoke_deb
        # continue-on-error only so both GUI steps always run and report; the
        # "Enforce smoke results" step below fails the job on any non-success.
        continue-on-error: true
        env:
          BIN: ${{ steps.deb.outputs.bin }}
        run: |
          set -euo pipefail
          # dbus-run-session (#2646): a throwaway session bus makes the startup
          # xdg-desktop-portal call fail fast instead of blocking ~25s.
          xvfb-run -a dbus-run-session -- ./scripts/smoke-test.sh "$BIN" 2>&1 | tee deb-smoke.log

      - name: App log + single-instance smoke, .deb (headless)
        id: lifecycle_deb
        continue-on-error: true
        env:
          BIN: ${{ steps.deb.outputs.bin }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # One dbus-run-session for the whole script: the single-instance lock
          # lives on D-Bus. The log path is file_log.rs's Linux location.
          xvfb-run -a dbus-run-session -- ./scripts/internal/release-smoke-app-lifecycle.sh \
            --exe "$BIN" --log "$HOME/.local/share/com.termihub.app/logs/termihub.log" \
            --version "$VERSION" --close x11 --clear-log --out lifecycle-deb \
            2>&1 | tee deb-lifecycle.log

      - name: Enforce smoke results
        if: always()
        env:
          DEB_SMOKE: ${{ steps.smoke_deb.outcome }}
          DEB_LIFECYCLE: ${{ steps.lifecycle_deb.outcome }}
        run: |
          set -euo pipefail
          echo ".deb GUI smoke outcome:     $DEB_SMOKE"
          echo ".deb lifecycle outcome:     $DEB_LIFECYCLE"
          {
            echo "### Linux arm64 install-smoke"
            echo ""
            echo "- .deb GUI launch smoke: \`$DEB_SMOKE\`"
            echo "- .deb app log + single instance: \`$DEB_LIFECYCLE\`"
          } >> "$GITHUB_STEP_SUMMARY"
          for outcome in "$DEB_SMOKE" "$DEB_LIFECYCLE"; do
            if [ "$outcome" != "success" ]; then
              echo "::error::Linux arm64 install-smoke failed"
              exit 1
            fi
          done

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-arm64-install-smoke-logs
          path: |
            arm64-version.log
            arm64-rpm-version.log
            rpm-file.log
            deb-smoke.log
            deb-lifecycle.log
            lifecycle-deb/
          if-no-files-found: ignore
          retention-days: 14
