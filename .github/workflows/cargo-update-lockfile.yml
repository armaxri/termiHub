name: Cargo Update Lockfile

# Proactive lockfile-refresh chore (issue #2645).
#
# A yanked TRANSITIVE crate reds every open PR's `Security Audit` job
# (`cargo deny check advisories`, `yanked = "deny"` in deny.toml) with no code
# change on the PR itself. This happened three times in one session
# (chacha20 #2585, der #2636, libssh2-sys #2642) — each fixed by a one-line
# `cargo update -p <crate>` that someone had to notice, land first, then
# reconcile against every other open PR.
#
# This job runs `cargo update` daily (and on demand) to pull compatible
# patch/minor bumps — including off-yanked replacements and freshly-published
# advisory fixes (e.g. ringbuf 0.5.2 for RUSTSEC-2026-0293) — into Cargo.lock
# *proactively*, opening a single PR against develop so the bump lands once
# instead of during a multi-PR scramble. It only opens a PR when the lockfile
# actually changed, and best-effort enables auto-merge on that PR so it lands
# hands-off once CI is green (needs repo auto-merge enabled — see below). The
# fast manual fix path for anything that still slips through is documented in
# docs/ci-yanked-crate-runbook.md.
#
# Gate before merge (#3755, CI-012): the refreshed lockfile is run through the
# same cargo-deny gate Security Audit uses (advisories incl. yanked, bans,
# licenses, sources). If it FAILS, the PR is still opened/updated so the change
# and its failure are visible in one place, but as a DRAFT with the cargo-deny
# output in its body, with auto-merge off — and the job itself then fails, so
# the scheduled run goes red instead of silently proposing a lockfile that reds
# the gate. When a later run passes, the PR is marked ready again.
#
# Daily (not weekly) because an advisory or yank is published upstream at an
# arbitrary time: a weekly cadence left every open PR's Security Audit red for
# up to a week before the refresh landed. Daily shrinks that window to ~a day.

on:
  schedule:
    # Daily, 04:00 UTC — before the weekday PR traffic so a fresh lockfile is
    # usually already merged when contributors branch, and so an advisory
    # published mid-week is proposed within ~a day rather than up to a week.
    - cron: '0 4 * * *'
  workflow_dispatch:

# Cancel a superseded manual run; a scheduled run and a manual run should not
# race to push the same automation branch.
concurrency:
  group: cargo-update-lockfile
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  cargo-update:
    name: Update Cargo.lock
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Fixed automation branch: reused every run so repeated runs update the
      # same PR instead of opening a new one each day.
      UPDATE_BRANCH: chore/cargo-update-lockfile

    steps:
      - name: Checkout develop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: develop

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      # Prebuilt binary download (~seconds) instead of compiling from source,
      # matching the Security Audit job. Used for the pre-PR gate below, so the
      # opened PR never silently reds the very gate this chore exists to keep
      # green.
      - name: Install cargo-deny
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: cargo-deny

      # Compatible (SemVer-respecting) updates only: `cargo update` never bumps
      # past a Cargo.toml constraint, so this is a lockfile-only refresh, not a
      # dependency-version change. That is exactly what clears a yanked patch.
      - name: Run cargo update
        run: cargo update

      - name: Detect lockfile changes
        id: diff
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Cargo.lock is already up to date — nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Cargo.lock updated"
              echo ''
              echo '```'
              git diff --stat -- Cargo.lock
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Pre-PR gate: the refreshed lockfile must pass the same cargo-deny check
      # Security Audit runs. No continue-on-error — the outcome is captured as an
      # output instead, so the next step can open the PR as a draft carrying the
      # failure, and the final step fails the job (#3755, CI-012).
      - name: Check refreshed lockfile against the cargo-deny gate
        id: gate
        if: steps.diff.outputs.changed == 'true'
        run: |
          set +e
          cargo deny --color never check advisories bans licenses sources \
            > "$RUNNER_TEMP/cargo-deny.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/cargo-deny.log"
          if [ "$rc" -eq 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "::error::The refreshed Cargo.lock fails cargo deny (exit $rc); PR opened as draft."
          fi

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GATE_PASSED: ${{ steps.gate.outputs.passed }}
          GATE_LOG: ${{ runner.temp }}/cargo-deny.log
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Recreate the automation branch from the freshly-updated tree. Force
          # applies ONLY to this bot-owned branch; it never touches a human
          # branch, develop, or main.
          git checkout -B "$UPDATE_BRANCH"
          git add Cargo.lock
          git commit -m "chore(deps): update cargo lockfile"
          git push --force origin "$UPDATE_BRANCH"

          # commitlint-safe body: conventional lowercase subject above, body
          # lines wrapped to <=100 chars. Deliberately no "Closes #" keyword —
          # this recurring chore closes nothing.
          BODY=$(cat <<'EOF'
          Automated lockfile refresh from the daily `cargo update` chore
          (see `.github/workflows/cargo-update-lockfile.yml`, issue #2645).

          Pulls compatible patch/minor bumps into `Cargo.lock` proactively so a
          yanked transitive crate — or a freshly-published RUSTSEC advisory fix
          — does not red every open PR's Security Audit before anyone notices.
          Compatible updates only — no `Cargo.toml` constraint is changed.

          This PR best-effort enables auto-merge, so it lands on its own once
          CI is green **if the repo has auto-merge enabled**
          (Settings -> General -> "Allow auto-merge"). If auto-merge is off the
          enable step no-ops and this PR waits for a human — the `automation`
          label flags it for pickup. Maintainer: enabling repo auto-merge makes
          this fully hands-off.

          If CI did not start automatically, close and reopen this PR (PRs
          opened by `GITHUB_TOKEN` do not trigger other workflows). See
          `docs/ci-yanked-crate-runbook.md` for the manual fix path when
          something slips through between runs.
          EOF
          )

          # Gate failed: say so at the top of the body, with the cargo-deny
          # output, so a reviewer sees why the PR is a draft without opening the
          # run. cargo-deny prints errors first and its verdict last; keep the
          # first 100 lines plus the verdict (the PR body limit is 65k chars).
          if [ "$GATE_PASSED" != "true" ]; then
            BODY="$(
              printf '%s\n' '> [!WARNING]'
              printf '%s\n' '> **This lockfile fails the cargo-deny gate** (yanked crate, advisory,'
              printf '%s\n\n' '> ban, license or source), so this PR is a draft with auto-merge off.'
              printf '%s\n\n' 'Run: '"$RUN_URL"
              printf '%s\n' '<details><summary>cargo deny output</summary>'
              printf '\n%s\n' '```'
              if [ -s "$GATE_LOG" ]; then
                head -n 100 "$GATE_LOG"
                if [ "$(wc -l < "$GATE_LOG")" -gt 100 ]; then
                  printf '%s\n' '[... truncated; full output in the run ...]'
                  tail -n 1 "$GATE_LOG"
                fi
              else
                echo "(no cargo-deny log captured)"
              fi
              printf '%s\n\n%s\n\n' '```' '</details>'
              printf '%s\n' "$BODY"
            )"
          fi

          if gh pr view "$UPDATE_BRANCH" --json state --jq '.state' 2>/dev/null | grep -q OPEN; then
            echo "PR already open for $UPDATE_BRANCH; branch updated in place."
            gh pr edit "$UPDATE_BRANCH" --body "$BODY"
            if [ "$GATE_PASSED" = "true" ]; then
              gh pr ready "$UPDATE_BRANCH" 2>/dev/null || true
            else
              gh pr ready "$UPDATE_BRANCH" --undo 2>/dev/null || true
            fi
          else
            DRAFT_FLAG=()
            if [ "$GATE_PASSED" != "true" ]; then DRAFT_FLAG=(--draft); fi
            gh pr create \
              --base develop \
              --head "$UPDATE_BRANCH" \
              --title "chore(deps): update cargo lockfile" \
              --label automation \
              ${DRAFT_FLAG[@]+"${DRAFT_FLAG[@]}"} \
              --body "$BODY"
          fi

          # Never queue a gate-failing lockfile for auto-merge; drop any auto-merge
          # a previous passing run enabled.
          if [ "$GATE_PASSED" != "true" ]; then
            gh pr merge "$UPDATE_BRANCH" --disable-auto 2>/dev/null || true
            echo "Draft PR: the refreshed lockfile fails cargo deny; auto-merge left off." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Best-effort hands-off merge: enable auto-merge so the PR lands by
          # itself once CI passes. This is a no-op unless the repo has auto-merge
          # enabled (Settings -> General -> "Allow auto-merge"); if it is off,
          # the command fails and we swallow it so the chore still succeeds — the
          # `automation` label leaves the PR for a human to merge. Merge commit
          # only, per the repo git workflow (never squash/rebase).
          if gh pr merge "$UPDATE_BRANCH" --auto --merge; then
            echo "Auto-merge enabled for $UPDATE_BRANCH; it will merge once CI is green." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::Could not enable auto-merge (repo auto-merge likely disabled)." \
              "PR left for manual merge — see the 'automation' label."
            echo "Auto-merge not enabled — repo auto-merge is likely off." \
              "The PR is labelled \`automation\` and waits for a human merge." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      # Visible failure: the PR above is a draft, but the run must go red too so
      # the failed scheduled run is noticed (#3755, CI-012).
      - name: Fail when the refreshed lockfile fails the gate
        if: steps.diff.outputs.changed == 'true' && steps.gate.outputs.passed != 'true'
        run: |
          echo "::error::The refreshed Cargo.lock fails cargo deny; see the draft PR and the gate step."
          echo "Fix path: docs/ci-yanked-crate-runbook.md"
          exit 1
