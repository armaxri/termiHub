name: Cargo Update Lockfile

# Proactive lockfile-refresh chore (issue #2645).
#
# A yanked TRANSITIVE crate reds every open PR's `Security Audit` job
# (`cargo deny check advisories`, `yanked = "deny"` in deny.toml) with no code
# change on the PR itself. This happened three times in one session
# (chacha20 #2585, der #2636, libssh2-sys #2642) — each fixed by a one-line
# `cargo update -p <crate>` that someone had to notice, land first, then
# reconcile against every other open PR.
#
# This job runs `cargo update` weekly (and on demand) to pull compatible
# patch/minor bumps — including off-yanked replacements — into Cargo.lock
# *proactively*, opening a single PR against develop so the bump lands once
# instead of during a multi-PR scramble. It only opens a PR when the lockfile
# actually changed. The fast manual fix path for a yank that still slips
# through is documented in docs/ci-yanked-crate-runbook.md.

on:
  schedule:
    # Weekly, Monday 04:00 UTC — before the weekday PR traffic so a fresh
    # lockfile is usually already merged when contributors branch.
    - cron: '0 4 * * 1'
  workflow_dispatch:

# Cancel a superseded manual run; a scheduled run and a manual run should not
# race to push the same automation branch.
concurrency:
  group: cargo-update-lockfile
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  cargo-update:
    name: Update Cargo.lock
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Fixed automation branch: reused every run so repeated runs update the
      # same PR instead of opening a new one each week.
      UPDATE_BRANCH: chore/cargo-update-lockfile

    steps:
      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          ref: develop

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Prebuilt binary download (~seconds) instead of compiling from source,
      # matching the Security Audit job. Used only for the advisory sanity
      # check below, so the opened PR is unlikely to red the very gate this
      # chore exists to keep green.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # Compatible (SemVer-respecting) updates only: `cargo update` never bumps
      # past a Cargo.toml constraint, so this is a lockfile-only refresh, not a
      # dependency-version change. That is exactly what clears a yanked patch.
      - name: Run cargo update
        run: cargo update

      - name: Detect lockfile changes
        id: diff
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Cargo.lock is already up to date — nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Cargo.lock updated"
              echo ''
              echo '```'
              git diff --stat -- Cargo.lock
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Non-blocking sanity check: confirm the refreshed lockfile still passes
      # the yanked/advisory gate. Advisory only — a failure here is surfaced in
      # the log/summary but never blocks opening the PR (the lockfile change is
      # still worth landing, and per-PR CI is the authoritative gate).
      - name: Sanity-check advisories (non-blocking)
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        run: cargo deny check advisories

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Recreate the automation branch from the freshly-updated tree. Force
          # applies ONLY to this bot-owned branch; it never touches a human
          # branch, develop, or main.
          git checkout -B "$UPDATE_BRANCH"
          git add Cargo.lock
          git commit -m "chore(deps): update cargo lockfile"
          git push --force origin "$UPDATE_BRANCH"

          # commitlint-safe body: conventional lowercase subject above, body
          # lines wrapped to <=100 chars. Deliberately no "Closes #" keyword —
          # this recurring chore closes nothing.
          BODY=$(cat <<'EOF'
          Automated lockfile refresh from the weekly `cargo update` chore
          (see `.github/workflows/cargo-update-lockfile.yml`, issue #2645).

          Pulls compatible patch/minor bumps into `Cargo.lock` proactively so a
          yanked transitive crate does not red every open PR's Security Audit
          before anyone notices. Compatible updates only — no `Cargo.toml`
          constraint is changed.

          Review the diff, let CI run, and merge if green. If CI did not start
          automatically, close and reopen this PR (PRs opened by `GITHUB_TOKEN`
          do not trigger other workflows). See
          `docs/ci-yanked-crate-runbook.md` for the manual fix path when a yank
          slips through between runs.
          EOF
          )

          if gh pr view "$UPDATE_BRANCH" --json state --jq '.state' 2>/dev/null | grep -q OPEN; then
            echo "PR already open for $UPDATE_BRANCH; branch updated in place."
          else
            gh pr create \
              --base develop \
              --head "$UPDATE_BRANCH" \
              --title "chore(deps): update cargo lockfile" \
              --body "$BODY"
          fi
