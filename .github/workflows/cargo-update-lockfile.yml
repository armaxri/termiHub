name: Cargo Update Lockfile

# Proactive lockfile-refresh chore (issue #2645).
#
# A yanked TRANSITIVE crate reds every open PR's `Security Audit` job
# (`cargo deny check advisories`, `yanked = "deny"` in deny.toml) with no code
# change on the PR itself. This happened three times in one session
# (chacha20 #2585, der #2636, libssh2-sys #2642) — each fixed by a one-line
# `cargo update -p <crate>` that someone had to notice, land first, then
# reconcile against every other open PR.
#
# This job runs `cargo update` daily (and on demand) to pull compatible
# patch/minor bumps — including off-yanked replacements and freshly-published
# advisory fixes (e.g. ringbuf 0.5.2 for RUSTSEC-2026-0293) — into Cargo.lock
# *proactively*, opening a single PR against develop so the bump lands once
# instead of during a multi-PR scramble. It only opens a PR when the lockfile
# actually changed. It NEVER merges that PR (maintainer decision 2026-10-24,
# #4912: no automatic merging of dependency updates): it assigns the PR to the
# maintainer, requests their review, and a human decides and merges. The fast
# manual fix path for anything that still slips through is documented in
# docs/ci-yanked-crate-runbook.md.
#
# Two lockfiles (#4357, SUP2-004): the workspace Cargo.lock AND
# rdp-sidecar/Cargo.lock. The RDP sidecar is workspace-excluded with its own
# lockfile and ships in every release, so it gets the same refresh in the same
# PR, and the same gate: its own `cargo check --locked` and its own cargo-deny
# run (rdp-sidecar/deny.toml). Each `cargo check` runs only when its lockfile
# changed; the tripwire reads both lockfiles; both cargo-deny runs always run.
#
# Gate before review (#3755 CI-012, #4465): the refreshed lockfile must pass, in
# the cargo-update job, before the PR is opened ready for review:
#   1. `cargo check --workspace --all-targets --all-features --locked` — it
#      compiles. #4460 moved primefield 0.14.0-rc.9 -> 0.14.0, which the -rc
#      p256/p384/p521 stack does not build against, and merged a lockfile that
#      broke every Rust build of develop (#4465);
#   2. the pre-release tripwire (scripts/internal/check-prerelease-crates.mjs
#      against .github/prerelease-allowlist.json) — the same per-PR check Code
#      Quality runs, which #4460 also failed (aead/argon2/blake2 left their -rc);
#   3. the cargo-deny gate Security Audit uses (advisories incl. yanked, bans,
#      licenses, sources).
# If any check FAILS, the PR is still opened/updated so the change and its
# failure are visible in one place, but as a DRAFT with the failing output in
# its body — and the run then fails, so the scheduled run goes red instead of
# silently proposing a broken lockfile. When a later run passes, the PR is
# marked ready again.
#
# Per-PR CI (#4912): the PR is pushed with GITHUB_TOKEN, and a push or PR made
# with GITHUB_TOKEN triggers no pull_request/push workflows. A workflow_dispatch
# made with GITHUB_TOKEN does run, so after a passing gate the open-pr job
# dispatches Code Quality, Build and Security Audit on the chore branch. Their
# check runs (incl. the required `PR Gate`) attach to the PR's head commit, so
# the maintainer sees full CI before deciding.
#
# The gate compiles freshly-bumped, unreviewed crates (build scripts and proc
# macros run), so it runs in its own job with a read-only GITHUB_TOKEN, no
# persisted checkout credentials and no secret at all. Only the open-pr job, on a
# fresh runner that compiles nothing, holds a write token: it takes the refreshed
# lockfiles and the gate verdict from the cargo-update job, pushes the branch,
# opens the PR and dispatches its CI.
#
# Daily (not weekly) because an advisory or yank is published upstream at an
# arbitrary time: a weekly cadence left every open PR's Security Audit red for
# up to a week before the refresh landed. Daily shrinks that window to ~a day.

on:
  # No schedule of its own (#4847). scheduled-dispatch.yml dispatches it on
  # develop daily at 04:00 UTC — before the weekday PR traffic so a fresh
  # lockfile is usually already merged when contributors branch, and so an
  # advisory published mid-week is proposed within ~a day rather than up to a
  # week. A cron here would fire from main and run MAIN's copy of this YAML
  # (its gate lags develop's between releases); the PR it opens targets develop,
  # so there is no main cadence to keep. Registry:
  # scripts/internal/scheduled-lanes.mjs.
  workflow_dispatch:
  # A change to this chore runs it once on develop. That first run also
  # registers the workflow with GitHub, which a dispatch needs (#4277): a
  # schedule/dispatch-only file that is not on main is unknown to the API.
  push:
    branches: [develop]
    paths:
      - '.github/workflows/cargo-update-lockfile.yml'

# Cancel a superseded run; the nightly dispatch and a manual run should not
# race to push the same automation branch.
concurrency:
  group: cargo-update-lockfile
  cancel-in-progress: true

# Read-only by default; only the open-pr job is granted write (#4465).
permissions:
  contents: read

jobs:
  cargo-update:
    name: Update Cargo.lock
    runs-on: ubuntu-latest

    # Handed to open-pr, which compiles nothing and holds the write token.
    outputs:
      base-sha: ${{ steps.base.outputs.sha }}
      changed: ${{ steps.diff.outputs.changed }}
      passed: ${{ steps.gate.outputs.passed }}
      failed: ${{ steps.gate.outputs.failed }}

    steps:
      - name: Checkout develop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: develop
          # The gate below runs build scripts of unreviewed crate versions; keep
          # even this read-only token out of .git/config (#4465).
          persist-credentials: false

      # open-pr recreates the automation branch from this exact develop commit,
      # so the lockfiles it commits are the ones gated here even if develop
      # moves between the two jobs.
      - name: Record the develop commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      # Prebuilt binary download (~seconds) instead of compiling from source,
      # matching the Security Audit job. Used for the pre-PR gate below, so the
      # opened PR never silently reds the very gate this chore exists to keep
      # green.
      - name: Install cargo-deny
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: cargo-deny@0.20.2

      # Compatible (SemVer-respecting) updates only: `cargo update` never bumps
      # past a Cargo.toml constraint, so this is a lockfile-only refresh, not a
      # dependency-version change. That is exactly what clears a yanked patch.
      # The rdp-sidecar lockfile is refreshed the same way (#4357).
      - name: Run cargo update
        run: |
          cargo update
          cargo update --manifest-path rdp-sidecar/Cargo.toml

      - name: Detect lockfile changes
        id: diff
        run: |
          root=false
          sidecar=false
          git diff --quiet -- Cargo.lock || root=true
          git diff --quiet -- rdp-sidecar/Cargo.lock || sidecar=true
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "sidecar=$sidecar" >> "$GITHUB_OUTPUT"
          if [ "$root" = false ] && [ "$sidecar" = false ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Cargo.lock and rdp-sidecar/Cargo.lock are already up to date — nothing to do." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Lockfiles updated"
              echo ''
              echo '```'
              git diff --stat -- Cargo.lock rdp-sidecar/Cargo.lock
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # `cargo check` below builds src-tauri, which links the Linux webview stack
      # (same packages as Code Quality's Rust job), and the rdp-sidecar, which
      # links libasound2 (same as Code Quality's RDP Sidecar Quality job).
      - name: Install system dependencies
        if: steps.diff.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev

      # Restore develop's cache (read-only) so the gate's `cargo check` starts
      # warm; this chore never writes the shared cache.
      - name: Cache Rust dependencies
        if: steps.diff.outputs.changed == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The sidecar has its own lockfile/target (as in RDP Sidecar Quality).
          workspaces: |
            .
            rdp-sidecar
          save-if: false

      # Pre-PR gate (#3755 CI-012, #4465): the refreshed lockfile must compile,
      # pass the pre-release tripwire and pass cargo-deny. Every check runs even
      # after an earlier one fails, so one run reports everything that is wrong.
      # No continue-on-error — the outcome is captured as an output instead, so
      # the next step can open the PR as a draft carrying the failures, and the
      # final step fails the job.
      - name: Gate the refreshed lockfile (cargo check, pre-release tripwire, cargo-deny)
        id: gate
        if: steps.diff.outputs.changed == 'true'
        env:
          ROOT_CHANGED: ${{ steps.diff.outputs.root }}
          SIDECAR_CHANGED: ${{ steps.diff.outputs.sidecar }}
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/lockfile-gate.log"
          : > "$log"
          failed=()

          # Run one check; on failure append its output to the gate log. Cargo's
          # progress lines are dropped so the PR body shows the actual errors.
          gate() {
            local label="$1"
            shift
            local part="$RUNNER_TEMP/lockfile-gate-part.log"
            echo "::group::$label"
            "$@" > "$part" 2>&1
            local rc=$?
            cat "$part"
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              failed+=("$label")
              echo "::error::Lockfile gate: $label failed (exit $rc); PR opened as draft."
              {
                echo "=== $label: FAILED (exit $rc) ==="
                grep -Ev '^ *(Compiling|Checking|Downloaded|Downloading|Updating|Locking|Fresh|Blocking) ' \
                  "$part" | head -n 80
                echo
              } >> "$log"
            fi
          }

          if [ "$ROOT_CHANGED" = "true" ]; then
            gate "cargo check" cargo check --workspace --all-targets --all-features --locked
          fi
          if [ "$SIDECAR_CHANGED" = "true" ]; then
            gate "rdp-sidecar cargo check" \
              cargo check --manifest-path rdp-sidecar/Cargo.toml --all-targets --locked
          fi
          # Reads both Cargo.lock and rdp-sidecar/Cargo.lock.
          gate "pre-release tripwire" node scripts/internal/check-prerelease-crates.mjs
          gate "cargo deny" cargo deny --color never check advisories bans licenses sources
          # Run from rdp-sidecar/ so its own deny.toml applies (#4357).
          gate "rdp-sidecar cargo deny" \
            bash -c 'cd rdp-sidecar && cargo deny --color never check advisories bans licenses sources'

          if [ "${#failed[@]}" -eq 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
            echo "Lockfile gate passed: cargo check, pre-release tripwire, cargo deny." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "failed=${failed[*]}" >> "$GITHUB_OUTPUT"
            echo "Lockfile gate FAILED: ${failed[*]}." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Hand the refreshed lockfiles and the gate log to open-pr. Plain files
      # only: open-pr reads them, it never builds or runs anything from them.
      - name: Stash the refreshed lockfiles for the PR job
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/lockfile-pr"
          mkdir -p "$out"
          cp Cargo.lock "$out/Cargo.lock"
          cp rdp-sidecar/Cargo.lock "$out/rdp-sidecar.Cargo.lock"
          cp "$RUNNER_TEMP/lockfile-gate.log" "$out/lockfile-gate.log"

      - name: Upload the refreshed lockfiles
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lockfile-pr
          path: ${{ runner.temp }}/lockfile-pr
          retention-days: 3
          if-no-files-found: error

  # The only job that holds a write token (#4465). It runs on a fresh runner,
  # checks out develop without persisted credentials, compiles nothing and
  # installs no packages, so no unreviewed crate's code runs next to it.
  open-pr:
    name: Open or update the lockfile PR
    needs: cargo-update
    if: needs.cargo-update.outputs.changed == 'true'
    runs-on: ubuntu-latest

    # GITHUB_TOKEN only (#4912): push the branch, open/edit the PR and assign it
    # (pull-requests also covers PR assignees and review requests), and dispatch
    # the per-PR CI on the chore branch (actions).
    permissions:
      contents: write
      pull-requests: write
      actions: write

    env:
      # Fixed automation branch: reused every run so repeated runs update the
      # same PR instead of opening a new one each day.
      UPDATE_BRANCH: chore/cargo-update-lockfile
      # Who decides on the PR (#4912): assigned and asked for review each run.
      MAINTAINER: armaxri

    steps:
      - name: Checkout the gated develop commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.cargo-update.outputs.base-sha }}
          # The PR step pushes with an explicit, step-scoped credential instead.
          persist-credentials: false

      - name: Download the refreshed lockfiles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lockfile-pr
          path: ${{ runner.temp }}/lockfile-pr

      - name: Apply the refreshed lockfiles
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/lockfile-pr/Cargo.lock" Cargo.lock
          cp "$RUNNER_TEMP/lockfile-pr/rdp-sidecar.Cargo.lock" rdp-sidecar/Cargo.lock

      - name: Open or update pull request
        env:
          # Step-scoped write token (#4465).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_PASSED: ${{ needs.cargo-update.outputs.passed }}
          GATE_FAILED: ${{ needs.cargo-update.outputs.failed }}
          GATE_LOG: ${{ runner.temp }}/lockfile-pr/lockfile-gate.log
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Recreate the automation branch from the gated develop commit plus
          # the refreshed lockfiles. Force applies ONLY to this bot-owned
          # branch; it never touches a human branch, develop, or main.
          git checkout -B "$UPDATE_BRANCH"
          git add Cargo.lock rdp-sidecar/Cargo.lock
          git commit -m "chore(deps): update cargo lockfile"
          # Checkout did not persist credentials (see above); authenticate this
          # one push the way actions/checkout does, without writing .git/config.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --force origin "$UPDATE_BRANCH"

          # commitlint-safe body: conventional lowercase subject above, body
          # lines wrapped to <=100 chars. Deliberately no "Closes #" keyword —
          # this recurring chore closes nothing.
          BODY=$(cat <<'EOF'
          > [!IMPORTANT]
          > **Waiting for a maintainer decision.** This PR is never merged automatically
          > (no auto-merge of dependency updates, #4912). Review the lockfile diff and
          > the CI checks, then merge it (merge commit) or close it.

          Automated lockfile refresh from the daily `cargo update` chore
          (see `.github/workflows/cargo-update-lockfile.yml`, issue #2645).
          Covers both `Cargo.lock` and `rdp-sidecar/Cargo.lock` (#4357).

          Pulls compatible patch/minor bumps into the lockfiles proactively so a
          yanked transitive crate — or a freshly-published RUSTSEC advisory fix
          — does not red every open PR's Security Audit before anyone notices.
          Compatible updates only — no `Cargo.toml` constraint is changed.

          Before this PR was marked ready, the chore job itself ran the lockfile
          gate on it: `cargo check --workspace --all-targets --all-features --locked`
          (and `cargo check --locked` for rdp-sidecar), the pre-release tripwire and
          `cargo deny` for both lockfiles (#4465, #4357).

          CI: this PR is pushed with `GITHUB_TOKEN`, which starts no pull_request
          workflows, so the chore dispatches Code Quality, Build and Security Audit
          on this branch itself; their checks (incl. `PR Gate`) show on this PR.
          If they are missing, re-run the chore or close and reopen this PR.

          See `docs/ci-yanked-crate-runbook.md` for the manual fix path when
          something slips through between runs.
          EOF
          )

          # Gate failed: say so at the top of the body, with each failing check's
          # output, so a reviewer sees why the PR is a draft without opening the
          # run. Keep the first 250 lines (the PR body limit is 65k chars).
          if [ "$GATE_PASSED" != "true" ]; then
            BODY="$(
              printf '%s\n' '> [!WARNING]'
              printf '%s\n' "> **This lockfile fails the lockfile gate (${GATE_FAILED:-unknown})**,"
              printf '%s\n\n' '> so this PR is a draft. Do not merge it as is.'
              printf '%s\n\n' 'Run: '"$RUN_URL"
              printf '%s\n' '<details><summary>Failing gate output</summary>'
              printf '\n%s\n' '```'
              if [ -s "$GATE_LOG" ]; then
                head -n 250 "$GATE_LOG"
                if [ "$(wc -l < "$GATE_LOG")" -gt 250 ]; then
                  printf '%s\n' '[... truncated; full output in the run ...]'
                fi
              else
                echo "(no gate log captured)"
              fi
              printf '%s\n\n%s\n\n' '```' '</details>'
              printf '%s\n' "$BODY"
            )"
          fi

          if gh pr view "$UPDATE_BRANCH" --json state --jq '.state' 2>/dev/null | grep -q OPEN; then
            echo "PR already open for $UPDATE_BRANCH; branch updated in place."
            gh pr edit "$UPDATE_BRANCH" --body "$BODY"
            if [ "$GATE_PASSED" = "true" ]; then
              gh pr ready "$UPDATE_BRANCH" 2>/dev/null || true
            else
              gh pr ready "$UPDATE_BRANCH" --undo 2>/dev/null || true
            fi
          else
            DRAFT_FLAG=()
            if [ "$GATE_PASSED" != "true" ]; then DRAFT_FLAG=(--draft); fi
            gh pr create \
              --base develop \
              --head "$UPDATE_BRANCH" \
              --title "chore(deps): update cargo lockfile" \
              --label automation \
              ${DRAFT_FLAG[@]+"${DRAFT_FLAG[@]}"} \
              --body "$BODY"
          fi

          # An earlier version of this chore armed auto-merge; drop any that is
          # still set so nothing merges without the maintainer (#4912).
          gh pr merge "$UPDATE_BRANCH" --disable-auto 2>/dev/null || true

          # Notify the maintainer (#4912). Best-effort, so a notification hiccup
          # never hides the PR itself: assignment and the review request are
          # separate calls, and either failing only warns.
          gh pr edit "$UPDATE_BRANCH" --add-assignee "$MAINTAINER" ||
            echo "::warning::Could not assign the lockfile PR to $MAINTAINER."
          gh pr edit "$UPDATE_BRANCH" --add-reviewer "$MAINTAINER" ||
            echo "::warning::Could not request review from $MAINTAINER."
          echo "Lockfile PR waits for a maintainer decision (assigned to $MAINTAINER)." \
            >> "$GITHUB_STEP_SUMMARY"

      # Per-PR CI on the chore branch (#4912). The push above used GITHUB_TOKEN,
      # which triggers no pull_request workflow; a GITHUB_TOKEN workflow_dispatch
      # does. Each dispatched run checks out the chore branch and reports its
      # check runs on the PR's head commit. Skipped on a failing gate: that PR is
      # a draft that must not be merged as is.
      - name: Dispatch per-PR CI on the lockfile branch
        if: needs.cargo-update.outputs.passed == 'true'
        env:
          # Step-scoped token (#4465); `actions: write` is what dispatch needs.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          failed=0
          for wf in code-quality.yml build.yml security-audit.yml; do
            if gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" --ref "$UPDATE_BRANCH"; then
              echo "Dispatched $wf on $UPDATE_BRANCH." >> "$GITHUB_STEP_SUMMARY"
            else
              failed=1
              echo "::warning::Could not dispatch $wf on $UPDATE_BRANCH."
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Some CI was not dispatched; close and reopen the PR to run it." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      # Visible failure: the PR above is a draft, but the run must go red too so
      # the failed nightly run is noticed (#3755, CI-012). The gate job records
      # its verdict instead of failing, so this job still opens the draft PR.
      - name: Fail when the refreshed lockfile fails the gate
        if: needs.cargo-update.outputs.passed != 'true'
        env:
          GATE_FAILED: ${{ needs.cargo-update.outputs.failed }}
        run: |
          echo "::error::The refreshed lockfile(s) fail the lockfile gate ($GATE_FAILED);" \
            "see the draft PR and the gate step."
          echo "Fix path: docs/ci-yanked-crate-runbook.md"
          exit 1
