name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v0.1.0, v1.2.3, etc.
  # Dry run (#4746): `gh workflow run release.yml --ref <branch> -f dry_run=true`
  # builds every release artifact under the stand-in version 0.0.0-dryrun and
  # checks the full asset set (check-release-assets), with read-only tokens
  # only. A dispatched run is ALWAYS a dry run: create-release is gated on the
  # tag push, and every write-scoped job needs create-release, so none of them
  # can start. verify-integration's gate and coverage-summary are skipped too
  # (no release commit to grade). workflow-token-hygiene.test.mjs pins this.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build and check every release artifact, publish nothing (a dispatch is always a dry run)'
        type: boolean
        required: true
        default: true

# Read-only by default (CI2-007, #4730). Only the jobs that publish write: they
# check nothing out (or only run first-party scripts) and install nothing. The
# build jobs that install dependencies and compile (third-party code: lifecycle
# scripts, every crate's build.rs, tauri-action) hold contents: read and hand
# their outputs to a write-scoped upload-* job as workflow artifacts.
# workflow-token-hygiene.test.mjs pins this.
permissions:
  contents: read

jobs:
  # Release gate (PKG-007): fail BEFORE anything is created, built or published
  # when the tag disagrees with the in-repo version sources (package.json,
  # tauri.conf.json, src-tauri/core/agent Cargo.toml) or the Tauri npm packages
  # have drifted from their Rust crates. Without it, tagging v0.2.0 on a tree
  # that still says 0.1.0 would publish termiHub-0.2.0-* assets whose bundle
  # reports 0.1.0 (and breaks update-available detection). Reuses
  # release-check.sh --versions-only so the manual and automatic checks agree.
  # Every other job depends on create-release, which depends on this job; every
  # build job (app bundles, agent binaries, notices, SBOM) also lists it directly
  # in its needs (CI-009, #3901) so the gate survives a refactor of that chain.
  verify-version:
    name: Verify Version
    runs-on: ubuntu-latest

    steps:
      # A dispatched run can never publish (#4746); refuse a dispatch that asks
      # for anything else rather than silently running a dry run.
      - name: Refuse a non-dry-run dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true
        run: |
          echo "::error::A dispatched Release run is dry-run only. Push a v*.*.* tag to release."
          exit 1

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'pnpm'

      # The Tauri npm/crate drift check reads the INSTALLED @tauri-apps/*
      # versions from node_modules; without an install it skips every pair.
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check tag and version sources agree
        if: github.event_name == 'push'
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          scripts/release-check.sh --versions-only --expect-version "${TAG_NAME#v}"

      # Dry run: no tag, so check only that the version sources agree.
      - name: Check version sources agree (dry run)
        if: github.event_name != 'push'
        run: scripts/release-check.sh --versions-only

      # The Windows leg builds an MSI, whose version must be numeric
      # (major.minor.patch.revision); Tauri's WiX bundler rejects a semver
      # prerelease such as 0.2.0-beta.1 (PKG2-003, #4283). build-app maps
      # the tag with msi-version.mjs; fail HERE, before create-release, when the
      # tag has a shape that mapping cannot represent (only -beta.N / -rc.N
      # prereleases, WiX field limits).
      - name: Check the tag maps to a Windows MSI version
        if: github.event_name == 'push'
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/internal/msi-version.mjs --check "${TAG_NAME#v}"

      # Dry run: build-app maps the in-repo version instead (see its wix step).
      - name: Check the in-repo version maps to a Windows MSI version (dry run)
        if: github.event_name != 'push'
        run: node scripts/internal/msi-version.mjs --check "$(node -p "require('./package.json').version")"

      # Strict production audit (WA-CI-008): the Security Audit lane soft-passes an
      # unreachable npm registry, which is fine for develop but must never let an
      # UNAUDITED tree ship. AUDIT_STRICT=1 turns "registry unreachable" into a
      # failure here (re-run the job once the registry is back).
      - name: pnpm audit (production deps, strict)
        env:
          AUDIT_STRICT: '1'
        run: ./scripts/internal/pnpm-audit-prod-gate.sh

  # Release gate (#4282, CI2-003, SUP2-001, WA-CI2-002): the Rust supply-chain
  # audit must pass on the EXACT commit being released, graded against the
  # advisory database AS OF TAG TIME. Per the slim lane (#3325) Security Audit
  # runs per-PR only on manifest changes and post-merge (cancel-in-progress on
  # develop), so without this a tag could ship a lockfile that was never audited,
  # or one that a RUSTSEC advisory / yank published after the merge now flags.
  # Running the checks here, not reading an old run, makes a fresh advisory block
  # the release too. Same commands as security-audit.yml (root workspace) and
  # code-quality.yml's RDP Sidecar Quality job (the sidecar's own lockfile).
  # create-release and every build job list this job directly in their needs.
  verify-supply-chain:
    name: Verify Rust Supply Chain
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      # Both lockfiles must already be fresh: the release builds below pass
      # --locked, so fail here, before anything is created, instead of mid-build.
      - name: Check the lockfiles are up to date
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > /dev/null
          cargo metadata --locked --format-version 1 --manifest-path rdp-sidecar/Cargo.toml > /dev/null

      # Pinned tool versions (prebuilt, SHA-pinned installer), like cargo-about
      # and cargo-cyclonedx below, so the release gate never runs whatever
      # version is newest on the day. Bump them deliberately.
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2

      - name: Cargo Audit (workspace)
        run: cargo audit

      # advisories (vulnerabilities + yanked crates), bans, licenses and the
      # crates.io-only source gate. Config: deny.toml.
      - name: Cargo Deny (workspace)
        run: cargo deny check advisories bans licenses sources

      # The RDP sidecar ships in every installer but has its own Cargo.lock and
      # rdp-sidecar/deny.toml, which the workspace checks above never read.
      - name: Cargo Deny (RDP sidecar)
        working-directory: rdp-sidecar
        run: cargo deny check advisories bans licenses sources

  # Release gate (#3652, WA-CI-004, WA-CI-024): refuse to publish unless the full
  # integration lanes passed on the EXACT commit being released. Per-PR CI is the
  # slim lane (#3325) — no bridge integration lane, a path-filtered fixture lane,
  # no agent Docker suites — so per-PR green alone must never ship. The script
  # requires the newest "Release Candidate: Full Integration" run (every lane, no
  # path filter), the newest post-merge Code Quality push run, the newest
  # post-merge Dev Build push run (full app build, CI-015) and the newest
  # post-merge Security Audit push run (#4282) on this sha to be green, and otherwise fails with the commands to fix it: dispatch
  # release-candidate.yml on the tag, then re-run this workflow's failed jobs.
  # Every other job depends on create-release, which depends on this job.
  verify-integration:
    name: Verify Integration Lanes
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow's `contents: write`: this job only
    # reads workflow runs, so it gets `actions: read` and a read-only checkout.
    permissions:
      actions: read
      contents: read

    # A dry run has no release commit to grade (#4746): both steps are skipped
    # and the job succeeds, so the builds still hang off it in a real release.
    steps:
      - name: Checkout code
        if: github.event_name == 'push'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # node is preinstalled on the runner (as for emit-release-notes.mjs below).
      - name: Require green full integration lanes on the release commit
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: node scripts/internal/release-integration-gate.mjs

  # ADVISORY release coverage (#3658, TOOL-005): show, in this run's job summary,
  # the unified coverage (unit + integration) and the integration coverage gap for
  # the release commit. It merges the unit lcov of the Coverage run on this sha with
  # the integration lcov of the Release Candidate run on this sha (its
  # instrumented fixtures lane) — scripts/internal/release-coverage-summary.mjs.
  # Nothing needs this job and it is continue-on-error; the script exits 0 on any
  # missing input, so coverage can never block or red a release.
  coverage-summary:
    name: Release Coverage Summary (advisory)
    # Nothing to summarise for a dry run (#4746).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # node is preinstalled on the runner (as for emit-release-notes.mjs below).
      - name: Summarize unified + integration coverage for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/internal/release-coverage-summary.mjs
          --repo "${{ github.repository }}"
          --sha "${{ github.sha }}"
          --ref "${{ github.ref_name }}"
          --out-dir coverage-release

      - name: Upload release coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-coverage
          path: |
            coverage-release/release-coverage.md
            coverage-release/integration-gap.md
            coverage-release/merged.lcov
          if-no-files-found: warn

  # The gate junction and the version every asset name carries (#4746): the tag
  # without its leading v on a tag push, the stand-in 0.0.0-dryrun on a dry run.
  # Every build job needs this job, not create-release, so a dry run builds
  # everything while create-release (and so every write-scoped job) is skipped.
  release-version:
    name: Resolve Release Version
    needs: [verify-version, verify-supply-chain, verify-integration]
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}

    steps:
      - name: Resolve the version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ]; then
            version="${REF_NAME#v}"
            dry_run=false
          else
            version=0.0.0-dryrun
            dry_run=true
          fi
          echo "Release version: ${version} (dry run: ${dry_run})"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${dry_run}" >> "$GITHUB_OUTPUT"

  create-release:
    name: Create Release
    needs: [verify-version, verify-supply-chain, verify-integration, release-version]
    # Never on a dry run (#4746). Every write-scoped job needs this job, so this
    # one condition keeps a dispatched run from reaching any write token.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Creates the draft release. Runs only first-party scripts with the
    # preinstalled node; installs nothing.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0  # Get all history for changelog

      # Fail the release BEFORE anything is built or published when agent update
      # signing is not configured (AGT-005, #3213): a release-built agent refuses
      # every self-update that is not signed by the key compiled into it, so a
      # release built from the committed PLACEHOLDER key file, or without the
      # signing secret, would ship agents that can never be updated.
      # The signing key is whichever of the two secret slots holds the private half
      # of the FIRST trusted public key (overlap rotation, #3329); select-key fails
      # here, before anything is built, when neither does (unset or mismatched).
      - name: Require agent update signing key
        env:
          AGENT_UPDATE_SIGNING_KEY: ${{ secrets.AGENT_UPDATE_SIGNING_KEY }}
          AGENT_UPDATE_SIGNING_KEY_NEXT: ${{ secrets.AGENT_UPDATE_SIGNING_KEY_NEXT }}
        run: |
          set -euo pipefail
          scripts/internal/agent-update-signing.sh check-key
          if ! scripts/internal/agent-update-signing.sh select-key \
            AGENT_UPDATE_SIGNING_KEY AGENT_UPDATE_SIGNING_KEY_NEXT; then
            echo "::error::No signing secret (AGENT_UPDATE_SIGNING_KEY / _NEXT) holds the private half of the first key in agent/keys/update-signing.pub.pem. Run scripts/internal/setup-agent-signing-key.sh (maintainer) — see docs/contributing.md → 'Agent update signing key'."
            exit 1
          fi

      - name: Get version from tag
        id: get_version
        env:
          VERSION: ${{ needs.release-version.outputs.version }}
        run: echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          # Extract this version's '## [X.Y.Z]' section from CHANGELOG.md, capped
          # under GitHub's release-body limit with a link to the full CHANGELOG
          # (#4278). Exit 2 = no section for this version → commit-log fallback.
          VERSION=${{ steps.get_version.outputs.version }}
          rc=0
          node scripts/internal/extract-release-notes.mjs \
            --version "$VERSION" --changelog CHANGELOG.md > release_notes.md || rc=$?

          if [ "$rc" -eq 2 ]; then
            echo "No changelog entry found, generating from commits..."
            # Find the previous tag to bound the log range. On the VERY FIRST
            # release there is no prior tag (and HEAD^ may not even resolve on a
            # single-commit history), so `git describe` fails — fall back to the
            # full history (root commit..HEAD) instead of erroring the release.
            if PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null); then
              RANGE="${PREV_TAG}..HEAD"
            else
              echo "No previous tag found (first release); using full history."
              RANGE="HEAD"
            fi
            git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges > release_commits.txt
            node scripts/internal/extract-release-notes.mjs \
              --version "$VERSION" --fallback release_commits.txt > release_notes.md
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      - name: Mark security release
        # The desktop self-update check (src-tauri/src/commands/update.rs) treats a
        # release as a *security* update when its body contains the "<!-- security -->"
        # marker, dropping the "Skip this version" action so the patch cannot be
        # suppressed (#1878). Emit that marker when the notes carry a Keep a Changelog
        # "### Security" section — or when a maintainer forces it by setting the
        # TERMIHUB_SECURITY_RELEASE repository variable. node is preinstalled on the
        # runner (same as scripts/internal/parse-issue-refs.mjs in auto-close-issues).
        env:
          TERMIHUB_SECURITY_RELEASE: ${{ vars.TERMIHUB_SECURITY_RELEASE }}
        run: |
          node scripts/internal/emit-release-notes.mjs release_notes.md > release_notes.marked.md
          mv release_notes.marked.md release_notes.md

      - name: Append macOS unsigned-beta bypass note
        # v0.x ships as an UNSIGNED public beta (maintainer decision 2026-09-06):
        # no Apple Developer-ID / notarization yet. build-app re-signs the
        # .app ad-hoc so it launches (and satisfies the Apple Silicon kernel), but
        # Gatekeeper still shows an "unverified developer" prompt on first open.
        # Document the one-time approval in every release body so the beta stays
        # turnkey for users. The text comes from scripts/internal/macos-first-launch.mjs,
        # the single source README.md is checked against (#4279). Appended AFTER the
        # security marker so the marker stays first (src-tauri/src/commands/update.rs
        # greps the body for it).
        run: node scripts/internal/macos-first-launch.mjs >> release_notes.md

      # Release channel (PKG-014): there is no `latest` git tag — clients (the
      # desktop update check and the agent self-updater) follow GitHub's own
      # "Latest release" marker via the releases/latest API. Safe by default:
      # every release is a GitHub prerelease (never marked latest, so no update
      # check or agent self-update picks it up) — v0.x ships as an unsigned
      # public beta. A plain vX.Y.Z tag becomes a stable release only when the
      # maintainer opts in with the TERMIHUB_STABLE_RELEASE repository variable
      # ("true"). A semver prerelease tag (vX.Y.Z-beta.1, vX.Y.Z-rc.1, …) is
      # always a prerelease, even with the variable set.
      # Every release is created with --latest=false; mark-latest promotes a
      # stable release to "Latest" only after verify-release has passed, so no
      # client can pick up a half-uploaded release.
      # The release starts as a DRAFT (PKG2-006, #4361): every upload below uses
      # --clobber, so "re-run failed jobs" can finish a leg that already
      # uploaded, and nobody sees a half-populated release. publish-release
      # publishes it after verify-release. release-draft.sh create reuses an
      # existing draft on a re-run and refuses a tag that is already published.
      - name: Create GitHub Release (draft)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
          TERMIHUB_STABLE_RELEASE: ${{ vars.TERMIHUB_STABLE_RELEASE }}
        run: |
          set -euo pipefail
          prerelease_flag=(--prerelease)
          if [[ "$VERSION" != *-* && "${TERMIHUB_STABLE_RELEASE}" == "true" ]]; then
            echo "TERMIHUB_STABLE_RELEASE=true: v${VERSION} will be a stable release."
            prerelease_flag=()
          else
            echo "v${VERSION} will be a prerelease (never marked latest)."
          fi
          scripts/internal/release-draft.sh create --tag "v${VERSION}" \
            --title "termiHub v${VERSION} — Public Beta" \
            "${prerelease_flag[@]}" \
            --notes release_notes.md

  # Build the desktop installers (read-only, CI2-007 / #4730). This job runs
  # third-party code (pnpm packages, every crate's build.rs, tauri-action), so it
  # holds no write, OIDC or attestation token: it stages the renamed bundles as
  # the release-app-<platform> workflow artifact, and upload-app attests and
  # publishes them.
  build-app:
    name: Build App - ${{ matrix.platform }}
    # third-party-notices generates the THIRD_PARTY_NOTICES.txt every installer
    # bundles (PKG-009) — generated once so all platforms ship the same file.
    needs: [verify-version, verify-supply-chain, release-version, third-party-notices]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Intel
          - platform: 'macos-x64'
            os: macos-latest
            rust_target: 'x86_64-apple-darwin'
            file_ext: '.dmg'
            bundle_path: 'dmg'

          # macOS Apple Silicon
          - platform: 'macos-arm64'
            os: macos-latest
            rust_target: 'aarch64-apple-darwin'
            file_ext: '.dmg'
            bundle_path: 'dmg'

          # Windows
          - platform: 'windows-x64'
            os: windows-latest
            rust_target: 'x86_64-pc-windows-msvc'
            file_ext: '.msi'
            bundle_path: 'msi'
            # Sideloaded ConPTY host next to termihub.exe (#4121).
            extra_config: '--config src-tauri/tauri.conpty.conf.json'

          # Linux x64
          - platform: 'linux-x64'
            os: ubuntu-latest
            rust_target: 'x86_64-unknown-linux-gnu'
            file_ext: '.AppImage'
            bundle_path: 'appimage'

          # Linux ARM64 (Raspberry Pi)
          # Uses native ARM64 runner — no cross-compilation needed.
          # AppImage is not supported on ARM64 (linuxdeploy is x86_64-only),
          # so we build .deb and .rpm only.
          - platform: 'linux-arm64'
            os: ubuntu-24.04-arm
            rust_target: 'aarch64-unknown-linux-gnu'
            file_ext: '.deb'
            bundle_path: 'deb'
            extra_args: '--bundles deb,rpm'

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.platform }}

      - name: Install system dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf \
            libarchive-tools

      - name: Install frontend dependencies
        # --ignore-scripts (CI2-007, #4360): no dependency lifecycle script runs
        # on this build runner. The only allowed one (pnpm.onlyBuiltDependencies)
        # is esbuild's postinstall, an optional speed-up: esbuild resolves its
        # platform binary from the installed optional dependency without it.
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The RDP sidecar (#1747) is a workspace-excluded crate with its own
      # Cargo.lock. It ships next to the desktop binary via Tauri `externalBin`
      # (#1754), so it must be cross-built for this matrix target and staged into
      # src-tauri/binaries/ BEFORE tauri-action runs — tauri-build rejects a
      # missing externalBin. `externalBin` lives in the bundle-only config
      # fragment tauri.sidecar.conf.json (merged via --config below), so per-PR
      # compile/test jobs stay sidecar-free. Run through Git Bash on all runners.
      - name: Build RDP sidecar for bundling
        shell: bash
        run: ./scripts/build-rdp-sidecar.sh --release --locked --target ${{ matrix.rust_target }} --tauri-externalbin

      # The plugin runner (#4182) is the second externalBin in
      # tauri.sidecar.conf.json (#4202). Stage it before tauri-action too:
      # core/build.rs embeds the staged runner's SHA-256, which the app checks
      # before spawning the bundled runner. Windows MSVC links the static VC
      # runtime (#4172); macOS ad-hoc signs it under its installed name so the
      # re-sign below leaves its bytes, and so the digest, unchanged.
      - name: Build plugin runner for bundling
        shell: bash
        run: ./scripts/build-plugin-runner.sh --release --locked --target ${{ matrix.rust_target }} --tauri-externalbin

      # The generated notices (PKG-009) are bundled as an app resource by the
      # bundle-only fragment tauri.notices.conf.json (merged via --config below);
      # tauri-build rejects a missing resource, so stage the file first.
      - name: Download third-party notices for bundling
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: third-party-notices
          path: src-tauri/resources/

      # Windows local shells need the sideloaded ConPTY host (#4121): the inbox
      # ConPTY strips SIXEL/inline-image sequences. Fetch Microsoft's
      # conpty.dll + OpenConsole.exe at the pinned version, SHA-256-verified
      # against src-tauri/packaging/windows/conpty.env (a mismatch fails the job),
      # and stage them for the bundle-only fragment tauri.conpty.conf.json, which
      # the Windows matrix entry merges via extra_config below. tauri-build
      # rejects a missing resource, so this must run first.
      - name: Fetch sideloaded ConPTY (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./scripts/internal/fetch-conpty.sh --arch x64

      # Tauri's WiX bundler rejects a non-numeric prerelease (0.2.0-beta.1), so
      # map the tag to a numeric MSI version (beta < rc < final, see the script
      # header and docs/contributing.md) and merge it as bundle.windows.wix.version
      # through a generated fragment (PKG2-003, #4283). Final releases are mapped
      # too, so the MSI version stays monotonic across beta -> rc -> final.
      # verify-version already ran --check, so this cannot reject the tag.
      # A dry run maps the in-repo version: 0.0.0-dryrun has no MSI form.
      - name: Generate the Windows MSI version fragment
        id: wix_version
        if: runner.os == 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.release-version.outputs.version }}
          DRY_RUN: ${{ needs.release-version.outputs.dry_run }}
        run: |
          set -euo pipefail
          fragment=src-tauri/tauri.wix-version.conf.json
          if [ "$DRY_RUN" = true ]; then VERSION="$(node -p "require('./package.json').version")"; fi
          node scripts/internal/msi-version.mjs --config-out "$fragment" "$VERSION"
          cat "$fragment"
          echo "config=--config $fragment" >> "$GITHUB_OUTPUT"

      - name: Build Tauri app for release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ''
          releaseName: ''
          releaseBody: ''
          releaseDraft: false
          prerelease: false
          args: --config src-tauri/tauri.sidecar.conf.json --config src-tauri/tauri.notices.conf.json --target ${{ matrix.rust_target }} ${{ matrix.extra_config }} ${{ steps.wix_version.outputs.config }} ${{ matrix.extra_args }} -- --locked

      # Fail the build, not the user, if the sideloaded ConPTY host (#4121) is
      # missing from the installer, misplaced (it must sit next to termihub.exe,
      # where portable-pty looks), altered, or not Microsoft-signed. The MSI is
      # administrative-extracted (no install); the target dir is what the
      # unbundled exe uses.
      - name: Verify the sideloaded ConPTY host in the Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          $bundle = "target/$env:RUST_TARGET/release/bundle"
          $msi = Get-ChildItem "$bundle/msi" -Filter *.msi | Select-Object -First 1
          if (-not $msi) { Write-Output "::error::no MSI built"; exit 1 }
          ./scripts/internal/verify-conpty-bundle.ps1 -Msi $msi.FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./scripts/internal/verify-conpty-bundle.ps1 -Dir "target/$env:RUST_TARGET/release"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Release builds link the Visual C++ runtime statically (#4172), so users
      # install termiHub without the VC++ redistributable. Fail the build if any
      # .exe/.dll in the installer imports VCRUNTIME*/MSVCP*.dll after all (a
      # toolchain or dependency change, or a build outside the release profile).
      - name: Verify no Visual C++ runtime dependency in the Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          $bundle = "target/$env:RUST_TARGET/release/bundle"
          $msi = Get-ChildItem "$bundle/msi" -Filter *.msi | Select-Object -First 1
          if (-not $msi) { Write-Output "::error::no MSI built"; exit 1 }
          ./scripts/internal/verify-no-vcruntime.ps1 -Msi $msi.FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Never ship a build with the test bridge compiled in (SEC-005): it carries
      # test-only commands such as the native-dialog fs grant (#4122). The release
      # build above passes no --features, so this guards a future workflow edit.
      - name: Assert the app binary has no test-bridge code
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.rust_target }}/release/termihub"
          if [ "${{ runner.os }}" = "Windows" ]; then BIN="${BIN}.exe"; fi
          scripts/internal/assert-no-test-bridge.sh "$BIN"

      # The bundled sidecars must match the digests the app embeds, or the app
      # would refuse them as tampered: the plugin runner (#4202, which must also
      # start) and the RDP helper (#1762). Windows/Linux: the target dir
      # (tauri-build copies the staged sidecars next to termihub). Linux also
      # inside every package: the AppImage bundler (linuxdeploy) patchelfs each
      # ELF in usr/bin, which once broke both digests (#4243). macOS is checked
      # inside the re-signed .app below.
      - name: Verify the bundled sidecars
        if: ${{ !startsWith(matrix.os, 'macos') }}
        shell: bash
        run: |
          set -euo pipefail
          T="${{ matrix.rust_target }}"
          BIN="target/$T/release/termihub"
          if [ "${{ runner.os }}" = "Windows" ]; then BIN="${BIN}.exe"; fi
          scripts/internal/verify-plugin-runner-bundle.sh "$BIN"
          if [ "${{ runner.os }}" = "Linux" ]; then
            check() {
              scripts/internal/verify-plugin-runner-bundle.sh "$1"
              scripts/internal/verify-rdp-helper-bundle.sh "$1"
            }
            scripts/internal/verify-rdp-helper-bundle.sh "$BIN"
            B="$PWD/target/$T/release/bundle"
            X="$(mktemp -d)"
            # Every Linux leg builds a .deb and an .rpm; linux-x64 also the
            # AppImage. Fail on a missing package rather than skip its check.
            want="deb rpm"
            if [ "${{ matrix.bundle_path }}" = "appimage" ]; then want="$want appimage"; fi
            for kind in $want; do
              found=0
              for pkg in "$B/$kind/"*.deb "$B/$kind/"*.rpm "$B/$kind/"*.AppImage; do
                [ -e "$pkg" ] || continue
                found=1
                D="$X/$kind"
                rm -rf "$D" && mkdir -p "$D"
                echo "--- $kind: $(basename "$pkg")"
                rc=0
                case "$kind" in
                deb) dpkg-deb -x "$pkg" "$D" || rc=$? ;;
                # bsdtar (libarchive) reads the rpm payload directly. Not
                # rpm2cpio | cpio: rpm2cpio exits 1 without a message on Tauri's
                # rpms even though it extracts them, which failed this step.
                rpm) bsdtar -xf "$pkg" -C "$D" || rc=$? ;;
                appimage)
                  chmod +x "$pkg"
                  # FUSE is unavailable on GitHub runners, so extract rather than mount.
                  (cd "$D" && "$pkg" --appimage-extract >/dev/null) || rc=$?
                  D="$D/squashfs-root"
                  ;;
                esac
                if [ "$rc" -ne 0 ]; then
                  echo "::error::extracting $kind package $(basename "$pkg") failed (exit $rc)"
                  exit 1
                fi
                if [ ! -f "$D/usr/bin/termihub" ]; then
                  echo "::error::no usr/bin/termihub extracted from $(basename "$pkg")"
                  exit 1
                fi
                check "$D/usr/bin/termihub"
              done
              if [ "$found" -eq 0 ]; then
                echo "::error::no $kind package built under $B/$kind"
                exit 1
              fi
            done
            rm -rf "$X"
          fi

      # Tauri's internal ad-hoc signing can leave the bundle in an inconsistent state
      # (inner components signed in the wrong order), which Gatekeeper classifies as
      # "damaged" — no bypass path exists for that error. A *fully consistent* ad-hoc
      # signature instead triggers "unverified developer", which users can bypass via
      # System Settings → Privacy & Security → Open Anyway (see the release notes).
      # We re-sign the entire bundle ourselves, inside-out, to guarantee consistency. Ad-hoc signatures are also
      # required by the Apple Silicon kernel — a completely unsigned binary is killed
      # immediately at exec time on M1/M2/M3/M4. Ported verbatim from dev-build.yml.
      - name: Re-sign macOS DMG with consistent ad-hoc signature
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          DMG=$(find "target/${{ matrix.rust_target }}/release/bundle/dmg" -name "*.dmg" | head -n 1)
          WORKDIR=$(mktemp -d)
          MOUNT="$WORKDIR/mount"
          mkdir "$MOUNT"

          hdiutil attach "$DMG" -mountpoint "$MOUNT" -nobrowse -quiet
          APP_PATH=$(find "$MOUNT" -mindepth 1 -maxdepth 1 -name '*.app' | head -n 1)
          APP_NAME=$(basename "$APP_PATH")
          ditto "$MOUNT/$APP_NAME" "$WORKDIR/$APP_NAME"
          hdiutil detach "$MOUNT" -quiet

          APP="$WORKDIR/$APP_NAME"

          # Sign inside-out: individual Mach-O files first, then nested bundles,
          # then the top-level app. This matches the required codesign ordering and
          # produces a CodeResources manifest that is consistent with all signed content.

          # 1. Sign all individual Mach-O binaries (dylibs, executables, helpers)
          # Every codesign failure is FATAL (PKG-005): a swallowed inner-sign
          # failure is exactly how an inconsistent, Gatekeeper-"damaged" bundle
          # would ship while the job reports success.
          while IFS= read -r -d '' f; do
            if file "$f" 2>/dev/null | grep -q 'Mach-O'; then
              if ! codesign -s - --force "$f"; then
                echo "::error::codesign failed for Mach-O file: $f"
                exit 1
              fi
            fi
          done < <(find "$APP" -type f -print0)

          # 2. Sign nested bundle types as bundles (frameworks, plugins, XPC services)
          while IFS= read -r -d '' bundle; do
            if ! codesign -s - --force "$bundle"; then
              echo "::error::codesign failed for nested bundle: $bundle"
              exit 1
            fi
          done < <(find "$APP" -mindepth 1 -type d \( \
            -name "*.framework" -o -name "*.app" -o \
            -name "*.bundle" -o -name "*.appex" -o -name "*.xpc" \) -print0)

          # 3. Sign the top-level app bundle (no --deep; inner content already signed)
          codesign -s - --force "$APP"

          # 3a. The re-signed RDP helper must still match the digest the app
          #     embeds (#1762), or RDP is refused as tampered (#4222).
          #     build-rdp-sidecar.sh signed it under its installed name before
          #     staging, so the re-sign above is byte-identical.
          EXE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          scripts/internal/verify-rdp-helper-bundle.sh "$APP/Contents/MacOS/$EXE_NAME"

          # 4. HARD GATE: the whole bundle must verify as consistently signed.
          #    This is what catches the "damaged" (inconsistent) state.
          echo "=== Signature verification (strict, deep) ==="
          if ! codesign --verify --deep --strict --verbose=2 "$APP"; then
            echo "::error::codesign --verify --deep --strict failed for $APP — the bundle is inconsistently signed"
            exit 1
          fi

          # 5. The re-signed plugin runner (#4202) must still match the digest
          #    the app embeds (the staged runner was signed under the same
          #    name, so the re-sign is byte-identical). --no-run: the x64
          #    bundle is cross-built here; Release macOS Smoke runs it natively.
          scripts/internal/verify-plugin-runner-bundle.sh --no-run "$APP/Contents/MacOS/$EXE_NAME"

          # Advisory only: Gatekeeper always rejects an ad-hoc (non-Developer ID)
          # bundle — the project ships unsigned-beta by maintainer decision — so
          # spctl cannot be a gate. Its verdict is logged, never discarded.
          echo "=== Gatekeeper assessment (advisory) ==="
          if ! spctl --assess --type exec --verbose=2 "$APP" 2>&1; then
            echo "::notice::spctl rejected the ad-hoc bundle (expected without a Developer ID)"
          fi
          echo "=== Signature info ==="
          codesign -dv "$APP" 2>&1
          find "$APP" -name "_CodeSignature" -type d 2>/dev/null || echo "(none)"

          # Swap the re-signed .app into Tauri's own image instead of rebuilding
          # it from the bare .app, which dropped the /Applications drag-to-install
          # link, volume icon and layout (PKG2-009, #4361). The helper rewrites
          # $DMG only after the new image verifies, then `check` re-asserts it.
          scripts/internal/macos-dmg-layout.sh replace-app "$DMG" "$APP"
          scripts/internal/macos-dmg-layout.sh check "$DMG"
          rm -rf "$WORKDIR"

      # Stage the release assets under their published names in release-assets/
      # (the upload job publishes that directory as-is): the primary bundle
      # termiHub-<version>-<platform><ext>, plus the .deb (linux-x64) and .rpm
      # (linux-arm64) side-assets.
      - name: Find and rename release artifact
        shell: bash
        run: |
          mkdir -p release-assets
          # Find the built installer/bundle
          ARTIFACT=$(find "target/${{ matrix.rust_target }}/release/bundle/${{ matrix.bundle_path }}" -name "*${{ matrix.file_ext }}" | head -n 1)

          if [ -z "$ARTIFACT" ]; then
            echo "Error: No artifact found!"
            exit 1
          fi

          # Rename to include platform
          FILENAME="termiHub-${{ needs.release-version.outputs.version }}-${{ matrix.platform }}${{ matrix.file_ext }}"
          mv "$ARTIFACT" "release-assets/$FILENAME"

      # Also stage .deb for Linux (skip ARM64 where .deb is already the primary artifact)
      - name: Stage .deb (Linux only)
        if: startsWith(matrix.os, 'ubuntu') && matrix.file_ext != '.deb'
        run: |
          DEB_FILE=$(find target/${{ matrix.rust_target }}/release/bundle/deb -name "*.deb" | head -n 1)
          if [ -n "$DEB_FILE" ]; then
            DEB_FILENAME="termiHub-${{ needs.release-version.outputs.version }}-${{ matrix.platform }}.deb"
            mv "$DEB_FILE" "release-assets/$DEB_FILENAME"
          fi

      # ARM64 builds deb,rpm (extra_args above); the deb is the primary artifact,
      # so stage the .rpm too — matches dev-build.yml's "Collect .rpm" step.
      - name: Stage .rpm (Linux ARM64 only)
        if: matrix.platform == 'linux-arm64'
        run: |
          RPM_FILE=$(find target/${{ matrix.rust_target }}/release/bundle/rpm -name "*.rpm" | head -n 1)
          if [ -n "$RPM_FILE" ]; then
            RPM_FILENAME="termiHub-${{ needs.release-version.outputs.version }}-${{ matrix.platform }}.rpm"
            mv "$RPM_FILE" "release-assets/$RPM_FILENAME"
          fi

      - name: Hand the bundles to upload-app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-app-${{ matrix.platform }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  # Check the full release asset set before anything is published (#4746). Runs
  # in a real release AND in a dry run: it downloads every build job's artifact
  # and asserts every expected file is present and non-empty, and every agent
  # binary matches its .sha256 sidecar, and every SBOM is well-formed CycloneDX
  # JSON (#4484). Read-only, no checkout. The upload-* jobs and sbom need it, so
  # they only ever publish a checked set.
  check-release-assets:
    name: Check Release Assets
    needs:
      [
        verify-version,
        verify-supply-chain,
        release-version,
        build-app,
        agent-binaries-linux,
        agent-binaries-macos,
        agent-binaries-windows,
        third-party-notices,
        sbom-generate,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download app bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-app-*
          merge-multiple: true

      - name: Download agent binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-agent-*
          merge-multiple: true

      - name: Download third-party notices
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: third-party-notices

      - name: Download SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-sboms

      # Names mirror build-app's rename logic, the agent-binaries-* matrices
      # and verify-release's expected list.
      - name: Check the asset set
        env:
          VERSION: ${{ needs.release-version.outputs.version }}
        run: |
          set -euo pipefail
          expected=(THIRD_PARTY_NOTICES.txt)
          for a in macos-x64.dmg macos-arm64.dmg windows-x64.msi linux-x64.AppImage \
            linux-x64.deb linux-arm64.deb linux-arm64.rpm; do
            expected+=("termiHub-${VERSION}-${a}")
          done
          agents=(termihub-agent-linux-x64 termihub-agent-linux-arm64
            termihub-agent-linux-armv7 termihub-agent-macos-arm64 termihub-agent-macos-x64
            termihub-agent-windows-x64.exe termihub-agent-windows-arm64.exe)
          for a in "${agents[@]}"; do
            expected+=("$a" "${a}.sha256")
          done
          sboms=()
          for c in desktop agent rdp-sidecar frontend; do
            sboms+=("termiHub-${VERSION}-sbom-${c}.cdx.json")
          done
          expected+=("${sboms[@]}")
          missing=0
          {
            echo "### Release assets (v${VERSION})"
            echo
            echo "| Asset | Bytes | SHA-256 |"
            echo "| --- | ---: | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for f in "${expected[@]}"; do
            if [ ! -s "$f" ]; then
              echo "::error::Missing or empty release asset: ${f}"
              missing=1
              continue
            fi
            echo "| ${f} | $(stat -c %s "$f") | $(sha256sum "$f" | cut -d' ' -f1) |" >> "$GITHUB_STEP_SUMMARY"
          done
          [ "$missing" -eq 0 ]
          # Publish only bytes that match their checksum sidecar.
          for a in "${agents[@]}"; do
            sha256sum -c "${a}.sha256"
          done
          # Every SBOM must be a CycloneDX document that lists components (#4484).
          for f in "${sboms[@]}"; do
            if ! jq -e '.bomFormat == "CycloneDX"
                and (.specVersion | type == "string")
                and (.components | type == "array" and length > 0)' "$f" > /dev/null; then
              echo "::error::Malformed SBOM (not CycloneDX JSON with components): ${f}"
              exit 1
            fi
            echo "${f}: CycloneDX $(jq -r .specVersion "$f"), $(jq '.components | length' "$f") components"
          done
          echo "All ${#expected[@]} expected assets are present."

  # Privileged half of the app publish (#4730), shaped like the sbom job: no
  # checkout and no third-party code, so the write, OIDC and attestation tokens
  # never share a runner with the build. It downloads every build-app leg's
  # bundles (checked by check-release-assets), attests build provenance (CI-022)
  # and uploads.
  upload-app:
    name: Attest and Upload App Bundles
    needs: [verify-version, verify-supply-chain, create-release, check-release-assets, build-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    # No checkout in this job; GH_REPO tells gh which repository to act on.
    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download app bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-app-*
          merge-multiple: true

      # Build provenance (CI-022): a Sigstore-signed SLSA statement binding each
      # published bundle's SHA-256 to this workflow run, commit and tag. Users
      # verify with `gh attestation verify <file> --repo <repo>`; verify-release
      # does the same for every asset before the release is published.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: termiHub-${{ needs.create-release.outputs.version }}-*

      - name: Upload app bundles as release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: gh release upload "v${VERSION}" --clobber termiHub-"${VERSION}"-*

  # Build the Linux agent binaries (static musl). Read-only like build-app; the
  # binaries + .sha256 sidecars go to upload-agent-binaries as workflow artifacts.
  agent-binaries-linux:
    name: Agent Binary (${{ matrix.target }})
    needs: [verify-version, verify-supply-chain, release-version]
    runs-on: ubuntu-latest
    # Read-only (#4730): upload-agent-binaries attests and publishes.
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact_name: termihub-agent-linux-x64
          - target: aarch64-unknown-linux-musl
            artifact_name: termihub-agent-linux-arm64
          - target: armv7-unknown-linux-musleabihf
            artifact_name: termihub-agent-linux-armv7

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-agent-${{ matrix.target }}

      - name: Install cross-rs
        # Pinned + SHA256-verified (CI-004 / WA-CI-019); the version lives only in
        # .github/cross-version (#4360).
        uses: ./.github/actions/setup-cross

      # No Docker Buildx / custom cross image on CI: the flaky "Set up Docker
      # Buildx" step pulled moby/buildkit from Docker Hub (registry-1.docker.io),
      # which times out non-deterministically (#2056) and would intermittently
      # fail these REQUIRED release artifact builds. cross-rs pulls its stock
      # target images from GHCR, which is reliable, so we let it use the default
      # images directly. The custom localhost/termihub-cross:* images (Cross.toml
      # + agent/docker/) only add an lld linker + a chmod entrypoint needed for
      # local Windows/Podman dev (DrvFs strips execute bits); neither is required
      # on a Linux runner, so dropping CROSS_CONFIG here changes nothing but the
      # image source. Local dev still uses Cross.toml via the build-agents scripts.
      - name: Build agent
        run: cross build --release --locked --target ${{ matrix.target }} -p termihub-agent

      - name: Stage agent binary and checksum
        run: |
          cp target/${{ matrix.target }}/release/termihub-agent ${{ matrix.artifact_name }}
          # Publish a SHA-256 sidecar the desktop verifies before install (#1350).
          sha256sum "${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"

      - name: Hand the binary and checksum to upload-agent-binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-agent-${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256
          if-no-files-found: error
          retention-days: 7

  # Build the macOS agent binaries (native build); published by upload-agent-binaries.
  agent-binaries-macos:
    name: Agent Binary (${{ matrix.target }})
    needs: [verify-version, verify-supply-chain, release-version]
    runs-on: macos-latest
    # Read-only (#4730): upload-agent-binaries attests and publishes.
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact_name: termihub-agent-macos-arm64
          - target: x86_64-apple-darwin
            artifact_name: termihub-agent-macos-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-agent-${{ matrix.target }}

      - name: Build agent
        run: cargo build --release --locked --target ${{ matrix.target }} -p termihub-agent

      - name: Stage agent binary and checksum
        run: |
          cp target/${{ matrix.target }}/release/termihub-agent ${{ matrix.artifact_name }}
          # macOS runners have `shasum`, not `sha256sum`; emit the same
          # "<hex>  <file>" sidecar the desktop verifies before install (#1350).
          shasum -a 256 "${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"

      - name: Hand the binary and checksum to upload-agent-binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-agent-${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256
          if-no-files-found: error
          retention-days: 7

  # Build the Windows agent binaries (native MSVC build); published by
  # upload-agent-binaries.
  # cross-rs cannot build the MSVC ABI, so this runs native cargo on a Windows
  # runner. The binary is emitted as termihub-agent.exe.
  #
  # The ARM64 leg cross-compiles aarch64-pc-windows-msvc from the x64
  # windows-latest runner: rustup adds the target's std (via the toolchain
  # `targets:` input) and the runner's Visual Studio ships the ARM64 MSVC build
  # tools/linker, so `cargo build --target aarch64-pc-windows-msvc` links without
  # an emulated ARM64 runner. The desktop resolves ARM64 Windows remotes to the
  # windows-arm64 artifact (src-tauri/src/terminal/agent_binary.rs), so this asset
  # must ship for those hosts to install the agent (#3060).
  agent-binaries-windows:
    name: Agent Binary (${{ matrix.target }})
    needs: [verify-version, verify-supply-chain, release-version]
    runs-on: windows-latest
    # Read-only (#4730): upload-agent-binaries attests and publishes.
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            artifact_name: termihub-agent-windows-x64.exe
          - target: aarch64-pc-windows-msvc
            artifact_name: termihub-agent-windows-arm64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-agent-${{ matrix.target }}

      # Link the Visual C++ runtime statically (#4175): the desktop deploys this
      # binary to remote Windows hosts over SSH, and a minimal host (Server Core,
      # a fresh VM) may lack VCRUNTIME140.dll. Step-scoped RUSTFLAGS with the
      # explicit --target reach only the target's crates, never build scripts or
      # proc macros, and `cc`-built C code follows the crt-static feature to /MT.
      # Same flag as scripts/build-agents.{sh,cmd}; agent tests stay dynamic.
      - name: Build agent
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked --target ${{ matrix.target }} -p termihub-agent

      # Fail the release if the agent still imports a VC++ runtime DLL (#4175).
      - name: Verify no Visual C++ runtime dependency in the agent
        shell: pwsh
        run: |
          ./scripts/internal/verify-no-vcruntime.ps1 -Exe "target/${{ matrix.target }}/release/termihub-agent.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Stage agent binary and checksum
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/termihub-agent.exe ${{ matrix.artifact_name }}
          # Git Bash on the Windows runner provides `sha256sum` (#1350).
          sha256sum "${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"

      - name: Hand the binary and checksum to upload-agent-binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-agent-${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256
          if-no-files-found: error
          retention-days: 7

  # Privileged half of the agent publish (#4730): no checkout and no third-party
  # code. Downloads every agent-binaries-* leg's binary + .sha256 sidecar
  # (checked by check-release-assets), attests the binaries and uploads all of it.
  upload-agent-binaries:
    name: Attest and Upload Agent Binaries
    needs:
      [
        verify-version,
        verify-supply-chain,
        create-release,
        check-release-assets,
        agent-binaries-linux,
        agent-binaries-macos,
        agent-binaries-windows,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    # No checkout in this job; GH_REPO tells gh which repository to act on.
    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download agent binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-agent-*
          merge-multiple: true

      # Provenance for the agent binaries themselves (CI-022). The .sha256 and
      # .sig sidecars are not attested: the attestation already binds each
      # binary's SHA-256, and the .sig is itself a signature over that digest.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            termihub-agent-linux-x64
            termihub-agent-linux-arm64
            termihub-agent-linux-armv7
            termihub-agent-macos-arm64
            termihub-agent-macos-x64
            termihub-agent-windows-x64.exe
            termihub-agent-windows-arm64.exe

      - name: Upload agent binaries and checksums as release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: gh release upload "v${VERSION}" --clobber termihub-agent-*

  # Third-party license notices (PKG-009): the full license text of every Rust
  # crate in the desktop app, agent and RDP sidecar (cargo-about, pinned), every
  # npm production dependency, and the X-server attribution, in one
  # THIRD_PARTY_NOTICES.txt. Generated ONCE here from the lockfiles, then
  #   - handed to build-app as an artifact, which bundles it into every
  #     installer (tauri.notices.conf.json), and
  #   - published by upload-third-party-notices as a release asset next to the
  #     agent binaries, which ship without an installer.
  # Needs no build — cargo-about reads the lockfiles and crate sources only.
  # Read-only (#4730): it installs npm packages and runs cargo-about.
  third-party-notices:
    name: Generate Third-Party Notices
    needs: [verify-version, verify-supply-chain, release-version]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      # Keep in sync with CARGO_ABOUT_VERSION in scripts/internal/third-party-notices.mjs
      # (the generator refuses any other version, so the output is reproducible).
      - name: Install cargo-about
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: cargo-about@0.9.2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate THIRD_PARTY_NOTICES.txt
        run: pnpm notices:generate --out THIRD_PARTY_NOTICES.txt

      - name: Stage notices for the installer builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-notices
          path: THIRD_PARTY_NOTICES.txt
          if-no-files-found: error

  # Privileged half of the notices publish (#4730): no checkout and no
  # third-party code. Publishes the same bytes build-app bundled, under the
  # versioned release-asset name, attested.
  upload-third-party-notices:
    name: Attest and Upload Third-Party Notices
    needs: [verify-version, verify-supply-chain, create-release, check-release-assets, third-party-notices]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    # No checkout in this job; GH_REPO tells gh which repository to act on.
    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download third-party notices
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: third-party-notices

      - name: Name the notices for the release
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          cp THIRD_PARTY_NOTICES.txt "termiHub-${VERSION}-THIRD_PARTY_NOTICES.txt"

      - name: Attest notices provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: termiHub-${{ needs.create-release.outputs.version }}-THIRD_PARTY_NOTICES.txt

      - name: Upload notices as a release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: gh release upload "v${VERSION}" --clobber "termiHub-${VERSION}-THIRD_PARTY_NOTICES.txt"

  # Software bills of materials (CI-022): one CycloneDX JSON per shipped
  # component, uploaded as release assets and provenance-attested so a
  # consumer can prove the SBOM came from this run. Needs no build — both
  # generators read the lockfiles / an install tree only.
  #   - desktop / agent: cargo-cyclonedx over the src-tauri and agent crates
  #     (every workspace crate they pull in, e.g. core/plugin-api/vnc-rs, is a
  #     component), --target all so every platform's deps are listed.
  #   - rdp-sidecar: its own crate + Cargo.lock (workspace-excluded, #1747).
  #   - frontend: @cyclonedx/cyclonedx-npm over the production (--omit dev)
  #     tree. It reads the tree via `npm ls`, which cannot follow pnpm's
  #     symlinked store, so this job installs with node-linker=hoisted (an
  #     npm-shaped node_modules from the same frozen lockfile).
  #
  # Split in two (SUP2-002, #4280) so no third-party code runs next to a write
  # or signing token:
  #   - sbom-generate runs the generators with a read-only token and no OIDC.
  #     Both generators are pinned: cargo-cyclonedx by version through the
  #     SHA-pinned installer, @cyclonedx/cyclonedx-npm as an exact devDependency
  #     installed from pnpm-lock.yaml (integrity-checked, --ignore-scripts) and
  #     run with `pnpm exec`. Never `npx` (an unlocked tree with install scripts).
  #   - sbom only downloads that artifact, attests it and uploads it with
  #     first-party actions and `gh`; it checks nothing out and runs no npm code.
  # release-sbom-split.test.mjs pins both halves.
  # sbom-generate is part of the dry run (#4484): it needs release-version, not
  # create-release, so a dispatched run generates all four SBOMs (including the
  # direct-dependency completeness check) under 0.0.0-dryrun and
  # check-release-assets verifies them. sbom stays tag-only via create-release.
  sbom-generate:
    name: Generate SBOMs
    needs: [verify-version, verify-supply-chain, release-version]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: Generate Rust SBOMs
        env:
          VERSION: ${{ needs.release-version.outputs.version }}
        run: |
          set -euo pipefail
          # One run per lockfile; cargo-cyclonedx writes <crate dir>/sbom.json
          # for EVERY member of the workspace, so pick the shipped crates.
          args=(--format json --spec-version 1.5 --target all --override-filename sbom)
          cargo cyclonedx "${args[@]}"
          cargo cyclonedx --manifest-path rdp-sidecar/Cargo.toml "${args[@]}"
          mv src-tauri/sbom.json "termiHub-${VERSION}-sbom-desktop.cdx.json"
          mv agent/sbom.json "termiHub-${VERSION}-sbom-agent.cdx.json"
          mv rdp-sidecar/sbom.json "termiHub-${VERSION}-sbom-rdp-sidecar.cdx.json"

      - name: Generate frontend SBOM
        env:
          VERSION: ${{ needs.release-version.outputs.version }}
        run: |
          set -euo pipefail
          # Installs the pinned @cyclonedx/cyclonedx-npm devDependency too; the
          # SBOM itself omits dev dependencies.
          pnpm install --frozen-lockfile --ignore-scripts --config.node-linker=hoisted
          out="termiHub-${VERSION}-sbom-frontend.cdx.json"
          # --ignore-npm-errors: npm ls flags a few pnpm-hoisted packages as
          # "extraneous"; that is a layout quirk, not a missing package. The
          # completeness check below is what guards the result instead.
          pnpm exec cyclonedx-npm \
            --ignore-npm-errors --omit dev --spec-version 1.6 --output-reproducible \
            --output-format JSON --output-file "$out"
          # Every direct production dependency must appear in the SBOM.
          missing=$(jq -r --slurpfile bom "$out" '
            ($bom[0] | [.components[]? | recurse(.components[]?)
              | if (.group // "") != "" then "\(.group)/\(.name)" else .name end]) as $have
            | .dependencies | keys[] | select(. as $d | $have | index($d) | not)
          ' package.json)
          if [ -n "$missing" ]; then
            echo "::error::Frontend SBOM is missing direct dependencies:"
            while IFS= read -r dep; do
              echo "::error::  ${dep}"
            done <<< "$missing"
            exit 1
          fi

      - name: Upload SBOMs as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sboms
          path: termiHub-${{ needs.release-version.outputs.version }}-sbom-*.cdx.json
          if-no-files-found: error
          retention-days: 7

  # Privileged half of the SBOM publish (#4280): attest + upload only. No
  # checkout and no third-party code, so the write, OIDC and attestation tokens
  # never share a runner with the generators.
  sbom:
    name: Attest and Upload SBOMs
    needs: [verify-version, verify-supply-chain, create-release, check-release-assets, sbom-generate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    # No checkout in this job; GH_REPO tells gh which repository to act on.
    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-sboms

      - name: Check the SBOM set
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          for c in desktop agent rdp-sidecar frontend; do
            f="termiHub-${VERSION}-sbom-${c}.cdx.json"
            if [ ! -s "$f" ]; then
              echo "::error::Missing or empty SBOM: ${f}"
              exit 1
            fi
          done

      - name: Attest SBOM provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: termiHub-${{ needs.create-release.outputs.version }}-sbom-*.cdx.json

      - name: Upload SBOMs as release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: gh release upload "v${VERSION}" --clobber termiHub-"${VERSION}"-sbom-*.cdx.json

  # Sign every agent binary with the release key (AGT-005, #3213). One job holds
  # the private key (never the build jobs): it downloads the just-published
  # agent assets, checks their .sha256 sidecars, writes a detached <asset>.sig
  # for each (Ed25519 over "termihub-agent-update-v1\0" || SHA-256), verifies
  # them against the committed public key, uploads them, and finally re-downloads
  # the published assets to verify what users will actually fetch.
  sign-agent-binaries:
    name: Sign Agent Binaries
    needs: [create-release, upload-agent-binaries]
    runs-on: ubuntu-latest
    # Uploads the .sig assets. Checks out the repo for the first-party signing
    # helpers only; installs nothing and compiles nothing.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Sign, verify and upload agent signatures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
          AGENT_UPDATE_SIGNING_KEY: ${{ secrets.AGENT_UPDATE_SIGNING_KEY }}
          AGENT_UPDATE_SIGNING_KEY_NEXT: ${{ secrets.AGENT_UPDATE_SIGNING_KEY_NEXT }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          HELPER="$GITHUB_WORKSPACE/scripts/internal/agent-update-signing.sh"
          agents=(
            termihub-agent-linux-x64
            termihub-agent-linux-arm64
            termihub-agent-linux-armv7
            termihub-agent-macos-arm64
            termihub-agent-macos-x64
            termihub-agent-windows-x64.exe
            termihub-agent-windows-arm64.exe
          )

          work="$RUNNER_TEMP/agent-signing"
          mkdir -p "$work/assets" "$work/published"
          cd "$work/assets"
          for a in "${agents[@]}"; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$a" --pattern "${a}.sha256"
          done
          # Sign only bytes that match their published checksum.
          for a in "${agents[@]}"; do
            sha256sum -c "${a}.sha256"
          done
          # Never sign an agent that trusts the committed TEST-ONLY key (#4083).
          "$GITHUB_WORKSPACE/scripts/internal/assert-no-test-signing-key.sh" "${agents[@]}"
          # Nor one that carries env-var-armed test hooks (WA-RS2-003, #4362).
          "$GITHUB_WORKSPACE/scripts/internal/assert-no-agent-test-hooks.sh" "${agents[@]}"

          # The private key exists on disk only for the signing call. select-key
          # picks the slot matching the FIRST trusted public key (rotation, #3329)
          # and logs which one; the key itself never leaves the runner.
          umask 077
          key="$RUNNER_TEMP/agent-update-signing-key.pem"
          trap 'shred -u "$key" 2>/dev/null || rm -f "$key"' EXIT
          "$HELPER" select-key --out "$key" AGENT_UPDATE_SIGNING_KEY AGENT_UPDATE_SIGNING_KEY_NEXT
          "$HELPER" sign --key "$key" "${agents[@]}"
          shred -u "$key"

          sigs=()
          for a in "${agents[@]}"; do
            sigs+=("${a}.sig")
          done
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${sigs[@]}"

          # Verify what is actually published, not just the local copies.
          cd "$work/published"
          for a in "${agents[@]}"; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$a" --pattern "${a}.sig"
          done
          "$HELPER" verify "${agents[@]}"

  # Verify the full checksummed asset set + release notes are present (folds in
  # #480). release.yml is not exercised by per-PR CI, so this turns the old manual
  # "eyeball the Release page" checklist into a hard gate: if any expected asset is
  # missing, the release job fails instead of shipping an incomplete release.
  verify-release:
    name: Verify Release Assets
    needs:
      [
        create-release,
        upload-app,
        upload-agent-binaries,
        sign-agent-binaries,
        sbom,
        upload-third-party-notices,
      ]
    runs-on: ubuntu-latest
    # This job only inspects the release, but the release is still a DRAFT here
    # (PKG2-006, #4361), and GitHub lists draft releases only to a token with
    # push access: with contents: read, `gh release view` cannot find it. So it
    # gets contents: write; release-draft.test.mjs pins that it never mutates a
    # release. attestations: read lets `gh attestation verify` fetch the bundles.
    permissions:
      contents: write
      attestations: read
    # No checkout in this job, so gh cannot infer the repository from a git
    # remote; without GH_REPO the bare `gh release view "$TAG"` calls fail.
    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Verify expected asset set and release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"

          # Desktop bundles — names mirror build-app's rename logic
          # (termiHub-<version>-<platform><ext>) plus its .deb/.rpm side-uploads.
          # DMG ×2 are re-signed ad-hoc before upload.
          expected=(
            "termiHub-${VERSION}-macos-x64.dmg"
            "termiHub-${VERSION}-macos-arm64.dmg"
            "termiHub-${VERSION}-windows-x64.msi"
            "termiHub-${VERSION}-linux-x64.AppImage"
            "termiHub-${VERSION}-linux-x64.deb"
            "termiHub-${VERSION}-linux-arm64.deb"
            "termiHub-${VERSION}-linux-arm64.rpm"
          )

          # Agent binaries — names mirror the agent-binaries-* matrices; each ships
          # a .sha256 sidecar the desktop verifies before install (#1350) and a
          # .sig signature the agent verifies before a self-update (AGT-005).
          agents=(
            termihub-agent-linux-x64
            termihub-agent-linux-arm64
            termihub-agent-linux-armv7
            termihub-agent-macos-arm64
            termihub-agent-macos-x64
            termihub-agent-windows-x64.exe
            termihub-agent-windows-arm64.exe
          )
          for a in "${agents[@]}"; do
            expected+=("$a" "${a}.sha256" "${a}.sig")
          done

          # CycloneDX SBOMs from the sbom job (CI-022).
          for c in desktop agent rdp-sidecar frontend; do
            expected+=("termiHub-${VERSION}-sbom-${c}.cdx.json")
          done

          # Third-party license notices from upload-third-party-notices (PKG-009).
          expected+=("termiHub-${VERSION}-THIRD_PARTY_NOTICES.txt")

          echo "Fetching asset list for ${TAG}..."
          mapfile -t actual < <(gh release view "$TAG" --json assets --jq '.assets[].name')

          printf 'Found %d assets:\n' "${#actual[@]}"
          if [ "${#actual[@]}" -gt 0 ]; then
            printf '  %s\n' "${actual[@]}"
          fi

          missing=()
          for want in "${expected[@]}"; do
            found=0
            for have in "${actual[@]}"; do
              if [ "$have" = "$want" ]; then
                found=1
                break
              fi
            done
            if [ "$found" -ne 1 ]; then
              missing+=("$want")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Release ${TAG} is missing ${#missing[@]} expected asset(s):"
            printf '::error::  missing %s\n' "${missing[@]}"
            exit 1
          fi
          echo "All ${#expected[@]} expected assets are present."

          # Release notes must be non-empty (extracted from CHANGELOG or generated
          # from commits by the create-release job).
          BODY=$(gh release view "$TAG" --json body --jq '.body')
          if [ -z "${BODY//[[:space:]]/}" ]; then
            echo "::error::Release ${TAG} has empty release notes."
            exit 1
          fi
          echo "Release notes present (${#BODY} chars)."

      # Every published artifact must carry a build-provenance attestation from
      # THIS workflow at THIS tag (CI-022) — the same check users run. The
      # .sha256/.sig sidecars are not attested (they derive from the binary's
      # digest, which the attestation already binds), so they are skipped.
      - name: Verify build provenance attestations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          work="$RUNNER_TEMP/attestation-verify"
          mkdir -p "$work"
          cd "$work"
          mapfile -t subjects < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name | select(endswith(".sha256") or endswith(".sig") | not)')
          failed=()
          for f in "${subjects[@]}"; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$f"
            if gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-ref "refs/tags/${TAG}" >/dev/null; then
              echo "attested: $f"
            else
              failed+=("$f")
            fi
            rm -f "$f"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::${#failed[@]} release asset(s) lack a valid provenance attestation:"
            printf '::error::  %s\n' "${failed[@]}"
            exit 1
          fi
          echo "All ${#subjects[@]} release artifacts carry valid build provenance."

  # Publish the verified draft (PKG2-006, #4361). create-release made the
  # release a draft so a failed leg could be re-run (every upload uses
  # --clobber) without a half-populated release being public. Only after
  # verify-release confirmed the full asset set and every attestation does this
  # job publish it, still NOT as latest (make_latest=false): mark-latest alone
  # promotes a stable release, after the install smokes. It runs before the
  # smokes because they download with a read-only token, which cannot see a
  # draft. Re-running it on an already-published release is a no-op.
  publish-release:
    name: Publish Release
    needs: [create-release, verify-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/internal

      - name: Publish the draft release (not latest)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: scripts/internal/release-draft.sh publish --tag "v${VERSION}"

  # Platform install smokes (PKG-006, #4281): each release-*-smoke.yml is a
  # reusable workflow that installs and launches the just-verified artifacts on
  # hosted runners. They run INSIDE the Release run, after verify-release (and
  # publish-release, #4361) and before mark-latest, so a release whose installer does not install or launch
  # never becomes GitHub's "Latest release". Release Windows Smoke also calls
  # plugin-lpac-per-machine.yml (#4252), so that check gates mark-latest too.
  # Each smoke keeps workflow_dispatch for a manual re-run against any release.
  smoke-linux:
    name: Install smoke - Linux x64
    needs: [create-release, verify-release, publish-release]
    permissions:
      contents: read
    uses: ./.github/workflows/release-linux-smoke.yml
    with:
      tag: v${{ needs.create-release.outputs.version }}

  smoke-linux-arm64:
    name: Install smoke - Linux arm64
    needs: [create-release, verify-release, publish-release]
    permissions:
      contents: read
    uses: ./.github/workflows/release-linux-arm64-smoke.yml
    with:
      tag: v${{ needs.create-release.outputs.version }}

  smoke-macos:
    name: Install smoke - macOS
    needs: [create-release, verify-release, publish-release]
    permissions:
      contents: read
      # `gh attestation verify` fetches the provenance bundles.
      attestations: read
    uses: ./.github/workflows/release-macos-smoke.yml
    with:
      tag: v${{ needs.create-release.outputs.version }}

  smoke-windows:
    name: Install smoke - Windows x64
    needs: [create-release, verify-release, publish-release]
    permissions:
      contents: read
      # `gh attestation verify` fetches the provenance bundles.
      attestations: read
    uses: ./.github/workflows/release-windows-smoke.yml
    with:
      tag: v${{ needs.create-release.outputs.version }}

  smoke-windows-arm64:
    name: Install smoke - Windows arm64 agent
    needs: [create-release, verify-release, publish-release]
    permissions:
      contents: read
      # `gh attestation verify` fetches the provenance bundles.
      attestations: read
    uses: ./.github/workflows/release-windows-arm64-smoke.yml
    with:
      tag: v${{ needs.create-release.outputs.version }}

  # Promote a verified, install-smoked stable release to GitHub's "Latest
  # release" (PKG-014). Replaces the old force-moved `latest` git tag: the
  # desktop update check and the agent self-updater poll the releases/latest API,
  # which follows this marker. Runs only after verify-release AND every install
  # smoke succeeded (#4281), so "Latest" never points at a release with missing
  # assets or attestations, or one that does not install and launch. There is
  # deliberately no `if:` here: a failed or skipped smoke skips this job, and the
  # release stays published but not latest (create-release passes --latest=false
  # and publish-release make_latest=false) while the previous latest keeps
  # serving clients. Fix a flaky smoke with
  # `gh run rerun <run-id> --failed`, which re-runs it and then this job.
  # Prereleases are skipped — GitHub never marks them latest.
  mark-latest:
    name: Mark Latest Release
    needs:
      [
        create-release,
        verify-release,
        publish-release,
        smoke-linux,
        smoke-linux-arm64,
        smoke-macos,
        smoke-windows,
        smoke-windows-arm64,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # No checkout in this job; GH_REPO tells gh which repository to act on.
    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Mark stable release as latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if [ "$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease')" = "true" ]; then
            echo "${TAG} is a prerelease; leaving GitHub's latest-release marker unchanged."
            exit 0
          fi
          gh release edit "$TAG" --latest
          echo "${TAG} is now GitHub's latest release."
