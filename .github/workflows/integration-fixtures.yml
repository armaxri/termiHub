name: Integration (Docker fixtures)

# Exercises the tests/docker fixtures end-to-end. The regular "Run Tests" job
# runs `cargo test --workspace --all-features` with NO containers up, so every
# `require_docker!`-gated integration test in core/tests skips — which is how a
# broken fixture (e.g. the telnet daemon serving nothing, or a perpetually
# "unhealthy" container) can rot unnoticed (#858). This lane brings the fixtures
# up and runs that suite against them, so a broken fixture fails CI.
#
# Not on every PR (it builds container images and runs network tests, so it is
# slower and Docker-bound): nightly + manual + a path-filtered PR subset instead.
# Trigger by hand from the Actions tab ("Run workflow") when touching tests/docker
# or core/tests. A release is never cut on the path-filtered PR subset: the
# Release workflow requires release-candidate.yml, which calls this lane with no
# path filter on the exact release commit (#3652).

on:
  schedule:
    # 03:17 UTC daily (off the top of the hour to dodge scheduler congestion).
    - cron: "17 3 * * *"
  workflow_dispatch:
  # Called by release-candidate.yml (#3652) on the exact release commit; the
  # checkouts below default to the caller's sha, and no path filter applies.
  workflow_call:
  # Also run when the fixtures, the integration tests, or the backend *source*
  # they exercise change — so a PR that edits the SSH/SFTP/telnet/serial/Docker
  # backends gets integration feedback without waiting for the nightly run. The
  # `require_docker!`-gated tests in core/tests self-skip on the per-PR gate
  # (which runs with no containers up), so a backend change would otherwise reach
  # `develop` with its integration path completely unexercised (#2050).
  pull_request:
    paths:
      - "tests/docker/**"
      - "core/tests/**"
      - "core/src/backends/**"
      # The session/connection plumbing that drives those backends, and the core
      # modules the fixture suites call into directly (#3652, WA-CI-024): every
      # core/tests file goes through `termihub_core::connection` (registry, schema
      # defaults), the transfer suites through `files`, the tunnel suite through
      # `tunnel`, and the FTP/SSH backends retry through `reconnect_backoff`. A change
      # there can break a live backend path as surely as a backends/** edit.
      # Deliberately NOT widened to agent/** or src-tauri/**: this lane runs
      # `-p termihub-core` only, so an agent/desktop change gains no coverage here
      # (the agent's Docker/live suites run in system-integration and Code
      # Quality). Cargo.lock is also left out: lockfile bumps land weekly and
      # would run this Docker lane on every one; the nightly run and the release
      # gate catch a dependency regression before it ships.
      - "core/src/connection/**"
      - "core/src/session/**"
      - "core/src/files/**"
      - "core/src/tunnel/**"
      - "core/src/reconnect_backoff.rs"
      - "core/src/reconnect_backoff/**"
      - "core/Cargo.toml"
      # The RDP sidecar is backend source too: rdp.rs drives it end to end.
      - "rdp-sidecar/**"
      # The Linux polkit verifier's D-Bus transport + the shipped action file
      # (the polkit-dbus job below; its fixture is under tests/docker/**).
      - "src-tauri/src/credential/os_auth/polkit.rs"
      - "src-tauri/src/credential/os_auth/polkit/**"
      - "src-tauri/packaging/linux/com.termihub.app.policy"
      - ".github/workflows/integration-fixtures.yml"

# A fixture run is self-contained; cancel an in-flight run when a newer commit
# lands on the same ref. `github.workflow` is the CALLER's name when this lane is
# called by release-candidate.yml, so a candidate run and a nightly/PR run on the
# same ref never cancel each other.
concurrency:
  group: integration-fixtures-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token (CI-010). The job checks out, brings up Docker fixtures,
# and runs the core integration suite — no PR comment, check-run, or push — so a
# read-only token is sufficient.
permissions:
  contents: read

jobs:
  core-integration:
    name: core/tests against live fixtures
    runs-on: ubuntu-latest
    # The instrumented (coverage) build on nightly/manual runs is slower than a
    # plain `cargo test`; 60 min leaves room for it.
    timeout-minutes: 60

    env:
      # Integration coverage (TOOL-005, #3656): manually dispatched runs
      # (including the nightly develop dispatch) measure the suite with cargo-llvm-cov and upload the lcov, which the
      # Coverage workflow (coverage.yml) merges into the unified report.
      # PR-triggered runs stay a plain `cargo test`, so PR runtime is unchanged.
      # The develop nightly is dispatched by integration-coverage-nightly.yml.
      #
      # NOT when called by release-candidate.yml (#3652): under workflow_call,
      # `github.event_name` and `github.workflow_ref` are the CALLER's, so a
      # dispatched candidate run would otherwise read as `workflow_dispatch` and
      # instrument. The release gate runs the plain `cargo test` instead — its
      # artifact would sit on the Release Candidate run, which
      # fetch-integration-coverage.mjs (it lists integration-fixtures.yml runs)
      # never reads, so instrumenting it would only slow the gate. The
      # workflow_ref check tells a direct run of this file from a called one.
      #
      # NOT on `schedule` either (#3664): a scheduled run fires from main but
      # checks out develop, so its run metadata (branch, head_sha) would not
      # match the code it measured and fetch-integration-coverage.mjs would
      # merge develop's lcov into main's report. develop's instrumented run is
      # the integration-coverage-nightly.yml dispatch.
      MEASURE_COVERAGE: >-
        ${{ github.event_name == 'workflow_dispatch'
        && contains(github.workflow_ref, '/.github/workflows/integration-fixtures.yml@') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The nightly grades develop, the active branch (#3664). A scheduled
          # run fires from the default branch (main), so without this it would
          # only ever re-test main's frozen code. Every other trigger keeps
          # checkout's default ref: a PR's merge ref, the dispatching branch, or
          # the release-candidate caller's sha.
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          # cargo-llvm-cov needs llvm-tools-preview to instrument and report.
          components: ${{ env.MEASURE_COVERAGE == 'true' && 'llvm-tools-preview' || '' }}

      - name: Install cargo-llvm-cov
        if: env.MEASURE_COVERAGE == 'true'
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: cargo-llvm-cov

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The RDP sidecar is a workspace-excluded crate with its own target dir.
          workspaces: |
            . -> target
            rdp-sidecar -> target

      - name: Build the RDP sidecar
        # core/tests/rdp.rs drives the real `termihub-rdp-helper` (#3609). It is
        # workspace-excluded (own Cargo.lock), so `cargo test` never builds it;
        # the sidecar links libasound2 (audio redirection) on Linux.
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
          ./scripts/build-rdp-sidecar.sh

      - name: Bring up the Docker fixtures
        # `--wait` blocks until every container is healthy — viable because the
        # healthchecks were fixed to probe via bash /dev/tcp instead of an
        # uninstalled `nc` (#852). The suite runs with `--all-features`, so every
        # feature-gated `require_docker!` test compiles AND runs — each must have
        # its fixture up or (under TERMIHUB_REQUIRE_DOCKER=1) it hard-fails:
        #   * stress   -> sftp-stress (sftp_stress.rs, `ssh`)
        #   * fault    -> network-fault-proxy (network_resilience.rs, `ssh`)
        #   * network  -> network-target / ssh-tunnel-target ports
        #   * ftp      -> ftp-server:21 (ftp_file_browser/reconnect/transfer.rs, `ftp`)
        #   * vnc      -> vnc-server:5900 + vnc-vencrypt-server:5900 (vnc.rs, `vnc`)
        #   * rdp      -> rdp-server:3389 (xrdp) + :3390 (FreeRDP shadow, NLA)
        #                 (rdp.rs, `rdp-sidecar`)
        # The default-profile services (ssh-*, telnet, ssh-x11) come up regardless.
        # The `agent` profile is omitted (no core/tests target it — the agent
        # suite lives in the `agent` crate, not this `-p termihub-core` lane).
        run: |
          docker compose -f tests/docker/docker-compose.yml \
            --profile stress --profile fault --profile network \
            --profile ftp --profile vnc --profile rdp \
            up -d --build --wait

      - name: Run core integration suite against the fixtures
        # `--all-features` enables the `docker` feature the integration tests
        # compile against; with the fixtures up, the `require_docker!` guards run
        # the tests instead of skipping them.
        #
        # TERMIHUB_REQUIRE_DOCKER=1 (TBE-006): this lane ALWAYS provisions the
        # fixtures — the unconditional "Bring up the Docker fixtures" step above
        # runs `docker compose … up -d --build --wait`, and `--wait` blocks until
        # every container is healthy, so by the time this step runs Docker is
        # guaranteed present. Without this var, a fixture that is nevertheless
        # unreachable (a container that never mapped its port, a compose that
        # partially came up) would make `require_docker!` *skip* the test and the
        # lane would go falsely green — "tests passed" when they never ran. Setting
        # it turns that missing/broken fixture into a hard FAIL instead of a silent
        # skip, so this Docker-backed lane cannot report green without actually
        # exercising the fixtures. Scoped to this step because it is the only one
        # that runs the `require_docker!`-gated core/tests; the local/per-PR gate
        # (no containers) leaves it unset, so those runs still skip as before.
        env:
          TERMIHUB_REQUIRE_DOCKER: "1"
          # The sidecar built above; rdp.rs hard-fails without it under
          # TERMIHUB_REQUIRE_DOCKER instead of skipping.
          TERMIHUB_RDP_HELPER: ${{ github.workspace }}/rdp-sidecar/target/debug/termihub-rdp-helper
        #
        # `--test-threads=1` is required: the suites share single-instance
        # containers, and running them concurrently makes them stomp on shared
        # state (e.g. the network-fault-proxy's `tc` qdisc → "Exclusivity flag
        # on, cannot modify").
        #
        # Under MEASURE_COVERAGE the same tests run instrumented; `--no-report`
        # defers the lcov export to the always() step below, so a failing test
        # still yields coverage for everything that did run.
        run: |
          if [ "$MEASURE_COVERAGE" = "true" ]; then
            cargo llvm-cov --no-report -p termihub-core --all-features -- --test-threads=1
          else
            cargo test -p termihub-core --all-features -- --test-threads=1
          fi

      - name: Export integration coverage (lcov)
        # advisory: a coverage hiccup must never red the fixture lane, whose
        # tests (the step above) are the forcing function; coverage is an overlay.
        if: always() && env.MEASURE_COVERAGE == 'true'
        continue-on-error: true
        run: |
          mkdir -p integration-coverage
          cargo llvm-cov report -p termihub-core --lcov \
            --output-path integration-coverage/integration.lcov
          {
            echo "## Integration coverage (core/tests against live fixtures)"
            echo ""
            echo '```'
            node scripts/internal/lcov-summary.mjs integration-coverage/integration.lcov
            echo '```'
            echo ""
            echo "Merged into the unified report by the next Coverage workflow run on this branch."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload integration coverage artifact
        if: always() && env.MEASURE_COVERAGE == 'true'
        # advisory: same as the export step; the fixture tests are the gate.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # coverage.yml looks the artifact up by this name
          # (scripts/internal/fetch-integration-coverage.mjs).
          name: integration-coverage
          path: integration-coverage/integration.lcov
          retention-days: 14
          if-no-files-found: warn

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f tests/docker/docker-compose.yml --profile all logs --tail=200

      - name: Tear down the fixtures
        if: always()
        run: docker compose -f tests/docker/docker-compose.yml --profile all down -v

  native-sshd:
    # SSH/SFTP core journeys against the platform's OWN OpenSSH server (CI-020,
    # TIN-007). The Docker fixtures above are Linux-only (macOS runners have no
    # container runtime; Windows runners run only Windows containers), so
    # core/tests/ssh_native.rs runs here against a native loopback sshd on all
    # three OSes: unprivileged /usr/sbin/sshd on macOS/Linux, a Win32-OpenSSH
    # service + local test user on Windows. TERMIHUB_NATIVE_SSHD=1 (exported by
    # the fixture) turns a missing fixture into a hard failure, never a skip.
    #
    # Nightly / manual / release gate only -- not on the path-filtered PRs: it
    # costs a macOS and a Windows runner. Dispatch this workflow on a branch to
    # try it. The whole recipe (fixture up -> suite -> sshd log on failure ->
    # teardown) is scripts/internal/run-native-sshd-suites.sh in the checked-out
    # tree, so a scheduled run (main's copy of this file) runs develop's recipe.
    if: github.event_name != 'pull_request'
    name: SSH/SFTP journeys against native sshd (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Nightly grades develop; see core-integration's checkout (#3664).
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run the native-sshd SSH/SFTP suites
        # bash on every OS (Git Bash on Windows, where the fixture script hands
        # over to its PowerShell twin).
        shell: bash
        run: scripts/internal/run-native-sshd-suites.sh

  polkit-dbus:
    # The Linux OS re-auth verifier's real polkit D-Bus path (#3553): a Debian
    # container with a system bus + polkitd, driven through registered /
    # unregistered action, authorized, denied, dismissed, no-agent and the
    # timeout -> CancelCheckAuthorization outcomes. Self-contained (builds its
    # probe in a rust container), so it needs no Rust toolchain on the runner.
    name: polkit D-Bus verifier (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Nightly grades develop; see core-integration's checkout (#3664).
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}

      - name: Run the polkit D-Bus integration test
        run: tests/docker/polkit/run.sh --clean
