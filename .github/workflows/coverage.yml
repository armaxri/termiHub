name: Coverage (unified, ratchet)

# Unified whole-app coverage — the frontend (vitest/v8) and the Rust
# backend/agent/core crates merged into ONE repo-wide number (TOOL-001/002/003).
# See scripts/coverage.sh.
#
# BLOCKING FAIL-ON-DECREASE RATCHET (#3740 — CI-011, TBE-007): scripts/coverage.sh
# grades the per-component UNIT line coverage (frontend, core, agent, src-tauri
# and the unified total) against the committed linux baseline in
# scripts/coverage-baseline.json (scripts/internal/coverage-ratchet.mjs) and
# exits non-zero when any component drops more than the baseline's tolerance
# (0.25 pp). The nightly integration overlay is reported but not gated — its
# availability varies run to run. When coverage improves, raise the baseline
# with `./scripts/coverage.sh --update-baseline` (raise-only) and commit it;
# lowering a value is a deliberate, reviewed edit of the JSON.
#
# NIGHTLY LANE (#4119; post-merge since #3325): this no longer runs on every
# push to develop (a ~21-minute Ubuntu runner per merge). It grades:
#   * develop — once a night: the `schedule` trigger fires on the DEFAULT branch
#     (main) only, so the scheduled run just dispatches this workflow on
#     develop (the `nightly-dispatch` job), like integration-coverage-nightly.yml.
#     Timed after develop's integration-fixtures (03:47 dispatch) and
#     system-integration (05:05) nightlies so their lcov overlays are fresh.
#   * main — on every push (release commits): the release coverage summary
#     (scripts/internal/release-coverage-summary.mjs) reads the Coverage push or
#     dispatch run on the exact release commit.
#   * any ref on demand: `gh workflow run coverage.yml --ref <ref>`.
# A drop therefore reds the next nightly develop run (a batch of a day's merges),
# not the PR that caused it. The blocking vitest coverage floors (#2066) still
# gate every frontend PR via the Ubuntu "Run Tests" leg.
on:
  push:
    branches: [ main ]
  schedule:
    # 07:23 UTC daily (off the hour to dodge scheduler congestion).
    - cron: '23 7 * * *'
  workflow_dispatch:

# A blocking gate on a low-volume trigger set (main pushes, the nightly, manual
# dispatch): every run completes, so none cancels in progress. The event name is
# part of the group so the nightly dispatch never queues behind a main push.
concurrency:
  group: coverage-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

# Least-privilege token (CI-010). The job checks out, runs coverage, and uploads
# the coverage artifact via the artifact API (no contents-write needed) — it does
# not comment on the PR or push, so a read-only token is sufficient.
# `actions: read` lets it list the integration-fixtures runs and download their
# `integration-coverage` artifact (TOOL-005, #3656).
permissions:
  contents: read
  actions: read

jobs:
  # The scheduled run (on main, the default branch) only re-dispatches this
  # workflow on develop. A GITHUB_TOKEN-created workflow_dispatch is allowed to
  # start a new workflow run, so no PAT is needed.
  nightly-dispatch:
    name: Dispatch nightly coverage on develop
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch coverage.yml on develop
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run coverage.yml --ref develop

  coverage:
    name: Unified Coverage (ratchet)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # cargo-llvm-cov needs the llvm-tools-preview rustup component to
      # instrument and merge coverage (TOOL-003).
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Match the other cargo jobs: only develop/main SAVE the cache; PRs
          # restore the develop cache and never write their own.
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # Prebuilt binary download (~seconds) instead of `cargo install`, matching
      # the cargo-audit/cargo-deny pattern already used in code-quality.yml.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: cargo-llvm-cov

      # Nightly integration coverage (TOOL-005, #3656): the integration-fixtures
      # lane runs core/tests against live Docker fixtures under cargo-llvm-cov on
      # its scheduled/dispatched runs. Fetch the newest such lcov for this branch
      # plus the list of files changed since its commit (their line numbers may
      # have moved, so coverage.sh skips them). Advisory: when none is available
      # the report is unit-only. The ratchet never grades this overlay.
      # It also fetches the bridge harness lane's lcov (system-integration.yml,
      # `harness-coverage-<branch>`, #3657) into coverage-integration/harness/.
      - name: Fetch nightly integration coverage
        # advisory: an optional overlay; without it the report is unit-only.
        # Forcing function: the unit-coverage ratchet (coverage-baseline.json).
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/internal/fetch-integration-coverage.mjs
          --repo "${{ github.repository }}"
          --branch "${{ github.ref_name }}"
          --out-dir coverage-integration

      - name: Run unified coverage
        env:
          TERMIHUB_INTEGRATION_LCOV: coverage-integration/integration.lcov
          TERMIHUB_INTEGRATION_STALE: coverage-integration/stale-files.txt
          TERMIHUB_HARNESS_LCOV: coverage-integration/harness/harness.lcov
          TERMIHUB_HARNESS_STALE: coverage-integration/harness/stale-files.txt
        run: ./scripts/coverage.sh

      - name: Publish unified number to job summary
        if: always()
        run: |
          {
            echo "## Unified whole-app coverage"
            echo ""
            echo '```'
            cat coverage-unified/summary.txt 2>/dev/null || echo "(no summary produced)"
            echo '```'
            echo ""
            if [ -f coverage-unified/ratchet.md ]; then
              echo "### Ratchet (unit coverage vs scripts/coverage-baseline.json)"
              echo ""
              cat coverage-unified/ratchet.md
              echo ""
            fi
            if [ -f coverage-unified/integration-gap.md ]; then
              cat coverage-unified/integration-gap.md
            else
              echo "_Unit tests only: no nightly integration coverage was merged._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unified
          path: |
            coverage-unified/
            coverage/lcov.info
            coverage-integration/
          if-no-files-found: warn
