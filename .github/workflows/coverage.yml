name: Coverage (unified, ratchet)

# Unified whole-app coverage — the frontend (vitest/v8) and the Rust
# backend/agent/core crates merged into ONE repo-wide number (TOOL-001/002/003).
# See scripts/coverage.sh.
#
# BLOCKING FAIL-ON-DECREASE RATCHET (#3740 — CI-011, TBE-007): the "Coverage
# ratchet" step grades the per-component UNIT line coverage (frontend, core,
# agent, src-tauri, plugin-runner, plugin-api, rdp-sidecar and the unified
# total) against the committed linux baseline in
# scripts/coverage-baseline.json (scripts/internal/coverage-ratchet.mjs) and
# exits non-zero when any component drops more than the baseline's tolerance
# (0.25 pp). The nightly integration overlays are not part of the ratchet; their
# freshness is gated separately by the "Integration overlay freshness" step
# (#5346), which runs after the ratchet. When coverage improves, raise the baseline
# with `./scripts/coverage.sh --update-baseline` (raise-only) and commit it;
# lowering a value is a deliberate, reviewed edit of the JSON.
#
# WINDOWS LEG (#5160, COV-002): `coverage-windows` measures the same components
# on windows-latest and grades them against the `win32` baseline. Windows has
# the most platform-only code (ConPTY, named pipes, Credential Manager, LPAC,
# WSL), and none of it reaches the Linux number. It runs the Rust tests in the
# per-PR Windows leg's partition (`coverage.sh --split`): the contention-
# sensitive suites with capped threads and the live-agent-TCP tests one at a
# time, which is what keeps that leg green on a 4-core runner (#2495, #3615).
# The phases run under `cargo llvm-cov nextest` with the per-PR legs' nextest
# `ci` profile (#5349): per-test timeouts and the same serial test groups.
# Same triggers as the Linux job, so it adds one Windows runner per night.
#
# NIGHTLY LANE (#4119; post-merge since #3325): this no longer runs on every
# push to develop (a ~21-minute Ubuntu runner per merge). It grades:
#   * develop — once a day, dispatched on develop by scheduled-dispatch.yml
#     (#4277). That file owns the cron because GitHub fires `schedule:` only
#     from the default branch (main), and this file is not on main between
#     releases. Until scheduled-dispatch.yml itself reaches main, every develop
#     push dispatches this lane when its newest develop run is older than 28 h,
#     and the heartbeat there fails when no develop run succeeded within 36 h.
#     Timed after develop's integration-fixtures and system-integration
#     nightlies so their lcov overlays are fresh.
#   * main — on every push (release commits): the release coverage summary
#     (scripts/internal/release-coverage-summary.mjs) reads the Coverage push or
#     dispatch run on the exact release commit.
#   * any ref on demand: `gh workflow run coverage.yml --ref <ref>`.
# A drop therefore reds the next nightly develop run (a batch of a day's merges),
# not the PR that caused it. The blocking vitest coverage floors (#2066) still
# gate every frontend PR via the Ubuntu "Run Tests" leg.
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      overlay-branch:
        description: >-
          Branch whose nightly integration overlays to merge (default: the
          dispatched ref). Pass `develop` to grade a feature branch against
          develop's overlays and their freshness gate.
        required: false
        default: ''
        type: string

# A blocking gate on a low-volume trigger set (main pushes, the nightly dispatch,
# manual dispatch): every run completes, so none cancels in progress. The event
# name is part of the group so the nightly dispatch never queues behind a main push.
concurrency:
  group: coverage-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

# Least-privilege token (CI-010). The job checks out, runs coverage, and uploads
# the coverage artifact via the artifact API (no contents-write needed) — it does
# not comment on the PR or push, so a read-only token is sufficient.
# `actions: read` lets it list the integration-fixtures runs and download their
# `integration-coverage` artifact (TOOL-005, #3656).
permissions:
  contents: read
  actions: read

jobs:
  coverage:
    name: Unified Coverage (ratchet)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # fetch-integration-coverage.mjs git-fetches the measured commit anonymously
          # (the repo is public), so no token is persisted (#4729).
          persist-credentials: false

      # cargo-llvm-cov needs the llvm-tools-preview rustup component to
      # instrument and merge coverage (TOOL-003).
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          cache: "true"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Match the other cargo jobs: only develop/main SAVE the cache; PRs
          # restore the develop cache and never write their own.
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Make apt retry downloads
        uses: ./.github/actions/apt-retries

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev

      # Prebuilt binary download (~seconds) instead of `cargo install`, matching
      # the cargo-audit/cargo-deny pattern already used in code-quality.yml.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: cargo-llvm-cov@0.9.1

      # Nightly integration coverage (TOOL-005, #3656): the integration-fixtures
      # lane runs core/tests against live Docker fixtures under cargo-llvm-cov on
      # its scheduled/dispatched runs. Fetch the newest such lcov for this branch
      # plus the list of files changed since its commit (their line numbers may
      # have moved, so coverage.sh skips them). Advisory: when none is available
      # the report is unit-only. The ratchet never grades this overlay.
      # It also fetches the bridge harness lane's lcov (system-integration.yml,
      # `harness-coverage-<branch>`, #3657) into coverage-integration/harness/.
      - name: Fetch nightly integration coverage
        # advisory: an optional overlay; without it the report is unit-only.
        # Forcing function: the unit-coverage ratchet (coverage-baseline.json).
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OVERLAY_BRANCH: ${{ inputs.overlay-branch || github.ref_name }}
        run: >-
          node scripts/internal/fetch-integration-coverage.mjs
          --repo "${{ github.repository }}"
          --branch "$OVERLAY_BRANCH"
          --out-dir coverage-integration

      - name: Run unified coverage
        env:
          TERMIHUB_INTEGRATION_LCOV: coverage-integration/integration.lcov
          TERMIHUB_INTEGRATION_STALE: coverage-integration/stale-files.txt
          TERMIHUB_HARNESS_LCOV: coverage-integration/harness/harness.lcov
          TERMIHUB_HARNESS_STALE: coverage-integration/harness/stale-files.txt
        # Measures only; the ratchet is the next step (#5159). A failure HERE means
        # the lane is broken (a test, the build or a tool failed) — not a drop.
        run: ./scripts/coverage.sh --no-ratchet

      # The gate, as its own step so a red run names its cause: a failure in THIS
      # step is a coverage drop (the error names the component), which the
      # scheduled-lane heartbeat reports as "ratchet drop", not "lane broken".
      # Keep the step name in sync with `gateSteps` in scheduled-lanes.mjs.
      - name: Coverage ratchet
        run: >-
          node scripts/internal/coverage-ratchet.mjs --check
          --report coverage-unified/ratchet.md

      - name: Publish unified number to job summary
        if: always()
        run: |
          {
            echo "## Unified whole-app coverage (linux)"
            echo ""
            echo '```'
            cat coverage-unified/summary.txt 2>/dev/null || echo "(no summary produced)"
            echo '```'
            echo ""
            if [ -f coverage-unified/ratchet.md ]; then
              echo "### Ratchet (unit coverage vs scripts/coverage-baseline.json)"
              echo ""
              cat coverage-unified/ratchet.md
              echo ""
            fi
            if [ -f coverage-unified/integration-gap.md ]; then
              cat coverage-unified/integration-gap.md
            else
              echo "_Unit tests only: no nightly integration coverage was merged._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The overlays' own gate (#5346, COV-022), after the ratchet so its verdict
      # never depends on them. It prints each overlay's source sha, age, commits
      # behind HEAD and stale-file share into the summary, and FAILS on develop
      # when an overlay is missing or older than 3 days: its nightly lane went
      # dark. The error names the lane and links its latest run. More than 10 %
      # stale only WARNS (develop churns past that within a day). Other
      # branches only warn. overlay-freshness.mjs holds the thresholds.
      # Keep the step name in sync with `gateSteps` in scheduled-lanes.mjs.
      - name: Integration overlay freshness
        if: always()
        run: >-
          node scripts/internal/overlay-freshness.mjs
          --status coverage-integration/overlay-status.json
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unified
          path: |
            coverage-unified/
            coverage/lcov.info
            coverage-integration/
          if-no-files-found: warn

  # The Windows twin of the job above (#5160): same script, same ratchet, graded
  # against the `win32` baseline. Keep the gate step's name "Coverage ratchet"
  # (scheduled-lanes.mjs `gateSteps`): the heartbeat names the failing job, so a
  # Windows-only drop reads "ratchet drop (Unified Coverage (Windows) / ...)".
  coverage-windows:
    name: Unified Coverage (Windows)
    runs-on: windows-latest
    # Backstop only: the split run is slower than Linux's single pass.
    timeout-minutes: 150
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          cache: "true"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Its own key: the instrumented Windows build shares nothing with the
          # Linux job's cache. Only develop/main save it, like every cargo job.
          key: coverage-windows
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: cargo-llvm-cov@0.9.1

      # The split run's phases run under `cargo llvm-cov nextest` (#5349): the
      # same per-test timeouts and test groups as the per-PR Windows leg, so a
      # hung test fails by name instead of eating the job's timeout. Same pin
      # and the same verified-archive-only install as code-quality.yml (#5345).
      - name: Install cargo-nextest
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: cargo-nextest@0.9.143
          fallback: none

      # core/tests/sideloaded_conpty.rs runs a real PTY on the pinned sideloaded
      # ConPTY host and fails, never skips, on a runner without it (#4130) —
      # staged exactly as the per-PR Windows "Run Tests" leg does.
      - name: Stage the sideloaded ConPTY host for the Rust tests
        run: |
          set -euo pipefail
          dest="$(cygpath -u "$RUNNER_TEMP")/conpty-test-host"
          ./scripts/internal/fetch-conpty.sh --arch x64 --dest "$dest"
          echo "TERMIHUB_TEST_CONPTY_DIR=$(cygpath -w "$dest")" >>"$GITHUB_ENV"

      # Unit coverage only: the nightly integration overlays are Linux fixture
      # runs, so their line numbers say nothing about the Windows build.
      - name: Run unified coverage
        env:
          # The per-PR Windows leg's live-agent cold-start gate (code-quality.yml).
          TERMIHUB_AGENT_TEST_MAX_CONCURRENT: '2'
        # Measures only; a failure HERE means the lane is broken, not a drop.
        run: ./scripts/coverage.sh --no-ratchet --split

      - name: Coverage ratchet
        run: >-
          node scripts/internal/coverage-ratchet.mjs --check
          --report coverage-unified/ratchet.md

      - name: Publish unified number to job summary
        if: always()
        run: |
          {
            echo "## Unified whole-app coverage (Windows)"
            echo ""
            echo '```'
            cat coverage-unified/summary.txt 2>/dev/null || echo "(no summary produced)"
            echo '```'
            echo ""
            if [ -f coverage-unified/ratchet.md ]; then
              echo "### Ratchet (unit coverage vs the win32 baseline)"
              echo ""
              cat coverage-unified/ratchet.md
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Its own name: release-coverage-summary.mjs reads `coverage-unified`
      # (the Linux job's) for the release notes.
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unified-windows
          path: |
            coverage-unified/
            coverage/lcov.info
          if-no-files-found: warn
