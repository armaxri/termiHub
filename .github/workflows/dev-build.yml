name: Dev Build

on:
  push:
    branches:
      - main
      - develop

# Only the latest commit's dev build matters (#3325): a newer push to the same
# branch cancels the in-flight run instead of stacking another ~90 runner-minutes
# (five of them on scarce macOS) behind it. Only publish-release touches the
# `dev-*-latest` release, and it stages the new build in a draft before swapping
# (#4471): a cancelled run leaves the old release in place (plus a stale draft
# the next publish deletes); only a cancel inside the seconds-long swap leaves
# no release until the newer run publishes. Tag releases live in release.yml,
# which is deliberately NOT cancellable.
concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ── 1. Determine release tag (read-only; never touches the release) ───────
  prepare-release:
    name: Prepare Dev Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      branch: ${{ steps.vars.outputs.branch }}

    steps:
      - name: Set release variables
        id: vars
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          if [ "$BRANCH" = "main" ]; then
            TAG="dev-latest"
          else
            TAG="dev-${BRANCH}-latest"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

  # ── 2. Build and stage desktop app artifacts ───────────────────────────────
  build-app:
    name: Build App - ${{ matrix.platform }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Intel
          - platform: macos-x64
            os: macos-latest
            rust_target: x86_64-apple-darwin
            file_ext: .dmg
            bundle_path: dmg

          # macOS Apple Silicon
          - platform: macos-arm64
            os: macos-latest
            rust_target: aarch64-apple-darwin
            file_ext: .dmg
            bundle_path: dmg

          # Windows x64
          - platform: windows-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            file_ext: .msi
            bundle_path: msi
            # Sideloaded ConPTY host next to termihub.exe (#4121).
            extra_config: '--config src-tauri/tauri.conpty.conf.json'

          # Linux x64
          - platform: linux-x64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            file_ext: .AppImage
            bundle_path: appimage

          # Linux ARM64 — AppImage not supported on ARM64 (linuxdeploy is x86_64-only)
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            file_ext: .deb
            bundle_path: deb
            extra_args: '--bundles deb,rpm'

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Shared with build.yml (same rust target → same shared-key): these
          # full release builds on push to develop/main warm the cache that PR
          # builds restore, so PRs don't start from a cold Rust cache.
          shared-key: tauri-${{ matrix.rust_target }}
          # Budget guard (#1006): only the three targets the PR Build workflow
          # (build.yml) actually restores — Linux x64, macOS arm64, Windows x64 —
          # are worth persisting into the shared 10 GB repo cache. The two
          # dev-build-only targets (linux-arm64, macos-x64) are never restored by
          # any PR, so saving them just crowds out the PR-blocking caches and
          # forces LRU eviction of the Windows PR cache. Those two post-merge
          # builds run cold instead — non-blocking.
          save-if: >-
            ${{ matrix.rust_target == 'x86_64-unknown-linux-gnu'
              || matrix.rust_target == 'aarch64-apple-darwin'
              || matrix.rust_target == 'x86_64-pc-windows-msvc' }}

      - name: Install system dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf \
            libarchive-tools

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The RDP sidecar (#1747) is a workspace-excluded crate with its own
      # Cargo.lock. It ships next to the desktop binary via Tauri `externalBin`
      # (#1754), so it must be cross-built for this matrix target and staged into
      # src-tauri/binaries/ BEFORE tauri-action runs — tauri-build rejects a
      # missing externalBin. `externalBin` lives in the bundle-only config
      # fragment tauri.sidecar.conf.json (merged via --config below), so per-PR
      # compile/test jobs stay sidecar-free. Run through Git Bash on all runners.
      - name: Build RDP sidecar for bundling
        shell: bash
        run: ./scripts/build-rdp-sidecar.sh --release --target ${{ matrix.rust_target }} --tauri-externalbin

      # The plugin runner (#4182) is the second externalBin in
      # tauri.sidecar.conf.json (#4202). Stage it before tauri-action too:
      # core/build.rs embeds the staged runner's SHA-256, which the app checks
      # before spawning the bundled runner. Windows MSVC links the static VC
      # runtime (#4172); macOS ad-hoc signs it under its installed name so the
      # re-sign below leaves its bytes, and so the digest, unchanged.
      - name: Build plugin runner for bundling
        shell: bash
        run: ./scripts/build-plugin-runner.sh --release --target ${{ matrix.rust_target }} --tauri-externalbin

      # Windows local shells need the sideloaded ConPTY host (#4121): the inbox
      # ConPTY strips SIXEL/inline-image sequences. Fetch Microsoft's
      # conpty.dll + OpenConsole.exe at the pinned version, SHA-256-verified
      # against src-tauri/packaging/windows/conpty.env (a mismatch fails the job),
      # and stage them for the bundle-only fragment tauri.conpty.conf.json, which
      # the Windows matrix entry merges via extra_config below. tauri-build
      # rejects a missing resource, so this must run first.
      - name: Fetch sideloaded ConPTY (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./scripts/internal/fetch-conpty.sh --arch x64

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TERMIHUB_DEV_BUILD: 'true'
          TERMIHUB_BUILD_BRANCH: ${{ needs.prepare-release.outputs.branch }}
        with:
          tagName: ''
          releaseName: ''
          releaseBody: ''
          releaseDraft: false
          prerelease: false
          args: --config src-tauri/tauri.sidecar.conf.json --target ${{ matrix.rust_target }} ${{ matrix.extra_config }} ${{ matrix.extra_args }}

      # Fail the build, not the user, if the sideloaded ConPTY host (#4121) is
      # missing from the installer, misplaced (it must sit next to termihub.exe,
      # where portable-pty looks), altered, or not Microsoft-signed. The MSI is
      # administrative-extracted (no install); the target dir is what the
      # unbundled exe uses.
      - name: Verify the sideloaded ConPTY host in the Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          $bundle = "target/$env:RUST_TARGET/release/bundle"
          $msi = Get-ChildItem "$bundle/msi" -Filter *.msi | Select-Object -First 1
          if (-not $msi) { Write-Output "::error::no MSI built"; exit 1 }
          ./scripts/internal/verify-conpty-bundle.ps1 -Msi $msi.FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $nsis = Get-ChildItem "$bundle/nsis" -Filter *-setup.exe | Select-Object -First 1
          if (-not $nsis) { Write-Output "::error::no NSIS setup.exe built"; exit 1 }
          ./scripts/internal/verify-conpty-bundle.ps1 -Nsis $nsis.FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./scripts/internal/verify-conpty-bundle.ps1 -Dir "target/$env:RUST_TARGET/release"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Release builds link the Visual C++ runtime statically (#4172), so users
      # install termiHub without the VC++ redistributable. Fail the build if any
      # .exe/.dll in the installer imports VCRUNTIME*/MSVCP*.dll after all (a
      # toolchain or dependency change, or a build outside the release profile).
      - name: Verify no Visual C++ runtime dependency in the Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          $bundle = "target/$env:RUST_TARGET/release/bundle"
          $msi = Get-ChildItem "$bundle/msi" -Filter *.msi | Select-Object -First 1
          if (-not $msi) { Write-Output "::error::no MSI built"; exit 1 }
          ./scripts/internal/verify-no-vcruntime.ps1 -Msi $msi.FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $nsis = Get-ChildItem "$bundle/nsis" -Filter *-setup.exe | Select-Object -First 1
          if (-not $nsis) { Write-Output "::error::no NSIS setup.exe built"; exit 1 }
          ./scripts/internal/verify-no-vcruntime.ps1 -Nsis $nsis.FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # The bundled sidecars must match the digests the app embeds, or the app
      # would refuse them as tampered: the plugin runner (#4202, which must also
      # start) and the RDP helper (#1762). Windows/Linux: the target dir
      # (tauri-build copies the staged sidecars next to termihub). Linux also
      # inside every package: the AppImage bundler (linuxdeploy) patchelfs each
      # ELF in usr/bin, which once broke both digests (#4243). macOS is checked
      # inside the re-signed .app below.
      - name: Verify the bundled sidecars
        if: ${{ !startsWith(matrix.os, 'macos') }}
        shell: bash
        run: |
          set -euo pipefail
          T="${{ matrix.rust_target }}"
          BIN="target/$T/release/termihub"
          if [ "${{ runner.os }}" = "Windows" ]; then BIN="${BIN}.exe"; fi
          scripts/internal/verify-plugin-runner-bundle.sh "$BIN"
          if [ "${{ runner.os }}" = "Linux" ]; then
            check() {
              scripts/internal/verify-plugin-runner-bundle.sh "$1"
              scripts/internal/verify-rdp-helper-bundle.sh "$1"
            }
            scripts/internal/verify-rdp-helper-bundle.sh "$BIN"
            B="$PWD/target/$T/release/bundle"
            X="$(mktemp -d)"
            # Every Linux leg builds a .deb and an .rpm; linux-x64 also the
            # AppImage. Fail on a missing package rather than skip its check.
            want="deb rpm"
            if [ "${{ matrix.bundle_path }}" = "appimage" ]; then want="$want appimage"; fi
            for kind in $want; do
              found=0
              for pkg in "$B/$kind/"*.deb "$B/$kind/"*.rpm "$B/$kind/"*.AppImage; do
                [ -e "$pkg" ] || continue
                found=1
                D="$X/$kind"
                rm -rf "$D" && mkdir -p "$D"
                echo "--- $kind: $(basename "$pkg")"
                rc=0
                case "$kind" in
                deb) dpkg-deb -x "$pkg" "$D" || rc=$? ;;
                # bsdtar (libarchive) reads the rpm payload directly. Not
                # rpm2cpio | cpio: rpm2cpio exits 1 without a message on Tauri's
                # rpms even though it extracts them, which failed this step.
                rpm) bsdtar -xf "$pkg" -C "$D" || rc=$? ;;
                appimage)
                  chmod +x "$pkg"
                  # FUSE is unavailable on GitHub runners, so extract rather than mount.
                  (cd "$D" && "$pkg" --appimage-extract >/dev/null) || rc=$?
                  D="$D/squashfs-root"
                  ;;
                esac
                if [ "$rc" -ne 0 ]; then
                  echo "::error::extracting $kind package $(basename "$pkg") failed (exit $rc)"
                  exit 1
                fi
                if [ ! -f "$D/usr/bin/termihub" ]; then
                  echo "::error::no usr/bin/termihub extracted from $(basename "$pkg")"
                  exit 1
                fi
                check "$D/usr/bin/termihub"
              done
              if [ "$found" -eq 0 ]; then
                echo "::error::no $kind package built under $B/$kind"
                exit 1
              fi
            done
            rm -rf "$X"
          fi

      # Tauri's internal ad-hoc signing can leave the bundle in an inconsistent state
      # (inner components signed in the wrong order), which Gatekeeper classifies as
      # "damaged" — no bypass path exists for that error. A *fully consistent* ad-hoc
      # signature instead triggers "unverified developer", which users can bypass via
      # System Settings → Privacy & Security → Open Anyway (the standard one-time flow).
      # We re-sign the entire bundle ourselves, inside-out, to guarantee consistency.
      # Ad-hoc signatures are also required by the Apple Silicon kernel — a completely
      # unsigned binary is killed immediately at exec time on M1/M2/M3/M4.
      - name: Re-sign macOS DMG with consistent ad-hoc signature
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          DMG=$(find "target/${{ matrix.rust_target }}/release/bundle/dmg" -name "*.dmg" | head -n 1)
          WORKDIR=$(mktemp -d)
          MOUNT="$WORKDIR/mount"
          mkdir "$MOUNT"

          hdiutil attach "$DMG" -mountpoint "$MOUNT" -nobrowse -quiet
          APP_PATH=$(find "$MOUNT" -mindepth 1 -maxdepth 1 -name '*.app' | head -n 1)
          APP_NAME=$(basename "$APP_PATH")
          ditto "$MOUNT/$APP_NAME" "$WORKDIR/$APP_NAME"
          hdiutil detach "$MOUNT" -quiet

          APP="$WORKDIR/$APP_NAME"

          # Sign inside-out: individual Mach-O files first, then nested bundles,
          # then the top-level app. This matches the required codesign ordering and
          # produces a CodeResources manifest that is consistent with all signed content.

          # 1. Sign all individual Mach-O binaries (dylibs, executables, helpers)
          # Every codesign failure is FATAL (PKG-005): a swallowed inner-sign
          # failure is exactly how an inconsistent, Gatekeeper-"damaged" bundle
          # would ship while the job reports success.
          while IFS= read -r -d '' f; do
            if file "$f" 2>/dev/null | grep -q 'Mach-O'; then
              if ! codesign -s - --force "$f"; then
                echo "::error::codesign failed for Mach-O file: $f"
                exit 1
              fi
            fi
          done < <(find "$APP" -type f -print0)

          # 2. Sign nested bundle types as bundles (frameworks, plugins, XPC services)
          while IFS= read -r -d '' bundle; do
            if ! codesign -s - --force "$bundle"; then
              echo "::error::codesign failed for nested bundle: $bundle"
              exit 1
            fi
          done < <(find "$APP" -mindepth 1 -type d \( \
            -name "*.framework" -o -name "*.app" -o \
            -name "*.bundle" -o -name "*.appex" -o -name "*.xpc" \) -print0)

          # 3. Sign the top-level app bundle (no --deep; inner content already signed)
          codesign -s - --force "$APP"

          # 3a. The re-signed RDP helper must still match the digest the app
          #     embeds (#1762), or RDP is refused as tampered (#4222).
          #     build-rdp-sidecar.sh signed it under its installed name before
          #     staging, so the re-sign above is byte-identical.
          EXE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          scripts/internal/verify-rdp-helper-bundle.sh "$APP/Contents/MacOS/$EXE_NAME"

          # 4. HARD GATE: the whole bundle must verify as consistently signed.
          #    This is what catches the "damaged" (inconsistent) state.
          echo "=== Signature verification (strict, deep) ==="
          if ! codesign --verify --deep --strict --verbose=2 "$APP"; then
            echo "::error::codesign --verify --deep --strict failed for $APP — the bundle is inconsistently signed"
            exit 1
          fi

          # 5. The re-signed plugin runner (#4202) must still match the digest
          #    the app embeds (the staged runner was signed under the same
          #    name, so the re-sign is byte-identical). --no-run: the x64
          #    bundle is cross-built here; Release macOS Smoke runs it natively.
          scripts/internal/verify-plugin-runner-bundle.sh --no-run "$APP/Contents/MacOS/$EXE_NAME"

          # Advisory only: Gatekeeper always rejects an ad-hoc (non-Developer ID)
          # bundle — the project ships unsigned-beta by maintainer decision — so
          # spctl cannot be a gate. Its verdict is logged, never discarded.
          echo "=== Gatekeeper assessment (advisory) ==="
          if ! spctl --assess --type exec --verbose=2 "$APP" 2>&1; then
            echo "::notice::spctl rejected the ad-hoc bundle (expected without a Developer ID)"
          fi
          echo "=== Signature info ==="
          codesign -dv "$APP" 2>&1
          find "$APP" -name "_CodeSignature" -type d 2>/dev/null || echo "(none)"

          rm "$DMG"
          hdiutil create -volname "termiHub" -srcfolder "$APP" -ov -format UDZO "$DMG"
          rm -rf "$WORKDIR"

      - name: Collect primary artifact
        shell: bash
        run: |
          ARTIFACT=$(find "target/${{ matrix.rust_target }}/release/bundle/${{ matrix.bundle_path }}" -name "*${{ matrix.file_ext }}" | head -n 1)
          if [ -z "$ARTIFACT" ]; then
            echo "Error: No artifact found matching *${{ matrix.file_ext }} in bundle/${{ matrix.bundle_path }}"
            exit 1
          fi
          cp "$ARTIFACT" "termiHub-dev-${{ matrix.platform }}${{ matrix.file_ext }}"

      - name: Collect NSIS setup.exe (Windows only)
        if: matrix.platform == 'windows-x64'
        shell: bash
        run: |
          NSIS=$(find "target/${{ matrix.rust_target }}/release/bundle/nsis" -name "*-setup.exe" | head -n 1)
          if [ -n "$NSIS" ]; then
            cp "$NSIS" "termiHub-dev-${{ matrix.platform }}-setup.exe"
          fi

      - name: Collect .deb (Linux x64 only)
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          DEB=$(find "target/${{ matrix.rust_target }}/release/bundle/deb" -name "*.deb" | head -n 1)
          if [ -n "$DEB" ]; then
            cp "$DEB" "termiHub-dev-${{ matrix.platform }}.deb"
          fi

      - name: Collect .rpm (Linux arm64 only)
        if: matrix.platform == 'linux-arm64'
        shell: bash
        run: |
          RPM=$(find "target/${{ matrix.rust_target }}/release/bundle/rpm" -name "*.rpm" | head -n 1)
          if [ -n "$RPM" ]; then
            cp "$RPM" "termiHub-dev-${{ matrix.platform }}.rpm"
          fi

      - name: Upload app artifacts to staging
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-${{ matrix.platform }}
          path: termiHub-dev-${{ matrix.platform }}*
          if-no-files-found: error

  # ── 3a. Build and stage Linux agent binaries (cross-compiled via cross-rs) ──
  build-agents-linux:
    name: Agent Binary (${{ matrix.target }})
    needs: prepare-release
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact_name: termihub-agent-linux-x64
          - target: aarch64-unknown-linux-musl
            artifact_name: termihub-agent-linux-arm64
          - target: armv7-unknown-linux-musleabihf
            artifact_name: termihub-agent-linux-armv7

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: dev-agent-${{ matrix.target }}
          # Budget guard (#1006): agent binaries are built only post-merge and are
          # never restored by a PR build. Persisting them spent ~2 GB of the shared
          # 10 GB repo cache budget, evicting the PR-blocking Windows cache. Don't
          # save — these non-blocking cross builds run cold. (The stock cross-rs
          # image is pulled fresh from GHCR by cross itself; see the Build step.)
          save-if: false

      - name: Install cross-rs
        # Pinned to a specific cross-rs release and SHA256-verified before extract
        # (was: curl releases/latest | sudo tar — an unpinned arbitrary binary on
        # the agent/release build path). See CI-004 / WA-CI-019.
        env:
          CROSS_VERSION: "0.2.5"
          CROSS_SHA256: "642375d1bcf3bd88272c32ba90e999f3d983050adf45e66bd2d3887e8e838bad"
        run: |
          set -euo pipefail
          url="https://github.com/cross-rs/cross/releases/download/v${CROSS_VERSION}/cross-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$url" -o /tmp/cross.tar.gz
          echo "${CROSS_SHA256}  /tmp/cross.tar.gz" | sha256sum -c -
          sudo tar xz -f /tmp/cross.tar.gz -C /usr/local/bin
          rm -f /tmp/cross.tar.gz

      # No Docker Buildx / custom cross image on CI: the flaky "Set up Docker
      # Buildx" step pulled moby/buildkit from Docker Hub (registry-1.docker.io),
      # which times out non-deterministically (#2056). cross-rs pulls its stock
      # target images from GHCR, which is reliable, so we let it use the default
      # images directly. The custom localhost/termihub-cross:* images (Cross.toml
      # + agent/docker/) only add an lld linker + a chmod entrypoint needed for
      # local Windows/Podman dev (DrvFs strips execute bits); neither is required
      # on a Linux runner, so dropping CROSS_CONFIG here changes nothing but the
      # image source. Local dev still uses Cross.toml via the build-agents scripts.
      - name: Build agent
        env:
          TERMIHUB_BUILD_BRANCH: ${{ github.ref_name }}
        run: cross build --release --target ${{ matrix.target }} -p termihub-agent

      - name: Rename agent binary
        run: cp "target/${{ matrix.target }}/release/termihub-agent" "${{ matrix.artifact_name }}"

      - name: Upload agent binary to staging
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error

  # ── 3b. Build and stage macOS agent binaries (native build) ───────────────
  build-agents-macos:
    name: Agent Binary (${{ matrix.target }})
    needs: prepare-release
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact_name: termihub-agent-macos-arm64
          - target: x86_64-apple-darwin
            artifact_name: termihub-agent-macos-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: dev-agent-${{ matrix.target }}
          # Budget guard (#1006): macOS agent binaries are built only post-merge and
          # are never restored by a PR build. Don't persist them into the shared
          # 10 GB repo cache budget — they crowd out the PR-blocking Windows cache.
          # These non-blocking native builds run cold instead.
          save-if: false

      - name: Build agent
        env:
          TERMIHUB_BUILD_BRANCH: ${{ github.ref_name }}
        run: cargo build --release --target ${{ matrix.target }} -p termihub-agent

      - name: Rename agent binary
        run: cp "target/${{ matrix.target }}/release/termihub-agent" "${{ matrix.artifact_name }}"

      - name: Upload agent binary to staging
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error

  # ── 3c. Build and stage Windows agent binaries (native MSVC build) ────────
  # Same build as release.yml's agent-binaries-windows (#4302, PKG2-007): dev
  # desktops deploy these to Windows hosts, and the release gate relies on Dev
  # Build to compile every agent target (incl. aarch64-pc-windows-msvc with the
  # static CRT) before tag time. Asset names follow the shared scheme in
  # core/src/agent_release_asset.rs (Windows assets carry .exe), pinned by
  # core/tests/agent_release_asset_contract.rs.
  build-agents-windows:
    name: Agent Binary (${{ matrix.target }})
    needs: prepare-release
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            artifact_name: termihub-agent-windows-x64.exe
          - target: aarch64-pc-windows-msvc
            artifact_name: termihub-agent-windows-arm64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: dev-agent-${{ matrix.target }}
          # Budget guard (#1006): like the other dev agent legs, never persist
          # into the shared repo cache budget the PR-blocking Windows cache needs.
          save-if: false

      # Static VC++ runtime (#4175), exactly as release.yml: a minimal Windows
      # host may lack VCRUNTIME140.dll.
      - name: Build agent
        env:
          TERMIHUB_BUILD_BRANCH: ${{ github.ref_name }}
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --target ${{ matrix.target }} -p termihub-agent

      - name: Verify no Visual C++ runtime dependency in the agent
        shell: pwsh
        run: |
          ./scripts/internal/verify-no-vcruntime.ps1 -Exe "target/${{ matrix.target }}/release/termihub-agent.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Rename agent binary
        shell: bash
        run: cp "target/${{ matrix.target }}/release/termihub-agent.exe" "${{ matrix.artifact_name }}"

      - name: Upload agent binary to staging
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error

  # ── 4. Publish the release once every build succeeded (#4471) ───────────
  # This is the ONLY job that touches the dev release. Every build job above
  # only stages workflow artifacts, so a red build leaves the previous
  # dev-*-latest release and all of its assets in place, and this job is
  # skipped — the run is red, the download page is not empty. Publishing itself
  # is staged: dev-release-publish.sh uploads everything into a draft release,
  # verifies it, and only then swaps it in for the old release.
  publish-release:
    name: Publish Dev Release
    needs:
      [
        prepare-release,
        build-app,
        build-agents-linux,
        build-agents-macos,
        build-agents-windows,
      ]
    runs-on: ubuntu-latest
    # Only when every needed job succeeded; never publish a partial dev build.
    if: ${{ success() }}

    steps:
      # Checked out first (checkout cleans the workspace) for the helper scripts.
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download all staged artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/
          merge-multiple: true

      # Fail (do not publish) when any required artifact is missing (CI-021,
      # #4471): the primary installer per desktop platform and every agent
      # binary, including the Windows agents (#4302).
      - name: Check required artifacts
        run: scripts/internal/dev-release-publish.sh check-artifacts artifacts/

      # Sign the dev agent binaries with the release key when it is configured
      # (AGT-005, #3213), so a release-built dev agent can accept a coordinated
      # update pushed from a dev desktop. Best-effort, unlike release.yml: a dev
      # build is not a release, so a missing key/secret only warns — those dev
      # agents then refuse unsigned updates (fail closed), nothing ships unsigned
      # as "verified". The .sig files are published with the other artifacts.
      - name: Sign agent binaries
        env:
          AGENT_UPDATE_SIGNING_KEY: ${{ secrets.AGENT_UPDATE_SIGNING_KEY }}
          AGENT_UPDATE_SIGNING_KEY_NEXT: ${{ secrets.AGENT_UPDATE_SIGNING_KEY_NEXT }}
        run: |
          set -euo pipefail
          HELPER="$GITHUB_WORKSPACE/scripts/internal/agent-update-signing.sh"
          if ! "$HELPER" check-key || ! "$HELPER" select-key \
            AGENT_UPDATE_SIGNING_KEY AGENT_UPDATE_SIGNING_KEY_NEXT; then
            echo "::warning title=Unsigned dev agents::Agent update signing is not configured (placeholder key, or no AGENT_UPDATE_SIGNING_KEY / _NEXT secret matching the first trusted key); dev agent binaries are published unsigned."
            exit 0
          fi
          mapfile -t agents < <(find artifacts/ -maxdepth 1 -type f -name 'termihub-agent-*' \
            ! -name '*.sha256' ! -name '*.sig' | sort)
          if [ "${#agents[@]}" -eq 0 ]; then
            echo "No agent binaries to sign."
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/agent-update-signing-key.pem"
          trap 'shred -u "$key" 2>/dev/null || rm -f "$key"' EXIT
          "$HELPER" select-key --out "$key" AGENT_UPDATE_SIGNING_KEY AGENT_UPDATE_SIGNING_KEY_NEXT
          "$HELPER" sign --key "$key" "${agents[@]}"

      - name: Write release notes
        run: |
          BRANCH="${{ needs.prepare-release.outputs.branch }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          {
            echo "## ⚠️ Dev Build — Not for Production Use"
            echo ""
            echo "This is an automated development build from the \`${BRANCH}\` branch."
            echo ""
            echo "**Commit**: [\`${SHORT_SHA}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})"
            echo "**Built**: ${DATE}"
            echo ""
            echo "These artifacts are rebuilt automatically on every push to \`${BRANCH}\` and replace the previous build once every platform has built. They may be unstable or contain incomplete features. **Do not use in production.**"
            echo ""
            echo "### Desktop Installers"
            echo "| Platform | Artifact |"
            echo "|----------|---------|"
            echo "| macOS Intel | \`termiHub-dev-macos-x64.dmg\` |"
            echo "| macOS Apple Silicon | \`termiHub-dev-macos-arm64.dmg\` |"
            echo "| Windows x64 | \`termiHub-dev-windows-x64.msi\`, \`termiHub-dev-windows-x64-setup.exe\` |"
            echo "| Linux x64 | \`termiHub-dev-linux-x64.AppImage\`, \`termiHub-dev-linux-x64.deb\` |"
            echo "| Linux ARM64 | \`termiHub-dev-linux-arm64.deb\`, \`termiHub-dev-linux-arm64.rpm\` |"
            echo ""
            echo "> **macOS — one-time security confirmation required.** These builds are not notarized (no Apple"
            echo "> Developer account). On first launch macOS will warn that the developer cannot be verified."
            echo "> Open **System Settings → Privacy \& Security** and click **Open Anyway**. This is a one-time step."
            echo ""
            echo "### Agent Binaries"
            echo "| Target | Artifact |"
            echo "|--------|---------|"
            echo "| Linux x64 (musl) | \`termihub-agent-linux-x64\` |"
            echo "| Linux ARM64 (musl) | \`termihub-agent-linux-arm64\` |"
            echo "| Linux ARMv7 (musl) | \`termihub-agent-linux-armv7\` |"
            echo "| macOS ARM64 | \`termihub-agent-macos-arm64\` |"
            echo "| macOS x64 | \`termihub-agent-macos-x64\` |"
            echo "| Windows x64 | \`termihub-agent-windows-x64.exe\` |"
            echo "| Windows ARM64 | \`termihub-agent-windows-arm64.exe\` |"
          } > release_notes.md

      # Staged, failure-safe swap — see the header of dev-release-publish.sh.
      - name: Publish dev release
        run: |
          BRANCH="${{ needs.prepare-release.outputs.branch }}"
          scripts/internal/dev-release-publish.sh publish \
            --tag "${{ needs.prepare-release.outputs.tag }}" \
            --sha "$GITHUB_SHA" \
            --dir artifacts/ \
            --title "Dev Build — not for production use (${BRANCH} @ ${GITHUB_SHA::7})" \
            --notes release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
