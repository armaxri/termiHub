name: Security Audit

# Dependency security + supply-chain gate (pnpm audit, cargo-audit, cargo-deny)
# for the workspace lockfiles. Moved out of code-quality.yml (#3325):
#
#   * push to develop/main — every merge is audited post-merge; watch develop.
#   * daily schedule       — RUSTSEC advisories and yanks are TIME-based (the tree
#                            does not change, the database does), so a daily run
#                            surfaces them on develop AND main without waiting
#                            for the next merge.
#   * pull_request         — only when a dependency manifest/lockfile (or this
#                            gate's own config) changes, i.e. when the PR itself
#                            can introduce a finding.
#
# Why not every PR: a new advisory/yank used to red EVERY open PR at once while
# develop stayed green (#2547, #2584, #2585, #2636, #2641). The maintainer
# accepted (2026-09-25) that such findings surface post-merge instead.
# The rdp-sidecar lockfile has its own cargo-deny gate in code-quality.yml's
# "RDP Sidecar Quality" job.

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - 'deny.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/internal/pnpm-audit-prod-gate.sh'
      - 'scripts/internal/check-pnpm-overrides.mjs'
      - 'scripts/internal/pnpm-audit-summary.mjs'
      - 'docs/supply-chain.md'
      - '.github/workflows/security-audit.yml'
      - '.github/actions/setup-pnpm/**'
  push:
    branches: [ main, develop ]
  schedule:
    # 04:41 UTC daily (off the hour to dodge scheduler congestion; after the
    # 04:00 cargo-update-lockfile run).
    - cron: '41 4 * * *'
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token (CI-010): checkout + audit only.
permissions:
  contents: read

jobs:
  # A scheduled run starts on the default branch (main) only, so it fans out
  # over both long-lived branches; every other event audits its own ref ('').
  security-audit:
    name: Security Audit${{ matrix.ref != '' && format(' ({0})', matrix.ref) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(github.event_name == 'schedule' && '["develop","main"]' || '[""]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ matrix.ref }}

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      # Every package.json pnpm.overrides entry must have a row (advisory +
      # removal condition) in docs/supply-chain.md, and none may be dead (its
      # target gone from pnpm-lock.yaml). WA-CI-020 / SUP-008. Offline, no install.
      - name: Check pnpm overrides are documented and live
        run: node scripts/internal/check-pnpm-overrides.mjs

      # Blocking gate on the RUNTIME dependency tree only. A high/critical
      # advisory that ships to users must fail CI. Scoped to `--prod` so it does
      # not fire on the dev/build toolchain (see the advisory step below) — that
      # split is what makes this safe to make blocking (#2074).
      # Blocks on a real high/critical prod advisory, but tolerates a transient
      # npm-registry outage (ERR_SOCKET_TIMEOUT etc.). `pnpm audit` exits
      # non-zero for BOTH cases, so a bare `pnpm audit --prod` reds every PR on a
      # registry blip even with a clean tree (#2589). The gate parses the --json
      # payload: it fails only when high+critical > 0, and retries-then-soft-
      # passes a network error. The gate stays genuinely blocking for advisories.
      - name: pnpm audit (production deps, blocking)
        run: ./scripts/internal/pnpm-audit-prod-gate.sh

      # Advisory-only visibility for the FULL tree (incl. devDependencies). These
      # are dev/build-time highs — eslint/typescript-eslint -> minimatch ->
      # brace-expansion, commitlint -> ajv -> fast-uri, vite -> postcss — none of
      # which reach the shipped app. Kept non-blocking so they surface in the log
      # without gating the release; promote a fix to the blocking step above once
      # the upstream dev tool patches land.
      #
      # Not silent, though (SUP-008): the step writes a per-severity count to the
      # job summary and raises a warning annotation when any high/critical
      # advisory is present. See docs/supply-chain.md -> "Audit gates".
      - name: pnpm audit (full tree, advisory)
        continue-on-error: true  # Dev-only advisories: warn, do not fail
        run: |
          pnpm audit --audit-level=moderate || true
          pnpm audit --json > "$RUNNER_TEMP/pnpm-audit-full.json" || true
          node scripts/internal/pnpm-audit-summary.mjs "$RUNNER_TEMP/pnpm-audit-full.json"

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      # Prebuilt binary download instead of compiling cargo-audit from source.
      # This job has no rust-cache, so the old `cargo install` recompiled it every
      # run (~197 s); the prebuilt download takes seconds.
      - name: Install cargo-audit
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: cargo-audit

      - name: Cargo Audit
        run: cargo audit

      # cargo-deny supply-chain gate. Config: deny.toml. Four checks run:
      #   - advisories: fails CI when the workspace lockfile pins a YANKED crate
      #     (e.g. the crypto-bigint 0.7.x line pulled via russh) — a silently
      #     withdrawn transitive dep surfaces loudly instead of shipping (#2074).
      #   - bans: documented release sign-off for the pre-release RustCrypto stack.
      #   - licenses: every crate must resolve to an allowed license, so an
      #     unknown/restrictive license cannot slip into the distributed binary
      #     unnoticed (#2096).
      #   - sources: every crate must come from crates.io — an unexpected registry
      #     or git source fails CI (#2096).
      # cargo-audit above still covers vulnerability RUSTSECs.
      - name: Install cargo-deny
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: cargo-deny

      - name: Cargo Deny (supply-chain gate)
        run: cargo deny check advisories bans licenses sources

      # Advisory-only visibility for duplicate dependency versions (SUP-010).
      # deny.toml keeps `multiple-versions = "allow"` — duplicates are common in a
      # large tree and are not a supply-chain signal on their own, so they must
      # NOT gate CI. This step just prints the current duplicates so the count is
      # visible in the log and its trend can be watched over time; it never fails
      # the build (`continue-on-error`, and `|| true` so an empty tree is fine).
      - name: Cargo Tree (duplicate versions, advisory)
        continue-on-error: true
        run: cargo tree --duplicates --workspace --edges normal || true
