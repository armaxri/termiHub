name: Agent

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'agent/**'
      - 'core/**'
      - 'Cargo.toml'
      # Re-run the cross-compile legs when the build workflow itself changes, so
      # edits to the musl build (e.g. the cross-image hardening in #2056) are
      # exercised on their own PR instead of shipping unvalidated.
      - '.github/workflows/agent.yml'

# Cancel an in-flight agent build when a newer commit lands on the same PR.
concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact_name: termihub-agent-linux-x64
          - target: aarch64-unknown-linux-musl
            artifact_name: termihub-agent-linux-arm64
          - target: armv7-unknown-linux-musleabihf
            artifact_name: termihub-agent-linux-armv7

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-rs
        # Pinned to a specific cross-rs release and SHA256-verified before extract
        # (was: curl releases/latest | sudo tar — an unpinned arbitrary binary on
        # the agent/release build path). See CI-004 / WA-CI-019.
        env:
          CROSS_VERSION: "0.2.5"
          CROSS_SHA256: "642375d1bcf3bd88272c32ba90e999f3d983050adf45e66bd2d3887e8e838bad"
        run: |
          set -euo pipefail
          url="https://github.com/cross-rs/cross/releases/download/v${CROSS_VERSION}/cross-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$url" -o /tmp/cross.tar.gz
          echo "${CROSS_SHA256}  /tmp/cross.tar.gz" | sha256sum -c -
          sudo tar xz -f /tmp/cross.tar.gz -C /usr/local/bin
          rm -f /tmp/cross.tar.gz

      # No Docker Buildx / custom cross image on CI: the flaky "Set up Docker
      # Buildx" step pulled moby/buildkit from Docker Hub (registry-1.docker.io),
      # which times out non-deterministically (#2056). cross-rs pulls its stock
      # target images from GHCR, which is reliable, so we let it use the default
      # images directly. The custom localhost/termihub-cross:* images (Cross.toml
      # + agent/docker/) only add an lld linker + a chmod entrypoint needed for
      # local Windows/Podman dev (DrvFs strips execute bits); neither is required
      # on a Linux runner, so dropping CROSS_CONFIG here changes nothing but the
      # image source. Local dev still uses Cross.toml via the build-agents scripts.
      - name: Build
        env:
          TERMIHUB_BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: cross build --release --target ${{ matrix.target }} -p termihub-agent

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/termihub-agent
          if-no-files-found: error
          retention-days: 7

  # Build the Windows agent (MSVC) and run the agent/core test suites on a
  # Windows runner. cross-rs cannot build the MSVC ABI, so this uses native
  # cargo on windows-latest. The bridge system-test harness now runs on all three
  # OSes (system-integration.yml), but its Docker fixtures stay Linux-only, so
  # Windows agent coverage is unit/integration + manual (see ADR-5, docs/testing.md).
  build-windows:
    name: Build (${{ matrix.target }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            artifact_name: termihub-agent-windows-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Run agent/core tests
        run: cargo test -p termihub-agent -p termihub-core --all-features

      - name: Build
        env:
          TERMIHUB_BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: cargo build --release --target ${{ matrix.target }} -p termihub-agent

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/termihub-agent.exe
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: Build (${{ matrix.target }})
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact_name: termihub-agent-macos-arm64
          - target: x86_64-apple-darwin
            artifact_name: termihub-agent-macos-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build
        env:
          TERMIHUB_BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: cargo build --release --target ${{ matrix.target }} -p termihub-agent

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/termihub-agent
          if-no-files-found: error
          retention-days: 7
