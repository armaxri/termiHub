name: Agent

# PR lane (#3325): only the three Linux musl cross-builds (Ubuntu runners). The
# Windows leg (agent/core tests + release build) and the two macOS legs run
# POST-MERGE on push to develop/main:
#   * the Windows leg's `cargo test -p termihub-agent -p termihub-core` is a strict
#     subset of code-quality.yml's "Run Tests (windows-latest)" leg
#     (`cargo test --workspace`), which still runs on every Rust PR;
#   * macOS runners are the scarcest in the pool, and dev-build.yml also builds
#     both macOS agent binaries on every push to develop/main.
on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'agent/**'
      - 'core/**'
      - 'Cargo.toml'
      # Re-run the cross-compile legs when the build workflow itself changes, so
      # edits to the musl build (e.g. the cross-image hardening in #2056) are
      # exercised on their own PR instead of shipping unvalidated.
      - '.github/workflows/agent.yml'
  push:
    branches: [ main, develop ]
    paths:
      - 'agent/**'
      - 'core/**'
      - 'Cargo.toml'
      - '.github/workflows/agent.yml'

# Cancel an in-flight agent build when a newer commit lands on the same PR.
# Only PR runs cancel in-progress (#3588): a push to develop/main is a post-merge
# correctness gate the slim PR lane (#3326) relies on. Cancelling on push left
# develop's gate dark under frequent merges (no run ever finished). A push run now
# always completes; GitHub still keeps only the newest *queued* run per group, so
# merges landing mid-run are covered by the next completed run.
concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege token (CI-010). Each job checks out, cross-builds the agent,
# runs tests, and uploads build artifacts via the artifact API (which does not
# use the GITHUB_TOKEN's contents scope) — so a read-only token suffices.
permissions:
  contents: read

jobs:
  # Changed-area detection (#3903): the path filter above is file-level, so a
  # comment-only Rust change (every changed .rs line a whole-line `//` comment)
  # still triggers this workflow. The shared classifier narrows it; see
  # .github/actions/detect-changes. Non-PR events report every area on, and the
  # gated jobs test `!= 'false'`, so a failure here runs everything (fail-open).
  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    outputs:
      agent: ${{ steps.detect.outputs.agent }}
      tests: ${{ steps.detect.outputs.tests }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The PR merge commit plus its parents, so HEAD^1 (the base tip) exists.
          fetch-depth: 2

      - name: Classify changed files
        id: detect
        uses: ./.github/actions/detect-changes

  build-linux:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: changes
    # Skipped on a PR whose agent/core changes are comment-only (#3903), or
    # whose head commit carries [skip-tests] (#3915).
    if: >-
      ${{ !cancelled() && needs.changes.outputs.tests != 'false' &&
      needs.changes.outputs.agent != 'false' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact_name: termihub-agent-linux-x64
          - target: aarch64-unknown-linux-musl
            artifact_name: termihub-agent-linux-arm64
          - target: armv7-unknown-linux-musleabihf
            artifact_name: termihub-agent-linux-armv7

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
          # Reader/writer split (#3328), same as code-quality.yml: only pushes to
          # develop/main save; PR runs restore the develop cache and never write,
          # so short-lived PR caches don't evict the shared ones (10 GB limit).
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}

      - name: Install cross-rs
        # Pinned to a specific cross-rs release and SHA256-verified before extract
        # (was: curl releases/latest | sudo tar — an unpinned arbitrary binary on
        # the agent/release build path). See CI-004 / WA-CI-019.
        env:
          CROSS_VERSION: "0.2.5"
          CROSS_SHA256: "642375d1bcf3bd88272c32ba90e999f3d983050adf45e66bd2d3887e8e838bad"
        run: |
          set -euo pipefail
          url="https://github.com/cross-rs/cross/releases/download/v${CROSS_VERSION}/cross-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$url" -o /tmp/cross.tar.gz
          echo "${CROSS_SHA256}  /tmp/cross.tar.gz" | sha256sum -c -
          sudo tar xz -f /tmp/cross.tar.gz -C /usr/local/bin
          rm -f /tmp/cross.tar.gz

      # No Docker Buildx / custom cross image on CI: the flaky "Set up Docker
      # Buildx" step pulled moby/buildkit from Docker Hub (registry-1.docker.io),
      # which times out non-deterministically (#2056). cross-rs pulls its stock
      # target images from GHCR, which is reliable, so we let it use the default
      # images directly. The custom localhost/termihub-cross:* images (Cross.toml
      # + agent/docker/) only add an lld linker + a chmod entrypoint needed for
      # local Windows/Podman dev (DrvFs strips execute bits); neither is required
      # on a Linux runner, so dropping CROSS_CONFIG here changes nothing but the
      # image source. Local dev still uses Cross.toml via the build-agents scripts.
      - name: Build
        env:
          TERMIHUB_BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: cross build --release --target ${{ matrix.target }} -p termihub-agent

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/termihub-agent
          if-no-files-found: error
          retention-days: 7

  # Build the Windows agent (MSVC) and run the agent/core test suites on a
  # Windows runner. cross-rs cannot build the MSVC ABI, so this uses native
  # cargo on windows-latest. The bridge system-test harness now runs on all three
  # OSes (system-integration.yml), but its Docker fixtures stay Linux-only, so
  # Windows agent coverage is unit/integration + manual (see ADR-5, docs/testing.md).
  build-windows:
    name: Build (${{ matrix.target }})
    runs-on: windows-latest
    # Post-merge only (#3325) — see the header.
    if: github.event_name != 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            artifact_name: termihub-agent-windows-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
          # Reader/writer split (#3328), same as code-quality.yml: only pushes to
          # develop/main save; PR runs restore the develop cache and never write,
          # so short-lived PR caches don't evict the shared ones (10 GB limit).
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}

      # Same bulk + capped-heavy split as code-quality.yml's test leg (CI-013,
      # #3350), so the PTY / remote-forward suites don't contend with the rest.
      # The live-agent-TCP tests are skipped here (CI_RUST_TESTS_SPLIT_SERIAL):
      # on Windows they run serially in code-quality.yml's "Agent Live Tests
      # (Windows, serial)" job, which also runs on every push (#2495, #3615).
      - name: Run agent/core tests
        shell: bash
        env:
          CI_RUST_TESTS_SPLIT_SERIAL: '1'
        run: ./scripts/internal/ci-rust-tests.sh bulk -p termihub-agent -p termihub-core

      - name: Run agent/core tests (contention-sensitive suites, capped threads)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CI_RUST_TESTS_SPLIT_SERIAL: '1'
        run: ./scripts/internal/ci-rust-tests.sh heavy -p termihub-agent -p termihub-core

      # Build through the shipped Windows build script (MT-AGENT-15, #3685), so
      # a regression in `build-agents.cmd --native` (native MSVC cargo build, the
      # .sha256 sidecar, the summary) fails here instead of on a user's box.
      # `--targets` pins the matrix target: the script's default also tries the
      # best-effort ARM64 build, which is not this leg's job.
      - name: Build (scripts\build-agents.cmd --native)
        shell: pwsh
        env:
          TERMIHUB_BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          & .\scripts\build-agents.cmd --native --targets $env:TARGET | Tee-Object -FilePath agent-build.log
          $rc = $LASTEXITCODE
          if ($rc -ne 0) { Write-Error "build-agents.cmd --native exited $rc"; exit 1 }
          $exe = "target/$env:TARGET/release/termihub-agent.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            Write-Error "expected agent binary not found: $exe"; exit 1
          }
          if (-not (Test-Path -LiteralPath "$exe.sha256" -PathType Leaf)) {
            Write-Error "expected checksum sidecar not found: $exe.sha256"; exit 1
          }
          if (-not (Select-String -LiteralPath agent-build.log -SimpleMatch 'Built: 1 | Failed: 0' -Quiet)) {
            Write-Error "build summary did not report 'Built: 1 | Failed: 0'"; exit 1
          }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { Write-Error "$exe --version exited $LASTEXITCODE"; exit 1 }

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/termihub-agent.exe
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: Build (${{ matrix.target }})
    runs-on: macos-latest
    # Post-merge only (#3325) — see the header.
    if: github.event_name != 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact_name: termihub-agent-macos-arm64
          - target: x86_64-apple-darwin
            artifact_name: termihub-agent-macos-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
          # Reader/writer split (#3328), same as code-quality.yml: only pushes to
          # develop/main save; PR runs restore the develop cache and never write,
          # so short-lived PR caches don't evict the shared ones (10 GB limit).
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}

      - name: Build
        env:
          TERMIHUB_BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: cargo build --release --target ${{ matrix.target }} -p termihub-agent

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/termihub-agent
          if-no-files-found: error
          retention-days: 7
