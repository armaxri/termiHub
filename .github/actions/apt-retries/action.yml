name: "Make apt retry downloads"
description: >-
  Write /etc/apt/apt.conf.d/80-ci-retries on the runner so every later apt
  download in the job (update, install) retries a failed fetch 5 times with a
  30s connect/read timeout. apt's default is no retries, so a
  transient archive.ubuntu.com outage otherwise reds an unrelated job on its first
  attempt (#5152). Use it once per job, before the first apt call. It is a no-op
  off Linux. Containers (Dockerfiles, apt inside `docker run`) do not inherit this
  file and carry their own setting. scripts/internal/check-apt-retries.mjs fails
  on an apt call that is not covered.
  It also probes the runner's Ubuntu mirrors and rewrites the apt mirror list to
  the reachable ones plus independent fallback mirrors outside ubuntu.com, so a
  *.ubuntu.com DNS outage (security.ubuntu.com, archive, azure.archive) does not
  fail the job; with no mirror reachable it fails with an
  "APT mirrors unreachable" error annotation (#5385).

runs:
  using: "composite"
  steps:
    - name: Write the apt retry config
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
          | sudo tee /etc/apt/apt.conf.d/80-ci-retries >/dev/null
        cat /etc/apt/apt.conf.d/80-ci-retries

    - name: Route apt around unreachable Ubuntu mirrors
      if: runner.os == 'Linux'
      shell: bash
      run: sudo bash "$GITHUB_ACTION_PATH/mirror-fallback.sh"
