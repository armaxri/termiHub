name: 'Detect changed CI areas'
description: >-
  Classify what a PR changes (rust, frontend, sidecar, scripts, harness,
  markdown, deps, agent, workflows, rustdoc, plugin_fuzz) via scripts/internal/ci-changes.mjs, so per-PR
  jobs can skip work the PR cannot affect (#3325). A workspace .rs file whose
  changed lines are all whole-line `//` comments sets only `rustdoc` (fmt +
  Rustdoc), not `rust`/`agent` (#3903). On a PR whose HEAD commit (the PR
  branch tip, not the merge commit) carries `[skip-tests]`, `tests` is false
  and `test_matrix` is [] so the test and build lanes skip (#3915). Non-PR events (push to develop/main,
  schedule, dispatch) always report every area on. FAIL-OPEN: if the diff
  cannot be computed, every area is reported on. Requires a prior
  actions/checkout with `fetch-depth: 2` so the PR merge commit's first parent
  (the base-branch tip) is present.

outputs:
  rust:
    description: 'Workspace Rust crates / manifests / toolchain changed'
    value: ${{ steps.classify.outputs.rust }}
  frontend:
    description: 'Frontend app / vitest-covered scripts / JS toolchain changed'
    value: ${{ steps.classify.outputs.frontend }}
  sidecar:
    description: 'rdp-sidecar/ changed'
    value: ${{ steps.classify.outputs.sidecar }}
  scripts:
    description: 'Shell / cmd scripts changed'
    value: ${{ steps.classify.outputs.scripts }}
  harness:
    description: 'Python system-test harness changed'
    value: ${{ steps.classify.outputs.harness }}
  markdown:
    description: 'docs/** or *.md changed'
    value: ${{ steps.classify.outputs.markdown }}
  deps:
    description: 'Dependency manifests / lockfiles changed'
    value: ${{ steps.classify.outputs.deps }}
  agent:
    description: 'Anything termihub-agent builds from (agent/, core/, workspace manifests) changed'
    value: ${{ steps.classify.outputs.agent }}
  workflows:
    description: 'GitHub Actions workflows / CI plumbing (.github/) changed'
    value: ${{ steps.classify.outputs.workflows }}
  rustdoc:
    description: 'Workspace Rust sources changed, code or comment-only (fmt + Rustdoc, #3903)'
    value: ${{ steps.classify.outputs.rustdoc }}
  plugin_fuzz:
    description: 'Anything the workspace-excluded plugin-runner/fuzz crate builds from changed (#4257)'
    value: ${{ steps.classify.outputs.plugin_fuzz }}
  tests:
    description: >-
      false only when the PR head commit carries [skip-tests] (#3915): gate the
      test and build lanes on it; quality/lint/rustdoc/gate jobs ignore it
    value: ${{ steps.classify.outputs.tests }}
  test_matrix:
    description: 'JSON list of OSes for the "Run Tests" matrix'
    value: ${{ steps.classify.outputs.test_matrix }}

runs:
  using: 'composite'
  steps:
    - id: classify
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        # The PR branch tip. The checkout itself is the synthetic merge commit,
        # whose second parent (HEAD^2) is this same commit — the fallback below.
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -uo pipefail
        script=scripts/internal/ci-changes.mjs
        if [ "$EVENT_NAME" != "pull_request" ]; then
          echo "Event '$EVENT_NAME' is not a pull_request: running every area."
          node "$script" --all | tee -a "$GITHUB_OUTPUT"
          exit 0
        fi
        # On pull_request the checkout is the PR merge commit: HEAD^1 is the base
        # branch tip, so this diff is exactly what the PR changes against its base.
        if ! files=$(git diff --name-only HEAD^1 HEAD); then
          echo "::warning::Could not diff against the base; failing open (every area on)."
          node "$script" --all | tee -a "$GITHUB_OUTPUT"
          exit 0
        fi
        # --base/--head let the script read each changed .rs file's diff, so a
        # comment-only Rust change narrows to fmt + Rustdoc (#3903). Any git
        # error there keeps that file's full Rust classification (fail-open).
        # [skip-tests] (#3915) is read from the PR HEAD commit's message only —
        # never the merge commit (HEAD) or older PR commits. Needs fetch-depth: 2,
        # which brings in both merge parents.
        head_sha="${PR_HEAD_SHA:-HEAD^2}"
        printf '%s\n' "$files" \
          | node "$script" --base HEAD^1 --head HEAD \
              --event "$EVENT_NAME" --head-sha "$head_sha" \
          | tee -a "$GITHUB_OUTPUT"
