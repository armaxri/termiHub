[workspace]
members = [
    "core",
    "src-tauri",
    "agent",
    "plugin-api",
    "vendor/vnc-rs",
    # Example plugins (#1994): kept as workspace members so `cargo build`/`clippy`
    # guarantee they keep compiling against the plugin-api ABI on every platform.
    "examples/plugins/echo-backend",
]
# The RDP sidecar (#1747) is a standalone build unit with its OWN Cargo.lock:
# IronRDP's CredSSP crypto and russh pin incompatible RustCrypto pre-releases,
# and Cargo allows one version per crate per lockfile (#1725). A workspace
# *member* would share the root lockfile (and pull russh via other members), so
# it must be excluded, not added. Built + bundled separately
# (scripts/build-rdp-sidecar.sh).
exclude = ["rdp-sidecar"]
resolver = "2"

# Dev/test builds emit no debug info at all. The workspace declared no
# [profile.dev], so it ran on Cargo's default `debug = true` — full DWARF for
# every crate in the dependency graph, which was the bulk of the debug target.
# Release builds are unaffected: every shipping artifact is built with
# `--release`.
#
# Measured, clean `du -sh target/debug` (macOS aarch64, rustc 1.93):
#
#   debug = true (Cargo default)  6.7 GB   9.4 GB with test binaries
#   debug = "line-tables-only"    4.5 GB   6.5 GB
#   debug = 0 (this)              3.3 GB   5.0 GB
#
# That is what makes several parallel checkouts fit on one disk — see
# docs/testing.md -> "Parallel test isolation".
#
# TRADE-OFF, deliberate: this strips file/line from panic backtraces. A
# backtrace still names the function symbols but reports no source location,
# and `RUST_BACKTRACE=1` (docs/contributing.md -> "Process exit codes") is
# correspondingly coarser. termiHub is not step-debugged in practice, so the
# debug info was not earning its disk. To get it back for a debugging session,
# build with `RUSTFLAGS="-C debuginfo=2"` (full DWARF) or
# `RUSTFLAGS="-C debuginfo=1"` (file/line only), or set a [profile.dev] in a
# local, uncommitted .cargo/config.toml. See
# https://github.com/armaxri/termiHub/issues/1537.
[profile.dev]
debug = 0

# Fail fast on integer overflow in shipping (release) builds.
#
# Cargo's default release profile sets `overflow-checks = false`, so a `+`/`-`/`*`
# that would panic in debug/tests silently *wraps* to a wrong value in the
# shipped binary. termiHub is a safety-critical build (ventilator-grade): a
# silent wrap to a corrupt value is strictly worse than a fail-fast panic. So we
# opt release into the same overflow checks debug already runs (ERR-010).
#
# Intended wrap-around (tftp block counters, mock frame index, backoff/hash math)
# already uses explicit `wrapping_*` / `saturating_*` / `checked_*`, so it is
# unaffected — only *un*intended overflow now panics instead of corrupting.
#
# Note: this covers arithmetic operators only, not `as` casts (which truncate
# regardless of this flag). Perf cost is a couple of extra bounds per arithmetic
# op — negligible for a terminal hub, and not on any measured hot loop.
[profile.release]
overflow-checks = true
# Strip the symbol table + debug info from release binaries (PKG-010). Smaller
# shipped binaries; symbols are not needed by users and are recoverable from a
# debug build when profiling. Does not affect behaviour or optimization level.
strip = true

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
serial2 = "0.2"
serial2-tokio = "0.1"
russh = "0.61"
russh-sftp = "2.3"
bollard = "0.18"
