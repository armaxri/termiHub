services:
  test-target:
    build: .
    ports:
      # Offset per checkout (docs/testing.md "Parallel test isolation"); a bare
      # `docker compose up` uses 2230/2323. SSH is 2230 so it clashes neither with
      # the dev agent's 2222 (#1536) nor with the test fixtures' 2201-2218 (#4339).
      - "${TERMIHUB_TEST_E2E_SSH_PORT:-2230}:22" # SSH
      - "${TERMIHUB_TEST_E2E_TELNET_PORT:-2323}:23" # Telnet
    restart: unless-stopped
