[package]
name = "termihub-agent"
version = "0.1.0"
description = "Remote agent for termiHub — manages persistent terminal sessions on Raspberry Pi"
authors = ["Arne Maximilian Richter <armaxri@gmail.com>"]
edition = "2021"
# First-party workspace crate — never published to crates.io (the repo is MIT,
# see /LICENSE). Marks it private so cargo-deny's `[licenses] private.ignore`
# skips its missing per-crate license field (#2096).
publish = false

[[bin]]
name = "termihub-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = { workspace = true }
termihub-core = { path = "../core", features = [
    "local-shell",
    "serial",
    "ssh",
    "telnet",
    "docker",
    "wsl",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
async-trait = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
jsonrpsee = { version = "0.24", default-features = false, features = ["server"] }
russh = { workspace = true }
shellexpand = "3"
sysinfo = "0.38"
dirs = "6"
# Agent-side GitHub self-update (#1355): outbound HTTP to the Releases API and
# asset download, semver comparison, and SHA-256 integrity verification of the
# downloaded binary. rustls-tls avoids an OpenSSL dependency for musl
# cross-compilation of the agent.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
semver = "1"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process", "term", "poll", "fs"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Named-pipe liveness probe (WaitNamedPipeW) for the session daemon's endpoint
# and detached-process creation flags. The per-user DACL construction moved to
# termihub-core's shared IPC transport (`ipc::ListenerSecurity::CurrentUserOnly`).
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }


[dev-dependencies]
tempfile = "3"
serde_json = { workspace = true }
# `start_paused` for the coordinated-update ack/timeout tests (#1351): the 10 s
# window is asserted on virtual time, so the tests are instant and immune to
# host load rather than sleeping and hoping.
tokio = { version = "1", features = ["test-util"] }
base64 = "0.22"
# Mock GitHub Releases HTTP endpoints in self-update tests without real network.
wiremock = "0.6"
# Compute the SHA-256 the mock release advertises for the staged agent binary
# in the live self-update integration test.
sha2 = "0.10"
