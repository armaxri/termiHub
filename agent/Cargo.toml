[package]
name = "termihub-agent"
version = "0.1.0"
description = "Remote agent for termiHub — manages persistent terminal sessions on Raspberry Pi"
authors = ["Arne Maximilian Richter <armaxri@gmail.com>"]
edition = "2021"

[[bin]]
name = "termihub-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = { workspace = true }
termihub-core = { path = "../core", features = [
    "local-shell",
    "serial",
    "ssh",
    "telnet",
    "docker",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
async-trait = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
jsonrpsee = { version = "0.24", default-features = false, features = ["server"] }
russh = { workspace = true }
shellexpand = "3"
sysinfo = "0.38"
dirs = "6"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process", "term", "poll", "fs"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Used to build a per-user DACL for the session daemon's named-pipe transport
# (the security analog of the Unix socket's 0o700 permissions).
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }


[dev-dependencies]
tempfile = "3"
serde_json = { workspace = true }
base64 = "0.22"
