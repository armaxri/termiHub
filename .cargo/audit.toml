# Cargo audit configuration (workspace level)
# https://docs.rs/cargo-audit/latest/cargo_audit/

[advisories]
# RUSTSEC-2023-0071: Marvin Attack timing sidechannel in the `rsa` crate.
# The `rsa` crate is a transitive dependency of `ssh-key` (used for OpenSSH
# key format parsing). We only extract raw RSA key components and rebuild
# them via OpenSSL — we never perform RSA encryption/decryption through
# this crate, so the timing sidechannel does not apply.
#
# ---------------------------------------------------------------------------
# Non-actionable TRANSITIVE advisories — conscious release sign-off (#3054).
# Findings SUP-003 / SUP-004 / SUP-006. Every ID below is `unmaintained` or
# `unsound` (NOT an exploitable vulnerability) on a crate pinned by upstream
# (mostly the Tauri/GTK3 binding stack), so no app-side change can clear it.
# These mirror the `[advisories] ignore` list in deny.toml so cargo-audit and
# cargo-deny stay in agreement. Real vulnerabilities and yanked crates are NOT
# listed here and still fail the gate. Revisit + remove per ID when upstream
# ships a maintained/sound replacement — see #3054. Last revisited 2026-09-30.
# ---------------------------------------------------------------------------
ignore = [
    "RUSTSEC-2023-0071",
    # -- unmaintained (no fix available; crate abandoned upstream) --
    # proc-macro-error: unmaintained, via glib-macros 0.18 (Tauri GTK3 stack); no fix.
    "RUSTSEC-2024-0370",
    # serial: unmaintained, via portable-pty 0.8 (0.9 moves to serial2).
    "RUSTSEC-2017-0008",
    # unic-* (next 5 IDs): unmaintained, via urlpattern 0.3 <- tauri-utils; no fix.
    # unic-char-property.
    "RUSTSEC-2025-0081",
    # unic-char-range: unmaintained, via the unic-* unicode stack.
    "RUSTSEC-2025-0075",
    # unic-common: unmaintained, via the unic-* unicode stack.
    "RUSTSEC-2025-0080",
    # unic-ucd-ident: unmaintained, via the unic-* unicode stack.
    "RUSTSEC-2025-0100",
    # unic-ucd-version: unmaintained, via the unic-* unicode stack.
    "RUSTSEC-2025-0098",
    # -- unsound (no vulnerability path in our usage; no upstream fix) --
    # glib: unsound VariantStrIter impls, glib 0.18 pinned by Tauri/wry GTK3; fix is 0.20+.
    "RUSTSEC-2024-0429",
]
