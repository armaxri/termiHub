# Cargo audit configuration (workspace level)
# https://docs.rs/cargo-audit/latest/cargo_audit/
#
# Every ID below is an ACCEPTED risk, documented with its rationale in
# docs/supply-chain.md -> "Accepted risks (Rust advisories and pre-release crates)".
# Real vulnerabilities and yanked crates that are not listed here still fail the
# Security Audit gate. Keep this list in sync with that section and with the
# `[advisories] ignore` list in deny.toml. Last revisited 2026-10-06.
#
# Removing an entry: when the crate leaves Cargo.lock (or upstream ships a fix
# and we take it), delete the ID here and its row in docs/supply-chain.md.
# cargo-deny reports a stale ignore as `advisory-not-detected`; to confirm by hand
# that an ID no longer fires, run `cargo audit` from a directory without this
# config: `cd /tmp && cargo audit -f <repo>/Cargo.lock`.

[advisories]
ignore = [
    # rsa (RUSTSEC-2023-0071, Marvin timing sidechannel): pulled by russh 0.61
    # and ssh-key. termiHub is an SSH client only: the private key is used to
    # sign the server-chosen session hash once per public-key login, and server
    # host-key checks are public-key verifications (not affected). There is no
    # RSA decryption path, and a server sees one signature per connection, far
    # from the large timed sample the attack needs. No fixed rsa release exists.
    "RUSTSEC-2023-0071",
    # proc-macro-error (RUSTSEC-2024-0370, unmaintained): a build-time proc-macro
    # helper pulled by glib-macros 0.18 in Tauri's Linux GTK3 stack. It runs only
    # at compile time on our own sources and ships no runtime code. Leaves the
    # tree when Tauri/wry move off gtk-rs 0.18.
    "RUSTSEC-2024-0370",
    # glib (RUSTSEC-2024-0429, unsound VariantStrIter): glib 0.18 is pinned by
    # Tauri/wry's Linux GTK3 stack; the fix is glib 0.20+. termiHub never calls
    # the affected glib::VariantStrIter API, so the unsound path is not reached.
    "RUSTSEC-2024-0429",
]
