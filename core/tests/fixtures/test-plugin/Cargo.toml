# Test fixture only — a minimal native plugin `cdylib` used by the host-loader
# round-trip test (`core/tests/plugin_host_roundtrip.rs`, #1995). It is NOT a
# workspace member: the empty `[workspace]` table below makes it its own
# workspace root so the parent workspace ignores it, and the round-trip test
# builds it on demand with `cargo build`.
[package]
name = "termihub-test-plugin"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
termihub-plugin-api = { path = "../../../../plugin-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The escape probe's `roots` check (#4811): what a Windows plugin does to get
# TLS roots inside its sandbox — `rustls-native-certs` (which reads the host's
# `SSL_CERT_FILE` snapshot) and webpki's trust-anchor parsing. Test-only.
[target.'cfg(windows)'.dependencies]
rustls-native-certs = { version = "0.8", optional = true }
rustls-webpki = { version = "0.103", default-features = false, features = ["alloc"], optional = true }
# The `tls` probe (#4818): a real certificate-verified handshake through a
# bridged connection, its roots from the snapshot above. `ring` needs only a C
# compiler (no cmake/nasm). Test-only, and only in the `tls-probe` build.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }

[features]
# The default build exports every ABI symbol. Building with
# `--no-default-features` omits `termihub_plugin_init`, which the test uses to
# exercise the loader's missing-symbol handling.
default = ["export-init"]
export-init = []
# Build a faithful ABI 1.0 plugin (#3576): reports ABI 1.0, writes only the 1.0
# PluginInfo prefix, never reads the 1.1 host context.
abi-1-0 = []
# Crash and hang commands for the plugin-runner isolation tests (#4184): input
# `!segv`, `!abort`, `!spin`, `!alloc`, `!garbage`, `!fds`, `!spawn`, `!fdstat`,
# `!flood` make the plugin misbehave on purpose (#4203 adds the last two).
# Test-only; never part of a shipped plugin.
crash-commands = []
# Escape-probe commands for the OS-sandbox tests (#4186, shared with #4185 /
# #4187): input `?probe <op> [arg]` tries one operation the sandbox must deny
# (or a positive control it must allow) and answers `PROBE <op> ALLOWED|DENIED
# <detail>`. Test-only; never part of a shipped plugin.
escape-probe = ["dep:rustls-native-certs", "dep:rustls-webpki"]
# The `tls` session probe (#4818): a rustls handshake against a public host
# through a bridged `open_connection`, roots from `load_native_certs()` (the
# host's `SSL_CERT_FILE` snapshot). Needs the network, so only the nightly
# `plugin_runner_tls_handshake` test builds it; never part of a shipped plugin.
tls-probe = ["escape-probe", "dep:rustls"]
