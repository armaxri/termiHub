[package]
name = "termihub-core"
version = "0.1.0"
description = "Shared core library for termiHub desktop and agent"
edition = "2021"

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt", "sync", "net", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
surge-ping = "0.8"
hickory-resolver = { version = "0.26", features = ["tokio", "system-config"] }
socket2 = { version = "0.5", features = ["all"] }
ipnet = "2.10"
pnet_packet = "0.35"
rand = "0.8"
serial2 = { workspace = true, optional = true }
serial2-tokio = { workspace = true, optional = true }
portable-pty = { version = "0.8", optional = true }
tracing = { version = "0.1", optional = true }
russh = { workspace = true, optional = true }
russh-sftp = { workspace = true, optional = true }
bollard = { workspace = true, optional = true }
futures-util = { version = "0.3", optional = true }
ringbuf = "0.5.0"
shellexpand = "3.1"
vte = "0.13"

[dev-dependencies]
tempfile = "3"
temp-env = "0.3"
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "net"] }
serde_json = { workspace = true }
russh = { workspace = true }

[features]
default = []
serial = ["dep:serial2", "dep:serial2-tokio", "dep:tracing"]
local-shell = ["dep:portable-pty", "dep:tracing"]
telnet = ["dep:tracing"]
ssh = ["dep:russh", "dep:russh-sftp", "dep:tracing"]
docker = ["dep:bollard", "dep:futures-util", "dep:tracing"]
wsl = ["dep:portable-pty", "dep:tracing"]
