[package]
name = "termihub-core"
version = "0.1.0"
description = "Shared core library for termiHub desktop and agent"
edition = "2021"
rust-version.workspace = true
# First-party workspace crate — never published to crates.io (the repo is MIT,
# see /LICENSE). Marks it private so cargo-deny's `[licenses] private.ignore`
# skips its missing per-crate license field (#2096).
publish = false
build = "build.rs"

# cargo-machete cannot see this dependency's usage because its package name
# (`vnc-rs`) differs from its library crate name (`[lib] name = "vnc"`): the code
# imports it as `vnc::VncConnector` / `vnc::VncClient` (core/src/backends/vnc/),
# which machete's `vnc_rs` name-scan never matches. It is genuinely used behind
# the `vnc` feature, so ignore-list it rather than remove it.
#
# primefield, aead, aes-gcm, argon2 and blake2 are lockfile pins, not code
# dependencies (#4465): exact `=…-rc.N` requirements that hold the russh -rc
# crypto stack in the root Cargo.lock (see the `[dependencies]` comment). No
# code imports them by design, so machete must not flag them.
[package.metadata.cargo-machete]
ignored = ["vnc-rs", "primefield", "aead", "aes-gcm", "argon2", "blake2"]

# Hashing the staged `termihub-rdp-helper` externalBin to embed its SHA-256 at
# build time for the adapter's pre-spawn integrity check (#1762). Always compiled
# (build-deps cannot be feature-gated), but tiny and pure-Rust.
[build-dependencies]
sha2 = "0.10"
hex = "0.4"

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt", "sync", "net", "time", "macros", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
surge-ping = "0.8"
hickory-resolver = { version = "0.26", features = ["tokio", "system-config"] }
socket2 = { version = "0.5", features = ["all"] }
ipnet = "2.10"
pnet_packet = "0.35"
rand = "0.8"
serial2 = { workspace = true, optional = true }
serial2-tokio = { workspace = true, optional = true }
portable-pty = { version = "0.9", optional = true }
# Cross-platform local-host stats (CPU/mem/swap/disk/network) for the local
# monitoring collector + provider (PROD-0022). Same crate/version the agent
# used before the collector moved into core.
sysinfo = { version = "0.38", optional = true }
tracing = { version = "0.1", optional = true }
# The shared rotating log-file writer (`diagnostics::file_log`, #4319) is a
# `tracing_subscriber::fmt::MakeWriter` and builds the file sink's `EnvFilter`.
# Already in the workspace tree via the desktop and the agent.
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter"], optional = true }
# The shared version parser and agent-compatibility rule (`util::version`,
# #4363), plus plugin install/update downgrade detection (PLG-012). Always on:
# the desktop and the agent both parse versions through it.
semver = "1"
# The single RFC 3339 timestamp formatter (`util::time`, #4363). Always on, but
# only `std` — `clock` (`Utc::now`) and `serde` come with `embedded-servers`.
chrono = { version = "0.4", default-features = false, features = ["std"] }
russh = { workspace = true, optional = true }
russh-sftp = { workspace = true, optional = true }
# Privilege-elevated SFTP writes (sftp_ops): POSIX-quote the untrusted remote
# destination path so it can never break out of the `sudo /bin/sh` command, and
# generate the tool-owned `/tmp/termihub-<uuid>` temp upload path.
shlex = { version = "1", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
# Wipe SSH keyboard-interactive prompt responses (OTP / password answers) from
# memory once they have been sent (#3371). Already in the tree via russh.
zeroize = { version = "1", optional = true }
# Loading legacy PKCS#5-encrypted PEM EC keys that russh 0.61 can't parse
# (see backends/ssh/legacy_pem.rs). Versions mirror russh's own crypto stack.
aes = { version = "0.9", optional = true }
cbc = { version = "0.2", optional = true }
md5 = { version = "0.7", optional = true }
sec1 = { version = "0.8", features = ["der"], optional = true }
hex = { version = "0.4", optional = true }
data-encoding = { version = "2", optional = true }
p256 = { version = "=0.14.0-rc.9", optional = true }
p384 = { version = "=0.14.0-rc.9", optional = true }
p521 = { version = "=0.14.0-rc.9", optional = true }
# Lockfile pins, not used in code (#4465). The daily `cargo update` chore moved
# these -rc crates to their first stable release: `^0.14.0-rc.9` matches 0.14.0,
# but the -rc p256/p384/p521 stack russh 0.61 needs does not compile against
# primefield 0.14.0, and the bumps went past the reviewed pre-release allowlist
# (.github/prerelease-allowlist.json). An exact `=` requirement on a workspace
# member holds the whole root Cargo.lock (it resolves for all features), so
# neither the chore nor a local `cargo update` can cross the rc -> stable line.
# `default-features = false`: pin the version only, never change what russh
# enables.
# Lift these together with the allowlist entries when russh moves to a stable
# RustCrypto line.
primefield = { version = "=0.14.0-rc.9", default-features = false, optional = true }
aead = { version = "=0.6.0-rc.10", default-features = false, optional = true }
aes-gcm = { version = "=0.11.0-rc.4", default-features = false, optional = true }
argon2 = { version = "=0.6.0-rc.8", default-features = false, optional = true }
blake2 = { version = "=0.11.0-rc.6", default-features = false, optional = true }
bollard = { workspace = true, optional = true }
futures-util = { version = "0.3", optional = true }
# Hashing the Docker CLI context name to locate its `contexts/meta/<id>` entry
# (the id is the lowercase hex SHA-256 of the context name) — see
# backends/docker/runtime.rs.
sha2 = { version = "0.10", optional = true }
# FTP / FTPS client. The `tokio` + `tokio-rustls-aws-lc-rs` features run the
# client on termiHub's native tokio runtime (suppaftp 6 pulled the now-
# unmaintained `async-std` executor — RUSTSEC-2025-0052 — which suppaftp itself
# dropped in v9). The v11 bump also closes RUSTSEC-2026-0271 (FTP CRLF command
# injection), fixed upstream in >=10.0.2. `deprecated` is required for implicit
# FTPS (`connect_secure_implicit`).
suppaftp = { version = "11", default-features = false, features = [
    "tokio",
    "tokio-rustls-aws-lc-rs",
    "deprecated",
], optional = true }
# rustls async TLS connector for FTPS — version pinned to suppaftp's own
# `tokio-rustls` so the `rustls` / `rustls-pki-types` types unify. Already in the
# workspace tree (reqwest / libunftp / vnc-rs), so this adds no new crate.
tokio-rustls = { version = "0.26", default-features = false, features = [
    "aws-lc-rs",
    "logging",
    "tls12",
], optional = true }
# Mozilla root CA bundle for the FTPS (rustls) client-config trust store.
webpki-roots = { version = "1", optional = true }
# VNC / RFB client: async, tokio-based framebuffer decode (Raw / Zrle / CopyRect)
# plus cursor + clipboard, decoding on the wire into the shared, protocol-agnostic
# graphical frame stream (#1681). Library-first per the repo rules — the RFB
# state machine is not hand-rolled.
#
# Vendored fork at `vendor/vnc-rs` (#1714): upstream 0.5.3 hard-errors on any RFB
# security type other than None/VncAuth and keeps `VncClient::new` `pub(super)`,
# so a VeNCrypt+TLS handshake cannot be driven. The fork adds VeNCrypt (security
# type 19) over TLS behind its `vencrypt` feature, reusing the in-tree rustls
# stack (via russh) — no new/duplicate crypto dependency.
vnc-rs = { path = "../vendor/vnc-rs", features = ["vencrypt"], optional = true }
# Pure-Rust JPEG decoder for the VNC Tight encoding's JPEG sub-rects (#1715).
# `vnc-rs` emits raw JPEG bytes via `VncEvent::JpegImage`; this decodes them to
# RGBA to fold into the shared shadow framebuffer. Chosen for a tiny, pure-Rust
# dep tree (only `zune-core`) that cannot collide with the SSH RustCrypto pins.
zune-jpeg = { version = "0.4", optional = true }
# MessagePack codec for the RDP sidecar IPC (#1747). Compact self-describing
# binary: keeps frame `Vec<u8>` packed (unlike JSON) while still round-tripping
# the internally-tagged `InputEvent` enum (which `bincode` cannot). Pulls no
# crypto, so it cannot collide with the SSH RustCrypto pins.
rmp-serde = { version = "1", optional = true }
# PATH lookup for the RDP sidecar's bare-name fallback (CORE-011): resolve the
# helper to the ABSOLUTE path `Command::new` would execute, so the pre-spawn
# integrity check hashes the exact file that is spawned instead of a CWD-relative
# name. The de-facto cross-platform `which` implementation (already in the tree,
# used windows-only for shell detection) — library-first over hand-rolled PATH
# scanning. Behind the optional `rdp-sidecar` feature.
which = { version = "7", optional = true }
ringbuf = "0.5.2"
# Local crash-report / diagnostics redaction (OBS-010): pattern-based masking of
# credentials, tokens, IPs, hostnames and home paths. Already in the workspace
# tree (via tracing-subscriber's env-filter), so this adds no new crate.
regex = "1"
# The local machine's host name, masked from crash reports and exported logs
# (OBS-010). Already in the workspace tree, so this adds no new crate.
gethostname = "1"
shellexpand = "3.1"
# ZIP reader for the `.termihub-plugin` package format (#1989). Used instead of
# hand-rolled archive parsing to open a package and read its `manifest.json`.
# Behind the optional `plugin` feature so it is only compiled when the plugin
# system is built.
zip = { version = "2", optional = true }
# Native plugin host loader (#1995): opens a plugin's backend dynamic library
# (`.dll`/`.so`/`.dylib`) and resolves its stable-ABI entry symbols. The de-facto
# cross-platform `dlopen`/`LoadLibrary` wrapper — library-first over hand-rolled
# FFI. Behind the optional `plugin` feature.
libloading = { version = "0.8", optional = true }
# The stable ABI contract shared by the host and every plugin (#1990). The host
# loader resolves the plugin's exported symbols to the type aliases this crate
# defines and drives the backend through its safe wrappers. Behind `plugin`.
termihub-plugin-api = { path = "../plugin-api", optional = true }
# The library half of the out-of-process plugin runner (#4182): the native-library
# loader (digest pin, ABI gate, toolchain rule — shared so the in-process host and
# the runner enforce the identical sequence) and the host<->runner IPC protocol.
# Pulls no tokio/Tauri; only the binary target is the sidecar. Behind `plugin`.
termihub-plugin-runner = { path = "../plugin-runner", optional = true }
# Embedded HTTP/FTP/TFTP file servers (#2192), so the same server implementations
# run on the desktop or a remote agent. Behind the optional `embedded-servers`
# feature so non-hosting core consumers do not pull the web-server stack.
# `axum` + `tower-http` serve the HTTP file server; `libunftp` + `unftp-sbe-fs`
# power the FTP server; `chrono` timestamps `started_at`. The TFTP server is
# hand-rolled over std UDP (RFC 1350) — no crate.
axum = { version = "0.7", optional = true }
tower-http = { version = "0.5", features = ["fs"], optional = true }
# The embedded server implementations use `anyhow` for their internal
# error plumbing (`Context`, `anyhow!`); gated behind `embedded-servers` so the
# rest of core keeps its `thiserror`-only error surface.
anyhow = { version = "1", optional = true }
libunftp = { version = "0.23", optional = true }
# The auth/storage traits `libunftp` builds on moved into `unftp-core` in 0.23.
unftp-core = { version = "0.1", optional = true }
unftp-sbe-fs = { version = "0.4", optional = true }
# Ed25519 plugin package signing / verification (#2036). Mature, misuse-resistant
# Ed25519 implementation (library-first over hand-rolled curve code). The
# `rand_core` feature enables `SigningKey::generate` for the keygen tool; the
# CSPRNG itself is `rand`'s `OsRng` (already a core dependency). Behind `plugin`.
ed25519-dalek = { version = "2", features = ["rand_core"], optional = true }
# Base64 codec used by the `plugin` feature for the 32-byte public key and
# 64-byte signature in `signature.json` (#2036), and by the `docker` feature to
# move file content across the `docker exec` boundary (LIBBE-001).
base64 = { version = "0.22", optional = true }
# Constant-time equality for the embedded HTTP server's Basic-auth credential
# check (PROD-0035), so credential verification cannot leak via timing. Already
# in the workspace tree (a transitive dependency of `argon2`), so this adds no
# new supply-chain surface. Behind the optional `embedded-servers` feature.
subtle = { version = "2", optional = true }
# `http_body::Body` trait, implemented by the embedded HTTP server's access-log
# body wrapper (PROD-034) to count streamed bytes and time a download to its
# last byte. Already in the tree via axum/hyper — adds no new crate. Behind the
# optional `embedded-servers` feature.
http-body = { version = "1", optional = true }
# HTTP client for the periodic HTTP monitor service (#2592), hostable on the
# desktop or a remote agent. `rustls-tls` avoids an OpenSSL dependency for the
# agent's musl cross-compilation; `blocking` backs the offline unit test that
# obtains a real `reqwest::Error`. Already in the workspace tree (the desktop
# and agent both depend on `reqwest`), so this adds no new crate. Behind the
# optional `http-monitor` feature.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "blocking",
], optional = true }

[target.'cfg(unix)'.dependencies]
# Read the real uid (`getuid`) to verify a local-IPC directory is owned by the
# current user before binding into it, rather than trusting a squattable
# `/tmp/termihub` — see `ipc::ensure_private_dir` (AGT-020).
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# The user's preferred locale (CoreFoundation), used to give local shells a
# UTF-8 LANG when the app is launched from Finder/Dock without one (#4336).
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
# The shared current-user SID / protected-DACL helper (#4322): the per-user DACL
# of a security-hardened local-IPC listener (the security analog of the Unix
# socket's 0o700 permissions, `ipc::ListenerSecurity::CurrentUserOnly`) and the
# accept-time peer-SID check (AGT-022).
termihub-win-security = { path = "../win-security" }
# Win32 FFI for the rest of core's Windows code (open-ports listing, console
# probe, plugin-runner watchdog, socket duplication).
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    # Spawn-free open-ports listing (#3814): socket owner tables + process
    # snapshot, and the console probe of `util::no_window`'s Windows test.
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Console",
    # The plugin-runner watchdog reads a runner's commit charge
    # (`K32GetProcessMemoryInfo`) to tell a hang near its job memory limit
    # from a plain hang (#4240).
    "Win32_System_ProcessStatus",
    # The plugin bridge checks a socket's provider hands out kernel (IFS)
    # handles before duplicating it into a runner (#4219).
    "Win32_Networking_WinSock",
] }
# Read Git for Windows' `InstallPath` from HKLM/HKCU\SOFTWARE\GitForWindows so
# Git Bash is discoverable regardless of install location — see
# `session::shell::git_bash_candidates`.
winreg = "0.55"
# Locate `git.exe` on PATH (winget/scoop/choco/custom installs) to derive the
# sibling `bin\bash.exe` — see `session::shell::git_bash_candidates`.
which = "7"

# CLI for the plugin packaging tooling (#1994). Gated behind `plugin` so it (and
# its use of `termihub_core::plugin`) is only built when that feature is on;
# without the gate, a default-feature `cargo build` would try to compile it and
# fail. Driven by `scripts/package-plugin.{sh,cmd}`.
[[bin]]
name = "termihub-plugin-pack"
path = "src/bin/plugin_pack.rs"
required-features = ["plugin"]

# Plugin code-signing tools (#2036), gated behind `plugin` like the packer:
# `plugin-keygen` mints an Ed25519 publisher keypair; `plugin-sign` writes a
# `signature.json` into a built package. Driven from `scripts/package-plugin.*`.
[[bin]]
name = "termihub-plugin-keygen"
path = "src/bin/plugin_keygen.rs"
required-features = ["plugin"]

[[bin]]
name = "termihub-plugin-sign"
path = "src/bin/plugin_sign.rs"
required-features = ["plugin"]

[dev-dependencies]
async-trait = { workspace = true }
tempfile = "3"
# `ServiceExt::oneshot` for driving the embedded HTTP router in unit tests
# (#2192) without binding a real socket.
tower = { version = "0.5", features = ["util"] }
temp-env = "0.3"
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "net", "test-util"] }
serde_json = { workspace = true }
russh = { workspace = true }
# Property-based testing for the panel-tree algebra (#2143) — its pure-function
# tree operations have a clean invariant shape ideal for proptest.
proptest = "1"
# Serializes integration tests that mutate shared single-instance container
# state (e.g. the network-fault-proxy's `tc` qdisc) so the suite is parallel-safe
# regardless of `--test-threads` (#864).
serial_test = "3"
# Generate the TypeScript connection-config DTOs from their Rust source of truth,
# killing the hand-duplicated TS↔Rust interfaces behind audit findings
# DUP-030/MOCK-005 (ts-rs rollout, part of #3088). The `#[derive(TS)]` and
# `#[ts(...)]` attrs are gated behind `#[cfg_attr(test, …)]`, so ts-rs is compiled
# ONLY under `cargo test` and is entirely absent from the release binary
# (`cargo build`). Generation = running the emitted `export_bindings_*` tests; a
# CI gate then fails on stale output. Matches the version wired for `src-tauri`.
ts-rs = "12"
# The socket type surge-ping's `Icmpv4Packet::decode` takes, so the ping tests can
# decode a real raw echo reply and assert its TTL is reported (#4337). Same 0.6 line
# surge-ping already pulls in — no new crate in the lockfile.
socket2-surge = { package = "socket2", version = "0.6" }

[target.'cfg(windows)'.dev-dependencies]
# `tests/sideloaded_conpty.rs` (#4130): preload the staged `conpty.dll` by full
# path (`LoadLibraryW`) and turn on VT output in its PTY child (console APIs).
# `tests/plugin_runner_sandbox.rs` (#4187): a canary named pipe the sandboxed
# plugin must not open.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
] }

[features]
default = []
# Structured logging for the always-compiled core modules that emit diagnostics
# (currently the transfer registry's illegal-transition warning, DUP-026). An
# explicit feature — rather than the implicit one, which is suppressed because
# other features reference `dep:tracing` — so a consumer that wants those logs
# (the desktop) can opt in, while `cargo test -p termihub-core` (default) compiles
# them out and stays tracing-free.
tracing = ["dep:tracing"]
# The shared rotating log-file writer and russh clamp (`diagnostics::file_log`,
# #4319, audit DUP2-006), used by both the desktop and the agent.
file-log = ["dep:tracing-subscriber", "dep:tracing"]
# Ed25519 verification of agent update binaries (AGT-005, #3213 / #3330): the
# trusted release key(s) compiled in from `agent/keys/update-signing.pub.pem`,
# the domain-separated signed message, and the release/dev signature policy.
# Shared by the agent (self-update apply gate) and the desktop (verify before
# every deploy path) so the two can never drift apart.
agent-update-signing = [
    "dep:ed25519-dalek",
    "dep:base64",
    "dep:hex",
    "dep:tracing",
]
# Deterministic test signing helpers (`agent_update_signature::test_support`)
# for the agent's and desktop's own tests. Enabled only from `[dev-dependencies]`
# — never in a shipping build.
agent-update-signing-test-support = ["agent-update-signing"]
# Deterministic test signing helpers for the curated plugin-index signature
# (`plugin::index_signature::test_support`, #3716). Enabled only from
# `[dev-dependencies]` — never in a shipping build.
plugin-index-signing-test-support = ["plugin"]
# In-process keyboard-interactive SSH server (`backends::ssh::ki_test_server`)
# for other crates' tests — the agent's relayed OTP end-to-end suite (#3436).
# Enabled only from `[dev-dependencies]` — never in a shipping build.
ssh-test-support = ["ssh"]
# Fixture addressing (`test_fixtures`: ports/containers from dev.local.json) and
# the skip-or-fail gate shared by every crate's integration tests (#4338).
# Enabled only from `[dev-dependencies]` — never in a shipping build.
fixture-test-support = []
# Embedded HTTP/FTP/TFTP file servers (#2192). Pulls the web-server stack
# (`axum`/`tower-http` for HTTP, `libunftp`/`unftp-sbe-fs` for FTP) plus `chrono`
# for status timestamps and `tracing` for lifecycle logs. Enabled by the desktop
# (`src-tauri`) and the agent so both can host the servers.
embedded-servers = [
    "dep:axum",
    "dep:tower-http",
    "dep:libunftp",
    "dep:unftp-core",
    "dep:unftp-sbe-fs",
    "chrono/clock",
    "chrono/serde",
    "dep:tracing",
    "dep:anyhow",
    "tokio/fs",
    # Optional HTTP Basic auth for the HTTP server (PROD-0035): `base64` decodes
    # the `Authorization: Basic` header, `sha2` reduces credentials to a
    # fixed-length digest, and `subtle` compares those digests in constant time.
    "dep:base64",
    "dep:sha2",
    "dep:subtle",
    # Access-log body wrapper for the HTTP server (PROD-034).
    "dep:http-body",
]
# Plugin package format + manifest schema/validation (#1989), plus the native
# host loader (#1995). Pulls `zip` to read `.termihub-plugin` archives,
# `libloading` to open a plugin's backend dynamic library, and
# `termihub-plugin-api` for the stable ABI contract.
plugin = [
    "dep:zip",
    "dep:libloading",
    "dep:termihub-plugin-api",
    "dep:termihub-plugin-runner",
    # Package code-signing substrate (#2036): Ed25519 signatures over a per-entry
    # SHA-256 digest map, base64-encoded in `signature.json`, hex for the key
    # fingerprint / digest rendering.
    "dep:ed25519-dalek",
    "dep:base64",
    "dep:sha2",
    "dep:hex",
    # A log line for each confirmed install/update downgrade (PLG-012); the
    # semver precedence compare itself uses the always-on `semver` dependency.
    "dep:tracing",
]
# Periodic HTTP monitor service (#2592), hostable on the desktop or a remote
# agent. Pulls `reqwest` for the checks, `uuid` for monitor ids, `tracing` for
# lifecycle logs, and `tokio/rt` for the per-monitor poll runtime. Enabled by the
# desktop (`src-tauri`) and the agent so both can host the monitor.
http-monitor = ["dep:reqwest", "dep:uuid", "dep:tracing", "tokio/rt"]
serial = ["dep:serial2", "dep:serial2-tokio", "dep:tracing"]
local-shell = ["dep:portable-pty", "dep:tracing", "dep:sysinfo"]
telnet = ["dep:tracing"]
ssh = [
    "dep:russh",
    "dep:zeroize",
    "dep:russh-sftp",
    "dep:shlex",
    "dep:uuid",
    "dep:tracing",
    "dep:aes",
    "dep:cbc",
    "dep:md5",
    "dep:sec1",
    "dep:hex",
    "dep:data-encoding",
    "dep:p256",
    "dep:p384",
    "dep:p521",
    # Lockfile-only pins of the russh -rc crypto stack (#4465), see above.
    "dep:primefield",
    "dep:aead",
    "dep:aes-gcm",
    "dep:argon2",
    "dep:blake2",
    # Local-file streaming for the SFTP transfer path (files/transfer/sftp.rs:
    # local read/append/create/metadata/remove). Without it a `--features ssh`
    # isolation build fails with `cannot find fs in tokio` (mirrors the `ftp`
    # feature, which enables it for files/transfer/ftp.rs).
    "tokio/fs",
]
docker = [
    "dep:bollard",
    "dep:futures-util",
    "dep:tracing",
    "dep:sha2",
    "dep:hex",
    # base64 codec for moving file content across the `docker exec` boundary
    # (LIBBE-001) — replaces a hand-rolled encoder/decoder with the battle-tested
    # crate. Already compiled into every shipping build (src-tauri + agent both
    # depend on it non-optionally), so this adds no new supply-chain surface.
    "dep:base64",
    # Local-file streaming for the Docker transfer executor
    # (files/transfer/docker.rs: local read/append/create/metadata/remove).
    "tokio/fs",
    # `StreamReader` adapts the `docker exec` stdout stream into an `AsyncRead`.
    "tokio-util/io",
]
wsl = ["dep:portable-pty", "dep:tracing", "dep:uuid"]
# Queued local-disk file copies (files/transfer/local.rs, PARITY-004 #3567):
# the chunked, pausable/resumable copy behind local and local <-> WSL (UNC)
# copies. Needs `tokio/fs` for the streaming and `tracing` for the shared
# attempt orchestration's logs.
local-transfer = ["dep:tracing", "tokio/fs"]
ftp = [
    "dep:suppaftp",
    "dep:tokio-rustls",
    "dep:webpki-roots",
    "dep:tracing",
    # Local-file streaming for FTP transfers (RETR → local, local → STOR).
    "tokio/fs",
]
# Test-only FTPS trust anchors (`backends::ftp::test_support`, #4006): lets the
# FTPS fixture test trust the fixture's test CA. Only adds roots, never skips
# verification. Enabled by `--all-features` test runs and dev-dependencies —
# never in a shipping build.
ftp-test-support = ["ftp"]
# Mock graphical remote-desktop backend: a protocol-less moving test pattern so
# the shared remote-desktop layer (#1680) merges and is E2E-testable with no
# real VNC/RDP server. Pulls no extra deps (tokio + tokio-util are core deps).
mock-remote-desktop = []
# VNC (RFB) graphical remote-desktop backend (#1681). Decodes framebuffer
# updates in Rust into the shared frame stream and translates the shared input /
# clipboard events to RFB. Depends on `ssh` because the connection editor's
# optional SSH-tunnel group reaches the VNC server through the existing SSH
# tunnel infrastructure (as the VNC concept specifies).
vnc = ["dep:vnc-rs", "dep:zune-jpeg", "dep:tracing", "ssh"]
# RDP graphical remote-desktop backend via a separately-built IronRDP sidecar
# (#1747). This crate holds only the thin `SidecarRdp` adapter — it spawns the
# `termihub-rdp-helper` binary and bridges its IPC into the shared #1680 layer —
# and links NO RDP crate, so unlike a same-crate IronRDP backend it does not
# conflict with `ssh`/russh (the #1725 blocker). The IronRDP code lives in the
# workspace-excluded `rdp-sidecar/` crate (own Cargo.lock); this feature only
# compiles the adapter + IPC protocol + config. `tokio/process` is needed to
# spawn/supervise the child. The sidecar binary is built separately
# (scripts/build-rdp-sidecar.sh) and bundled next to the app binary.
rdp-sidecar = [
    "dep:rmp-serde",
    "dep:tracing",
    "tokio/process",
    # Pre-spawn SHA-256 integrity verification of the bundled sidecar (#1762).
    "dep:sha2",
    "dep:hex",
    # Resolve the bare-name helper fallback to an absolute PATH entry so the
    # integrity check hashes the exact file that is spawned (CORE-011).
    "dep:which",
]
