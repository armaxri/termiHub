[package]
name = "termihub-core"
version = "0.1.0"
description = "Shared core library for termiHub desktop and agent"
edition = "2021"
# First-party workspace crate — never published to crates.io (the repo is MIT,
# see /LICENSE). Marks it private so cargo-deny's `[licenses] private.ignore`
# skips its missing per-crate license field (#2096).
publish = false
build = "build.rs"

# Hashing the staged `termihub-rdp-helper` externalBin to embed its SHA-256 at
# build time for the adapter's pre-spawn integrity check (#1762). Always compiled
# (build-deps cannot be feature-gated), but tiny and pure-Rust.
[build-dependencies]
sha2 = "0.10"
hex = "0.4"

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt", "sync", "net", "time", "macros", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
surge-ping = "0.8"
hickory-resolver = { version = "0.26", features = ["tokio", "system-config"] }
socket2 = { version = "0.5", features = ["all"] }
ipnet = "2.10"
pnet_packet = "0.35"
rand = "0.8"
serial2 = { workspace = true, optional = true }
serial2-tokio = { workspace = true, optional = true }
portable-pty = { version = "0.8", optional = true }
tracing = { version = "0.1", optional = true }
russh = { workspace = true, optional = true }
russh-sftp = { workspace = true, optional = true }
# Loading legacy PKCS#5-encrypted PEM EC keys that russh 0.61 can't parse
# (see backends/ssh/legacy_pem.rs). Versions mirror russh's own crypto stack.
aes = { version = "0.9", optional = true }
cbc = { version = "0.2", optional = true }
md5 = { version = "0.7", optional = true }
sec1 = { version = "0.8", features = ["der"], optional = true }
hex = { version = "0.4", optional = true }
data-encoding = { version = "2", optional = true }
p256 = { version = "=0.14.0-rc.9", optional = true }
p384 = { version = "=0.14.0-rc.9", optional = true }
p521 = { version = "=0.14.0-rc.9", optional = true }
bollard = { workspace = true, optional = true }
futures-util = { version = "0.3", optional = true }
# Hashing the Docker CLI context name to locate its `contexts/meta/<id>` entry
# (the id is the lowercase hex SHA-256 of the context name) — see
# backends/docker/runtime.rs.
sha2 = { version = "0.10", optional = true }
# FTP / FTPS client. `async-rustls` aligns with termiHub's rustls stack
# (the concept originally proposed `async-native-tls`; deviation flagged in the PR).
# `deprecated` is required for implicit FTPS (`connect_secure_implicit`).
suppaftp = { version = "6", default-features = false, features = [
    "async-rustls",
    "deprecated",
], optional = true }
# rustls async TLS connector for FTPS — version pinned to suppaftp's own
# `futures-rustls` so the `rustls` / `rustls-pki-types` types unify.
futures-rustls = { version = "0.26", optional = true }
# Mozilla root CA bundle for the FTPS (rustls) client-config trust store.
webpki-roots = { version = "1", optional = true }
# VNC / RFB client: async, tokio-based framebuffer decode (Raw / Zrle / CopyRect)
# plus cursor + clipboard, decoding on the wire into the shared, protocol-agnostic
# graphical frame stream (#1681). Library-first per the repo rules — the RFB
# state machine is not hand-rolled.
#
# Vendored fork at `vendor/vnc-rs` (#1714): upstream 0.5.3 hard-errors on any RFB
# security type other than None/VncAuth and keeps `VncClient::new` `pub(super)`,
# so a VeNCrypt+TLS handshake cannot be driven. The fork adds VeNCrypt (security
# type 19) over TLS behind its `vencrypt` feature, reusing the in-tree rustls
# stack (via russh) — no new/duplicate crypto dependency.
vnc-rs = { path = "../vendor/vnc-rs", features = ["vencrypt"], optional = true }
# Pure-Rust JPEG decoder for the VNC Tight encoding's JPEG sub-rects (#1715).
# `vnc-rs` emits raw JPEG bytes via `VncEvent::JpegImage`; this decodes them to
# RGBA to fold into the shared shadow framebuffer. Chosen for a tiny, pure-Rust
# dep tree (only `zune-core`) that cannot collide with the SSH RustCrypto pins.
zune-jpeg = { version = "0.4", optional = true }
# MessagePack codec for the RDP sidecar IPC (#1747). Compact self-describing
# binary: keeps frame `Vec<u8>` packed (unlike JSON) while still round-tripping
# the internally-tagged `InputEvent` enum (which `bincode` cannot). Pulls no
# crypto, so it cannot collide with the SSH RustCrypto pins.
rmp-serde = { version = "1", optional = true }
ringbuf = "0.5.0"
shellexpand = "3.1"
vte = "0.13"
# ZIP reader for the `.termihub-plugin` package format (#1989). Used instead of
# hand-rolled archive parsing to open a package and read its `manifest.json`.
# Behind the optional `plugin` feature so it is only compiled when the plugin
# system is built.
zip = { version = "2", optional = true }
# Native plugin host loader (#1995): opens a plugin's backend dynamic library
# (`.dll`/`.so`/`.dylib`) and resolves its stable-ABI entry symbols. The de-facto
# cross-platform `dlopen`/`LoadLibrary` wrapper — library-first over hand-rolled
# FFI. Behind the optional `plugin` feature.
libloading = { version = "0.8", optional = true }
# The stable ABI contract shared by the host and every plugin (#1990). The host
# loader resolves the plugin's exported symbols to the type aliases this crate
# defines and drives the backend through its safe wrappers. Behind `plugin`.
termihub-plugin-api = { path = "../plugin-api", optional = true }
# Ed25519 plugin package signing / verification (#2036). Mature, misuse-resistant
# Ed25519 implementation (library-first over hand-rolled curve code). The
# `rand_core` feature enables `SigningKey::generate` for the keygen tool; the
# CSPRNG itself is `rand`'s `OsRng` (already a core dependency). Behind `plugin`.
ed25519-dalek = { version = "2", features = ["rand_core"], optional = true }
# Base64 codec for the 32-byte public key and 64-byte signature carried in
# `signature.json` (#2036). Behind `plugin`.
base64 = { version = "0.22", optional = true }

[target.'cfg(windows)'.dependencies]
# Used to build a per-user DACL for a security-hardened local-IPC listener
# (the security analog of the Unix socket's 0o700 permissions) — see
# `ipc::ListenerSecurity::CurrentUserOnly`.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }
# Read Git for Windows' `InstallPath` from HKLM/HKCU\SOFTWARE\GitForWindows so
# Git Bash is discoverable regardless of install location — see
# `session::shell::git_bash_candidates`.
winreg = "0.55"
# Locate `git.exe` on PATH (winget/scoop/choco/custom installs) to derive the
# sibling `bin\bash.exe` — see `session::shell::git_bash_candidates`.
which = "7"

# CLI for the plugin packaging tooling (#1994). Gated behind `plugin` so it (and
# its use of `termihub_core::plugin`) is only built when that feature is on;
# without the gate, a default-feature `cargo build` would try to compile it and
# fail. Driven by `scripts/package-plugin.{sh,cmd}`.
[[bin]]
name = "termihub-plugin-pack"
path = "src/bin/plugin_pack.rs"
required-features = ["plugin"]

# Plugin code-signing tools (#2036), gated behind `plugin` like the packer:
# `plugin-keygen` mints an Ed25519 publisher keypair; `plugin-sign` writes a
# `signature.json` into a built package. Driven from `scripts/package-plugin.*`.
[[bin]]
name = "termihub-plugin-keygen"
path = "src/bin/plugin_keygen.rs"
required-features = ["plugin"]

[[bin]]
name = "termihub-plugin-sign"
path = "src/bin/plugin_sign.rs"
required-features = ["plugin"]

[dev-dependencies]
async-trait = { workspace = true }
tempfile = "3"
temp-env = "0.3"
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "net"] }
serde_json = { workspace = true }
russh = { workspace = true }
# Serializes integration tests that mutate shared single-instance container
# state (e.g. the network-fault-proxy's `tc` qdisc) so the suite is parallel-safe
# regardless of `--test-threads` (#864).
serial_test = "3"

[features]
default = []
# Plugin package format + manifest schema/validation (#1989), plus the native
# host loader (#1995). Pulls `zip` to read `.termihub-plugin` archives,
# `libloading` to open a plugin's backend dynamic library, and
# `termihub-plugin-api` for the stable ABI contract.
plugin = [
    "dep:zip",
    "dep:libloading",
    "dep:termihub-plugin-api",
    # Package code-signing substrate (#2036): Ed25519 signatures over a per-entry
    # SHA-256 digest map, base64-encoded in `signature.json`, hex for the key
    # fingerprint / digest rendering.
    "dep:ed25519-dalek",
    "dep:base64",
    "dep:sha2",
    "dep:hex",
]
serial = ["dep:serial2", "dep:serial2-tokio", "dep:tracing"]
local-shell = ["dep:portable-pty", "dep:tracing"]
telnet = ["dep:tracing"]
ssh = [
    "dep:russh",
    "dep:russh-sftp",
    "dep:tracing",
    "dep:aes",
    "dep:cbc",
    "dep:md5",
    "dep:sec1",
    "dep:hex",
    "dep:data-encoding",
    "dep:p256",
    "dep:p384",
    "dep:p521",
]
docker = [
    "dep:bollard",
    "dep:futures-util",
    "dep:tracing",
    "dep:sha2",
    "dep:hex",
]
wsl = ["dep:portable-pty", "dep:tracing"]
ftp = [
    "dep:suppaftp",
    "dep:futures-rustls",
    "futures-util/io",
    "dep:webpki-roots",
    "dep:tracing",
    # Local-file streaming for FTP transfers (RETR → local, local → STOR).
    "tokio/fs",
]
# Mock graphical remote-desktop backend: a protocol-less moving test pattern so
# the shared remote-desktop layer (#1680) merges and is E2E-testable with no
# real VNC/RDP server. Pulls no extra deps (tokio + tokio-util are core deps).
mock-remote-desktop = []
# VNC (RFB) graphical remote-desktop backend (#1681). Decodes framebuffer
# updates in Rust into the shared frame stream and translates the shared input /
# clipboard events to RFB. Depends on `ssh` because the connection editor's
# optional SSH-tunnel group reaches the VNC server through the existing SSH
# tunnel infrastructure (as the VNC concept specifies).
vnc = ["dep:vnc-rs", "dep:zune-jpeg", "dep:tracing", "ssh"]
# RDP graphical remote-desktop backend via a separately-built IronRDP sidecar
# (#1747). This crate holds only the thin `SidecarRdp` adapter — it spawns the
# `termihub-rdp-helper` binary and bridges its IPC into the shared #1680 layer —
# and links NO RDP crate, so unlike a same-crate IronRDP backend it does not
# conflict with `ssh`/russh (the #1725 blocker). The IronRDP code lives in the
# workspace-excluded `rdp-sidecar/` crate (own Cargo.lock); this feature only
# compiles the adapter + IPC protocol + config. `tokio/process` is needed to
# spawn/supervise the child. The sidecar binary is built separately
# (scripts/build-rdp-sidecar.sh) and bundled next to the app binary.
rdp-sidecar = [
    "dep:rmp-serde",
    "dep:tracing",
    "tokio/process",
    # Pre-spawn SHA-256 integrity verification of the bundled sidecar (#1762).
    "dep:sha2",
    "dep:hex",
]
