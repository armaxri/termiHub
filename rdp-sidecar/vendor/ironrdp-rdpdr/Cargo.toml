# termiHub vendored fork of ironrdp-rdpdr 0.7.0 (#4125).
#
# WHAT WAS CHANGED vs upstream (see README.md): a drive's Device Announce Header
# (MS-RDPEFS 2.2.1.3) carries the drive name, truncated to the 7 valid ASCII
# characters the 8-byte PreferredDosName field allows, instead of the literal
# "ignored". xrdp's devredir reads only PreferredDosName, so every redirected
# drive was mounted as ~/thinclient_drives/ignored. DeviceData is unchanged.
# `[lib] test = false` was removed so the fork's own unit tests run.
#
# UPSTREAM CHANGE THIS REPRESENTS: the `PreferredDosName::for_drive` part of
# Devolutions/IronRDP 161409e18dd1, "feat(rdpdr): add filesystem PDU foundation
# (#1566)", merged to master after the 0.7.0 release and not yet published. Drop
# this fork when an ironrdp-rdpdr release that contains it is adopted.
# Everything else is byte-for-byte the crates.io 0.7.0 package (this manifest is
# the registry-normalized one, with this header added).
#
# Wired into the workspace-EXCLUDED sidecar graph via `[patch.crates-io]` in
# `rdp-sidecar/Cargo.toml`, exactly like `vendor/ironrdp-pdu`. The sidecar has
# its own Cargo.lock, so this fork never touches the desktop app's dependency graph.

[package]
edition = "2024"
rust-version = "1.89"
name = "ironrdp-rdpdr"
version = "0.7.0"
authors = [
    "Devolutions Inc. <infos@devolutions.net>",
    "Teleport <goteleport.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "RDPDR channel implementation (termiHub vendored fork naming drives in PreferredDosName)"
homepage = "https://github.com/Devolutions/IronRDP"
readme = "README.md"
keywords = [
    "rdp",
    "remote-desktop",
    "network",
    "client",
    "protocol",
]
categories = ["network-programming"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Devolutions/IronRDP"
resolver = "2"

[lib]
name = "ironrdp_rdpdr"
path = "src/lib.rs"
doctest = false

[dependencies.bitflags]
version = "2.11"

[dependencies.ironrdp-core]
version = "0.2"

[dependencies.ironrdp-error]
version = "0.2"

[dependencies.ironrdp-pdu]
version = "0.9"

[dependencies.ironrdp-svc]
version = "0.8"

[dependencies.tracing]
version = "0.1"
features = ["log"]

