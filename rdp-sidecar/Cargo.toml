[package]
name = "termihub-rdp-sidecar"
version = "0.1.0"
description = "RDP (IronRDP) sidecar for termiHub — decodes RDP and bridges it to the shared remote-desktop layer over IPC (#1747)"
edition = "2021"
# Workspace-excluded, so it cannot inherit `workspace.package`; must equal the
# root workspace's rust-version and `.github/rust-version` (check-rust-version.mjs).
rust-version = "1.98.0"
publish = false

# This crate is EXCLUDED from the root workspace (`[workspace].exclude`) and has
# its own Cargo.lock on purpose: IronRDP's CredSSP crypto and russh pin
# incompatible RustCrypto pre-releases, and Cargo allows one version per crate
# per lockfile (#1725). Resolving IronRDP in its own graph — with no russh —
# dissolves the conflict.

# Release profile. This crate is workspace-excluded, so the root Cargo.toml's
# `[profile.release]` does NOT apply here — every setting must be restated, and
# scripts/internal/check-crate-policy.mjs fails CI if these drift from the root:
#
# - `overflow-checks = true` (ERR-010 / PKG2-008): the sidecar parses untrusted
#   RDP server traffic, and a silent integer wrap to a corrupt value is strictly
#   worse than a fail-fast panic in a safety-critical build.
# - `strip = "debuginfo"` (#4316): strip debug info but keep the symbol table,
#   so a panic backtrace still names functions.
# - `debug = "line-tables-only"` (#4504): the release workflow splits the line
#   tables into a separate debug-symbols release asset (root Cargo.toml).
[profile.release]
overflow-checks = true
debug = "line-tables-only"
strip = "debuginfo"

[[bin]]
name = "termihub-rdp-helper"
path = "src/main.rs"

[dependencies]
# Pure-Rust RDP (Microsoft/Devolutions-maintained). IronRDP decodes on the wire
# into the shared protocol-agnostic frame stream. The sidecar depends on the
# IronRDP sub-crates directly rather than on the `ironrdp` facade (#5117): the
# facade only re-exports them, and upstream releases the sub-crates without
# always cutting a new facade, so naming them is what lets the sidecar track
# their releases. Versions verified to resolve + compile in this excluded graph
# (#1747 / #1725 spike).
ironrdp-connector = "0.12"
ironrdp-session = "0.13"
ironrdp-graphics = "0.11"
ironrdp-pdu = "0.11"
ironrdp-core = "0.3"
# Display Control Virtual Channel (MS-RDPEDISP) for dynamic resize (#1755):
# `ironrdp-dvc` provides the drdynvc static channel that carries DVCs, and
# `ironrdp-displaycontrol` the monitor-layout resize processor that rides it.
ironrdp-dvc = "0.10"
ironrdp-displaycontrol = "0.10"
# Clipboard redirection static channel (MS-RDPECLIP) for bidirectional text
# clipboard bridging (#1756): the CLIPRDR SVC processor plus its
# `CliprdrBackend` integration seam.
ironrdp-cliprdr = "0.9"
# Device redirection static channel (MS-RDPEFS) for drive redirection (#1757):
# the RDPDR SVC processor plus its `RdpdrBackend` filesystem-IRP integration
# seam. MS-RDPEFS requires the `rdpsnd` channel to be co-advertised for the
# server to talk back to rdpdr, so `ironrdp-rdpsnd` is registered alongside it
# (and plays audio, #1764).
ironrdp-rdpdr = "0.9"
ironrdp-rdpsnd = "0.11"
# `ironrdp-svc`'s `SvcMessage` is the return type of the `RdpdrBackend`
# filesystem-IRP handlers (#1757).
ironrdp-svc = "0.10"
ironrdp-tokio = { version = "0.12", features = ["reqwest"] }
ironrdp-tls = { version = "0.3", default-features = false, features = [
    "rustls-ring",
] }

# X.509 parsing for the server certificate's subject/issuer distinguished names
# (#1783). `ironrdp_tls::upgrade` already returns a parsed `x509_cert::Certificate`
# (0.3 since ironrdp-tls 0.3), so this only names the type IronRDP hands us — it
# is already resolved in this graph (IronRDP's TLS layer depends on it), adding no
# new locked dependency. The
# fingerprint is the security-critical identity; subject/issuer are best-effort
# human-readable context for the trust prompt.
# DER + distinguished-name formatting only — `default-features = false` drops the
# `pem` feature (and its pem-rfc7468 crate) we do not use, so this adds no new
# locked dependency to the excluded sidecar graph.
x509-cert = { version = "0.3", default-features = false, features = ["std"] }

# The shared serde types (FrameUpdate / CursorUpdate / InputEvent / RdpConfig)
# and the framed MessagePack IPC helpers live in termihub-core behind the
# `rdp-sidecar` feature. `default-features = false` keeps russh (the `ssh`
# feature) out of this graph, which is the whole point.
termihub-core = { path = "../core", default-features = false, features = [
    "rdp-sidecar",
] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "sync", "time"] }

# Cross-platform filesystem watcher (inotify on Linux, FSEvents on macOS,
# ReadDirectoryChangesW on Windows) so files added to / removed from / renamed in
# the shared folder after connect are re-advertised over CLIPRDR without a
# reconnect (#1788). `default-features = false` drops the optional
# crossbeam-channel event bus we do not use — the watcher forwards events into a
# tokio channel from its callback — while `macos_fsevent` keeps the native macOS
# backend. notify already target-gates its own platform deps (inotify/fsevent-sys/
# windows-sys), so no per-platform gating is needed here.
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Server-certificate trust gate (#1758): fingerprint the server's public key so
# an untrusted certificate can be rejected with an actionable message instead of
# being silently accepted. Both already resolve in this graph (IronRDP's CredSSP
# crypto pulls them in), so this adds no new locked dependency.
sha2 = "0.11"
hex = "0.4"

# Percent-decode the path component of `file:` URIs when parsing a Linux
# `text/uri-list` clipboard payload (#1792). Platform-agnostic (used by the
# unit-tested `host_clipboard::parse_uri_list`), pure Rust, no system libs; already
# resolved transitively in this graph, so naming it directly adds no new locked
# crate.
percent-encoding = "2"

# Host audio output for rdpsnd audio redirection (#1764). `rodio` (a maintained,
# widely-used Rust audio library on top of `cpal`) opens the default output
# device, resamples our advertised PCM to it, and queues decoded `wave` buffers
# through its `Sink`. `default-features = false` drops the file-format decoders
# (symphonia/flac/vorbis/…) we do not use, keeping only the playback core.
#
# Target-gated to macOS/Windows/Linux — the three platforms the bundle CI builds
# the sidecar for. `cpal`'s Linux backend links ALSA (`libasound2-dev`), which
# the bundle CI installs on its native `ubuntu` / `ubuntu-24.04-arm` sidecar
# legs (#1772); at runtime it dynamically loads `libasound.so.2`, which every
# desktop Linux ships. The gate stays explicit (rather than unconditional) so an
# exotic target `cpal` cannot build for degrades to the no-op sink in audio.rs
# instead of failing to compile. This lives in the workspace-EXCLUDED sidecar
# graph, so it adds zero dependency-conflict risk to the main app (#1747).
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
rodio = { version = "0.20", default-features = false }

# Compressed rdpsnd audio decoding (#1812): MS-ADPCM (`WAVE_FORMAT_ADPCM`, 0x0002)
# and IMA/DVI ADPCM (0x0011) `wave` payloads are decoded to 16-bit PCM before the
# existing jitter buffer + rodio sink. Symphonia is a mature, widely-used, pure-Rust
# multimedia library; its `adpcm` codec decodes both formats a Windows `rdpsnd`
# server offers besides PCM. `default-features = false` keeps only the codec + core
# (no format demuxers we do not use), and both crates are pure Rust with no system
# libraries, so they add no C build dependency and are cleanly cross-platform.
#
# Target-gated to the same macOS/Windows/Linux set as `rodio`: ADPCM is only ever
# decoded where the audio sink is compiled and formats are advertised, so gating it
# alongside `rodio` keeps the decoder out of the no-op-sink builds. This lives in the
# workspace-EXCLUDED sidecar graph, so it adds zero dependency-conflict risk to the
# main app (#1747). Opus (`WAVE_FORMAT_OPUS`, 0x704F) is deferred — its maintained
# bindings link the native `libopus` C library, a cross-platform CI cost tracked as a
# follow-up.
symphonia-core = { version = "0.5", default-features = false }
symphonia-codec-adpcm = { version = "0.5", default-features = false }

# Read the host OS clipboard's native file list to bridge it to CLIPRDR (#1779):
# the sidecar runs on the host, so it can read what the user copied in their file
# manager and serve those real files to the remote (`host_clipboard.rs`).
# On macOS `host_clipboard.rs` asks `NSPasteboard` for file URLs directly through
# the objc2 bindings — the same objc2 family the desktop app already uses for its
# own pasteboard code (src-tauri `macos_clipboard.rs` / `macos_services.rs`).
#
# This replaced the `clipboard-files` crate (#3054): although it was only ever
# compiled on macOS, its Linux target table named `gtk 0.18`, which dragged the
# unmaintained GTK3 stack (`gtk`/`glib`/`proc-macro-error`, RUSTSEC-2024-0429 /
# RUSTSEC-2024-0370) into this crate's target-independent Cargo.lock and onto the
# cargo-audit / cargo-deny sign-off list.
#
# Gated to **macOS only**: it links AppKit and must never enter the
# Linux/Windows sidecar graph. This lives in the workspace-EXCLUDED sidecar
# graph, so it adds zero dependency-conflict risk to the main app (#1747).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSDictionary",
    "NSEnumerator",
    "NSObject",
    "NSString",
    "NSURL",
    "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSPasteboard",
] }

# Read the Windows clipboard's `CF_HDROP` file list (#1791) — the Windows half of
# the macOS reader above. `clipboard-win` hands us the raw `CF_HDROP` bytes via
# its `raw` API and `host_clipboard.rs` parses the `DROPFILES` structure itself,
# so the decode stays unit-testable off Windows (a live Win32 clipboard cannot be
# read in headless CI).
#
# Gated to **Windows only**: it links Win32 clipboard APIs and must never enter
# the macOS/Linux sidecar build graph. This lives in the workspace-EXCLUDED
# sidecar graph, so it adds zero dependency-conflict risk to the main app (#1747).
[target.'cfg(windows)'.dependencies]
clipboard-win = "4.5"

# Read the Linux clipboard's `text/uri-list` file list (#1792) — the Linux half
# of the macOS/Windows readers above. Both crates hand `host_clipboard.rs` the raw
# selection text, which its own [`parse_uri_list`] decodes, so the parse stays
# unit-testable off Linux (a live X11/Wayland clipboard cannot be read in headless
# CI).
#
# Chosen over a `gtk`-based reader (such as `clipboard-files`) deliberately: GTK
# clipboard reads require the process main thread and a running GTK main loop,
# which a headless sidecar called from a tokio worker cannot promise. These two
# are window-less, thread-agnostic blocking clients and, crucially, add **no
# system-library build dependency** — `x11-clipboard` is pure Rust over `x11rb`
# (no `libxcb`), and `wl-clipboard-rs` with `dlopen` loads `libwayland` at runtime
# (no link-time `libwayland-dev`), so the bundle CI's existing ubuntu packages
# suffice.
#
# Gated to **Linux only**: they link nothing on other platforms and must never
# enter the macOS/Windows sidecar graph. This lives in the workspace-EXCLUDED
# sidecar graph, so it adds zero dependency-conflict risk to the main app (#1747).
[target.'cfg(target_os = "linux")'.dependencies]
x11-clipboard = "0.9"
wl-clipboard-rs = { version = "0.8", default-features = false, features = [
    "dlopen",
] }

[dev-dependencies]
# Temp directories back the drive-redirection filesystem tests (#1757), which
# exercise the RDPDR backend against a real folder without a live RDP server.
tempfile = "3"
# The scripted RDP connection broker (#5271) terminates TLS on the server side
# to drive a followed Server Redirection through the real session code. Already
# locked in this graph (ironrdp-tls is its client side), so no new crate; `ring`
# is the provider the sidecar's own TLS client uses.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

# Vendored forks of three IronRDP crates, re-based onto the current releases for
# #5117 and patched in the same way as `vendor/vnc-rs` is patched into the main
# app (#1714). Each carries only fixes upstream has not released yet; drop a
# fork once a released crate carries its fix. Patching crates-io redirects every
# `ironrdp-*` crate's dependency on the crate to the fork. This lives in the
# workspace-EXCLUDED sidecar graph with its own Cargo.lock, so it never touches
# the desktop app's dependency graph. The register is `vendor/vendored-forks.json`;
# each fork's README.md says exactly what changed vs upstream.
[patch.crates-io]
# ironrdp-rdpsnd 0.11.0 + the Training Confirm's wPackSize (upstream f86e3c49,
# #4923): GNOME Remote Desktop rejects 0.11.0's 8-byte-short value and then sends
# no audio.
ironrdp-rdpsnd = { path = "vendor/ironrdp-rdpsnd" }
# ironrdp-pdu 0.11.0 + licensing secrets withheld from `Debug` (upstream
# 5c4dcfa7, #4923), so a debug/trace sidecar log can be shared.
ironrdp-pdu = { path = "vendor/ironrdp-pdu" }
# ironrdp-rdpdr 0.9.0 + the drive DeviceData as 8-bit characters (upstream
# 4cd9d4506, #4923; 0.9.0's UTF-16LE shows on Windows as the first letter only)
# and, fork-only, Device I/O Requests with an unknown MajorFunction completed
# instead of ending the session (#5124).
ironrdp-rdpdr = { path = "vendor/ironrdp-rdpdr" }
