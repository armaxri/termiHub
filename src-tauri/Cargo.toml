[package]
name = "termihub"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# First-party workspace crate — never published to crates.io (the repo is MIT,
# see /LICENSE). Marks it private so cargo-deny's `[licenses] private.ignore`
# skips its missing per-crate license field (#2096).
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# FTP / FTPS connection type. Enabled by default so the desktop ships it, but
# kept as a toggle so the registry registration is gated (`#[cfg(feature = "ftp")]`)
# and a build without it still compiles.
default = ["ftp", "mock-remote-desktop", "vnc", "rdp-sidecar"]
ftp = ["termihub-core/ftp"]
# Mock graphical remote-desktop backend so the shared remote-desktop layer
# (#1680) ships and is E2E-testable with no real VNC/RDP server. Gated so the
# registration is `#[cfg(feature = "mock-remote-desktop")]`.
mock-remote-desktop = ["termihub-core/mock-remote-desktop"]
# VNC (RFB) graphical remote-desktop backend (#1681). Gated so the registration
# is `#[cfg(feature = "vnc")]`. Ships experimental — hidden unless the user
# enables experimental features (#1705).
vnc = ["termihub-core/vnc"]
# RDP graphical remote-desktop backend via the IronRDP sidecar (#1747). Gated so
# the registration is `#[cfg(feature = "rdp-sidecar")]`. In `default` since #1754:
# the `termihub-rdp-helper` binary is built by scripts/build-rdp-sidecar.sh and
# bundled next to the app via Tauri `externalBin` (see tauri.conf.json), so
# SidecarRdp's next-to-exe resolution finds it in a shipped build. Ships
# experimental — hidden unless the user enables experimental features (#1705).
rdp-sidecar = ["termihub-core/rdp-sidecar"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "termihub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# default-features = false avoids `common-controls-v6` which embeds a Windows
# app manifest only in binaries (not test executables), causing
# STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139) in `cargo test` on Windows.
# See: https://github.com/tauri-apps/tauri/issues/13419
tauri = { version = "2", default-features = false, features = ["wry", "compression", "dynamic-acl"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Cross-platform filesystem watching (FSEvents / inotify / ReadDirectoryChangesW)
# for reflecting external on-disk changes to open local editor files (#1620).
# The debouncer coalesces the multiple syscalls a single external save emits.
notify-debouncer-full = "0.7"
serde = { workspace = true }
hex = "0.4"
# Percent-decoding paths from the `plugin://` custom URI-scheme protocol (#2251),
# so encoded characters in a request path resolve to the real on-disk filename.
percent-encoding = "2"
# SHA-256 hashing: agent-binary integrity verification (all platforms) and
# Windows VcXsrv checksum validation.
sha2 = "0.10"
# CSV / inventory parsing for bulk host onboarding (#1961) — quoting and
# delimiter handling delegated to the maintained crate rather than hand-rolled.
csv = "1"
serde_json = { workspace = true }
# RFC 6902 JSON-Patch: structural diff (produce) + apply for the stateless-UI
# projection substrate (#2149). Library-backed per the repo's "prefer libraries"
# rule rather than a hand-rolled differ; `diff()` emits only add/remove/replace.
json-patch = "3"
portable-pty = "0.8"
russh = { workspace = true }
russh-sftp = { workspace = true }
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
# POSIX shell-word quoting for the elevated-save exec command: the untrusted
# remote destination path is quoted with `shlex::try_quote` so it can never
# break out of the sudo shell command (#1328).
shlex = "1"
base64 = "0.22"
anyhow = "1"
thiserror = { workspace = true }
termihub-core = { path = "../core", features = ["serial", "local-shell", "telnet", "ssh", "docker", "wsl", "plugin", "embedded-servers"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "net", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
semver = "1"
dirs = "6"
which = "7"
# OpenSSH client-config (`~/.ssh/config`) parser for importing a host's
# ProxyJump chain into the jump-host editor (#1702). Library-first per the repo
# rules — handles the tokenizer, `Include`, and `Match`/pattern semantics rather
# than hand-rolling them.
ssh2-config = "0.7"
# Streaming XML reader/writer used to append/remove termiHub's Thunar custom
# action inside a shared ~/.config/Thunar/uca.xml without disturbing foreign
# actions (Linux file-manager registration, #1370).
quick-xml = "0.39"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "fmt", "env-filter"] }
chrono = "0.4"
argon2 = "0.5"
aes-gcm = "0.10"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-cli = "2"
if-addrs = "0.6"
# Native OS credential store (macOS Keychain / Windows Credential Manager /
# Linux Secret Service). Platform backends are enabled per-target below; the
# base crate always provides the `mock` backend used in unit tests.
keyring = { version = "3", default-features = false }

[target.'cfg(unix)'.dependencies]
# Resolve the current uid for the per-user spawn socket path (#1364).
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = [
    "NSUserDefaults",
    "NSString",
    "NSArray",
] }
# Native Cocoa Services provider for the app-level "Open in termiHub"
# Services-menu entry (#1409): register on NSApp.servicesProvider and read the
# selection off the pasteboard. macOS-only by nature.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSResponder",
    "NSPasteboard",
] }
# macOS Keychain backend for the `keyring` crate.
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_Console",
    "Win32_Foundation",
] }
# Low-level Win32 for the remote-clipboard delayed-render binding (#1814): a
# message-only owner window that offers CF_HDROP with a NULL handle and renders
# the file list on WM_RENDERFORMAT. windows-sys (already used by `termihub-core`)
# gives the raw clipboard / window / message-loop APIs with predictable C-style
# signatures. Windows-only — the module is `#[cfg(windows)]` and `cargo tree -i`
# clean off Windows.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
] }
# Windows Credential Manager backend for the `keyring` crate.
keyring = { version = "3", default-features = false, features = ["windows-native"] }
# VcXsrv acquisition (X server provisioning): download + extract. Windows-only —
# the X server subsystem provisions VcXsrv, which does not exist on other
# platforms. (SHA-256 hashing is a shared dependency; see `[dependencies]`.)
zip = "2"
# Windows Registry access for Explorer context-menu registration (#1368).
# Writes user-level HKCU keys (no elevation); Windows-only by nature.
winreg = "0.55"

[target.'cfg(target_os = "linux")'.dependencies]
# X11 `CLIPBOARD`-selection owner for the remote-clipboard delayed-render binding
# (#1815): own the selection and serve `text/uri-list` (+ gnome/mate copied-files)
# on request, fetching the remote files only when a paste converts the selection.
# `x11rb` is the pure-Rust (`RustConnection`), libxcb-free X11 stack the sidecar's
# `x11-clipboard` reader already builds on, so it adds **no system-library build
# dependency**. Linux-only — the module is `#[cfg(target_os = "linux")]` and
# `cargo tree -i` clean off Linux. `default-features = false` keeps the C-FFI
# `XCBConnection` out; only the pure-Rust connection is needed.
x11rb = { version = "0.13", default-features = false }
# Native-Wayland `wlr-data-control` delayed data source for the same binding under
# a Wayland session (#1847): own a data source offering the file targets and serve
# its `send(mime, fd)` callback on paste, fetching the remote files only then — the
# lazy serve `wl-clipboard-rs` (fixed-bytes only) cannot do. `wayland-client`'s
# `dlopen` feature loads `libwayland-client.so` at **runtime** (like the sidecar's
# `wl-clipboard-rs`), so this adds **no link-time `libwayland-dev` build
# dependency**; `wayland-protocols-wlr`'s `client` feature provides the
# data-control bindings. Linux-only — the module is `#[cfg(target_os = "linux")]`
# and `cargo tree -i` clean off Linux.
wayland-client = { version = "0.31", features = ["dlopen"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# (`percent-encoding` — used here on Linux to encode staged temp paths into
# `file://` URIs for the clipboard sidecar — is declared once in the top-level
# `[dependencies]` so it is available on every platform, see #2251.)
# Linux Secret Service backend. The `async-secret-service` backend talks to the
# Secret Service over the pure-Rust `zbus` transport (no `libdbus-sys` C
# dependency), so it compiles in CI without `libdbus-1-dev` and without a live
# D-Bus session at build time (D-Bus is only contacted at runtime). `crypto-rust`
# keeps the session encryption pure-Rust and `tokio` drives the async backend
# from keyring's synchronous `Entry` API.
keyring = { version = "3", default-features = false, features = [
    "async-secret-service",
    "crypto-rust",
    "tokio",
] }

[dev-dependencies]
# Property tests over the shadow LayoutStore's tree transitions (#2151); the
# panel-tree algebra it drives is proptest-covered in `termihub-core` (#2143).
proptest = "1"
# Tauri's mock runtime (`tauri::test::mock_app`) for a live `Manager` whose
# `manage`/`try_state` state machinery drives the tunnel-manager resolution
# regression test (#2168) without launching the real Wry app.
tauri = { version = "2", default-features = false, features = ["wry", "compression", "dynamic-acl", "test"] }
temp-env = "0.3"
